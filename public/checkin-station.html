<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AYBKK Check-in">
<meta name="theme-color" content="#0f1512">
<link rel="manifest" href="/checkin-manifest.webmanifest">
<title>AYBKK Check-in Station</title>
<style>
  :root{
    --bg:#0f1512; --panel:#18211d; --line:#2b3831; --text:#eef2ee; --muted:#9fb0a6;
    --green:#1f9d55; --amber:#c98a1a; --red:#c0392b; --accent:#d9a441;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .title{font-weight:700;font-size:16px;letter-spacing:.3px}
  header .title small{display:block;color:var(--muted);font-weight:500;font-size:11px}
  header .spacer{flex:1}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(0,0,0,.25)}
  .dot.on{background:var(--green)}
  select,button,input{font-family:inherit;font-size:15px}
  select#session{background:#0c1210;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;max-width:52vw}
  main{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
  #scanWrap{position:relative;flex:1;min-height:220px;background:#000;display:flex;align-items:center;justify-content:center}
  #video{width:100%;height:100%;object-fit:cover}
  #reticle{position:absolute;width:62vmin;height:62vmin;max-width:320px;max-height:320px;border:3px solid rgba(255,255,255,.7);border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  #camMsg{position:absolute;color:var(--muted);font-size:15px;padding:20px;text-align:center;max-width:80%}
  .toolbar{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
  .btn{flex:1;min-width:120px;border:1px solid var(--line);background:#141c18;color:var(--text);
    padding:13px 12px;border-radius:12px;font-weight:600;text-align:center}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);color:#231a06;border-color:var(--accent)}
  .stat{padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:14px;align-items:center}
  .stat b{color:var(--text);font-size:15px}
  /* Result flash overlay */
  #flash{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:40;text-align:center;padding:24px}
  #flash.show{display:flex}
  #flash .mark{font-size:74px;line-height:1}
  #flash .who{font-size:34px;font-weight:800;margin-top:8px}
  #flash .sub{font-size:19px;margin-top:6px;opacity:.95}
  #flash.ok{background:var(--green)} #flash.warn{background:var(--amber);color:#231a06} #flash.no{background:var(--red)} #flash.dup{background:#324a3d}
  /* Sheet (manual / roster) */
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:30;align-items:flex-end}
  #sheet.show{display:flex}
  #sheetInner{background:var(--panel);width:100%;max-height:82dvh;border-radius:18px 18px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column}
  #sheetInner h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  #sheetInner h3 .x{margin-left:auto;color:var(--muted);font-size:22px;padding:0 6px}
  #search{margin:12px 16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0c1210;color:var(--text)}
  #list{overflow:auto;padding:0 8px 16px}
  .row{display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line)}
  .row .nm{font-weight:600}
  .row .pk{color:var(--muted);font-size:12px}
  .row .rt{margin-left:auto;font-size:12px;padding:5px 9px;border-radius:999px}
  .rt.in{background:var(--green);color:#fff}.rt.out{background:#26332c;color:var(--muted)}
  .row .act{background:#26332c;color:#cfe0d6;border:0;border-radius:8px;padding:8px 12px;font-size:12px;margin-left:6px}
  .row .act.warn{background:#5a2d20;color:#f0b9a8}
  .btn small{display:block;font-size:10px;font-weight:400;opacity:.8;margin-top:2px}
  .banner{background:#3a2410;color:#f4c98a;font-size:13px;padding:8px 14px;text-align:center;display:none}
  .banner.show{display:block}
  #scanWrap{position:relative}
  #photoBanner{position:absolute;left:0;right:0;bottom:0;background:rgba(16,24,20,.92);color:#f4e8c8;padding:10px 12px;font-size:14px;display:none;align-items:center;gap:8px;z-index:5;flex-wrap:wrap}
  #photoBanner.show{display:flex}
  #photoBanner .skip{margin-left:auto;background:#26332c;color:#cfe0d6;border:0;border-radius:8px;padding:8px 14px;font-size:13px}
  #photoBanner .cancel{background:#5a2d20;color:#f0b9a8;border:0;border-radius:8px;padding:8px 14px;font-size:13px}
  #photoBanner .warnTag{background:#a63d2f;color:#fff;border-radius:6px;padding:2px 8px;font-size:11px}
</style>
</head>
<body>
<header>
  <div class="title">AYBKK Check-in<small id="wsName">Hefei Workshop</small></div>
  <div class="spacer"></div>
  <select id="session" aria-label="Session"></select>
  <div class="dot" id="net" title="network"></div>
</header>

<div class="banner" id="secureWarn">Open this page over <b>https</b> (or add it to the Home Screen) so the camera can start.</div>

<main>
  <div id="scanWrap">
    <video id="video" playsinline muted></video>
    <div id="reticle" hidden></div>
    <div id="camMsg">Tap <b>Start camera</b> to scan cards.</div>
    <div id="photoBanner">📸 <span id="photoWho"></span> <span id="photoHint">· 对准学生后点屏幕拍照</span><span class="warnTag" id="photoWarn" hidden>⚠ 未购此节</span><button class="skip" id="photoSkip">Skip</button><button class="cancel" id="photoCancel">✕</button></div>
  </div>
  <div class="stat">
    <span>Session: <b id="sCount">0</b>/<b id="sTotal">0</b></span>
    <span id="syncState">not synced</span>
    <span style="margin-left:auto" id="rosterState">roster: 0</span>
  </div>
  <div class="toolbar">
    <button class="btn primary" id="startBtn">Start camera<small>开启相机</small></button>
    <button class="btn" id="manualBtn">Manual<small>手动签到</small></button>
    <button class="btn" id="rosterBtn">Student List<small>学员名单</small></button>
    <button class="btn" id="syncBtn">Sync<small>同步</small></button>
    <button class="btn" id="csvBtn">Export CSV<small>导出表格</small></button>
    <button class="btn" id="viewBtn">📊 View<small>出勤看板</small></button>
  </div>
</main>

<div id="flash" role="alert" aria-live="assertive">
  <div class="mark"></div><div class="who"></div><div class="sub"></div>
</div>

<div id="sheet">
  <div id="sheetInner">
    <h3><span id="sheetTitle">Check in</span><span class="x" id="sheetClose">✕</span></h3>
    <input id="search" placeholder="搜索姓名或编号 · Search name or code…" autocomplete="off">
    <div id="list"></div>
  </div>
</div>

<canvas id="cv" hidden></canvas>
<script src="/vendor/jsQR.js"></script>
<script>
(() => {
  "use strict";
  const WORKSHOP = "hefei";
  const LS_ROSTER = "aybkk_roster_" + WORKSHOP;
  const LS_ATT    = "aybkk_att_" + WORKSHOP;
  const LS_SESS   = "aybkk_sess_" + WORKSHOP;
  const $ = s => document.querySelector(s);

  let roster = { workshop: WORKSHOP, title: "Hefei Workshop", lang: "zh", sessions: [], students: [] };
  let byCode = new Map(), byJournal = new Map(), bySlug = new Map();
  let attendance = [];           // [{id,journalId,name,package,session,sessionDate,checkedInAt,eligible,source,synced}]
  let session = null;            // current session code
  let stream = null, scanning = false, lastHit = { key: "", t: 0 };

  // ---------- storage ----------
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  // ---------- photo store (IndexedDB — localStorage is too small for images) ----------
  let idb = null;
  const idbReady = new Promise(res => {
    try {
      const rq = indexedDB.open("aybkk-checkin-photos", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("photos", { keyPath: "key" });
      rq.onsuccess = () => { idb = rq.result; res(true); };
      rq.onerror = () => res(false);
    } catch (e) { res(false); }
  });
  const photoPut = rec => new Promise(res => {
    if (!idb) return res(false);
    const tx = idb.transaction("photos", "readwrite");
    tx.objectStore("photos").put(rec);
    tx.oncomplete = () => res(true); tx.onerror = () => res(false);
  });
  const photoGet = key => new Promise(res => {
    if (!idb) return res(null);
    const rq = idb.transaction("photos").objectStore("photos").get(key);
    rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
  });
  const photoDel = key => new Promise(res => {
    if (!idb) return res(false);
    const tx = idb.transaction("photos", "readwrite");
    tx.objectStore("photos").delete(key);
    tx.oncomplete = () => res(true); tx.onerror = () => res(false);
  });

  // Grab the current camera frame (the student is in view at the scan moment)
  function captureFrame() {
    try {
      if (!stream || video.readyState < 2 || !video.videoWidth) return null;
      const w = 640, h = Math.round(video.videoHeight * (w / video.videoWidth));
      const pc = document.createElement("canvas"); pc.width = w; pc.height = h;
      pc.getContext("2d").drawImage(video, 0, 0, w, h);
      return pc.toDataURL("image/jpeg", 0.72);
    } catch (e) { return null; }
  }

  function indexRoster() {
    byCode = new Map(); byJournal = new Map(); bySlug = new Map();
    (roster.students || []).forEach(s => {
      if (s.id) byCode.set(String(s.id).toUpperCase(), s);
      if (s.journalId) byJournal.set(String(s.journalId).toLowerCase(), s);
      if (s.slug) bySlug.set(String(s.slug).toLowerCase(), s);
    });
  }

  async function initRoster() {
    const cached = load(LS_ROSTER, null);
    if (cached && cached.students) { roster = cached; }
    // Try to refresh from server when possible (network-first, cache fallback)
    try {
      const r = await fetch("/rosters/hefei.json", { cache: "no-store" });
      if (r.ok) { const j = await r.json(); if (j && j.students) { roster = j; save(LS_ROSTER, roster); } }
    } catch (e) { /* offline — cached roster is fine */ }
    indexRoster();
    buildSessions();
    render();
  }

  function buildSessions() {
    const sel = $("#session"); sel.innerHTML = "";
    const sessions = (roster.sessions && roster.sessions.length) ? roster.sessions
      : [{ code: "GENERAL", label: "General" }];
    sessions.forEach(s => {
      const o = document.createElement("option");
      o.value = s.code; o.textContent = s.label || s.code;
      sel.appendChild(o);
    });
    session = load(LS_SESS, null) || sessions[0].code;
    sel.value = session;
    $("#wsName").textContent = roster.title || "Workshop";
    sel.onchange = () => { session = sel.value; save(LS_SESS, session); render(); };
  }

  // ---------- scan parsing ----------
  // Accepts: full URL (.../student.html?id=UUID), short link (.../s/HEFEI-001),
  //          bare code "HEFEI-001", or a bare uuid.
  function parseScan(text) {
    text = (text || "").trim();
    let journalId = null, code = null, name = null;
    try {
      const u = new URL(text);
      if (u.searchParams.get("id")) journalId = u.searchParams.get("id");
      if (u.searchParams.get("name")) name = u.searchParams.get("name");
      const m = u.pathname.match(/\/s\/([^/?#]+)/i);
      if (m) code = decodeURIComponent(m[1]);
    } catch (e) {
      if (/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(text)) journalId = text;   // looks like a uuid
      else code = text;                                                 // treat as a code
    }
    return { journalId, code, name };
  }

  function findStudent(p) {
    if (p.code && byCode.has(p.code.toUpperCase())) return byCode.get(p.code.toUpperCase());
    if (p.code && bySlug.has(p.code.toLowerCase())) return bySlug.get(p.code.toLowerCase());
    if (p.journalId && byJournal.has(p.journalId.toLowerCase())) return byJournal.get(p.journalId.toLowerCase());
    return null;
  }

  function isEligible(student, sessionCode) {
    const ent = student.entitledSessions;
    const pkg = (student.package || "").toLowerCase();
    if (pkg === "full" || pkg === "host" || pkg === "translator" || pkg === "teacher") return true;
    if (!ent || ent.length === 0) return true;         // no restriction listed
    if (ent.includes("*")) return true;
    return ent.includes(sessionCode);
  }

  function sessionMeta(code) {
    return (roster.sessions || []).find(s => s.code === code) || { code, label: code, date: null };
  }

  // ---------- check-in ----------
  // Every check-in carries a face photo: Boonchu is not at the door, and the
  // photos are how he learns names and faces in the afternoon.
  //   manual: photo FIRST (pre mode), then the check-in registers
  //   scan:   check-in on scan, then the face-photo step opens (post mode)
  function checkIn(student, source, preKey) {
    const meta = sessionMeta(session);
    const already = attendance.find(a =>
      !a.voided && a.session === session &&
      ((student.journalId && a.journalId === student.journalId) || (student.id && a.id === student.id)));
    if (already) { flash("dup", "•", student.name, "Already checked in"); return; }

    const ok = isEligible(student, session);
    // Scan path: grab the scan-moment frame as a fallback shot in case the
    // host skips the face step (usually shows the phone/QR, not the face).
    let photoKey = preKey || null;
    if (source !== "manual" && !photoKey) {
      const frame = captureFrame();
      if (frame) {
        photoKey = WORKSHOP + "|" + (student.id || student.journalId) + "|" + session + "|" + Date.now();
        photoPut({ key: photoKey, dataUrl: frame, ts: Date.now() });
      }
    }
    const row = {
      workshop: WORKSHOP, id: student.id || null, journalId: student.journalId || null,
      name: student.name, package: student.package || "", studentCode: student.id || null,
      session, sessionDate: meta.date || null, checkedInAt: new Date().toISOString(),
      eligible: ok, source: source || "scan", synced: false,
      photoKey, photoFile: null
    };
    attendance.push(row);
    save(LS_ATT, attendance);
    if (ok) flash("ok", "✓", student.name, (student.package || "") + (photoKey ? " · ✓ 📸" : " · checked in"));
    else    flash("no", "⚠", student.name, "NOT paid for this session (" + (student.package || "?") + ")");
    render();
    scheduleSync();
    if (source !== "manual") startPhotoMode("post", student, row); // face shot after scan
  }

  // ---------- face-photo step ----------
  // pre  = before a manual check-in (photo saved -> check-in registers)
  // post = right after a scan check-in, or retake via the 📸 button
  let photoMode = null, photoTimer = null;
  function startPhotoMode(type, student, row) {
    closeSheet();
    photoMode = { type, student, row: row || null };
    $("#photoWho").textContent = student.name || "";
    $("#photoHint").textContent = type === "pre" ? "· 拍照后签到 · photo, then check-in" : "· 拍脸 · face photo";
    $("#photoWarn").hidden = !(type === "pre" && !isEligible(student, session));
    $("#photoSkip").textContent = type === "pre" ? "无照片签到" : "Skip";
    $("#photoBanner").classList.add("show");
    if (!stream) startCam(); // fire and forget; the fallback buttons always work
    clearTimeout(photoTimer);
    photoTimer = setTimeout(() => {
      // Never silently decide for the host: a pre-mode timeout does NOT check in.
      if (photoMode && photoMode.type === "pre") flash("warn", "✕", photoMode.student.name, "未签到 · not checked in");
      endPhotoMode();
    }, 45000);
  }
  function endPhotoMode() {
    photoMode = null;
    clearTimeout(photoTimer);
    $("#photoBanner").classList.remove("show");
  }
  function skipPhotoMode() {
    if (!photoMode) return;
    const m = photoMode; endPhotoMode();
    if (m.type === "pre") checkIn(m.student, "manual", null); // camera broken fallback
  }
  function cancelPhotoMode() {
    if (!photoMode) return;
    const m = photoMode; endPhotoMode();
    if (m.type === "pre") flash("warn", "✕", m.student.name, "已取消 · cancelled");
  }
  function snapPhotoForMode() {
    if (!photoMode) return;
    const frame = captureFrame();
    if (!frame) { flash("warn", "…", "Camera not ready", "Point at the student, tap again"); return; }
    const m = photoMode; endPhotoMode();
    if (m.type === "pre") {
      // photo saved -> now the check-in registers
      const key = WORKSHOP + "|" + (m.student.id || m.student.journalId) + "|" + session + "|" + Date.now();
      photoPut({ key, dataUrl: frame, ts: Date.now() });
      checkIn(m.student, "manual", key);
      return;
    }
    // post/retake: the face shot replaces whatever the row had (e.g. the QR frame)
    const row = m.row;
    if (!row || row.voided) return;
    if (row.photoKey) photoDel(row.photoKey);
    const key = WORKSHOP + "|" + (row.id || row.journalId) + "|" + row.session + "|" + Date.now();
    photoPut({ key, dataUrl: frame, ts: Date.now() });
    row.photoKey = key;
    row.photoFile = null;      // re-upload the new shot
    row.profilePushed = false; // the face replaces the QR frame on the profile too
    row.synced = false;
    save(LS_ATT, attendance);
    flash("ok", "📸", row.name, "face saved");
    scheduleSync();
  }

  // Un-check a wrong tap/scan. The row is voided locally and the deletion
  // syncs to the server (attendance-api removes it from Postgres + JSON).
  function uncheck(row) {
    row.voided = true;
    row.synced = false;
    if (photoMode && photoMode.row === row) endPhotoMode();
    if (row.photoKey) { photoDel(row.photoKey); row.photoKey = null; } // wrong person — never upload
    save(LS_ATT, attendance);
    flash("warn", "↩", row.name, "Un-checked");
    render();
    scheduleSync();
  }

  function handleScanText(text) {
    if (photoMode) return; // a stray QR in view must not fire while framing a photo
    const p = parseScan(text);
    const key = (p.code || p.journalId || text);
    const now = Date.now();
    if (key === lastHit.key && now - lastHit.t < 2500) return;  // debounce same card
    lastHit = { key, t: now };
    const student = findStudent(p);
    if (!student) { flash("warn", "?", p.code || p.name || "Unknown", "Not on roster — walk-in"); beep(220); return; }
    checkIn(student, "scan"); beep(880);
  }

  // ---------- camera ----------
  const video = $("#video"), cv = $("#cv"), ctx = cv.getContext("2d", { willReadFrequently: true });
  async function startCam() {
    if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
      $("#secureWarn").classList.add("show");
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
      video.srcObject = stream; await video.play();
      $("#camMsg").hidden = true; $("#reticle").hidden = false;
      $("#startBtn").innerHTML = "Stop camera<small>关闭相机</small>";
      scanning = true; requestAnimationFrame(tick);
    } catch (e) {
      $("#camMsg").hidden = false;
      $("#camMsg").innerHTML = "Camera unavailable: " + (e.message || e.name) + "<br>Use <b>Manual</b> to check in.";
    }
  }
  function stopCam() {
    scanning = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    $("#reticle").hidden = true; $("#camMsg").hidden = false; $("#startBtn").innerHTML = "Start camera<small>开启相机</small>";
  }
  let lastDecode = 0;
  function tick(ts) {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA && ts - lastDecode > 160) {
      lastDecode = ts;
      const w = video.videoWidth, h = video.videoHeight;
      if (w && h) {
        cv.width = w; cv.height = h;
        ctx.drawImage(video, 0, 0, w, h);
        try {
          const img = ctx.getImageData(0, 0, w, h);
          const res = jsQR(img.data, w, h, { inversionAttempts: "dontInvert" });
          if (res && res.data) handleScanText(res.data);
        } catch (e) {}
      }
    }
    requestAnimationFrame(tick);
  }

  // ---------- feedback ----------
  function flash(kind, mark, who, sub) {
    const f = $("#flash");
    f.className = "show " + kind;
    f.querySelector(".mark").textContent = mark;
    f.querySelector(".who").textContent = who || "";
    f.querySelector(".sub").textContent = sub || "";
    if (navigator.vibrate) navigator.vibrate(kind === "ok" ? 60 : [40, 60, 40]);
    clearTimeout(flash._t); flash._t = setTimeout(() => { f.className = ""; }, 1600);
  }
  let ac = null;
  function beep(freq) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.15, ac.currentTime); o.start();
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .18); o.stop(ac.currentTime + .2);
    } catch (e) {}
  }

  // ---------- sync ----------
  let syncTimer = null;
  function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1500); }
  async function syncNow() {
    const pending = attendance.filter(a => !a.synced);
    if (!pending.length) { $("#syncState").textContent = "all synced"; return; }
    if (!navigator.onLine) { $("#syncState").textContent = pending.length + " to sync (offline)"; return; }
    $("#syncState").textContent = "syncing " + pending.length + "…";

    // 1: upload captured photos (attendance file + student profile) that
    //    haven't reached the server yet
    for (const a of pending) {
      if (a.voided || !a.photoKey) continue;
      try {
        const rec = await photoGet(a.photoKey);
        if (!rec) { a.photoKey = null; continue; }        // photo lost — sync row anyway
        if (!a.photoFile) {
          const blob = await (await fetch(rec.dataUrl)).blob();
          const fd = new FormData();
          fd.append("file", blob, (a.studentCode || "student") + "-" + a.session + ".jpg");
          const up = await fetch("/api/upload/attendance-photo", { method: "POST", body: fd });
          if (up.ok) {
            const j = await up.json();
            a.photoFile = (j.file && j.file.filename) || null;
          }
        }
        // Same shot becomes the student's profile face (Cloudinary, face-cropped),
        // so the teacher sees who attended on faces.html / student profiles.
        if (!a.profilePushed && a.journalId) {
          try {
            const pr = await fetch("/api/upload/student-photo", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ studentId: a.journalId, imageBase64: rec.dataUrl, name: a.name, location: WORKSHOP })
            });
            if (pr.ok) a.profilePushed = true; // freshest face wins
          } catch (e) { /* retry next pass */ }
        }
      } catch (e) { /* retry on the next sync pass */ }
    }
    save(LS_ATT, attendance);

    // 2: sync the rows
    try {
      const r = await fetch("/api/attendance/checkin", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rows: pending })
      });
      if (r.ok) {
        for (const a of pending) {
          a.synced = true;
          // Keep the local photo until BOTH destinations have it (attendance
          // file + profile push), so a failed push never loses the shot.
          if (a.photoKey && a.photoFile && (a.profilePushed || !a.journalId)) { photoDel(a.photoKey); a.photoKey = null; }
        }
        save(LS_ATT, attendance); $("#syncState").textContent = "all synced";
      }
      else $("#syncState").textContent = pending.length + " to sync (server " + r.status + ")";
    } catch (e) { $("#syncState").textContent = pending.length + " to sync (no server)"; }
    render();
  }

  // ---------- CSV (guaranteed offline backup) ----------
  function exportCSV() {
    const cols = ["workshop", "studentCode", "name", "package", "session", "sessionDate", "checkedInAt", "eligible", "source", "photoFile"];
    const esc = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const rows = attendance.filter(r => !r.voided);
    const csv = [cols.join(",")].concat(rows.map(r => cols.map(c => esc(r[c])).join(","))).join("\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "attendance-" + WORKSHOP + "-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- render ----------
  function render() {
    const inSession = attendance.filter(a => !a.voided && a.session === session);
    $("#sCount").textContent = inSession.length;
    $("#sTotal").textContent = (roster.students || []).length;
    $("#rosterState").textContent = "roster: " + (roster.students || []).length;
    const pending = attendance.filter(a => !a.synced).length;
    if (pending && $("#syncState").textContent === "not synced") $("#syncState").textContent = pending + " to sync";
    $("#net").classList.toggle("on", navigator.onLine);
  }

  // ---------- sheet (manual + roster) ----------
  function openSheet(mode) {
    $("#sheet").classList.add("show");
    $("#sheetTitle").textContent = mode === "roster" ? "学员名单 · Student List" : "手动签到 · Manual check-in";
    $("#search").value = ""; renderList("", mode); $("#search").focus();
    $("#search").oninput = () => renderList($("#search").value, mode);
    $("#sheet")._mode = mode;
  }
  function closeSheet() { $("#sheet").classList.remove("show"); }
  function activeRowFor(s) {
    return attendance.find(a => !a.voided && a.session === session &&
      ((s.journalId && a.journalId === s.journalId) || (s.id && a.id === s.id)));
  }
  // Rows are scroll-safe: the row body is inert, only the explicit buttons act
  // (Boonchu tapped a name by accident while scrolling). Sorted by card number.
  function renderList(q, mode) {
    q = (q || "").trim().toLowerCase();
    const list = $("#list"); list.innerHTML = "";
    const checked = new Set(attendance.filter(a => !a.voided && a.session === session).map(a => a.id || a.journalId));
    (roster.students || [])
      .filter(s => !q || (s.name || "").toLowerCase().includes(q) || (s.id || "").toLowerCase().includes(q) || (s.slug || "").includes(q))
      .sort((a, b) => (a.id || "").localeCompare(b.id || ""))
      .forEach(s => {
        const isIn = checked.has(s.id) || checked.has(s.journalId);
        const row = document.createElement("div"); row.className = "row";
        row.innerHTML = '<div><div class="nm">' + esc(s.name || "") + '</div>' +
          '<div class="pk">' + esc(s.id || "") + ' · ' + esc(s.package || "") + '</div></div>';
        const right = document.createElement("div"); right.style.marginLeft = "auto"; right.style.flexShrink = "0";
        if (!isIn) {
          const goBtn = document.createElement("button"); goBtn.className = "act"; goBtn.textContent = "📸 拍照签到 · check in";
          goBtn.onclick = e => { e.stopPropagation(); startPhotoMode("pre", s); }; // camera first, then check-in
          right.appendChild(goBtn);
        } else {
          const photoBtn = document.createElement("button"); photoBtn.className = "act"; photoBtn.textContent = "📸";
          photoBtn.title = "take / retake face photo";
          photoBtn.onclick = e => {
            e.stopPropagation();
            const rec = activeRowFor(s);
            if (rec) startPhotoMode("post", s, rec);
          };
          const unBtn = document.createElement("button"); unBtn.className = "act warn"; unBtn.textContent = "↩";
          unBtn.title = "un-check";
          unBtn.onclick = e => {
            e.stopPropagation();
            if (!confirm("取消签到 Un-check " + (s.name || "") + "?")) return;
            const rec = activeRowFor(s);
            if (rec) uncheck(rec);
            renderList($("#search").value, mode);
          };
          const tag = document.createElement("span"); tag.className = "rt in"; tag.textContent = "✓";
          tag.style.marginRight = "6px";
          right.appendChild(tag); right.appendChild(photoBtn); right.appendChild(unBtn);
        }
        row.appendChild(right);
        list.appendChild(row);
      });
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- wire up ----------
  $("#startBtn").onclick = () => scanning ? stopCam() : startCam();
  $("#scanWrap").onclick = () => { if (photoMode) snapPhotoForMode(); };
  $("#photoSkip").onclick = e => { e.stopPropagation(); skipPhotoMode(); };
  $("#photoCancel").onclick = e => { e.stopPropagation(); cancelPhotoMode(); };
  $("#manualBtn").onclick = () => openSheet("manual");
  $("#rosterBtn").onclick = () => openSheet("roster");
  $("#sheetClose").onclick = closeSheet;
  $("#sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
  $("#syncBtn").onclick = syncNow;
  $("#csvBtn").onclick = exportCSV;
  $("#viewBtn").onclick = () => window.open("/attendance-hefei.html", "_blank");
  window.addEventListener("online", () => { render(); syncNow(); });
  window.addEventListener("offline", render);
  setInterval(() => { if (navigator.onLine) syncNow(); }, 30000);

  attendance = load(LS_ATT, []);
  initRoster();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/checkin-sw.js").catch(() => {});
})();
</script>
</body>
