<title>Petal Playground</title>

<style>
/* ── Faces, inlined so nothing depends on a blocked CDN ────────────── */
@font-face{font-family:'Caveat';src:url('@@FONT:caveatbrush@@') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Outfit';src:url('@@FONT:outfit@@') format('woff2');font-weight:300 800;font-display:swap}
@font-face{font-family:'Pangolin';src:url('@@FONT:pangolin@@') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'SarabunTH';src:url('@@FONT:sarabun-th@@') format('woff2');font-weight:400 700;font-display:swap}

/* ── Tokens ────────────────────────────────────────────────────────── */
:root{
  --paper:#FBEEF3;
  --paper-2:#F4DBE6;
  --card:#FFFFFF;
  --card-2:#FDF5F8;
  --ink:#4A2740;
  --ink-soft:#8B6A80;
  --line:#EDCEDC;
  --ring:#C23B6B;

  --c-colour:#C23B6B;
  --c-count:#7A4FB0;
  --c-shape:#0E7A6B;
  --c-size:#2E6FB0;
  --c-sound:#B0700A;
  --c-feel:#C4452F;
  --c-body:#6B3A73;
  --c-thai:#9B2F5F;
  --c-safe:#2F6B57;
  --c-pairs:#A63F86;
  --c-patt:#3F5FB8;
  --c-where:#8A5A1F;
  --c-odd:#5B4BA8;
  --c-opp:#1F6F8B;
  --c-more:#A0522D;
  --c-abc:#B03060;
  --on-accent:#FFFFFF;

  --good:#0E7A6B;
  --gold:#F0B429;
  --hero:#C23B6B;
  --pill:#FFEAF2;
  --pill-ink:#8E2350;

  --lift:0 7px 0 rgba(74,39,64,.16);
  --lift-sm:0 4px 0 rgba(74,39,64,.14);
  --pop:0 12px 34px rgba(74,39,64,.13);

  --display:'Caveat','Outfit',system-ui,sans-serif;
  --ui:'Outfit',system-ui,-apple-system,sans-serif;
  --school:'Pangolin','Caveat',system-ui,sans-serif;
  --thai:'SarabunTH','Outfit',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1E1226;
    --paper-2:#150C1B;
    --card:#2E1D38;
    --card-2:#28193010;
    --card-2:#281930;
    --ink:#F9E9F3;
    --ink-soft:#C4A3BA;
    --line:#4B3157;
    --ring:#FF8FB8;
    --good:#3FCFAE;
    --hero:#FF8FB8;
    --pill:#3D1E32;
    --pill-ink:#FFC2DA;
    --lift:0 7px 0 rgba(0,0,0,.45);
    --lift-sm:0 4px 0 rgba(0,0,0,.42);
    --pop:0 12px 34px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#1E1226;
  --paper-2:#150C1B;
  --card:#2E1D38;
  --card-2:#281930;
  --ink:#F9E9F3;
  --ink-soft:#C4A3BA;
  --line:#4B3157;
  --ring:#FF8FB8;
  --good:#3FCFAE;
  --hero:#FF8FB8;
  --pill:#3D1E32;
  --pill-ink:#FFC2DA;
  --lift:0 7px 0 rgba(0,0,0,.45);
  --lift-sm:0 4px 0 rgba(0,0,0,.42);
  --pop:0 12px 34px rgba(0,0,0,.5);
}

/* ── Base ──────────────────────────────────────────────────────────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--ui);font-size:18px;line-height:1.45;
  -webkit-text-size-adjust:100%;overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--ring);outline-offset:3px;border-radius:10px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.app{min-height:100svh;min-height:100dvh;display:flex;flex-direction:column;
  max-width:1000px;margin:0 auto;padding:12px 14px 24px}

/* ── Top bar ───────────────────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:10px;min-height:60px}
.bar-title{font-family:var(--display);font-size:26px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  width:54px;height:54px;flex:none;display:grid;place-items:center;
  border-radius:18px;background:var(--card);box-shadow:var(--lift-sm);
  font-size:25px;line-height:1;transition:transform .12s,box-shadow .12s;
}
.icon-btn:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,0)}
.tally{
  display:flex;align-items:center;gap:6px;flex:none;background:var(--card);
  border-radius:18px;padding:9px 15px 9px 12px;box-shadow:var(--lift-sm);
  font-family:var(--display);font-size:23px;font-variant-numeric:tabular-nums;
}
.tally.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-5deg)}100%{transform:scale(1)}}

/* ── Home ──────────────────────────────────────────────────────────── */
.hero{padding:12px 4px 2px;position:relative}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.hero h1{font-family:var(--display);font-size:clamp(44px,12vw,72px);line-height:.94;
  margin:8px 0 8px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--hero)}
.hero p{margin:0;max-width:30ch;color:var(--ink-soft);font-size:17px}
.sparkle{position:absolute;font-size:20px;opacity:.6;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:.45}50%{transform:scale(1.3) rotate(18deg);opacity:.9}}

.board{display:grid;gap:16px;margin:22px 0 8px;
  grid-template-columns:repeat(auto-fit,minmax(216px,1fr))}
@media (max-width:540px){.board{grid-template-columns:repeat(2,1fr);gap:12px}}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;min-height:222px;padding:16px 12px;
  border-radius:30px;color:var(--on-accent);text-align:center;
  background:var(--tile);box-shadow:var(--lift);
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),box-shadow .14s;overflow:hidden;
}
.tile:nth-child(odd){transform:rotate(-1.2deg)}
.tile:nth-child(even){transform:rotate(1deg)}
.tile:active{transform:translateY(6px) rotate(0);box-shadow:0 1px 0 rgba(74,39,64,.2)}
.tile .peek{width:112px;height:118px;flex:none;margin-bottom:4px;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.16))}
.tile h2{font-family:var(--display);font-size:27px;margin:0;line-height:1.02;text-wrap:balance}
.tile .sub{font-size:14px;font-weight:600;opacity:.94}
.tile .got{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.24);
  border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
:root[data-theme="dark"] .tile,
:root:not([data-theme="light"]) .tile{filter:saturate(1.1) brightness(1.12)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .tile{filter:none}}

.footnote{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  color:var(--ink-soft);font-size:15px}
.linky{font-weight:700;color:var(--ink);text-decoration:underline;
  text-decoration-thickness:2px;text-underline-offset:3px;padding:6px 2px}

/* ── Play surface ──────────────────────────────────────────────────── */
.play{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:4px}
.stage{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;gap:14px;
  background:var(--card);border-radius:34px;padding:20px 16px 22px;
  box-shadow:var(--pop);position:relative;overflow:hidden auto;min-height:300px;
}
.stage::after{content:"";position:absolute;inset:0;border-radius:34px;
  border:3px solid var(--accent);opacity:.16;pointer-events:none}
.mid{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;min-height:0}
.dots{display:flex;gap:9px;justify-content:center}
.dot{width:15px;height:15px;border-radius:50%;background:var(--line);transition:transform .3s,background .3s}
.dot.on{background:var(--accent);transform:scale(1.3)}

.buddy{position:relative;display:flex;align-items:flex-end;gap:10px;align-self:flex-start}
.mascot{width:112px;height:120px;flex:none}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.bubble{
  position:relative;background:var(--card-2);color:var(--ink);
  border:3px solid var(--line);border-radius:22px;padding:10px 16px;
  font-family:var(--display);font-size:20px;max-width:22ch;margin-bottom:16px;
}
.bubble::after{content:"";position:absolute;left:-10px;bottom:14px;width:15px;height:15px;
  background:var(--card-2);border-left:3px solid var(--line);border-bottom:3px solid var(--line);
  transform:rotate(45deg)}

.ask{font-family:var(--display);font-size:23px;text-align:center;color:var(--ink-soft);margin:0;text-wrap:balance}
.hint{font-family:var(--display);font-size:17px;color:var(--ink-soft);text-align:center;margin:0;min-height:1.4em}

/* Two enormous choices is the default; three only once she is ready. */
.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
.choice{
  flex:1 1 0;min-width:118px;max-width:220px;min-height:128px;
  border-radius:28px;background:var(--card-2);border:4px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:60px;line-height:1;box-shadow:var(--lift-sm);
  transition:transform .12s,box-shadow .12s,background .2s,border-color .2s;
}
.choice .cap{font-family:var(--display);font-size:17px;color:var(--ink-soft)}
.choice:active{transform:translateY(4px);box-shadow:none}
.choice.yes{background:var(--good);border-color:var(--good);color:#fff;animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
.choice.yes .cap{color:rgba(255,255,255,.94)}
.choice.no{animation:wiggle .5s ease-in-out}
.choice.num{font-family:var(--school);font-size:70px}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
/* After two misses the right answer starts glowing. Nobody gets stuck. */
.choice.hintme,.bp.hintme circle[fill="transparent"]{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:var(--lift-sm)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--good) 42%,transparent)}}
.swatch{width:78px;height:70px}
.swatch svg{width:100%;height:100%;display:block}

/* ── Colour hunt ───────────────────────────────────────────────────── */
.garden{display:flex;flex-wrap:wrap;gap:10px 12px;justify-content:center;
  max-width:430px;margin:0 auto}
.bloom{width:clamp(72px,19vw,94px);height:clamp(72px,19vw,94px);padding:7px;
  border-radius:24px;background:var(--card-2);border:4px solid transparent;
  box-shadow:var(--lift-sm);transition:transform .14s,box-shadow .14s,border-color .2s,background .2s}
.bloom svg{width:100%;height:100%;display:block}
.bloom:active{transform:translateY(4px);box-shadow:none}
.bloom.yes{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--card-2));
  transform:translateY(-6px) scale(1.05)}
.bloom.no{animation:wiggle .5s ease-in-out}
.bloom.hintme{animation:glow 1.1s ease-in-out infinite}

/* ── Matching pairs ────────────────────────────────────────────────── */
.deck{display:grid;gap:8px;justify-content:center;margin:0 auto;width:100%;max-width:430px}
.pcard{width:100%;aspect-ratio:3/4;border-radius:20px;
  border:4px solid var(--line);background:var(--accent);color:transparent;
  font-size:clamp(24px,6.5vw,44px);line-height:1;box-shadow:var(--lift-sm);
  display:grid;place-items:center;transition:transform .16s,background .2s,border-color .2s}
.pcard::after{content:'✿';color:rgba(255,255,255,.72);font-size:30px}
.pcard:active{transform:translateY(4px)}
.pcard.up,.pcard.done{background:var(--card-2);color:inherit;border-color:var(--good)}
.pcard.up::after,.pcard.done::after{content:''}
.pcard.done{opacity:.5}
.pcard.up{animation:bump .4s cubic-bezier(.34,1.56,.64,1)}

/* ── Patterns ──────────────────────────────────────────────────────── */
/* The "?" has to stay on the end of the row — wrapped onto a line of its own
   it stops reading as "and then this one". Longer strips shrink to fit. */
.strip{display:flex;gap:7px;justify-content:center;align-items:center;
  font-size:clamp(30px,8vw,44px);line-height:1}
.strip span{flex:0 0 auto;width:clamp(44px,11.5vw,60px);height:clamp(44px,11.5vw,60px);
  display:grid;place-items:center;background:var(--card-2);border-radius:16px;border:3px solid var(--line)}
.strip.long{gap:5px;font-size:clamp(22px,6vw,38px)}
.strip.long span{width:clamp(34px,8.4vw,52px);height:clamp(34px,8.4vw,52px)}
.strip span.gap{border-style:dashed;border-color:var(--accent);color:var(--accent);
  font-family:var(--display);font-size:1em}

/* ── In, on, under ─────────────────────────────────────────────────────
   The box has to read as an OPEN box or "in" means nothing: a dark cavity
   behind, a wooden front panel in front of it, and two flaps folded open at
   the top. A thing that is "in" sits in the cavity with its bottom half
   hidden behind the front panel. */
.scene{position:relative;width:min(100%,300px);height:262px;margin:0 auto}
.crate-back,.crate-front{position:absolute;left:50%;transform:translateX(-50%);width:180px;
  border:4px solid #C39A6B}
.crate-back{top:104px;height:88px;border-radius:10px;background:#8B6942;z-index:1}
.crate-back::before,.crate-back::after{content:'';position:absolute;top:-20px;width:72px;height:16px;
  background:#EBCEA6;border:4px solid #C39A6B;border-radius:6px}
.crate-back::before{left:-10px;transform:rotate(-15deg)}
.crate-back::after{right:-10px;transform:rotate(15deg)}
.crate-front{top:140px;height:56px;border-radius:0 0 12px 12px;background:#EBCEA6;border-top:0;z-index:3}
.thing{position:absolute;left:50%;transform:translateX(-50%);font-size:54px;line-height:1;z-index:2}
.thing.on{top:44px;z-index:4}
.thing.in{top:112px}
.thing.under{top:200px;z-index:0}
.thing.beside{top:150px;left:auto;right:0;transform:none;z-index:4}

/* ── Which has more ────────────────────────────────────────────────── */
.piles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
.pile{flex:1 1 0;min-width:116px;max-width:210px;min-height:132px;border-radius:28px;
  background:var(--card-2);border:4px solid var(--line);box-shadow:var(--lift-sm);
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px;padding:13px;
  transition:transform .12s,box-shadow .12s,background .2s,border-color .2s}
.pile span{font-size:clamp(19px,5vw,29px);line-height:1}
.pile:active{transform:translateY(4px);box-shadow:none}
.pile.yes{background:color-mix(in srgb,var(--good) 18%,var(--card-2));border-color:var(--good);
  animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
.pile.no{animation:wiggle .5s ease-in-out}
.pile.hintme{animation:glow 1.1s ease-in-out infinite}

/* ── Letters ───────────────────────────────────────────────────────── */
.bigletter{font-family:var(--school);font-size:clamp(96px,26vw,140px);line-height:1;color:var(--accent)}
.choice.letter{font-family:var(--school);font-size:clamp(46px,12vw,68px)}

.herd{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;max-width:400px;padding:4px}
.critter{font-size:52px;line-height:1;padding:4px;border-radius:16px;position:relative;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),filter .2s}
.critter.counted{transform:translateY(-9px) scale(1.1);filter:drop-shadow(0 4px 0 var(--accent))}
.critter .tag{position:absolute;top:-6px;right:-4px;background:var(--accent);color:#fff;
  border-radius:999px;min-width:24px;height:24px;font-family:var(--school);font-size:15px;
  display:grid;place-items:center;padding:0 5px}

.sizes{display:flex;gap:clamp(6px,2.4vw,24px);align-items:center;justify-content:center;
  width:100%;flex-wrap:wrap}
.sizer{background:none;border:0;padding:6px;line-height:1;border-radius:20px;
  transition:transform .12s}
.sizer:active{transform:translateY(4px)}
.sizer.yes{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
.sizer.no{animation:wiggle .5s ease-in-out}
.sizer.hintme{animation:glow 1.1s ease-in-out infinite;border-radius:24px}
.sizer{position:relative}
.sizer .rank{position:absolute;top:-2px;right:-2px;background:var(--good);color:#fff;
  border-radius:999px;min-width:26px;height:26px;font-family:var(--school);font-size:16px;
  display:grid;place-items:center;padding:0 6px}

.shape-hero{width:clamp(120px,32vw,168px);height:clamp(120px,32vw,168px)}
.shape-hero svg,.shape-mini svg{width:100%;height:100%;display:block}
.shape-mini{width:66px;height:66px}

.thai-word{font-family:var(--thai);font-weight:700;font-size:clamp(48px,14vw,80px);
  line-height:1.5;color:var(--accent);text-align:center}
.roman{font-family:var(--display);font-size:23px;color:var(--ink-soft);margin:0}
.thai-mini{font-family:var(--thai);font-weight:700;font-size:clamp(26px,7vw,38px);line-height:1.6;color:var(--ink)}

.faces{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
.face-btn{flex:1 1 0;min-width:118px;max-width:210px;border-radius:28px;
  background:var(--card-2);border:4px solid var(--line);padding:8px;box-shadow:var(--lift-sm);
  transition:transform .12s,box-shadow .12s,border-color .2s,background .2s}
.face-btn:active{transform:translateY(4px);box-shadow:none}
.face-btn svg{width:100%;height:auto;display:block}
.face-btn.yes{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card-2));animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
.face-btn.no{animation:wiggle .5s ease-in-out}
.face-btn.hintme{animation:glow 1.1s ease-in-out infinite}
.feel-word{font-family:var(--display);font-size:clamp(38px,10vw,56px);color:var(--accent);line-height:1}

/* ── Body parts ────────────────────────────────────────────────────── */
.kid{width:min(100%,300px);height:auto;display:block}
.kid svg{width:100%;height:auto;display:block}
.bp{cursor:pointer}
.bp.found > *:not([fill="transparent"]){filter:drop-shadow(0 0 6px var(--good))}
.bp.no{animation:wiggle .5s ease-in-out}

/* ── Safety game ───────────────────────────────────────────────────── */
.rule{
  font-family:var(--display);font-size:clamp(28px,7.2vw,44px);line-height:1.15;
  text-align:center;color:var(--ink);max-width:16ch;text-wrap:balance;
}
.heart-btn{
  min-height:132px;min-width:200px;max-width:340px;width:100%;
  border-radius:34px;background:var(--accent);color:#fff;box-shadow:var(--lift);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:var(--display);font-size:28px;
  transition:transform .12s,box-shadow .12s;
}
.heart-btn span{font-size:52px;line-height:1}
.heart-btn:active{transform:translateY(5px);box-shadow:none}
.heart-btn.yes{animation:bump .6s cubic-bezier(.34,1.56,.64,1)}

/* ── Celebration ───────────────────────────────────────────────────── */
.curtain{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.party{background:var(--card);border-radius:36px;box-shadow:var(--pop);padding:28px 22px 22px;
  text-align:center;max-width:400px;width:100%;display:flex;flex-direction:column;
  align-items:center;gap:11px;animation:rise .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes rise{from{transform:translateY(28px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.party .mascot{width:158px;height:168px}
.party h2{font-family:var(--display);font-size:36px;margin:0;line-height:1.05}
.party p{margin:0;color:var(--ink-soft);font-size:17px}
.sticker{font-size:16px;font-weight:800;color:var(--pill-ink);background:var(--pill);
  border-radius:999px;padding:8px 18px}
.btn{border-radius:22px;padding:16px 22px;min-height:62px;width:100%;
  font-family:var(--display);font-size:23px;background:var(--accent,var(--c-colour));color:#fff;
  box-shadow:var(--lift);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(5px);box-shadow:none}
.btn.ghost{background:var(--card-2);color:var(--ink);border:3px solid var(--line);box-shadow:var(--lift-sm)}

/* ── Grown-ups ─────────────────────────────────────────────────────── */
.panel{position:fixed;inset:0;z-index:70;overflow-y:auto;
  background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);
  padding:20px 16px 40px}
.panel-inner{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.panel h3{font-family:var(--display);font-size:22px;margin:0 0 3px}
.panel p{margin:0;color:var(--ink-soft);font-size:16px;max-width:62ch}
.map{display:flex;flex-direction:column;gap:10px}
.map-row{display:flex;gap:12px;align-items:flex-start;background:var(--card);
  border-radius:20px;padding:14px 16px;border-left:8px solid var(--tile);box-shadow:var(--lift-sm)}
.map-row .area{font-size:14px;color:var(--ink-soft);font-weight:600}
.band{display:flex;align-items:baseline;gap:10px;margin:22px 2px 4px;flex-wrap:wrap}
.band-name{font-weight:800;font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:7px}
.field > label{font-family:var(--display);font-size:19px}
.vrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.vsel{flex:1 1 210px;min-width:0;min-height:54px;padding:12px 14px;border-radius:16px;
  background:var(--card);color:var(--ink);border:3px solid var(--line);font:inherit;font-size:16px}
.vrow .btn{width:auto;flex:0 0 auto;padding:12px 20px;min-height:54px}

/* ── Mascot motion ─────────────────────────────────────────────────── */
.mx-all{transform-box:fill-box;transform-origin:50% 96%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-3px)}}
.mascot.is-happy .mx-all{animation:joy 1s cubic-bezier(.34,1.56,.64,1)}
@keyframes joy{0%{transform:translateY(0) rotate(0)}22%{transform:translateY(-26px) rotate(-10deg)}
  46%{transform:translateY(0) rotate(0)}66%{transform:translateY(-14px) rotate(10deg)}100%{transform:translateY(0)}}
.mascot.is-oops .mx-all{animation:lean 1s ease-in-out}
@keyframes lean{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg) translateY(-4px)}}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.mascot.is-happy .eyes{animation:none}
.ear-l{transform-box:fill-box;transform-origin:100% 50%;animation:flapl 3.2s ease-in-out infinite}
.ear-r{transform-box:fill-box;transform-origin:0% 50%;animation:flapr 3.2s ease-in-out infinite}
@keyframes flapl{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
@keyframes flapr{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.ele-trunk{transform-box:fill-box;transform-origin:50% 4%;animation:swing 3.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
.spray{opacity:0}
.mascot.is-happy .spray{animation:spritz 1s ease-out}
@keyframes spritz{0%{opacity:0;transform:translate(0,0) scale(.3)}30%{opacity:1}100%{opacity:0;transform:translate(24px,-38px) scale(1.3)}}

@media (prefers-reduced-motion:reduce){
  .mx-all,.eyes,.ear-l,.ear-r,.ele-trunk,.sparkle,.choice.hintme,.face-btn.hintme,.sizer.hintme,.bloom.hintme{animation:none !important}
  *{transition-duration:.01ms !important}
  .party{animation:none}
}
@media (max-width:480px){
  .icon-btn{width:48px;height:48px;font-size:22px;border-radius:15px}
  .bar-title{font-size:20px}
  .tally{padding:8px 12px;font-size:19px}
  .mascot{width:92px;height:98px}
  .bubble{font-size:17px;padding:9px 12px}
  .choice{min-height:112px;font-size:50px;border-radius:24px}
  .stage{padding:16px 12px 18px;border-radius:28px}
}
@media (min-height:900px) and (min-width:600px){
  .play{justify-content:center}
  .stage{max-height:800px}
  .mid{gap:26px}
  .mascot{width:132px;height:140px}
  .choice{min-height:152px;font-size:70px;max-width:240px}
  .face-btn{max-width:220px}
}

<script>
(function(){
'use strict';

/* ═══ State ═══════════════════════════════════════════════════════ */
var KEY = 'aisb-petal-v1';
var S = { stars:0, got:{}, sound:true, vname:'', rate:1 };
try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); for (var k in p) if (k in S) S[k] = p[k]; } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

var app = document.getElementById('app');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* A game grows with her rather than ending the moment she has the idea: four
   rounds and two choices on the first sitting, eight rounds and five choices
   by the top. Seven levels, so a game she loves keeps opening up instead of
   running out. Still no losing and no clock — the stretch is in what she is
   asked to hold in her head, not in pressure. */
var MAXLVL = 6;
function lvl(id){ return Math.min(MAXLVL, Math.floor((S.got[id] || 0) / 10)); }
function nChoices(id){ var L = lvl(id); return L >= 5 ? 5 : (L >= 3 ? 4 : (L >= 2 ? 3 : 2)); }
function winFor(id){ return Math.min(8, 4 + lvl(id)); }

/* ═══ Helpers ═════════════════════════════════════════════════════ */
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function sample(a,n,skip){
  var pool = a.filter(function(x){ return !skip || skip.indexOf(x) < 0; });
  return shuffle(pool).slice(0,n);
}
function on(root, sel, fn){
  Array.prototype.forEach.call(root.querySelectorAll(sel), function(el){
    el.addEventListener('click', function(ev){ fn(el, ev); });
  });
}
function wait(ms, fn){ return setTimeout(fn, reduce ? Math.min(ms,160) : ms); }
var GEN = 0;
function later(ms, fn){ var g = GEN; return wait(ms, function(){ if (G && GEN === g) fn(); }); }

/* ═══ Sound ═══════════════════════════════════════════════════════ */
var ac = null;
function ctx(){
  if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, at, dur, type, vol){
  var c = ctx(); if (!c) return;
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  var t = c.currentTime + at;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfx(name){
  if (!S.sound) return;
  if (name === 'yes')      [587,740,880,1175].forEach(function(f,i){ tone(f, i*0.075, 0.3, 'sine', 0.15); });
  /* Deliberately not a buzzer. A three-year-old should hear "hmm?", not "WRONG". */
  else if (name === 'no')  { tone(440, 0, 0.14, 'sine', 0.08); tone(392, 0.11, 0.2, 'sine', 0.07); }
  else if (name === 'tap') tone(784, 0, 0.07, 'sine', 0.08);
  else if (name === 'step') tone(988, 0, 0.06, 'sine', 0.06);
  else if (name === 'star') [1175,1397,1760].forEach(function(f,i){ tone(f, i*0.05, 0.22, 'sine', 0.12); });
  else if (name === 'party') [587,740,880,1175,880,1175,1480].forEach(function(f,i){ tone(f, i*0.11, 0.36, 'sine', 0.14); });
}

/* ═══ Voice ═══════════════════════════════════════════════════════ */
var voices = [];
function loadVoices(){ try { voices = window.speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
var V_GREAT = /natural|neural|enhanced|premium|siri|online/i;
var V_GOOD  = /google|karen|catherine|matilda|samantha|serena|moira|tessa|fiona|libby|aria|jenny|sonia|natasha|nicky|ava|allison|joana|zoe/i;
var V_AWFUL = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|jester|organ|trinoids|whisper|wobble|zarvox|hysterical|princess|bruce|agnes|junior|ralph|kathy|fred|superstar|grandma|grandpa|rocko|sandy|shelley|eddy|flo|reed|compact|espeak/i;
function voiceScore(v, lang){
  var n = (v.name || '') + ' ' + (v.voiceURI || '');
  var s = 0;
  if (V_AWFUL.test(n)) s -= 200;
  if (V_GREAT.test(n)) s += 60;
  if (V_GOOD.test(n)) s += 25;
  if (!v.localService) s += 14;
  if (v['default']) s += 6;
  var vl = (v.lang || '').replace('_','-').toLowerCase(), want = lang.toLowerCase();
  if (vl === want) s += 30;
  else if (vl.split('-')[0] === want.split('-')[0]) s += 12;
  return s;
}
function voicesFor(lang){
  if (!voices.length) loadVoices();
  var base = lang.split('-')[0].toLowerCase();
  return voices
    .filter(function(v){ return v.lang && v.lang.replace('_','-').toLowerCase().split('-')[0] === base; })
    .sort(function(a, b){ return voiceScore(b, lang) - voiceScore(a, lang); });
}
function voiceFor(lang){
  var list = voicesFor(lang);
  if (!list.length) return null;
  if (S.vname){
    for (var i=0;i<list.length;i++) if (list[i].voiceURI === S.vname || list[i].name === S.vname) return list[i];
  }
  return list[0];
}
function hasLang(lang){ return !!voiceFor(lang); }
function say(text, lang, rate){
  if (!S.sound || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-AU';
    u.rate = (rate || 0.84) * (S.rate || 1);
    u.pitch = 1.08;
    var v = voiceFor(u.lang); if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch(e){}
}

sizeFx(); addEventListener('resize', sizeFx);
var CONF = ['#F27FA8','#C23B6B','#9B6BD6','#F0B429','#5FC9B0','#FFFFFF','#F6A5C0'];
function heartPath(c, r){
  c.beginPath();
  c.moveTo(0, r*0.35);
  c.bezierCurveTo(-r, -r*0.4, -r*0.5, -r*1.1, 0, -r*0.45);
  c.bezierCurveTo(r*0.5, -r*1.1, r, -r*0.4, 0, r*0.35);
  c.closePath();
}
function burst(n, x, y){
  if (reduce) return;
  x = x == null ? innerWidth/2 : x; y = y == null ? innerHeight*0.42 : y;
  for (var i=0;i<(n||70);i++){
    var a = Math.random()*Math.PI*2, sp = 3 + Math.random()*9;
    bits.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 5,
      r:5+Math.random()*7, c:pick(CONF), rot:Math.random()*6, vr:(Math.random()-0.5)*0.35,
      life:1, heart:Math.random() < 0.55 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  fxc.clearRect(0,0,innerWidth,innerHeight);
  for (var i=bits.length-1;i>=0;i--){
    var b = bits[i];
    b.vy += 0.3; b.x += b.vx; b.y += b.vy; b.vx *= 0.99; b.rot += b.vr; b.life -= 0.008;
    if (b.life <= 0 || b.y > innerHeight + 40) { bits.splice(i,1); continue; }
    fxc.save(); fxc.translate(b.x,b.y); fxc.rotate(b.rot);
    fxc.globalAlpha = Math.max(0, Math.min(1, b.life*1.6));
    fxc.fillStyle = b.c;
    if (b.heart){ heartPath(fxc, b.r); fxc.fill(); }
    else fxc.fillRect(-b.r/2, -b.r/2, b.r, b.r*0.7);
    fxc.restore();
  }
  raf = bits.length ? requestAnimationFrame(tick) : 0;
  if (!raf) fxc.clearRect(0,0,innerWidth,innerHeight);
}

    area:'Comparing size', note:'Starts by asking for the big one or the little one. Later it puts five on screen and asks her to tap them in order, smallest to biggest — one look becomes a plan.' },
  { id:'sound',  title:'Who Says That?',  sub:'Animal sounds',     mascot:'sloth',    color:'var(--c-sound)',
    area:'Listening and animals', note:'Hears a sound and finds the animal that makes it. There is a repeat button so she can hear it as often as she likes; past level four the word comes off the screen so the only way through is to listen.' },
  { id:'feel',   title:'Happy Faces',     sub:'How do they feel?', mascot:'panda',    color:'var(--c-feel)',
    area:'Feelings', note:'Four feelings to begin with — happy, sad, angry, tired — the four she has words for. Scared and surprised join later.' },
  { id:'body',   title:'Where Is My Nose?',sub:'Point to me',      mascot:'giraffe',  color:'var(--c-body)',
    area:'Body parts', note:'Taps parts of a dressed cartoon child. Every part has an oversized invisible target so a small finger can actually land on it. Later it gives her two, then three, to find in order — a small instruction she has to keep hold of while she moves.' },
  { id:'thai',   title:'Thai Hello',      sub:'สวัสดี',            mascot:'elephant', color:'var(--c-thai)',
    area:'Thai language', note:'Nine everyday Thai words with pictures and sound. Falls back to reading the romanisation if the device has no Thai voice. Past level four the question turns round: she sees the picture and picks the Thai writing, with no romanisation to lean on.' },
  { id:'safe',   title:'Clothes Stay On', sub:'My body is mine',   mascot:'koala',    color:'var(--c-safe)',
    area:'Body safety — the swimsuit rule', note:'Three kinds of round: a rule she says back with one tap on a heart, a choice between a private and a public place to get changed in, and a place she is off to where clothes stay on. Two of the three offer only a positive action — putting "take them off" on a button would model the very thing this teaches against. No body is ever shown. See the note above for what to add in your own words.' },
  { id:'pairs',  title:'Matching Pairs',   sub:'Find the two that match', mascot:'kitten', color:'var(--c-pairs)',
    area:'Memory and concentration', note:'Two pairs to start, six once she is good at it. A mismatch just turns the cards back — nothing is ever counted against her — so the only way through a round is to remember where things were.' },
  { id:'patt',   title:'What Comes Next?', sub:'Finish the pattern', mascot:'unicorn', color:'var(--c-patt)',
    area:'Patterns and early maths', note:'Repeating patterns, the first real algebra: red-blue-red-blue and then what? Starts with two-item patterns and works up to four-item ones like ABCD.' },
  { id:'where',  title:'In, On, Under',    sub:'Where is it hiding?', mascot:'duck', color:'var(--c-where)',
    area:'Position words', note:'The words that make instructions make sense — in, on, under. She sees where the thing is and picks the word for it.' },
  { id:'odd',    title:'Odd One Out',      sub:'Which is different?', mascot:'owl', color:'var(--c-odd)',
    area:'Sorting and reasoning', note:'Everything belongs to one family except one. Later on the odd one comes from a neighbouring family — a carrot among the fruit — so a quick glance is not enough.' },
  { id:'opp',    title:'The Other Way',    sub:'Find the opposite', mascot:'swan', color:'var(--c-opp)',
    area:'Vocabulary and reasoning', note:'Big and little, day and night, loud and quiet. The first idea here that is not about how something looks — she has to hold a word and reach for its other end. The picture comes away at the top levels, leaving just the word.' },
  { id:'more',   title:'Which Has More?',  sub:'Count them both', mascot:'squirrel', color:'var(--c-more)',
    area:'Comparing numbers', note:'Counting says how many; this asks her to count two piles and compare them, which is harder. Later it asks which has FEWER, so the answer is not simply the bigger-looking pile.' },
  { id:'abc',    title:'My First Letters', sub:'Find the letter', mascot:'bear', color:'var(--c-abc)',
    area:'Letter recognition', note:'Three steps: match a capital to a capital, then match a capital to its little letter, then hear a word and find the letter it starts with.' }
];
function act(id){ for (var i=0;i<ACTS.length;i++) if (ACTS[i].id === id) return ACTS[i]; return null; }

/* ═══ Chrome ══════════════════════════════════════════════════════ */
function barHTML(title, back){
  return '<div class="bar">' +
    (back ? '<button class="icon-btn" data-back aria-label="Back">←</button>' : '') +
    '<div class="bar-title">' + title + '</div>' +
    '<button class="icon-btn" data-sound aria-pressed="' + S.sound + '" aria-label="Sound on or off">' + (S.sound ? '🔊' : '🔇') + '</button>' +
    '<div class="tally" id="tally"><span>⭐</span><span id="tallyN">' + S.stars + '</span></div>' +
    '</div>';
}
function wireBar(root){
  on(root, '[data-back]', function(){ sfx('tap'); hush(); G = null; home(); });
  on(root, '[data-sound]', function(el){
    S.sound = !S.sound; save();
    el.textContent = S.sound ? '🔊' : '🔇';
    el.setAttribute('aria-pressed', S.sound);
    if (S.sound) sfx('tap'); else hush();
  });
}
function addStar(id){
  S.stars++; S.got[id] = (S.got[id] || 0) + 1; save();
  var t = document.getElementById('tally'), n = document.getElementById('tallyN');
  if (n) n.textContent = S.stars;
  if (t){ t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump'); }
}

/* ═══ Home ════════════════════════════════════════════════════════ */
function home(){
  hush(); GEN++; G = null;
  var tiles = ACTS.map(function(a){
    var got = S.got[a.id] || 0;
    return '<button class="tile" data-go="' + a.id + '" style="--tile:' + a.color + '">' +
      (got ? '<span class="got">⭐ ' + got + '</span>' : '') +
      '<span class="peek">' + (SVG[a.mascot] || '') + '</span>' +
      '<h2>' + a.title + '</h2><span class="sub">' + a.sub + '</span>' +
      '</button>';
  }).join('');

  app.innerHTML = barHTML('Petal Playground', false) +
    '<div class="hero">' +
      '<span class="sparkle" style="top:6px;right:18%">✦</span>' +
      '<span class="sparkle" style="top:52px;right:6%;animation-delay:.7s">✧</span>' +
      '<span class="sparkle" style="top:110px;right:22%;animation-delay:1.4s">✦</span>' +
      '<div class="eyebrow">Pre-K1 · for my girl</div>' +
      '<h1>Hello, lovely.<br><em>Come and play.</em></h1>' +
      '<p>Sixteen little games. Tap anywhere — nothing here can go wrong.</p>' +
    '</div>' +
    '<div class="board">' + tiles + '</div>' +
    '<div class="footnote"><button class="linky" data-panel>For grown-ups →</button></div>';

  wireBar(app);
  on(app, '[data-go]', function(el){ sfx('tap'); start(el.getAttribute('data-go')); });
  on(app, '[data-panel]', function(){ sfx('tap'); grownups(); });
}

/* ═══ Play shell ══════════════════════════════════════════════════ */
var G = null;

function start(id){
  var a = act(id);
  GEN++;
  G = { a:a, round:0, correct:0, misses:0 };
  app.innerHTML = barHTML(a.title, true) +
    '<div class="play" style="--accent:' + a.color + '">' +
      '<div class="dots" id="dots"></div>' +
      '<div class="stage" id="stage"></div>' +
    '</div>';
  wireBar(app);
  next();
}
function dots(){
  var d = document.getElementById('dots'); if (!d) return;
  var out = '';
  for (var i=0;i<winFor(G.a.id);i++) out += '<span class="dot' + (i < G.correct ? ' on' : '') + '"></span>';
  d.innerHTML = out;
}
function stage(){ return document.getElementById('stage'); }

function lay(line, middle, tail){
  return '<div class="buddy">' + mascotHTML(G.a.mascot) +
      (line ? '<div class="bubble">' + line + '</div>' : '') + '</div>' +
    '<div class="mid">' + middle + '</div>' + (tail || '');
}

function scored(ok, thenSay){
  if (ok){
    sfx('yes'); react('happy'); addStar(G.a.id);
    G.correct++; G.misses = 0;
    dots();
    if (thenSay) later(240, function(){ say(thenSay); });
    if (G.correct >= winFor(G.a.id)) { later(1150, party); return; }
    later(1500, next);
  } else {
    sfx('no'); react('oops');
    G.misses++;
    if (thenSay) later(240, function(){ say(thenSay); });
    // Two misses and the right answer starts glowing. She always gets there.
    if (G.misses >= 2) later(500, showMe);
  }
}
/* Overridden per round when the right answer is not a .choice. */
var showMe = function(){};
function glow(sel){
  var el = stage() && stage().querySelector(sel);
  if (el) el.classList.add('hintme');
}

function next(){
  if (!G || !stage()) return;
  GEN++; G.round++; G.misses = 0;
  showMe = function(){};
  dots();
  ({ colour:roundColour, count:roundCount, shape:roundShape, size:roundSize,
     sound:roundSound, feel:roundFeel, body:roundBody, thai:roundThai,
     safe:roundSafe, pairs:roundPairs, patt:roundPatt, where:roundWhere,
     odd:roundOdd, opp:roundOpp, more:roundMore, abc:roundAbc })[G.a.id]();
}

function party(){
  sfx('party'); burst(90); GEN++;
  var a = G.a;
  var lines = ['Clever girl!','You did it!','Beautiful!','So clever!','Hooray!'];
  var wrap = document.createElement('div');
  wrap.className = 'curtain';
  wrap.innerHTML = '<div class="party" style="--accent:' + a.color + '">' +
    mascotHTML(a.mascot, 'is-happy') +
    '<h2>' + pick(lines) + '</h2>' +
    '<p>' + NUMWORD[winFor(a.id)] + ' in a row on ' + a.title + '.</p>' +
    '<span class="sticker">⭐ ' + S.stars + ' stars altogether</span>' +
    '<button class="btn" data-more>Play more</button>' +
    '<button class="btn ghost" data-home>Pick another</button>' +
    '</div>';
  document.body.appendChild(wrap);
  say('Hooray! Clever girl.');
  on(wrap, '[data-more]', function(){ sfx('tap'); wrap.remove(); G.correct = 0; next(); });
  on(wrap, '[data-home]', function(){ sfx('tap'); wrap.remove(); G = null; home(); });
  wait(900, function(){ burst(50, innerWidth*0.32, innerHeight*0.4); });
}

/* ═══ 1 · Rainbow Colours ═════════════════════════════════════════ */
/* A single tap was over before she had looked. Now she has to find every one
   of a colour — two at first, three once she is sure — scattered among things
   of other colours, in four different shapes so she cannot win by matching
   outlines instead of reading the colour. */
var BLOOM_KINDS = ['heart','flower','star','butterfly'];
function roundColour(){
  var L = lvl('colour');
  var pool = COLOURS.filter(function(c){ return c.tier <= Math.min(2, L); });
  var right = pick(pool);
  var others = pool.filter(function(c){ return c.n !== right.n; });
  var want = L < 2 ? 2 : (L < 5 ? 3 : 4);
  var total = [4, 5, 6, 7, 8, 10, 12][L];

  var items = [];
  for (var i = 0; i < want; i++) items.push(right);
  /* Distractors are drawn with repeats allowed, so the target is not simply
     the only colour that appears more than once. */
  while (items.length < total) items.push(pick(others));
  items = shuffle(items).map(function(c, i){
    return { c:c, i:i, kind:pick(BLOOM_KINDS), hit:c.n === right.n };
  });

  function tally(found){ return 'Found ' + found + ' of ' + want; }

  stage().innerHTML = lay(
    'Find every <b>' + right.n + '</b> one!',
    '<div class="garden">' + items.map(function(t){
      return '<button class="bloom" data-i="' + t.i + '" data-n="' + t.c.n + '" data-hit="' + (t.hit ? 1 : 0) + '"' +
        ' aria-label="' + t.c.n + ' ' + t.kind + '">' + blobSVG(t.kind, t.c.c) + '</button>';
    }).join('') + '</div>' +
    '<p class="ask" id="tallyline" aria-live="polite">' + tally(0) + '</p>',
    ''
  );
  showMe = function(){ glow('.bloom[data-hit="1"]:not(.yes)'); };
  later(340, function(){ say('Find all the ' + right.n + ' ones. There are ' + NUMWORD[want] + '.'); });

  var found = 0, done = false;
  on(stage(), '.bloom', function(el){
    if (done || el.classList.contains('yes')) return;
    if (el.getAttribute('data-hit') === '1'){
      el.classList.add('yes');
      found++;
      var line = document.getElementById('tallyline');
      if (line) line.textContent = tally(found);
      if (found >= want){
        done = true;
        scored(true, 'You found all ' + NUMWORD[want] + ' ' + right.n + ' ones!');
      } else {
        sfx('step');
        say(NUMWORD[found], 'en-AU', 1);
      }
    } else {
      el.classList.add('no');
      wait(600, function(){ el.classList.remove('no'); });
      scored(false, 'That one is ' + el.getAttribute('data-n') + '. Keep looking for ' + right.n + '.');
    }
  });
}

/* ═══ 2 · Count to Five ═══════════════════════════════════════════ */
var NUMWORD = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
function roundCount(){
  var L = lvl('count');
  var hi = L < 1 ? 3 : (L < 3 ? 5 : (L < 5 ? 8 : 10));
  var n = 1 + Math.floor(Math.random() * hi);
  var emo = pick(CUTE);
  var want = nChoices('count');
  /* Near misses make better wrong answers than random ones — she has to count
     rather than eyeball the pile. */
  var near = shuffle([n-1, n+1, n-2, n+2]).filter(function(x){ return x >= 1 && x <= hi && x !== n; });
  var opts = [n].concat(near.slice(0, want - 1));
  var b = 1;
  while (opts.length < want){ if (opts.indexOf(n + b) < 0 && n + b >= 1 && n + b <= hi) opts.push(n + b); b++; if (b > hi + 2) break; }
  opts = shuffle(opts);

  var body = '';
  for (var i=0;i<n;i++) body += '<button class="critter" data-c="' + i + '">' + emo + '</button>';

  stage().innerHTML = lay(
    'Touch each one!',
    '<div class="herd">' + body + '</div>' +
    '<p class="ask" aria-live="polite">How many?</p>',
    '<div class="choices">' + opts.map(function(v){
      return '<button class="choice num" data-v="' + v + '">' + v + '</button>';
    }).join('') + '</div>'
  );
  showMe = function(){ glow('.choice[data-v="' + n + '"]'); };
  later(340, function(){ say('Touch each one.'); });

  var tapped = 0;
  on(stage(), '.critter', function(el){
    if (el.classList.contains('counted')) return;
    tapped++;
    el.classList.add('counted');
    el.insertAdjacentHTML('beforeend', '<span class="tag">' + tapped + '</span>');
    sfx('step');
    say(NUMWORD[tapped] || String(tapped), 'en-AU', 1);
  });

  var done = false;
  on(stage(), '.choice', function(el){
    var v = +el.getAttribute('data-v');
    if (v === n){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, NUMWORD[n] + '! There are ' + n + '.');
    } else {
      el.classList.add('no');
      scored(false, 'Count them again with your finger.');
    }
  });
}

/* ═══ 3 · Shape Party ═════════════════════════════════════════════ */
function roundShape(){
  var L = lvl('shape');
  var pool = L < 1 ? ['circle','square','triangle','heart'] : (L < 3 ? SHAPE_BASIC : SHAPE_NAMES);
  var right = pick(pool);
  var opts = shuffle([right].concat(sample(pool, nChoices('shape') - 1, [right])));

  stage().innerHTML = lay(
    'Find one like this!',
    '<div class="shape-hero" style="color:var(--accent)">' + shapeSVG(right) + '</div>' +
    '<p class="ask" aria-live="polite">Which one matches?</p>',
    '<div class="choices">' + opts.map(function(s){
      return '<button class="choice" data-s="' + s + '" aria-label="' + s + '">' +
        '<span class="shape-mini" style="color:var(--ink-soft)">' + shapeSVG(s) + '</span></button>';
    }).join('') + '</div>'
  );
  showMe = function(){ glow('.choice[data-s="' + right + '"]'); };
  later(340, function(){ say('This is a ' + right + '. Find one the same.'); });

  var done = false;
  on(stage(), '.choice', function(el){
    if (el.getAttribute('data-s') === right){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, right + '! Well done.');
    } else {
      el.classList.add('no');
      scored(false, 'Look at the big one again.');
    }
  });
}

/* ═══ 4 · Big & Little ════════════════════════════════════════════ */
/* Picking the big one is one look. Putting five of them in order is a plan,
   so that is what the later levels ask for. */
var SIZE_SCALE = [1, 0.44, 0.72, 0.88, 0.58];
function roundSize(){
  var L = lvl('size');
  var emo = pick(CUTE);
  var order = L >= 4;
  var count = Math.min(SIZE_SCALE.length, Math.max(3, nChoices('size')));
  var sizes = shuffle(SIZE_SCALE.slice(0, count));
  var wantBig = Math.random() < 0.5;

  /* The biggest one still has to fit next to all the others on a phone, so the
     whole set shrinks as it grows. */
  var base = count >= 5 ? 68 : (count >= 4 ? 88 : 112);
  function sizerHTML(lab){
    return '<div class="sizes">' + sizes.map(function(sz, i){
      return '<button class="sizer" data-s="' + sz + '" data-i="' + i + '" aria-label="' + lab(sz) + '" ' +
        'style="font-size:' + Math.round(base * sz) + 'px">' + emo + '</button>';
    }).join('') + '</div>';
  }

  if (order){
    var seq = sizes.slice().sort(function(a, b){ return wantBig ? b - a : a - b; });
    var ask = wantBig ? 'Tap them from biggest to smallest' : 'Tap them from smallest to biggest';
    stage().innerHTML = lay(
      'Put them in order for me!',
      sizerHTML(function(){ return 'one of them'; }) +
      '<p class="ask" aria-live="polite">' + ask + '</p>',
      ''
    );
    var step = 0, settled = false;
    showMe = function(){ glow('.sizer[data-s="' + seq[step] + '"]'); };
    later(340, function(){ say(ask + '.'); });
    on(stage(), '.sizer', function(el){
      if (settled) return;
      if (+el.getAttribute('data-s') === seq[step]){
        step++; sfx('step');
        el.classList.add('yes');
        el.insertAdjacentHTML('beforeend', '<span class="rank">' + step + '</span>');
        if (step >= seq.length){ settled = true; scored(true, 'In order. Beautiful!'); }
      } else {
        el.classList.add('no');
        wait(600, function(){ el.classList.remove('no'); });
        if (step > 0){
          step = 0;
          Array.prototype.forEach.call(stage().querySelectorAll('.sizer'), function(t){
            t.classList.remove('yes');
            var r = t.querySelector('.rank'); if (r) r.remove();
          });
          scored(false, 'Start again from the ' + (wantBig ? 'biggest' : 'smallest') + ' one.');
        } else {
          scored(false, 'Find the ' + (wantBig ? 'biggest' : 'smallest') + ' one first.');
        }
      }
    });
    return;
  }

  var target = wantBig ? Math.max.apply(null, sizes) : Math.min.apply(null, sizes);
  stage().innerHTML = lay(
    wantBig ? 'Which one is BIG?' : 'Which one is little?',
    sizerHTML(function(sz){ return sz === target ? (wantBig ? 'the big one' : 'the little one') : 'another one'; }) +
    '<p class="ask" aria-live="polite">Tap the ' + (wantBig ? 'big' : 'little') + ' one</p>',
    ''
  );
  showMe = function(){ glow('.sizer[data-s="' + target + '"]'); };
  later(340, function(){ say('Tap the ' + (wantBig ? 'big' : 'little') + ' one.'); });

  var done = false;
  on(stage(), '.sizer', function(el){
    if (+el.getAttribute('data-s') === target){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, 'Yes! That one is ' + (wantBig ? 'big' : 'little') + '.');
    } else {
      el.classList.add('no');
      scored(false, 'Look for the ' + (wantBig ? 'biggest' : 'smallest') + ' one.');
    }
  });
}

/* ═══ 5 · Who Says That? ══════════════════════════════════════════ */
function roundSound(){
  var L = lvl('sound');
  var right = pick(ANIMAL_SOUNDS);
  var opts = shuffle([right].concat(sample(ANIMAL_SOUNDS, nChoices('sound') - 1, [right])));
  function playIt(){ say(right.s + ' ' + right.s + ' Who says that?'); }
  /* Once she is good at it the word comes off the screen, so the only way
     through is to actually listen. */
  var showWord = L < 4;

  stage().innerHTML = lay(
    'Listen! Who says that?',
    '<div class="feel-word" aria-live="polite">' + (showWord ? right.s : '🔊') + '</div>' +
    '<p class="ask">Tap the animal</p>',
    '<div class="choices">' + opts.map(function(a){
      return '<button class="choice" data-n="' + a.n + '" aria-label="' + a.n + '">' + a.a + '</button>';
    }).join('') + '</div>' +
    '<p class="hint"><button class="linky" data-again>🔊 again</button></p>'
  );
  showMe = function(){ glow('.choice[data-n="' + right.n + '"]'); };
  later(380, playIt);
  on(stage(), '[data-again]', playIt);

  var done = false;
  on(stage(), '.choice', function(el){
    if (el.getAttribute('data-n') === right.n){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, 'Yes! The ' + right.n + ' says ' + right.s);
    } else {
      el.classList.add('no');
      scored(false, 'That is a ' + el.getAttribute('data-n') + '. Listen again.');
    }
  });
}

/* ═══ 6 · Happy Faces ═════════════════════════════════════════════ */
function roundFeel(){
  var pool = lvl('feel') < 3 ? FEEL_BASIC : FEEL_KEYS;
  var right = pick(pool);
  var opts = shuffle([right].concat(sample(pool, nChoices('feel') - 1, [right])));

  stage().innerHTML = lay(
    'Who feels this way?',
    '<div class="feel-word" aria-live="polite">' + right + '</div>' +
    '<p class="ask">Who looks ' + right + '?</p>',
    '<div class="faces">' + opts.map(function(k){
      return '<button class="face-btn" data-f="' + k + '" aria-label="' + k + ' face">' + faceSVG(k) + '</button>';
    }).join('') + '</div>' +
    '<p class="hint">Can you make that face too?</p>'
  );
  showMe = function(){ glow('.face-btn[data-f="' + right + '"]'); };
  later(340, function(){ say('Who looks ' + right + '?'); });

  var done = false;
  on(stage(), '.face-btn', function(el){
    if (el.getAttribute('data-f') === right){

/* ═══ 7 · Where Is My Nose? ═══════════════════════════════════════ */
var SINGULAR = { nose:1, mouth:1, tummy:1, hair:1 };
function isAre(w){ return SINGULAR[w] ? 'is' : 'are'; }
/* One part is a pointing game. Two or three in a row is a little instruction
   she has to keep hold of while she moves — which is the actual skill. */
function roundBody(){
  var L = lvl('body');
  var howMany = L < 3 ? 1 : (L < 5 ? 2 : 3);
  var want = sample(BODY_PARTS, howMany);
  var words = want.map(function(x){ return 'the ' + x.say; });
  var askText = howMany === 1
    ? 'Tap ' + words[0]
    : 'Tap ' + words.slice(0, -1).join(', ') + ', then ' + words[words.length - 1];
  var spoken = howMany === 1
    ? 'Where ' + isAre(want[0].say) + ' ' + words[0] + '?'
    : 'Ready? ' + askText + '.';

  stage().innerHTML = lay(
    howMany === 1 ? 'Where ' + isAre(want[0].say) + ' my ' + want[0].say + '?' : 'Can you remember all of them?',
    '<div class="kid">' + kidSVG() + '</div>' +
    '<p class="ask" aria-live="polite">' + askText + '</p>',
    '<p class="hint">Can you find yours too?</p>'
  );
  var step = 0, settled = false;
  showMe = function(){
    var el = stage().querySelector('.bp[data-p="' + want[step].p + '"]');
    if (el) el.classList.add('hintme');
  };
  later(340, function(){ say(spoken); });

  on(stage(), '.bp', function(el){
    if (settled) return;
    if (el.getAttribute('data-p') === want[step].p){
      el.classList.add('found');
      step++;
      if (step >= want.length){
        settled = true;
        scored(true, howMany === 1 ? 'Yes! That is ' + words[0] + '.' : 'All of them. Clever girl!');
      } else {
        sfx('step');
        say('Now ' + words[step] + '.');
      }
    } else {
      el.classList.add('no');
      wait(600, function(){ el.classList.remove('no'); });
      if (step > 0){
        step = 0;
        Array.prototype.forEach.call(stage().querySelectorAll('.bp'), function(t){ t.classList.remove('found'); });
        scored(false, 'Start again. ' + askText + '.');
      } else {
        scored(false, 'That is the ' + el.getAttribute('data-p') + '. Try again.');
      }
    }
  });
}

/* ═══ 8 · Thai Hello ══════════════════════════════════════════════ */

/* ═══ 9 · Clothes Stay On ═════════════════════════════════════════
   Body-safety for a three-year-old is call-and-response, not a quiz. Two of
   the three round types have only a positive action to take — she hears the
   rule and agrees with it — because offering "take them off" as a tappable
   choice would model the very thing this is teaching against. Only the
   where-do-we-change round asks her to discriminate, and both of its options
   are ordinary places. Nothing here depicts a body. */
function roundSafe(){
  var mode = ['affirm', 'place', 'clothes'][(G.round - 1) % 3];

  if (mode === 'affirm'){
    var r = pick(SAFE.affirmations);
    stage().innerHTML = lay(
      'Say it with me.',
      '<div style="font-size:76px;line-height:1">' + r.emoji + '</div>' +
      '<p class="rule" aria-live="polite">' + r.say + '</p>',
      '<button class="heart-btn" data-yes><span>💗</span>Yes!</button>'
    );
    later(320, function(){ say(r.say, 'en-AU', 0.76); });
    var used = false;
    on(stage(), '[data-yes]', function(el){
      if (used) return;
      used = true; el.classList.add('yes');
      scored(true, r.say);
    });
    return;
  }

  if (mode === 'place'){
    var q = pick(SAFE.placeSort);
    var pair = shuffle([
      { k:'right', emo:q.rightEmoji, lab:q.rightLabel },
      { k:'wrong', emo:q.wrongEmoji, lab:q.wrongLabel }
    ]);
    stage().innerHTML = lay(
      'Where do we get changed?',
      '<p class="rule" aria-live="polite">' + q.ask + '</p>',
      '<div class="choices">' + pair.map(function(o){
        return '<button class="choice" data-k="' + o.k + '" aria-label="' + o.lab + '">' +
          '<span>' + o.emo + '</span><span class="cap">' + o.lab + '</span></button>';
      }).join('') + '</div>'
    );
    showMe = function(){ glow('.choice[data-k="right"]'); };
    later(320, function(){ say(q.ask, 'en-AU', 0.76); });
    var settled = false;
    on(stage(), '.choice', function(el){
      if (el.getAttribute('data-k') === 'right'){
        if (settled) return;
        settled = true; el.classList.add('yes');
        scored(true, 'Yes! In ' + q.rightLabel + '.');
      } else {
        el.classList.add('no');
        scored(false, 'Not there. That is where other people can see us.');
      }
    });
    return;
  }

  var pl = pick(SAFE.clothesOn);
  stage().innerHTML = lay(
    'Where are we going?',
    '<div style="font-size:82px;line-height:1">' + pl.emoji + '</div>' +
    '<p class="rule" aria-live="polite">We are going to ' + pl.place + '.<br>Clothes stay on!</p>',
    '<button class="heart-btn" data-yes><span>👕</span>Clothes on!</button>'
  );
  later(320, function(){ say('We are going to ' + pl.place + '. Clothes stay on!', 'en-AU', 0.76); });
  var tapped = false;
  on(stage(), '[data-yes]', function(el){
    if (tapped) return;
    tapped = true; el.classList.add('yes');
    scored(true, 'Clothes stay on at ' + pl.place + '.');
  });
}

/* ═══ 10 · Matching Pairs ═════════════════════════════════════════
   Turning a card over and holding it in her head is the longest single thing
   she does here. A mismatch is never scored against her — the cards simply
   turn back — so the only way out of a round is finding every pair. */
function roundPairs(){
  var L = lvl('pairs');
  var nPairs = [2, 3, 3, 4, 4, 5, 6][L];
  var cols = nPairs <= 2 ? 2 : (nPairs === 3 ? 3 : 4);
  var faces = sample(CUTE, nPairs);
  var deck = shuffle(faces.concat(faces)).map(function(f, i){ return { f:f, i:i }; });

  stage().innerHTML = lay(
    'Find the two that match!',
    '<div class="deck" style="grid-template-columns:repeat(' + cols + ',auto)">' +
      deck.map(function(c){
        return '<button class="pcard" data-i="' + c.i + '" data-f="' + c.f + '" aria-label="a card">' + c.f + '</button>';
      }).join('') + '</div>' +
    '<p class="ask" id="tallyline" aria-live="polite">0 of ' + nPairs + ' pairs</p>',
    ''
  );
  later(340, function(){ say('Turn over two cards. Can you find a matching pair?'); });

  var open = [], matched = 0, busy = false;
  on(stage(), '.pcard', function(el){
    if (busy || el.classList.contains('up') || el.classList.contains('done')) return;
    el.classList.add('up');
    sfx('tap');
    open.push(el);
    if (open.length < 2) return;

    busy = true;
    var a = open[0], b = open[1];
    if (a.getAttribute('data-f') === b.getAttribute('data-f')){
      matched++;
      var line = document.getElementById('tallyline');
      if (line) line.textContent = matched + ' of ' + nPairs + ' pairs';
      open = [];
      a.classList.add('done'); b.classList.add('done');
      if (matched >= nPairs){
        busy = true;
        scored(true, 'Every pair found. Clever girl!');
      } else {
        sfx('step');
        say('A pair!', 'en-AU', 1);
        busy = false;
      }
    } else {
      sfx('no');
      later(900, function(){
        a.classList.remove('up'); b.classList.remove('up');
        open = []; busy = false;
      });
    }
  });
}

/* ═══ 11 · What Comes Next? ═══════════════════════════════════════ */
function roundPatt(){
  var L = lvl('patt');
  var units = L < 2 ? [['A','B']]
    : (L < 3 ? [['A','B'],['A','A','B'],['A','B','B']]
    : (L < 5 ? [['A','B'],['A','A','B'],['A','B','B'],['A','B','C']]
             : [['A','A','B'],['A','B','B'],['A','B','C'],['A','A','B','B'],['A','B','C','D']]));
  var unit = pick(units);
  var letters = [];
  unit.forEach(function(x){ if (letters.indexOf(x) < 0) letters.push(x); });
  var faces = sample(CUTE, letters.length);
  var map = {};
  letters.forEach(function(x, i){ map[x] = faces[i]; });

  /* Show at least two whole repeats so the rhythm is visible, then ask for
     the very next one. */
  var reps = unit.length > 2 ? 2 : 3;
  var seq = [];
  for (var r = 0; r < reps; r++) for (var i = 0; i < unit.length; i++) seq.push(unit[i]);
  var answer = map[unit[seq.length % unit.length]];
  var opts = shuffle([answer].concat(sample(CUTE, nChoices('patt') - 1, faces)));

  stage().innerHTML = lay(
    'What comes next?',
    '<div class="strip' + (seq.length >= 5 ? ' long' : '') + '">' +
      seq.map(function(x){ return '<span>' + map[x] + '</span>'; }).join('') +
      '<span class="gap">?</span></div>' +
    '<p class="ask" aria-live="polite">Which one comes next?</p>',
    '<div class="choices">' + opts.map(function(f){
      return '<button class="choice" data-f="' + f + '" aria-label="a picture">' + f + '</button>';
    }).join('') + '</div>'
  );
  showMe = function(){ glow('.choice[data-f="' + answer + '"]'); };
  later(340, function(){ say('Look at the order. What comes next?'); });

  var done = false;
  on(stage(), '.choice', function(el){
    if (el.getAttribute('data-f') === answer){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, 'Yes! That one comes next.');
    } else {
      el.classList.add('no');
      scored(false, 'Say the order out loud with your finger.');
    }
  });
}

/* ═══ 13 · Which One Is Different? ════════════════════════════════ */
var ODD_SETS = [
  { many:'fruit',            one:'a fruit',        items:['🍎','🍌','🍓','🍇','🍊','🍐'], near:'vegetables' },
  { many:'animals',          one:'an animal',      items:['🐈','🐕','🐰','🐘','🦆','🐷'], near:'sea animals' },
  { many:'things that go',   one:'a thing that goes', items:['🚗','🚌','🚂','✈️','🚲','🚤'] },
  { many:'clothes',          one:'clothes',        items:['👕','👗','🧦','👞','🧢','🧣'] },
  { many:'flowers',          one:'a flower',       items:['🌸','🌷','🌻','🌹','🌼','💐'], near:'vegetables' },
  { many:'vegetables',       one:'a vegetable',    items:['🥕','🥦','🌽','🍆','🥒','🫑'], near:'fruit' },
  { many:'sea animals',      one:'a sea animal',   items:['🐟','🐠','🐙','🦀','🐬','🐳'], near:'animals' }
];
/* Telling a car from an apple is easy. The later levels put the odd one in a
   neighbouring family — a carrot among the fruit — so she has to hold the
   actual category in mind. */
function roundOdd(){
  var L = lvl('odd');
  var main = pick(ODD_SETS);
  var rest = ODD_SETS.filter(function(x){ return x.many !== main.many; });
  var close = rest.filter(function(x){ return x.many === main.near; });
  var other = (L >= 4 && close.length) ? close[0] : pick(rest);
  var odd = pick(other.items);
  var body = shuffle(sample(main.items, nChoices('odd')).map(function(f){
    return { f:f, odd:false };
  }).concat([{ f:odd, odd:true }]));

  stage().innerHTML = lay(
    'One of these is different!',
    '<p class="ask" aria-live="polite">Which one is not ' + main.one + '?</p>',
    '<div class="choices">' + body.map(function(t){
      return '<button class="choice" data-odd="' + (t.odd ? 1 : 0) + '" aria-label="a picture">' + t.f + '</button>';
    }).join('') + '</div>'
  );
  showMe = function(){ glow('.choice[data-odd="1"]'); };
  later(340, function(){ say('All of them are ' + main.many + ', except one. Which one is different?'); });

  var done = false;
  on(stage(), '.choice', function(el){
    if (el.getAttribute('data-odd') === '1'){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, 'That one is different. Clever girl!');
    } else {
      el.classList.add('no');
      scored(false, 'That one is ' + main.one + '. Find the odd one.');
    }
  });
}

/* ═══ 14 · Opposites ══════════════════════════════════════════════ */
var OPPOSITES = [
  { a:{ w:'big',   e:'\uD83D\uDC18' }, b:{ w:'little', e:'\uD83D\uDC2D' } },
  { a:{ w:'hot',   e:'\u2600\uFE0F' }, b:{ w:'cold',   e:'\u2744\uFE0F' } },
  { a:{ w:'up',    e:'\u2B06\uFE0F' }, b:{ w:'down',   e:'\u2B07\uFE0F' } },
  { a:{ w:'day',   e:'\uD83C\uDF1E' }, b:{ w:'night',  e:'\uD83C\uDF19' } },
  { a:{ w:'wet',   e:'\uD83D\uDCA7' }, b:{ w:'dry',    e:'\uD83C\uDFDC\uFE0F' } },
  { a:{ w:'happy', e:'\uD83D\uDE00' }, b:{ w:'sad',    e:'\uD83D\uDE22' } },
  { a:{ w:'fast',  e:'\uD83D\uDC07' }, b:{ w:'slow',   e:'\uD83D\uDC22' } },
  { a:{ w:'open',  e:'\uD83D\uDEAA' }, b:{ w:'closed', e:'\uD83D\uDD12' } },
  { a:{ w:'loud',  e:'\uD83D\uDCE2' }, b:{ w:'quiet',  e:'\uD83E\uDD2B' } }
];
/* Opposites are the first idea here that is not about what a thing looks
   like — she has to hold a word and reach for its other end. The picture
   comes off the question at the top levels, leaving just the word. */
function roundOpp(){
  var L = lvl('opp');
  var pair = pick(OPPOSITES);
  var flip = Math.random() < 0.5;
  var shown = flip ? pair.b : pair.a;
  var answer = flip ? pair.a : pair.b;
  var others = [];
  OPPOSITES.forEach(function(x){
    if (x === pair) return;
    others.push(x.a); others.push(x.b);
  });
  var opts = shuffle([answer].concat(sample(others, nChoices('opp') - 1)));
  var withPicture = L < 4;

  stage().innerHTML = lay(
    'What is the other way round?',
    (withPicture ? '<div style="font-size:72px;line-height:1">' + shown.e + '</div>' : '') +
    '<div class="feel-word" aria-live="polite">' + shown.w + '</div>' +
    '<p class="ask">What is the opposite of ' + shown.w + '?</p>',
    '<div class="choices">' + opts.map(function(o){
      return '<button class="choice" data-w="' + o.w + '" aria-label="' + o.w + '">' +
        (withPicture ? '<span>' + o.e + '</span>' : '') +
        '<span class="cap">' + o.w + '</span></button>';
    }).join('') + '</div>'
  );
  showMe = function(){ glow('.choice[data-w="' + answer.w + '"]'); };
  later(340, function(){ say('What is the opposite of ' + shown.w + '?'); });

  var done = false;
  on(stage(), '.choice', function(el){
    if (el.getAttribute('data-w') === answer.w){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, shown.w + ' and ' + answer.w + '. That is right!');
    } else {
      el.classList.add('no');
      scored(false, 'Not quite. The opposite of ' + shown.w + '.');
    }
  });
}

/* ═══ 15 · Which Has More? ════════════════════════════════════════
   Counting tells her how many. This asks her to count two piles and compare
   them, which is a different and harder thing — and at the top it asks for
   fewer, so the answer is not simply "the big-looking one". */
function roundMore(){
  var L = lvl('more');
  var hi = L < 2 ? 4 : (L < 4 ? 6 : 9);
  var groups = L < 4 ? 2 : 3;
  var gapMin = L < 2 ? 2 : 1;
  var wantMore = L < 3 ? true : Math.random() < 0.55;
  var emo = pick(CUTE);

  /* Counts are drawn without replacement so no two piles are ever equal — a
     tie between the losing piles still looks broken to her even when the
     winner is unambiguous. */
  var counts, bag = [];
  for (var v = 1; v <= hi; v++) bag.push(v);
  for (var guard = 0; guard < 300; guard++){
    counts = shuffle(bag).slice(0, groups);
    var sorted = counts.slice().sort(function(x, y){ return x - y; });
    var best = wantMore ? sorted[sorted.length - 1] : sorted[0];
    var second = wantMore ? sorted[sorted.length - 2] : sorted[1];
    if (Math.abs(best - second) >= gapMin) break;
  }
  var target = wantMore ? Math.max.apply(null, counts) : Math.min.apply(null, counts);
  var ask = wantMore ? 'Which one has MORE?' : 'Which one has FEWER?';

  stage().innerHTML = lay(
    'Count them both!',
    '<div class="piles">' + counts.map(function(c, i){
      var pile = '';
      for (var k = 0; k < c; k++) pile += '<span>' + emo + '</span>';
      return '<button class="pile" data-c="' + c + '" data-i="' + i + '" aria-label="' + c + '">' + pile + '</button>';
    }).join('') + '</div>' +
    '<p class="ask" aria-live="polite">' + ask + '</p>',
    ''
  );
  showMe = function(){ glow('.pile[data-c="' + target + '"]'); };
  later(340, function(){ say(ask); });

  var done = false;
  on(stage(), '.pile', function(el){
    if (+el.getAttribute('data-c') === target){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, NUMWORD[target] + ' is ' + (wantMore ? 'more' : 'fewer') + '. Well done!');
    } else {
      el.classList.add('no');
      scored(false, 'Count them again with your finger.');
    }
  });
}

/* ═══ 16 · My First Letters ═══════════════════════════════════════ */
var ABC = [
  { u:'A', l:'a', e:'\uD83C\uDF4E', w:'apple' }, { u:'B', l:'b', e:'\uD83D\uDC3B', w:'bear' },
  { u:'C', l:'c', e:'\uD83D\uDC08', w:'cat' },   { u:'D', l:'d', e:'\uD83D\uDC15', w:'dog' },
  { u:'E', l:'e', e:'\uD83E\uDD5A', w:'egg' },   { u:'F', l:'f', e:'\uD83D\uDC1F', w:'fish' },
  { u:'H', l:'h', e:'\uD83C\uDFE0', w:'house' }, { u:'M', l:'m', e:'\uD83C\uDF19', w:'moon' },
  { u:'S', l:'s', e:'\u2600\uFE0F', w:'sun' },   { u:'T', l:'t', e:'\uD83C\uDF33', w:'tree' }
];
/* Three steps, not one: match a capital to a capital, then match a capital to
   its little letter, then hear a word and find the letter it starts with. */
function roundAbc(){
  var L = lvl('abc');
  var mode = L < 3 ? 'same' : (L < 5 ? 'lower' : 'sound');
  var right = pick(ABC);
  var opts = shuffle([right].concat(sample(ABC, nChoices('abc') - 1, [right])));
  var face = mode === 'lower' ? function(x){ return x.l; } : function(x){ return x.u; };

  var head, askText, spoken;
  if (mode === 'sound'){
    head = '<div style="font-size:80px;line-height:1">' + right.e + '</div>';
    askText = 'What does ' + right.w + ' start with?';
    spoken = right.w + '. What does ' + right.w + ' start with?';
  } else {
    head = '<div class="bigletter">' + right.u + '</div>';
    askText = mode === 'lower' ? 'Find the little ' + right.u : 'Find the same letter';
    spoken = mode === 'lower'
      ? 'This is big ' + right.u + '. Find the little one.'
      : 'This is ' + right.u + '. Find another ' + right.u + '.';
  }

  stage().innerHTML = lay(
    mode === 'sound' ? 'Listen to the first sound!' : 'Find the letter!',
    head + '<p class="ask" aria-live="polite">' + askText + '</p>',
    '<div class="choices">' + opts.map(function(x){
      return '<button class="choice letter" data-u="' + x.u + '" aria-label="letter ' + x.u + '">' +
        face(x) + '</button>';
    }).join('') + '</div>'
  );
  showMe = function(){ glow('.choice[data-u="' + right.u + '"]'); };
  later(340, function(){ say(spoken); });

  var done = false;
  on(stage(), '.choice', function(el){
    if (el.getAttribute('data-u') === right.u){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, right.u + ' for ' + right.w + '!');
    } else {
      el.classList.add('no');
      scored(false, 'That one is ' + el.getAttribute('data-u') + '. Look again.');
    }
  });
}

/* ═══ Grown-ups ═══════════════════════════════════════════════════ */
var VOICE_SAMPLE = 'Hello lovely! Can you find the pink one?';
function voicePanel(){
  var list = voicesFor('en-AU');
  if (!list.length){
    return '<p><b>Reading voice:</b> this device has not reported any voices yet. ' +
      'Close this panel, tap a game, then come back.</p>';
  }
  var best = voiceFor('en-AU');
  var opts = list.slice(0, 40).map(function(v){
    var id = v.voiceURI || v.name;
    var tag = V_GREAT.test(v.name + ' ' + id) ? ' ★ high quality' : (v === best ? ' — recommended' : '');
    return '<option value="' + id.replace(/"/g, '&quot;') + '"' +
      ((S.vname && S.vname === id) || (!S.vname && v === best) ? ' selected' : '') + '>' +
      v.name + ' (' + v.lang + ')' + tag + '</option>';
  }).join('');
  return '<div class="field"><label for="vpick">Reading voice</label>' +
      '<div class="vrow"><select class="vsel" id="vpick">' + opts + '</select>' +
      '<button class="btn ghost" data-vtest>▶ Hear it</button></div>' +
      '<p>Pick whichever sounds most like a person. On an iPad the good ones are a free download: ' +
      '<b>Settings → Accessibility → Spoken Content → Voices → English</b>, then tap ⬇ next to ' +
      '<b>Enhanced</b> or <b>Premium</b>. Reload afterwards and it appears here marked ★.</p></div>' +
    '<div class="field"><label for="rpick">Speaking speed</label>' +
      '<select class="vsel" id="rpick" style="flex:1 1 100%">' +
        [['0.85','Slower'],['1','Normal'],['1.15','Quicker']].map(function(r){
          return '<option value="' + r[0] + '"' + (String(S.rate) === r[0] ? ' selected' : '') + '>' + r[1] + '</option>';
        }).join('') + '</select></div>';
}
function wireVoice(root){
  var pick2 = root.querySelector('#vpick'), rate = root.querySelector('#rpick');
  if (pick2) pick2.addEventListener('change', function(){ S.vname = pick2.value; save(); say(VOICE_SAMPLE); });
  if (rate) rate.addEventListener('change', function(){ S.rate = parseFloat(rate.value) || 1; save(); say(VOICE_SAMPLE); });
  on(root, '[data-vtest]', function(){ if (!S.sound){ S.sound = true; save(); } say(VOICE_SAMPLE); });
}

function grownups(){
  var rows = ACTS.map(function(a){
    return '<div class="map-row" style="--tile:' + a.color + '">' +
      '<div><h3>' + a.title + '</h3>' +
      '<div class="area">' + a.area + '</div>' +
      '<p style="margin-top:6px">' + a.note + '</p></div></div>';
  }).join('');

  var wrap = document.createElement('div');
  wrap.className = 'panel';
  wrap.innerHTML = '<div class="panel-inner">' +
    '<div class="bar"><div class="bar-title" style="font-size:30px">For grown-ups</div>' +
    '<button class="icon-btn" data-close aria-label="Close">✕</button></div>' +
    '<p>Nine games pitched at pre-K1 — a three-year-old who cannot read a word. Two choices at a time, everything spoken aloud, and no way to lose: after two wrong taps the right answer starts glowing so she always gets there. Three in a row earns a celebration. Everything runs in the page: no accounts, no network, no ads. Progress is saved on this device only.</p>' +
    SAFETY_NOTE +
    '<div class="band"><span class="band-name">Sound &amp; voice</span></div>' +
    voicePanel() +
    '<div class="band"><span class="band-name">What each game teaches</span></div>' +
    '<div class="map">' + rows + '</div>' +
    '<button class="btn ghost" data-reset style="--accent:var(--c-feel)">Clear the star count</button>' +
    '</div>';
  document.body.appendChild(wrap);
  wireVoice(wrap);
  on(wrap, '[data-close]', function(){ sfx('tap'); wrap.remove(); });
  on(wrap, '[data-reset]', function(el){
    if (el.getAttribute('data-armed')){ S.stars = 0; S.got = {}; save(); wrap.remove(); home(); }
    else { el.setAttribute('data-armed','1'); el.textContent = 'Tap again to clear ' + S.stars + ' stars'; }
  });
}

/* ═══ Go ══════════════════════════════════════════════════════════ */
home();

document.addEventListener('pointerdown', function once(){
  ctx();
  try {
    if (window.speechSynthesis){
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
      loadVoices();
    }
  } catch(e){}
  document.removeEventListener('pointerdown', once);
}, { once:true });

})();
</script>
