<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYBKK Tee Shop · AYBKK T恤</title>
<style>
  @font-face{
    font-family:'Shantell Sans';
    src:url('/fonts/shantell-var.woff2') format('woff2');
    font-weight:300 800; font-display:swap;
  }
  :root{ --purple:#582C83; --ink:#241243; --paper:#f6f3fa; --line:#e3dcf0;
         --hand:'Shantell Sans',-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:#2b2340;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  header{background:var(--purple);color:#fff;padding:26px 18px 22px;text-align:center}
  header img.bird{width:92px;display:block;margin:0 auto 4px}
  header h1{margin:0;font-size:30px;letter-spacing:.5px;font-family:var(--hand);font-weight:800}
  header p{margin:8px 0 0;opacity:.92;font-size:15px;font-family:var(--hand);font-weight:500}
  main{max-width:560px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
  .card img{width:100%;display:block;aspect-ratio:1;object-fit:cover;background:#eee}
  .card .body{padding:14px}
  .card h2{margin:0 0 2px;font-size:21px;font-family:var(--hand);font-weight:800}
  .card .zh{color:#6b5f85;font-size:14px;margin-bottom:8px}
  .price{font-size:22px;font-weight:800;color:var(--purple);font-family:var(--hand)}
  .price s.full{font-size:15px;font-weight:600;opacity:.55}
  .price b.pre{font-size:24px}
  .price .prelabel{font-size:12px;font-weight:700;letter-spacing:.04em;opacity:.75}
  .paynote{font-size:12px;color:#8a7db0;margin-top:2px}
  .sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .size{border:1.5px solid var(--line);border-radius:10px;padding:8px 13px;font-size:15px;background:#faf8ff;cursor:pointer}
  .size b{margin-right:4px}
  .size small{color:#8a7db0}
  .size.out{opacity:.35;text-decoration:line-through;pointer-events:none}
  .size:active{background:var(--purple);color:#fff}
  /* order sheet */
  #sheet{position:fixed;inset:0;background:rgba(30,18,55,.55);display:none;align-items:flex-end;z-index:20}
  #sheet.show{display:flex}
  #sheetIn{background:#fff;width:100%;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
  #sheetIn h3{margin:0 0 12px;font-size:18px}
  label{display:block;font-size:13px;color:#6b5f85;margin:12px 0 4px}
  input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px}
  .qty{display:flex;align-items:center;gap:14px}
  .qty button{width:44px;height:44px;font-size:22px;border:1.5px solid var(--line);border-radius:10px;background:#faf8ff}
  .qty b{font-size:20px;min-width:24px;text-align:center}
  .cta{width:100%;margin-top:16px;padding:15px;border:none;border-radius:16px;background:var(--purple);color:#fff;font-size:18px;font-weight:800;font-family:var(--hand)}
  .cta[disabled]{opacity:.5}
  .ghost{width:100%;margin-top:8px;padding:12px;border:none;background:none;color:#8a7db0;font-size:14px;text-decoration:underline}
  /* payment stage */
  .paywrap{text-align:center}
  #countdown{font-size:40px;font-weight:800;color:var(--purple);margin:6px 0;font-family:var(--hand)}
  #payQr{max-width:240px;width:70%;border-radius:12px;border:1px solid var(--line)}
  .note{font-size:13px;color:#6b5f85;line-height:1.6;margin:10px 0}
  .state{padding:14px;border-radius:12px;background:#f2eefc;font-weight:700;margin-top:10px}
  .state.ok{background:#e6f6ec;color:#187a43}
  .state.bad{background:#fdeaea;color:#a33}
  footer{text-align:center;color:#9a8fb5;font-size:12px;padding:18px}
</style>
</head>
<body>
<header>
  <img class="bird" src="/img/hefei-bird.png" alt="">
  <h1>AYBKK Tee Shop</h1>
  <p>挑一件喜欢的 · pick one you love ✿</p>
</header>
<main id="list"><p style="text-align:center;color:#9a8fb5">加载中 Loading…</p></main>
<footer>AYBKK · my.aybkk.com</footer>

<div id="sheet"><div id="sheetIn"></div></div>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  let DATA = { products: [], paymentQr: null, wechatAccount: 'AYBKK' };
  let sel = null;        // {product, size}
  let qty = 1;
  let timer = null;

  const yen = n => '¥' + n;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  async function loadProducts() {
    try {
      const r = await fetch('/api/shop/products', { cache: 'no-store' });
      DATA = await r.json();
      renderList();
    } catch (e) {
      $('#list').innerHTML = '<p style="text-align:center;color:#a33">网络错误，请刷新 · Network error, please refresh</p>';
    }
  }

  function renderList() {
    const el = $('#list');
    if (!DATA.products.length) { el.innerHTML = '<p style="text-align:center;color:#9a8fb5">暂无商品 · No shirts yet</p>'; return; }
    el.innerHTML = '';
    for (const p of DATA.products) {
      const card = document.createElement('div'); card.className = 'card';
      const sizes = Object.entries(p.sizes || {}).map(([sz, n]) =>
        `<button class="size ${n < 1 ? 'out' : ''}" data-p="${p.id}" data-s="${esc(sz)}"><b>${esc(sz)}</b><small>${n < 1 ? '售罄 sold out' : '剩' + n}</small></button>`).join('');
      card.innerHTML =
        (p.photo ? `<img src="${esc(p.photo)}" alt="">` : '') +
        `<div class="body">
           <h2>${esc(p.nameEn)}</h2>
           <div class="zh">${esc(p.nameZh)}</div>
           <div class="price">${p.fullPrice > p.price ? `<s class="full">${yen(p.fullPrice)}</s> <b class="pre">${yen(p.price)}</b> <span class="prelabel">预购价 pre-order</span>` : yen(p.price)}</div>
           <div class="paynote">下单后请在 10 分钟内付款 · pay within 10 minutes</div>
           <div class="sizes">${sizes}</div>
         </div>`;
      el.appendChild(card);
    }
    el.querySelectorAll('.size').forEach(b => b.onclick = () => openOrder(b.dataset.p, b.dataset.s));
  }

  // ── order form ──
  function openOrder(pid, size) {
    const p = DATA.products.find(x => x.id === pid);
    if (!p) return;
    sel = { p, size }; qty = 1;
    $('#sheetIn').innerHTML = `
      <h3>${esc(p.nameEn)} · ${esc(size)} · ${yen(p.price)}</h3>
      <label>数量 Quantity</label>
      <div class="qty">
        <button id="less">−</button><b id="qn">1</b><button id="more">＋</button>
        <span style="color:#8a7db0;font-size:13px">合计 Total: <b id="tot">${yen(p.price)}</b></span>
      </div>
      <label>中文名字 Chinese name</label><input id="nameZh" autocomplete="off">
      <label>English name 英文名</label><input id="nameEn" autocomplete="off">
      <label>微信号 WeChat ID</label><input id="wechatId" autocomplete="off">
      <button class="cta" id="place">下单 Place order</button>
      <button class="ghost" id="cancel">取消 Cancel</button>`;
    $('#sheet').classList.add('show');
    const max = p.sizes[size] || 1;
    $('#more').onclick = () => { qty = Math.min(max, 10, qty + 1); paint(); };
    $('#less').onclick = () => { qty = Math.max(1, qty - 1); paint(); };
    const paint = () => { $('#qn').textContent = qty; $('#tot').textContent = yen(p.price * qty); };
    $('#cancel').onclick = closeSheet;
    $('#place').onclick = placeOrder;
  }
  function closeSheet(){ $('#sheet').classList.remove('show'); if (timer) { clearInterval(timer); timer = null; } }

  async function placeOrder() {
    const nameZh = $('#nameZh').value.trim(), nameEn = $('#nameEn').value.trim(), wechatId = $('#wechatId').value.trim();
    if (!(nameZh || nameEn) || !wechatId) { alert('请填写名字和微信号 · Name and WeChat ID required'); return; }
    $('#place').disabled = true;
    try {
      const r = await fetch('/api/shop/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productId: sel.p.id, size: sel.size, qty, nameZh, nameEn, wechatId }) });
      const j = await r.json();
      if (!r.ok) { alert((j.errorZh || '') + ' ' + (j.error || '')); $('#place').disabled = false; loadProducts(); return; }
      localStorage.setItem('aybkk_shop_order', JSON.stringify({ id: j.order.id, productId: sel.p.id, size: sel.size, qty }));
      showPayment(j.order, j.paymentQr, j.wechatAccount);
    } catch (e) { alert('网络错误 Network error'); $('#place').disabled = false; }
  }

  // ── payment stage: countdown + QR + screenshot ──
  function showPayment(order, qr, account) {
    $('#sheetIn').innerHTML = `
      <div class="paywrap">
        <h3>订单 ${esc(order.id)} · ${yen(order.amount)}</h3>
        <div id="countdown">10:00</div>
        <div class="note">请在10分钟内用微信扫码付款<br>Pay ${yen(order.amount)} by WeChat within 10 minutes</div>
        ${qr ? `<img id="payQr" src="${esc(qr)}" alt="WeChat Pay">` : `<div class="state bad">收款码暂缺，请直接转账给微信号 ${esc(account)}<br>QR not set — transfer to WeChat: ${esc(account)}</div>`}
        <div class="note">付款后请截图，上传付款截图 ↓<br>After paying, upload your payment screenshot ↓</div>
        <input type="file" id="shot" accept="image/*" style="display:none">
        <button class="cta" id="upBtn">上传付款截图 Upload screenshot</button>
        <div id="payState"></div>
        <button class="ghost" id="done">完成 Close</button>
      </div>`;
    $('#done').onclick = closeSheet;
    $('#upBtn').onclick = () => $('#shot').click();
    $('#shot').onchange = () => uploadShot(order.id);

    const end = order.expiresAt;
    const tick = () => {
      const left = Math.max(0, end - Date.now());
      const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
      $('#countdown').textContent = m + ':' + String(s).padStart(2, '0');
      if (left <= 0) {
        clearInterval(timer); timer = null;
        $('#countdown').textContent = '0:00';
        $('#payState').innerHTML = '<div class="state bad">已超时，你选的T恤还在购物车里，但先不为你保留了<br>Time is up — your shirt is still in the cart, just no longer held</div>' +
          '<button class="cta" id="again">再下单一次 Order it again</button>';
        $('#upBtn').style.display = 'none';
        loadProducts();
        const saved = JSON.parse(localStorage.getItem('aybkk_shop_order') || '{}');
        $('#again').onclick = () => { closeSheet(); if (saved.productId) openOrder(saved.productId, saved.size); };
      }
    };
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 500); tick();
  }

  async function uploadShot(orderId) {
    const f = $('#shot').files[0];
    if (!f) return;
    $('#upBtn').disabled = true; $('#upBtn').textContent = '上传中… Uploading…';
    try {
      const fd = new FormData(); fd.append('file', f);
      const up = await fetch('/api/upload/shop-payments', { method: 'POST', body: fd });
      const uj = await up.json();
      const file = uj.file && uj.file.filename ? '/uploads/shop-payments/' + uj.file.filename : null;
      if (!file) throw new Error('upload failed');
      const r = await fetch('/api/shop/orders/' + orderId + '/screenshot', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.errorZh || j.error);
      if (timer) { clearInterval(timer); timer = null; }
      $('#countdown').textContent = '✓';
      $('#payState').innerHTML = '<div class="state ok">已收到截图，等待确认。确认后T恤为你保留。<br>Screenshot received — waiting for confirmation. Your shirt is held for you.</div>';
      $('#upBtn').style.display = 'none';
    } catch (e) {
      $('#payState').innerHTML = '<div class="state bad">' + esc(e.message || 'failed') + '</div>';
      $('#upBtn').disabled = false; $('#upBtn').textContent = '上传付款截图 Upload screenshot';
    }
  }

  async function resumeOrder() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('aybkk_shop_order') || 'null'); } catch (e) {}
    if (!saved || !saved.id) return;
    try {
      const r = await fetch('/api/shop/orders/' + saved.id, { cache: 'no-store' });
      if (!r.ok) { localStorage.removeItem('aybkk_shop_order'); return; }
      const { order } = await r.json();
      if (order.status === 'pending') {
        $('#sheet').classList.add('show');
        showPayment(order, DATA.paymentQr, DATA.wechatAccount);
      } else if (order.status === 'review') {
        $('#sheet').classList.add('show');
        $('#sheetIn').innerHTML = `<div class="paywrap"><h3>订单 ${esc(order.id)}</h3>
          <div class="state ok">已收到你的付款截图，等待确认中。确认后T恤为你保留 ✓<br>Screenshot received — waiting for Boonchu's confirmation.</div>
          <button class="ghost" id="done">好 OK</button></div>`;
        $('#done').onclick = closeSheet;
      } else if (order.status === 'expired') {
        $('#sheet').classList.add('show');
        $('#sheetIn').innerHTML = `<div class="paywrap"><h3>${esc(order.productNameZh || order.productName)} · ${esc(order.size)} × ${order.qty}</h3>
          <div class="state bad">上次没来得及付款，T恤还在购物车里<br>Last order timed out — your shirt is still in the cart</div>
          <button class="cta" id="again">再下单一次 Order it again</button>
          <button class="ghost" id="done">先逛逛 Keep browsing</button></div>`;
        $('#again').onclick = () => { closeSheet(); openOrder(saved.productId, saved.size); };
        $('#done').onclick = closeSheet;
      } else if (order.status === 'paid') {
        localStorage.removeItem('aybkk_shop_order');
        $('#sheet').classList.add('show');
        $('#sheetIn').innerHTML = `<div class="paywrap"><h3>${esc(order.productNameZh || order.productName)} · ${esc(order.size)} × ${order.qty}</h3>
          <div class="state ok">已确认，T恤是你的了！到店取货 🎉<br>Confirmed — the shirt is yours! Pick it up at the shala.</div>
          <button class="ghost" id="done">太好了 Yay</button></div>`;
        $('#done').onclick = closeSheet;
      } else {
        localStorage.removeItem('aybkk_shop_order');
      }
    } catch (e) {}
  }

  (async () => { await loadProducts(); resumeOrder(); })();
})();
</script>
</body>
</html>
