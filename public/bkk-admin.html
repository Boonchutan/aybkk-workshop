<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYBKK Bangkok Admin</title>
<style>
  @font-face{font-family:'Work Sans';src:url('/fonts/worksans.woff2') format('woff2');font-weight:100 900;font-display:swap}
  @font-face{font-family:'Plex';src:url('/fonts/plexthai.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Plex';src:url('/fonts/plexthai-th.woff2') format('woff2');
    unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;font-display:swap}
  :root{--ink:#17121a;--wall:#f7f1f5;--paper:#fff;--blush:#fbe7f0;--plum:#5c2160;--plum-deep:#43164a;
    --pink:#e8458c;--soft:#6b5d70;--line:rgba(23,18,26,.11);--on-dark:#fdf7fa;--header:#17121a}
  @media (prefers-color-scheme:dark){:root{--ink:#f5e9f0;--wall:#140f18;--paper:#1e1723;--blush:#2b1c2b;
    --plum:#c07ec8;--plum-deep:#d9a5de;--pink:#ff6fae;--soft:#b09cb6;--line:rgba(245,233,240,.14);--on-dark:#17121a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--wall);color:var(--ink);font:16px/1.6 'Plex',-apple-system,'Helvetica Neue','PingFang SC',sans-serif}
  header{background:var(--header);color:#fdf7fa;padding:16px;display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:26px;flex:1;font-family:'Work Sans','Plex',sans-serif;font-weight:900;line-height:1.1;letter-spacing:.01em}
  nav{display:flex;background:var(--paper);border-bottom:1px solid var(--line)}
  nav button{flex:1;padding:13px;border:none;background:none;font:inherit;font-weight:700;font-size:15px;color:var(--soft);cursor:pointer}
  nav button.on{color:var(--plum);box-shadow:inset 0 -3px 0 var(--plum)}
  main{max-width:820px;margin:0 auto;padding:14px}
  .box{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px}
  .box b{font-family:'Work Sans','Plex',sans-serif;font-weight:800}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--soft);font-size:12px}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
  .pending{background:#fff3d6;color:#8a6a12}.paid{background:#e6f6ec;color:#187a43}
  .mismatch,.failed{background:#fdeaea;color:#a33}
  .btn{padding:9px 14px;border:none;border-radius:7px;background:var(--plum);color:var(--on-dark);font-weight:700;font-size:14px;cursor:pointer;font-family:'Work Sans','Plex',sans-serif;font-weight:800}
  .btn.gray{background:var(--plum-deep)}.btn.pink{background:var(--pink)}.btn.red{background:#b3453c;color:#fdf7fa}
  input{padding:10px;border:1.5px solid var(--line);border-radius:7px;font-size:15px;font-family:inherit;background:var(--wall);color:var(--ink)}
  #gate{max-width:340px;margin:16vh auto;text-align:center}
  .muted{color:var(--soft);font-size:12.5px}
  .in{color:#187a43;font-weight:700}
  .lang{display:flex;gap:4px}
  .lang button{padding:6px 8px;border:1.5px solid rgba(253,247,250,.35);border-radius:6px;background:none;color:#fdf7fa;
    font:700 13px/1 'Work Sans','Plex',sans-serif;cursor:pointer}
  .lang button.on{background:#fdf7fa;color:#17121a;border-color:#fdf7fa}
  #gate .lang{justify-content:center;margin-bottom:10px}
  #gate .lang button{color:var(--soft);border-color:var(--line)}
  #gate .lang button.on{background:var(--plum);color:var(--on-dark);border-color:var(--plum)}
  .attended,.active{background:#e6f6ec;color:#187a43}.upcoming{background:#fff3d6;color:#8a6a12}
  .noshow{background:#fdeaea;color:#a33}.cancelled,.void,.past{background:#eeeaf0;color:#5d5463}
  .refund,.frozen{background:#e3eefa;color:#2a5d8f}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:7px 11px;font-size:13px}
  select{padding:9px;border:1.5px solid var(--line);border-radius:7px;font-size:15px;font-family:inherit;
    background:var(--wall);color:var(--ink);max-width:100%}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
  .tile{background:var(--wall);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
  .tile span,.tile small{display:block;color:var(--soft);font-size:12px;line-height:1.4}
  .box .tile b{display:block;font-size:20px;line-height:1.3;overflow-wrap:anywhere}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .scroll.wide table{min-width:560px}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .nowrap{white-space:nowrap}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .seg button{padding:8px 13px;border:1.5px solid var(--line);border-radius:99px;background:var(--paper);color:var(--ink);
    font:700 13.5px/1.2 'Plex',sans-serif;cursor:pointer}
  .seg button.on{background:var(--plum);border-color:var(--plum);color:var(--on-dark)}
  .row2{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:6px 0}
  .row2 label{font-size:13px;color:var(--soft)}
  .cimap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:8px 12px;align-items:center;margin:8px 0}
  .cimap label{font-size:14px}
  .cimap select{width:100%}
  .list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:8px 10px;
    background:var(--paper);font-size:13.5px;line-height:1.5}
  .list div{padding:2px 0;border-bottom:1px solid var(--line)}
  .warnline{background:#fff3d6;color:#6b520e;border-radius:7px;padding:8px 10px;font-size:14px}
  .hhead h2{margin:4px 0 2px;font-family:'Work Sans','Plex',sans-serif;font-weight:800;font-size:24px;line-height:1.2}
  /* An id or class rule such as .chosen{display:flex} beats the browser's own [hidden]. */
  [hidden]{display:none!important}
  main.wide{max-width:1100px}
  .calbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
  .calbar .seg{margin:0;flex:1 1 auto}
  /* Month calendar, design B, as on the booking page: deep plum, hairlines, gold moons. */
  .cal{background:#3E1442;color:#FBF5F9;border-radius:12px;padding:12px 10px 14px;margin-bottom:12px}
  .cal .head{display:flex;align-items:center;margin:0 0 10px}
  .cal .head b{flex:1;text-align:center;font-family:'Work Sans','Plex',sans-serif;font-weight:900;font-size:24px;line-height:1.15;
    letter-spacing:.01em;color:#FBF5F9}
  .cal .head b small{font-weight:300;font-size:17px;margin-left:8px;color:#F2D98A}
  .cal.wk .head b{font-size:19px}
  .cal .nav{background:none;border:none;font-family:inherit;font-weight:700;font-size:26px;line-height:1;color:#F2D98A;
    cursor:pointer;padding:6px 14px;min-height:44px;min-width:44px}
  .cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal .grid > span{border-bottom:1px solid rgba(251,245,249,.28)}
  .cal .wd{text-align:left;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:#C9AFCB;padding:0 5px 8px;border-bottom:1px solid rgba(251,245,249,.28)}
  .cal .d{min-height:78px;border-bottom:1px solid rgba(251,245,249,.28);padding:6px 1px 6px 2px;min-width:0;
    display:flex;flex-direction:column;align-items:stretch;gap:4px;cursor:pointer}
  .cal .d .n{align-self:flex-start;background:none;border:0;padding:0 2px;min-height:20px;color:#FBF5F9;cursor:pointer;
    font:700 15px/1 'Plex',sans-serif;font-variant-numeric:tabular-nums}
  .cal .d.moonday{background:rgba(224,181,43,.08)}
  .cal .d.moonday .n{color:#F2D98A}
  .cal .d.today .n{color:#E0B52B}
  .cal .d.was .cl{opacity:.82}
  .cal .ch{display:block;font-weight:700;font-size:10px;line-height:1.2;overflow-wrap:break-word;padding-left:10px;position:relative}
  .cal .ch::before{content:"";position:absolute;left:0;top:3px;width:7px;height:7px;border-radius:50%;background:currentColor}
  .cal .ch b{display:none}
  .cal .ch.moon{color:#F2D98A;padding-left:14px}
  .cal .ch.moon::before{width:9px;height:9px;top:1px;background:transparent;box-shadow:inset 0 0 0 1.4px #E0B52B}
  .cal .ch.moon.full::before{background:#E0B52B}
  /* One tappable line per class: time, class, booked/places, checked in. */
  .cal .cl{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-width:0;margin:0;
    background:none;border:0;border-radius:4px;padding:2px 1px 3px;color:#FBF5F9;font:inherit;text-align:left;cursor:pointer}
  .cal .cl:hover{background:rgba(251,245,249,.1)}
  .cal .cl:focus-visible,.cal .d .n:focus-visible,.cal .nav:focus-visible,.wh:focus-visible,.wb:focus-visible{outline:2px solid #E0B52B;outline-offset:1px}
  .cal .ct{font-weight:800;font-size:11px;line-height:1.15;color:#7FD8CC;font-variant-numeric:tabular-nums}
  .cal .cn{font-style:normal;font-weight:800;font-size:10px;line-height:1.15;letter-spacing:-.01em;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#F0C6F2}
  .cal .mysore .cn{color:#FC838B}.cal .led_primary .cn{color:#8BFC83}.cal .led_inter .cn{color:#9AA2FF}
  .cal .cc{display:flex;flex-wrap:wrap;column-gap:4px;font-size:11px;line-height:1.25;font-variant-numeric:tabular-nums}
  .cal .cc b{font-weight:800;color:#FBF5F9;border-radius:3px}
  .cal .cc i{font-style:normal;font-weight:700;color:#C9AFCB}
  .cal .full .cc b{background:#FF6FAE;color:#3E1442;padding:0 3px}
  .cal .off{opacity:.55}
  .cal .off .ct,.cal .off .cn,.cal .off .cc b{text-decoration:line-through}
  .cal .ol{display:inline-block;font:900 8.5px/1 'Plex',sans-serif;padding:2px 3px;border-radius:3px;
    background:#F2C94C;color:#3E1442;white-space:nowrap}
  .cal .legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;padding:0 4px}
  .cal .legend .lr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%;font-size:12px;font-weight:600;color:#C9AFCB}
  .cal .legend .cl{display:inline-flex;width:auto;padding:0;cursor:default}
  .cal .legend .cn,.cal .legend .ch,.cal .legend .cc{font-size:12px}
  /* Week: a column a day, scrolling sideways inside the card on a phone. */
  .wkscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;position:relative}
  .wkgrid{display:grid;grid-template-columns:repeat(7,minmax(108px,1fr))}
  .wcol{min-width:0;padding:0 4px 10px;border-left:1px solid rgba(251,245,249,.16);display:flex;flex-direction:column;gap:6px}
  .wcol:first-child{border-left:0}
  .wcol.moonday{background:rgba(224,181,43,.06)}
  .wcol.today{background:rgba(224,181,43,.1);border-radius:6px}
  .wh{display:block;width:100%;min-height:44px;background:none;border:0;border-bottom:1px solid rgba(251,245,249,.28);
    color:#C9AFCB;font:700 11px/1.2 'Plex',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:left;
    padding:6px 3px 8px;cursor:pointer}
  :lang(th) .wh,:lang(th) .cal .wd{letter-spacing:0}
  .wh .wn{display:block;margin-top:2px;font:900 22px/1.1 'Work Sans','Plex',sans-serif;letter-spacing:0;color:#FBF5F9}
  .wcol.today .wh,.wcol.today .wh .wn{color:#E0B52B}
  .wh .ch{margin-top:4px;text-transform:none;letter-spacing:0}
  .cal .wh .ch b{display:inline;color:#F2D98A}
  .wb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-width:0;text-align:left;
    background:rgba(251,245,249,.07);border:0;border-left:3px solid #C9AFCB;border-radius:6px;padding:7px 7px 8px;
    color:#FBF5F9;font:inherit;cursor:pointer}
  .wb:hover{background:rgba(251,245,249,.13)}
  .wb.mysore{border-left-color:#FC838B}.wb.led_primary{border-left-color:#8BFC83}.wb.led_inter{border-left-color:#9AA2FF}
  .cal .wb .ct{font-size:13.5px}
  .cal .wb .cn{font-size:12.5px;line-height:1.2;white-space:normal;overflow:visible;overflow-wrap:anywhere}
  .wb .tc{font-size:11.5px;line-height:1.25;color:#C9AFCB;overflow-wrap:anywhere}
  .cal .wb .cc{font-size:12px}
  .wb .ci{font-size:12px;font-weight:700;color:#7FD8CC}
  .wcol.was .wb{opacity:.85}
  /* Day: rows in the page's own colours. */
  .dayhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .dayhead b{flex:1;text-align:center;font-size:19px;line-height:1.25}
  .dnav{background:none;border:1.5px solid var(--line);border-radius:8px;color:var(--plum);font:700 22px/1 'Plex',sans-serif;
    min-width:44px;min-height:44px;cursor:pointer}
  .drow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--wall);border:1px solid var(--line);
    border-left:5px solid var(--soft);border-radius:9px;padding:12px;margin-top:8px;font:inherit;color:var(--ink);cursor:pointer;min-height:68px}
  .drow:hover{box-shadow:0 0 0 1.5px var(--plum)}
  .drow.mysore{border-left-color:#FC838B}.drow.led_primary{border-left-color:#4cc95a}.drow.led_inter{border-left-color:#7f88ff}
  .drow .tm{font:800 21px/1 'Work Sans','Plex',sans-serif;color:var(--plum);min-width:58px;font-variant-numeric:tabular-nums}
  .drow .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .drow .bd b{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
  .drow .cnt{display:flex;flex-direction:column;align-items:flex-end;text-align:right;white-space:nowrap;font-size:12.5px;line-height:1.3}
  .drow .cnt b{font:800 19px/1.1 'Work Sans','Plex',sans-serif;font-variant-numeric:tabular-nums}
  .drow.full .cnt b{color:var(--pink)}
  .drow.off .tm,.drow.off .bd b,.drow.off .cnt b{text-decoration:line-through;opacity:.6}
  .drow .go{font-size:24px;line-height:1;color:var(--soft)}
  .pill.onl{background:var(--blush);color:var(--plum);vertical-align:2px}
  .pill.mat{background:#fff3d6;color:#6b520e;vertical-align:1px;margin-left:4px}
  /* Inside one class. */
  .tile.hot b{color:var(--pink)}
  .flash{border-radius:7px;padding:8px 10px;font-size:14px;margin:10px 0 0;background:#e6f6ec;color:#187a43}
  .flash.warn{background:#fff3d6;color:#6b520e}
  .flash small{display:block;font-size:12px;font-weight:400;overflow-wrap:anywhere}
  /* Settings: the payment watch (15 Nov 2026). */
  .pw .pwl{display:flex;align-items:center;gap:9px;margin:8px 0;cursor:pointer}
  .pw .pwl input{width:auto;margin:0;flex:none}
  .pw .pwrow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
  .pw .pwrow .pwl{margin-right:0}
  .pw input[type=time]{padding:6px 8px;font-size:15px}
  .rr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
  /* The student's face, or their initials, so staff can put a name to a face (9 Nov 2026). */
  .rr .av{flex:none;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;
    overflow:hidden;background:var(--blush);color:var(--plum);font:800 14px/1 'Work Sans','Plex',sans-serif}
  .rr .av img{display:block;width:100%;height:100%;object-fit:cover}
  .rr .rm{flex:1 1 210px;min-width:0;line-height:1.35}
  .rr .rm b{overflow-wrap:anywhere}
  .rr .rs{flex:0 0 auto;font-size:14px}
  .rr .ra{display:flex;flex-wrap:wrap;gap:6px}
  .rr.miss .rm{opacity:.7}
  .cxl div{font-size:13px;color:var(--soft);padding:5px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
  #addBox input:not([type=checkbox]){width:100%;margin-bottom:8px}
  .link{background:none;border:0;color:var(--plum);font:inherit;font-size:14px;font-weight:700;padding:6px 0;cursor:pointer}
  /* Payments: the name opens the student's profile; unpaid tries fold away (Nov 2026). */
  .link:focus-visible,details.tries>summary:focus-visible{outline:2px solid var(--plum);outline-offset:2px;border-radius:4px}
  .link.who{padding:0;font-size:inherit;text-align:left;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
  .ordact{display:flex;flex-direction:column;align-items:stretch;gap:6px}
  .ordact .btn{white-space:nowrap}
  .chk{display:block;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--plum)}
  .chk:empty{display:none}
  .chk small{display:block;font-size:12px;font-weight:400;color:var(--soft);overflow-wrap:anywhere}
  .chk.ok,.chk.warn{padding:5px 8px;border-radius:6px}
  .chk.ok{background:#e6f6ec;color:#187a43}.chk.warn{background:#fff3d6;color:#6b520e}
  details.tries{margin-top:14px;border-top:1px solid var(--line)}
  details.tries>summary{cursor:pointer;padding:12px 0 10px;font-weight:700}
  details.tries>summary .muted{display:block;font-weight:400}
  /* One sale, one row (15 Nov 2026): a ฿0 line, where a row came from, and what was done by hand. */
  .pill.zero,.pill.twin{background:#eeeaf0;color:#5d5463}
  .pill.hand{background:#fff3d6;color:#6b520e;margin-top:4px}
  .badge{display:inline-block;padding:0 6px;border:1px solid var(--soft);border-radius:5px;font-size:11.5px;font-weight:700;
    line-height:1.5;color:var(--soft);vertical-align:1px}
  .onote{display:block;margin-top:3px;font-size:12.5px;line-height:1.4;color:var(--soft);overflow-wrap:anywhere}
  .onote.warn{color:#8a5a00;font-weight:700}
  .gone{color:var(--soft);text-decoration:line-through}
  .reloadbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;
    background:#fff3d6;color:#6b520e;font-weight:700;font-size:14.5px;cursor:pointer;border-bottom:1px solid var(--line)}
  .reloadbar span{flex:1 1 200px}
  .reloadbar .btn{min-height:44px}
  .sellout:empty{display:none}
  .sellout .btn{margin-top:8px;min-height:44px}
  .sellout .sub{display:block;font-size:12.5px;margin-top:2px}
  @media (max-width:640px),(pointer:coarse){.link.who,.ordact .btn,#chkAll,.tdh .btn,.btn.back{min-height:44px}
    .btn.rfr{min-height:44px;min-width:44px}}
  /* Today: each class opens, so "+ Add student" is one tap away (Nov 2026). */
  .tdh{display:flex;align-items:flex-start;gap:10px}
  .tdh>div{flex:1;min-width:0}
  .tdh .btn{flex:none;white-space:nowrap}
  /* A 44 px name button sits in the row's own padding, so the row stays one line high and in line. */
  table.tdl td{vertical-align:middle}table.tdl td:last-child{white-space:nowrap}
  @media (max-width:640px),(pointer:coarse){table.tdl td.nm{padding-top:0;padding-bottom:0}}
  /* The profile opens on what they can practise on today. */
  .now{margin:12px 0 4px;padding:9px 12px;border:1px solid var(--line);border-left:4px solid #187a43;border-radius:8px;background:var(--wall)}
  .now.none{border-left-color:#b3453c}
  .now h3{margin:0 0 2px;font:800 12.5px/1.4 'Work Sans','Plex',sans-serif;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
  :lang(th) .now h3{letter-spacing:0}
  .now .np{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;padding:3px 0}
  .now .np b{font-size:16px;overflow-wrap:anywhere}
  .now .np span:not(.pill){font-size:14px}
  /* The dot sits in the gap before its part, so at the start of a line it is cut off: no line starts or ends
     with one. The line runs 8px into the box's padding, so the gap after its last part costs no room. */
  .now .np .l{flex-basis:calc(100% + 8px);margin-right:-8px;overflow-x:clip;overflow-wrap:anywhere}
  .now .np .l span{display:inline-block;margin-right:8px}
  .now .np .l i{display:inline-block;width:0;position:relative;left:-8px;white-space:pre;font-style:normal}
  .now .np .nt{font-family:'Work Sans','Plex',sans-serif;font-weight:800}
  .now h3~h3{margin-top:10px}
  /* Two columns: when, then the class, so the class names line up and a long one wraps under itself. Under 340 px the class goes under its day. */
  .now .nbs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;padding:2px 0;font-size:14px}
  .now .nbs>span{overflow-wrap:anywhere}
  .now .nbs>span:nth-child(odd){font-weight:700;white-space:nowrap}

    document.title = T('title');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
    document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = T(el.dataset.ph); });
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  }
  window.setLang = l => {
    LANG = l === 'en' ? 'en' : 'th';
    store.set('aybkk_admin_lang', LANG);
    paintStatic();
    if ($('#gateMsg').textContent) $('#gateMsg').textContent = T('wrongPass');
    if ($('#app').style.display !== 'none') {
      if (SUB === 'history') { if (HIST) paintHistory(); return; }
      if (SUB === 'class') { if (CV.data) paintClass(); return; }
      if (current === 'calendar') { renderCalendar(true); return; }
      const term = current === 'students' && $('#q') ? $('#q').value.trim() : '';
      if (current === 'students') renderStudents(term); else tab(current);
    }
  };
  paintStatic();

  window.unlock = async () => {
    KEY = $('#key').value.trim();
    const r = await api('/api/bkk/admin/orders');
    if (r.status === 401) { $('#gateMsg').textContent = T('wrongPass'); return; }
    store.set('aybkk_bkk_key', KEY);
    $('#gate').style.display = 'none'; $('#app').style.display = 'block';
    tab('today');
  };
  window.logout = () => { store.del('aybkk_bkk_key'); location.reload(); };

  // A tab left open for days runs an old copy of this page (15 Nov 2026: the fix
  // for unpaid tries was live, the owner's tab was not). Asked when a tab opens
  // and every 10 minutes; never reloads by itself, as someone may be typing.
  let PAGE_TAG = null;
  async function checkPage() {
    let tag = null;
    try {
      const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
      if (r.ok) tag = [r.headers.get('ETag'), r.headers.get('Last-Modified')].filter(Boolean).join(' ') || null;
    } catch (_) {}
    if (!tag) return;
    if (PAGE_TAG == null) PAGE_TAG = tag;
    else if (tag !== PAGE_TAG) $('#reloadBar').hidden = false;
  }
  checkPage();
  setInterval(checkPage, 10 * 60e3);

  let current = 'today', SUB = null;    // SUB: a view opened on top of a tab ('history', 'class')
  window.tab = t => {
    current = t; SUB = null;
    closeQr(false);
    checkPage();
    $('#view').classList.remove('wide');
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.id === 't-' + t));
    if (t === 'today') renderToday();
    if (t === 'students') renderStudents();
    if (t === 'calendar') renderCalendar();
    if (t === 'orders') renderOrders();
    if (t === 'reports') renderReports();
    if (t === 'settings') renderSettings();
  };

  const day = iso => new Date(iso).toLocaleDateString(locale(),
    { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Bangkok' });
  const ask = (q, d = '') => { const v = prompt(q, d); return v === null ? null : v.trim(); };
  const shout = async (r) => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.error || T('failed')); return null; }
    return j;
  };

  // ── students ──────────────────────────────────────────────────────────────
  // back: where a student's profile was opened from, to land there again.
  async function renderStudents(term, back) {
    $('#view').innerHTML = `<div class="box">
      <b>${T('students')}</b>
      <p class="muted">${T('searchHelp')}</p>
      <p><input id="q" placeholder="${esc(T('searchPh'))}" style="width:68%" value="${esc(term || '')}">
      <button class="btn" onclick="findStudents()">${T('search')}</button></p>
      <div id="results"></div>
    </div>
    <div class="box">
      <b>${T('sellTitle')}</b>
      <p class="muted">${T('sellHelp')}</p>
      <p><button class="btn pink" id="sellBtn" onclick="sellDesk()"${SELL && SELL.busy ? ' disabled' : ''}>${T('sellBtn')}</button></p>
      <div id="sellOut" class="sellout" role="status" aria-live="polite">${sellOutHtml()}</div>
    </div>
    <div class="box">
      <b>${T('giveTitle')}</b>
      <p class="muted">${esc(T('giveHelp'))}</p>
      <p><button class="btn pink" onclick="grantPass()">${T('giveBtn')}</button></p>
    </div>
    <div class="box" id="ciBox">${importInner()}</div>
    <div class="box">
      <b>${T('impTitle')}</b>
      <p class="muted">${esc(T('impHelp'))}</p>
      <textarea id="imp" rows="8" style="width:100%;font:13px/1.5 ui-monospace,monospace;padding:10px;border:1.5px solid var(--line);border-radius:7px;background:var(--wall);color:var(--ink)"
        placeholder="Mei Xu | mei@example.com | 1 month | 3 Oct 2026&#10;Anna Lee | | 10 class pack | 12 Dec 2026 | 7"></textarea>
      <p><button class="btn pink" onclick="importRezerv()">${T('impBtn')}</button></p>
      <div id="impOut"></div>
    </div>`;
    $('#q').onkeydown = e => { if (e.key === 'Enter') findStudents(); };
    if (!term) return;
    await findStudents();
    if (back && current === 'students' && !SUB) backTo(back);
  }

  window.importRezerv = async () => {
    const rows = $('#imp').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const [name, email, plan, until, classesLeft] = l.split(/\s*[|\t]\s*/);
      return { name, email, plan, until, classesLeft };
    });
    if (!rows.length) return;
    const r = await api('/api/bkk/admin/import', { method: 'POST', body: JSON.stringify({ rows }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.error || T('failed')); return; }
    $('#impOut').innerHTML = `<div class="box" style="background:var(--blush)">${esc(T('impDone', j))}
      ${j.skipped.length ? `<br><b>${T('impSkipped')}</b><br>${j.skipped.map(esc).join('<br>')}` : ''}</div>`;
  };

  window.findStudents = async () => {
    const term = $('#q').value.trim();
    if (term.length < 2) { $('#results').innerHTML = `<p class="muted">${T('twoLetters')}</p>`; return; }
    await loadThNames();
    const d = await api('/api/bkk/admin/members?q=' + encodeURIComponent(term)).then(r => r.json());
    const ms = d.members || [];
    FOUND = Object.fromEntries(ms.map(m => [m.code, m]));
    if (!ms.length) { $('#results').innerHTML = `<p class="muted">${T('nobody')}</p>`; return; }
    $('#results').innerHTML = ms.map(m => `<div style="border-top:1px solid var(--line);padding:12px 0">
      ${whoBtn(m.code, m.name, 'who-s-' + m.code)} <span class="muted">${esc(m.code)}</span>
      <button class="btn sm" style="float:right" onclick="showHistory('${esc(m.code)}')">${T('histBtn')}</button><br>
      <span class="muted">${esc(m.email || T('noEmail'))}${m.phone ? ' · ' + esc(m.phone) : ''}
        · ${T('upcoming', m.booked)}${m.source === 'rezerv' ? ' · Rezerv' + (m.rezerv_id ? ' ' + esc(m.rezerv_id) : '') : ''}</span>
      ${(m.passes || []).map(p => `<div style="margin-top:8px">
        <span class="pill ${p.status === 'active' ? 'paid' : 'pending'}">${esc(W(p.status))}</span>
        ${esc(pkgName(p))} —
        ${p.kind === 'unlimited' ? T('unlimited') : T('left', p.credits_total - p.credits_used)}
        ${p.valid_until ? T('until', String(p.valid_until).slice(0, 10)) : T('notStarted')}
        <br>
        <button class="btn gray" onclick="passAct(${p.id},'freeze')">${T('freeze')}</button>
        <button class="btn gray" onclick="passAct(${p.id},'unfreeze')">${T('unfreeze')}</button>
        <button class="btn gray" onclick="passAct(${p.id},'extend')">${T('extend')}</button>
        <button class="btn red" onclick="passAct(${p.id},'void')">${T('void')}</button>
      </div>`).join('') || `<p class="muted">${T('noPass')}</p>`}
      <p style="margin-top:8px"><button class="btn" onclick="bookFor('${esc(m.code)}')">${T('bookBtn')}</button>
        <button class="btn pink" onclick="signinLink('${esc(m.code)}')">${T('linkBtn')}</button>
        <button class="btn pink" onclick="showQr('${esc(m.code)}', this)">${T('qrBtn')}</button>
        <button class="btn gray" onclick="changeEmail('${esc(m.code)}')">${T('emailBtn')}</button>
        <button class="btn red" onclick="signOutAll('${esc(m.code)}')">${T('outBtn')}</button>
        <button class="btn gray" onclick="mergeInto('${esc(m.code)}')">${T('mergeBtn')}</button></p>
      ${(m.folded || []).length ? `<p class="muted">${T('foldedL')} ${m.folded.map(f => `${esc(f.code)}${f.email ? ' · ' + esc(f.email) : ''}
        <button class="btn sm gray" onclick="unmerge('${esc(f.code)}')">${T('undoBtn')}</button>`).join(' ')}</p>` : ''}
      <div id="sl_${esc(m.code)}"></div>
    </div>`).join('');
  };

  let FOUND = {};
  // Fix a wrong email. One that sits on another profile moves only after M
  // confirms which profile it leaves.
  window.changeEmail = async (code) => {
    const m = FOUND[code]; if (!m) return;
    const email = ask(T('qEmail', m.name), m.email || ''); if (email === null) return;
    const send = body => api(`/api/bkk/admin/members/${encodeURIComponent(code)}/email`,
      { method: 'POST', body: JSON.stringify(body) });
    let r = await send({ email });
    if (r.status === 409) {
      const j = await r.json().catch(() => ({}));
      if (!j.owner || !confirm(T('qMove', email, j.owner))) { if (!j.owner) alert(j.error || T('failed')); return; }
      r = await send({ email, takeFrom: j.owner.code });
    }
    if (await shout(r)) { alert(T('emailDone')); findStudents(); }
  };
  // An email left on the profile would let the wrong person straight back in
  // (email link, checkout), so M says whose it is, against the email as it is
  // now: the server refuses a sign-out decided on a stale search. Typed answers,
  // so Cancel, Esc or Back never removes anyone's email.
  const emailFate = (name, email) => {
    const a = ask(T('qOutMail', name, email), '');
    if (a === null) return null;
    if (/^(keep|เก็บ)$/i.test(a)) return false;
    if (/^(remove|ลบ)$/i.test(a)) return true;
    alert(T('qOutMailBad'));
    return null;
  };
  window.signOutAll = async (code) => {
    const m = FOUND[code]; if (!m) return;
    const now = ((await api('/api/bkk/admin/members?q=' + encodeURIComponent(code)).then(r => r.json())
      .catch(() => ({}))).members || []).find(x => x.code === code);
    if (!now) { alert(T('failed')); return; }
    const body = { expectEmail: now.email || null };
    if (now.email) { const c = emailFate(now.name, now.email); if (c === null) return; body.clearEmail = c; }
    if (!confirm(T('qOut', now.name))) return;
    const send = () => api(`/api/bkk/admin/members/${encodeURIComponent(code)}/signout`,
      { method: 'POST', body: JSON.stringify(body) });
    let r = await send();
    if (r.status === 409) {
      const j = await r.clone().json().catch(() => ({}));
      if (j.needEmailDecision) {
        const c = emailFate(now.name, j.email); if (c === null) return;
        body.expectEmail = j.email; body.clearEmail = c;
        r = await send();
      }
    }
    const j = await shout(r);
    if (!j) return;
    $('#q').value = j.member.code;
    await findStudents();
    alert(T('outDone', now.name, j.linksStopped, j.removedEmail));
  };

  // Two profiles for one student (a Rezerv import, a second email): fold the
  // other into this one. The server shows what would move before anything does.
  window.mergeInto = async (code) => {
    const m = FOUND[code]; if (!m) return;
    const from = (ask(T('qMergeFrom', m.name), '') || '').toUpperCase(); if (!from) return;
    const send = body => api(`/api/bkk/admin/members/${encodeURIComponent(code)}/merge`,
      { method: 'POST', body: JSON.stringify({ from, ...body }) });
    const p = await shout(await send({ dryRun: true })); if (!p) return;
    const body = {};
    if (p.differs.length) {
      const a = ask(T('qMergeSure', p.keep, p.fold, p.differs), ''); if (a === null) return;
      if (a.toUpperCase() !== 'SAME') { alert(T('mergeNo')); return; }
      body.sure = true;
    }
    if (!confirm(T('mergePlan', p))) return;
    if (await shout(await send(body))) { alert(T('mergeDone', p.keep.name)); findStudents(); }
  };
  window.unmerge = async (code) => {
    if (!confirm(T('qUndo', code))) return;
    const r = await api(`/api/bkk/admin/members/${encodeURIComponent(code)}/unmerge`, { method: 'POST', body: '{}' });
    const j = await shout(r);
    if (j) { alert(T('undoDone', j)); findStudents(); }
  };

  // A link M pastes into the student's LINE, WhatsApp or WeChat: the short one,
  // since the long token link reads as spam in a chat.
  window.signinLink = async (code) => {
    const r = await api(`/api/bkk/admin/members/${encodeURIComponent(code)}/signin-link`, { method: 'POST', body: '{}' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.error || T('failed')); return; }
    const msg = `สวัสดีค่ะ คุณ${j.name} 🙏 โปรไฟล์ AYBKK ของคุณพร้อมแล้ว รูปการฝึกของคุณจะอยู่ที่นี่ เห็นได้เฉพาะคุณ\n`
      + `Hi ${j.name} 🙏 Your AYBKK profile is ready. Your class photos are here, only for you.\n\n`
      + `${j.short_link}\n\n`
      + `(ลิงก์ใช้ได้ ${j.days} วัน · This link works for ${j.days} days.)`;
    let copied = false;
    try { await navigator.clipboard.writeText(msg); copied = true; } catch (_) {}
    $('#sl_' + code).innerHTML = `<div class="box" style="background:var(--blush);margin-top:8px">
      <b style="font-size:15px">${copied ? T('linkCopied') : T('linkCopyHand')}</b>
      <textarea readonly style="width:100%;margin-top:6px;font-size:13px" rows="6">${esc(msg)}</textarea></div>`;
  };

  // Show QR: the student scans this screen at the desk and is signed in on that
  // phone. One scan, 10 minutes. The panel asks every 2.5 s whether it was used,
  // and stops asking once it was, once it ran out, or once the panel is gone.
  // Closing it (or leaving the screen) ends the QR, so a photo of it is no use.
  // The student's line is in all four languages, whatever the staff language.
  const QR_SAY = [['en', 'Scan with your phone camera'], ['th', 'สแกนด้วยกล้องมือถือ'],
    ['zh', '用手机相机扫码'], ['ru', 'Отсканируйте камерой телефона']];
  let QR = null, QR_SEQ = 0, QR_POLL = null, QR_TICK = null, QR_FROM = null, QR_BUSY = false;
  const qrStop = () => { clearTimeout(QR_POLL); clearInterval(QR_TICK); QR_POLL = QR_TICK = null; };
  const qrEnd = short => api(`/api/bkk/admin/signin-qr/${encodeURIComponent(short)}/end`,
    { method: 'POST', body: '{}', keepalive: true }).catch(() => null);
  // preventScroll: on a phone held sideways the card is taller than the screen, and focus would scroll the QR away.
  const qrFocus = () => { const b = $('#qrAgain') || $('#qrClose'); if (b) b.focus({ preventScroll: true }); };
  const qrLeft = () => { const s = Math.max(0, Math.ceil((QR.until - Date.now()) / 1000));
    return T('qrLeft', `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`); };
  const qrMsg = () => QR.state === 'used' ? `${T('qrUsed')} ${T('qrCheck', QR.name)}` : T('qrGone');
  function paintQr() {
    const el = $('#qrPanel');
    $('#app').inert = !!QR;                 // aria-modal alone lets Tab reach Lock behind the panel
    $('#qrLive').textContent = QR && QR.state !== 'live' ? qrMsg() : '';
    if (!QR) { el.hidden = true; el.innerHTML = ''; return; }
    const live = QR.state === 'live';
    el.innerHTML = `<div class="qrcard" role="dialog" aria-modal="true" aria-labelledby="qrName" aria-describedby="${live ? 'qrLeft' : 'qrMsg'}">
      <h2 id="qrName">${esc(QR.name)}</h2>
      ${live ? `<div class="qrbox" role="img" aria-label="${esc(T('qrImg'))}">${QR.svg.replace('<svg ', '<svg aria-hidden="true" focusable="false" ')}</div>
        <p class="qrleft" id="qrLeft">${esc(qrLeft())}</p>
        <div class="qrsay">${QR_SAY.map(([l, t]) => `<p lang="${l}">${t}</p>`).join('')}</div>`
      : `<div id="qrMsg"><p class="qrdone${QR.state === 'gone' ? ' gone' : ''}">${esc(T(QR.state === 'used' ? 'qrUsed' : 'qrGone'))}</p>
        ${QR.state === 'used' ? `<p class="qrcheck">${esc(T('qrCheck', QR.name))}</p>` : ''}</div>`}
      <div class="qrbtns">${QR.state === 'gone' ? `<button class="btn pink" id="qrAgain" onclick="showQr('${esc(QR.code)}')">${T('qrBtn')}</button>` : ''}
        <button class="btn gray" id="qrClose" onclick="closeQr()">${T('qrClose')}</button></div></div>`;
    el.hidden = false;
  }
  const qrDone = state => { QR.state = state; qrStop(); paintQr(); qrFocus(); };
  const qrRun = (now) => {
    qrStop();
    if (!QR || QR.state !== 'live' || document.hidden) return;
    const seq = QR_SEQ, short = QR.short;
    // With no answer at all (no network), the screen's own clock takes the QR away a few seconds after 0:00.
    const tick = () => {
      if (!QR || QR.state !== 'live') return;
      if (Date.now() >= QR.until + 5000) return qrDone('gone');
      const e = $('#qrLeft'); if (e) e.textContent = qrLeft();
    };
    tick();
    QR_TICK = setInterval(tick, 1000);
    const check = async () => {
      const r = await api(`/api/bkk/admin/signin-qr/${encodeURIComponent(short)}/status`).catch(() => null);
      const j = r && r.ok ? await r.json().catch(() => null) : null;
      if (seq !== QR_SEQ || !QR || QR.state !== 'live') return;
      if (j && j.used) return qrDone('used');
      // A failed check (a changed key, a server error) past 0:00 ends it too: the QR is dead by then.
      if ((j && j.expired) || (r && r.status === 404) || Date.now() >= QR.until) return qrDone('gone');
      QR_POLL = setTimeout(check, 2500);
    };
    QR_POLL = setTimeout(check, now ? 0 : 2500);
  };
  window.showQr = async (code, from) => {
    if (QR_BUSY) return;                    // a double tap would make two QRs, and the server may keep the other one
    QR_BUSY = true;
    const seq = ++QR_SEQ;
    qrStop();
    if (from) QR_FROM = from;
    try {
      const r = await api(`/api/bkk/admin/members/${encodeURIComponent(code)}/signin-qr`,
        { method: 'POST', body: JSON.stringify({ origin: location.origin }),
          signal: window.AbortSignal && AbortSignal.timeout ? AbortSignal.timeout(20000) : undefined }).catch(() => null);
      const j = r ? await r.json().catch(() => ({})) : {};
      // Closed, or staff left the screen, while it was on its way: nobody saw it, so end it.
      if (seq !== QR_SEQ) { if (r && r.ok && j.short_code) qrEnd(j.short_code); return; }
      if (!r || !r.ok) { alert(j.error || T('failed')); return; }
      // Counted from this answer, not the server's clock, so a phone set wrong still shows the right time.
      QR = { code, name: j.name, short: j.short_code, svg: j.svg, until: Date.now() + j.expiresIn * 1000, state: 'live' };
      paintQr();
      qrFocus();
      qrRun();
    } finally { QR_BUSY = false; }
  };
  window.closeQr = (back = true) => {
    if (QR && QR.state === 'live') qrEnd(QR.short);
    QR_SEQ++; qrStop(); QR = null; paintQr();
    if (back && QR_FROM && document.contains(QR_FROM)) QR_FROM.focus();
    QR_FROM = null;
  };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && QR) closeQr(); });
  document.addEventListener('visibilitychange', () => { if (!QR) return; if (document.hidden) qrStop(); else qrRun(true); });
  window.addEventListener('pagehide', () => { if (QR && QR.state === 'live') qrEnd(QR.short); qrStop(); });

  window.passAct = async (id, what) => {
    let body = {};
    if (what === 'freeze') {
      const days = ask(T('qPauseDays'), '30'); if (days === null) return;
      const reason = ask(T('qPauseWhy'), ''); if (reason === null) return;
      body = { days: Number(days), reason };
    } else if (what === 'extend') {
      const days = ask(T('qAddDays'), '7'); if (days === null) return;
      const credits = ask(T('qAddClasses'), '0'); if (credits === null) return;
      body = { days: Number(days), credits: Number(credits), reason: ask(T('qNote'), '') || '' };
    } else if (what === 'void') {
      if (!confirm(T('qVoid'))) return;
      body = { reason: ask(T('qWhy'), '') || '' };
    }
    const r = await api(`/api/bkk/admin/passes/${id}/${what}`, { method: 'POST', body: JSON.stringify(body) });
    const j = await shout(r);
    // The Rezerv copy of a voided pass is the sale's pass again: said, so nobody voids it by mistake.
    if (j && (j.rezervPassBack || []).length) alert(T('rzPassBack'));
    if (j) findStudents();
  };

  window.grantPass = async () => {
    const d = await fetch('/api/bkk/products').then(r => r.json());
    const codes = d.products.map(p => p.code).join(', ');
    const productCode = ask(T('qWhichCode', codes), 'pack8'); if (!productCode) return;
    const name = ask(T('qName')); if (!name) return;
    const email = ask(T('qEmailFind')); if (email === null) return;
    const validFrom = ask(T('qStart'), '');
    if (validFrom === null) return;
    let validUntil = '';
    if (validFrom) { validUntil = ask(T('qExpires')); if (!validUntil) return; }
    const r = await api('/api/bkk/admin/passes', { method: 'POST', body: JSON.stringify({
      productCode, name, email, source: 'manual',
      validFrom: validFrom || null, validUntil: validUntil || null,
      note: ask(T('qNoteWhy'), '') || '' }) });
    const j = await shout(r);
    if (j) { alert(T('doneMember', j.member.name, j.member.code)); renderStudents(name); }
  };

  window.sellDesk = async () => {
    // One sale at a time: a sale with no answer is finished with Retry, never sold again here.
    if (SELL) { if (!SELL.busy) alert(T('sellPending')); return; }
    const d = await fetch('/api/bkk/products').then(r => r.json());
    const ps = d.products || [];
    const withVat = p => p.price_thb + Math.round(p.price_thb * (d.vatPct || 0) / 100);
    const pick = ask(T('qWhichPkg') + '\n' + ps.map((p, i) =>
      `${i + 1}. ${pkgName(p)} · ฿${withVat(p).toLocaleString()} ${T('inclVat')}`).join('\n'), '1');
    if (!pick) return;
    const p = ps[Number(pick) - 1];
    if (!p) return alert(T('noPkgNum'));
    const name = ask(T('qName')); if (!name) return;
    const email = ask(T('qEmailReceipt'), ''); if (email === null) return;
    const phone = ask(T('qPhone'), ''); if (phone === null) return;
    const m = ask(T('qPaidHow'), '1'); if (!m) return;
    const method = { 1: 'cash', 2: 'transfer', 3: 'card' }[m];
    if (!method) return alert(T('pick123'));
    if (!confirm(T('confirmSale', name, pkgName(p), '฿' + withVat(p).toLocaleString(), W(method)))) return;
    // One id for this sale, made once: Retry after a lost reply sends it again, and the server answers with the first sale.
    SELL = { productCode: p.code, name, email, phone, method, requestId: newId(),
      what: [name, pkgName(p), '฿' + withVat(p).toLocaleString(), W(method)].join(' · ') };
    await sendSale();
  };
  // A sale on its way (busy), or one whose reply was lost: kept until the server
  // answers, in this tab's session too, so a reload still offers Retry with the same id.
  const SELL_KEY = 'aybkk_desk_sale';
  let SELL = (() => {
    try { const x = JSON.parse(sessionStorage.getItem(SELL_KEY) || 'null'); return x && x.requestId ? { ...x, busy: false } : null; }
    catch (_) { return null; }
  })();
  const keepSell = () => {
    try { if (SELL) sessionStorage.setItem(SELL_KEY, JSON.stringify(SELL)); else sessionStorage.removeItem(SELL_KEY); } catch (_) {}
  };
  const SALE_WAIT = 20e3;
  const sellOutHtml = () => !SELL ? '' : SELL.busy ? `<p class="muted">${esc(T('sellSending'))}</p>`
    : `<div class="flash warn"><b>${esc(T('sellLost'))}</b><span class="sub">${esc(SELL.what || SELL.name)}</span>
      <span class="sub">${esc(T('sellRetryHelp'))}</span><button class="btn" onclick="sellRetry()">${esc(T('retry'))}</button></div>`;
  const paintSell = () => {
    if ($('#sellOut')) $('#sellOut').innerHTML = sellOutHtml();
    if ($('#sellBtn')) $('#sellBtn').disabled = !!(SELL && SELL.busy);
  };
  // A reply that never comes is a lost reply too: after SALE_WAIT the same Retry box shows.
  const apiWait = (url, opts, ms) => {
    const c = window.AbortController ? new AbortController() : null;
    const t = c && setTimeout(() => c.abort(), ms);
    return api(url, c ? { ...opts, signal: c.signal } : opts).finally(() => clearTimeout(t));
  };
  async function sendSale() {
    const sale = SELL;
    if (!sale || sale.busy) return;
    sale.busy = true; keepSell(); paintSell();
    const { what, busy, ...body } = sale;
    let r = null, j = {};
    try {
      r = await apiWait('/api/bkk/admin/sales', { method: 'POST', body: JSON.stringify(body) }, SALE_WAIT);
      j = await r.json();
    } catch (_) { if (r && r.ok) r = null; }
    sale.busy = false;
    // Another sale took its place meanwhile: this answer is not for the box any more.
    if (SELL !== sale) return;
    // No answer, or a server that fell over after it may have sold: only the same id may try again.
    if (!r || r.status >= 500 || (r.ok && !j.order)) { keepSell(); paintSell(); if (!$('#sellOut')) alert(T('sellLost')); return; }
    if (r.status === 409 && j.repeatOf) {
      const x = j.repeatOf;
      if (confirm(T('qRepeat', whenPaid(x.at), x.refno, W(x.method), '฿' + Number(x.amount).toLocaleString()))) {
        sale.confirmRepeat = true;
        return sendSale();
      }
      SELL = null; keepSell(); paintSell(); return;
    }
    SELL = null; keepSell(); paintSell();
    if (!r.ok) { alert(j.error || T('failed')); return; }
    alert(T('doneSale', '฿' + j.order.amount.toLocaleString(), W(j.order.method), j.order.refno, j.member.name, j.member.code));
    renderStudents(sale.name);
  }
  window.sellRetry = () => { if (SELL && !SELL.busy) sendSale(); };

  window.bookFor = async (code) => {
    const d = await api('/api/bkk/schedule?days=14').then(r => r.json());
    const list = (d.classes || []).slice(0, 40);
    const pick = ask(T('qWhichClass') + '\n' + list.map((c, i) =>
      `${i + 1}. ${day(c.startAt)} ${time(c.startAt)} ${cls(c.title)} (${T('seatsLeft', c.seatsLeft)})`).join('\n'), '1');
    if (!pick) return;
    const c = list[Number(pick) - 1];
    if (!c) return alert(T('noClassNum'));
    const r = await api('/api/bkk/bookings', { method: 'POST',
      body: JSON.stringify({ memberCode: code, slotId: c.slotId, date: c.date }) });
    if (await shout(r)) { alert(T('booked')); findStudents(); }
  };

  // ── calendar: month, week, day, and inside one class ──────────────────────
  // Days are Bangkok dates as 'YYYY-MM-DD' strings moved with UTC arithmetic,
  // so a laptop in another timezone never shifts a class to the wrong day.
  const pad2 = n => String(n).padStart(2, '0');
  const addDays = (ymd, n) => { const [y, m, d] = ymd.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
  const dowOf = ymd => new Date(ymd + 'T12:00:00Z').getUTCDay();
  const ymdFmt = (ymd, o) => new Date(ymd + 'T12:00:00+07:00').toLocaleDateString(locale(), { timeZone: 'Asia/Bangkok', ...o });
  const hm = iso => time(iso).replace(/^0/, '');
  // A Rezerv visit with no time on file: the server says so (stored at 00:00).
  const noTime = c => c.timeKnown === false;
  const calHm = c => noTime(c) ? '--:--' : hm(c.startAt);
  const KIND_SHORT = { mysore: 'Mysore', led_primary: 'Primary', led_inter: 'Inter.' };
  const KIND_LONG = { mysore: 'Mysore', led_primary: 'Led Primary', led_inter: 'Led Intermediate' };
  const kindCls = k => KIND_SHORT[k] ? k : 'other';
  const plainTitle = c => cls(String(c.title || '').replace(/^\[Online\]\s*/i, ''));
  const shortName = c => KIND_SHORT[c.kind] || plainTitle(c);
  const isFull = c => c.capacity != null && c.booked >= c.capacity;
  const countTxt = c => c.capacity != null ? `${c.booked}/${c.capacity}` : String(c.booked);
  const shows = (c, today) => c.date <= today && !c.cancelled;      // checked-in counts: today and past only

  const calView0 = store.get('aybkk_admin_calview');
  const CAL = { view: ['month', 'week', 'day'].includes(calView0) ? calView0 : 'month',
    date: null, data: null, seq: 0, y: 0, keepY: null, x: null, keepX: null };

  function calRange() {
    const d = CAL.date;
    if (CAL.view === 'month') {
      const [y, m] = d.split('-').map(Number);
      return [`${y}-${pad2(m)}-01`, new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10)];
    }
    if (CAL.view === 'week') { const s = addDays(d, -dowOf(d)); return [s, addDays(s, 6)]; }
    return [d, d];
  }

  // Paints at once (the last counts for this stretch, or an empty grid), then
  // again with fresh counts. noFetch: a language change, nothing new to ask.
  async function renderCalendar(noFetch) {
    if (!CAL.date) CAL.date = bkkYmd();
    const [from, to] = calRange();
    const have = CAL.data && CAL.data.from === from && CAL.data.to === to && !CAL.data.error;
    if (!have) CAL.data = { from, to, today: bkkYmd(), moonDays: {}, classes: [], loading: true };
    paintCalendar();
    if (noFetch && have) return;
    const seq = ++CAL.seq;
    const r = await api(`/api/bkk/admin/calendar?${new URLSearchParams({ from, to })}`).catch(() => null);
    const j = r ? await r.json().catch(() => ({})) : {};
    if (seq !== CAL.seq || current !== 'calendar' || SUB) return;
    CAL.data = r && r.ok
      ? { ...j, from, to, moonDays: j.moonDays || {}, classes: j.classes || [] }
      : { from, to, today: bkkYmd(), moonDays: {}, classes: [], error: j.error || T('failed') };
    paintCalendar();
  }

  function paintCalendar() {
    const d = CAL.data, v = CAL.view, view = $('#view');
    // The week box keeps its sideways place over a repaint, and over a visit into a class.
    const old = $('#wkScroll'), back = CAL.keepX && CAL.keepX.from === d.from ? CAL.keepX.left : null;
    const keepX = old && old.dataset.from === d.from ? old.scrollLeft : back;
    view.classList.add('wide');
    view.innerHTML = `<div class="calbar"><div class="seg">${['month', 'week', 'day'].map(x =>
        `<button class="${v === x ? 'on' : ''}" onclick="calView('${x}')">${T('v_' + x)}</button>`).join('')}</div>
        ${d.loading ? `<span class="muted">${T('loadingTxt')}</span>` : ''}
        <button class="btn gray sm" onclick="calToday()">${T('today')}</button></div>
      ${d.error ? `<p class="warnline">${esc(d.error)}</p>` : ''}
      ${v === 'month' ? monthHtml(d) : v === 'week' ? weekHtml(d) : dayHtml(d)}`;
    const sc = $('#wkScroll');
    if (sc) {
      const col = sc.querySelector('.wcol.today');
      sc.scrollLeft = keepX != null ? keepX : col ? Math.max(0, col.offsetLeft - 8) : 0;
    }
    if (CAL.keepY != null && !d.loading) { window.scrollTo(0, CAL.keepY); CAL.keepY = null; }
    if (!d.loading) CAL.keepX = null;
  }

  const calHead = label => `<div class="head">
      <button class="nav" onclick="calNav(-1)" aria-label="${esc(T('prev'))}">‹</button><b>${label}</b>
      <button class="nav" onclick="calNav(1)" aria-label="${esc(T('next'))}">›</button></div>`;
  const moonChip = k => { const w = esc(T(k === 'new' ? 'newMoon' : 'fullMoon'));
    return `<span class="ch moon ${k === 'new' ? 'new' : 'full'}" title="${w}"><b>${w}</b>&nbsp;</span>`; };
  const olTag = c => c.isOnline ? `<b class="ol">${esc(T('lgOnline'))}</b>` : '';
  const lineTitle = (c, today) => [noTime(c) ? T('noTime') : hm(c.startAt), plainTitle(c), c.isOnline ? T('lgOnline') : '', c.teachers,
    T('nBooked', c.booked, c.capacity), shows(c, today) ? T('nIn', c.checkedIn) : '',
    c.cancelled ? T('closedNote', c.note) : ''].filter(Boolean).join(' · ');
  const kindLegend = () => ['mysore', 'led_primary', 'led_inter'].map(k =>
    `<span class="cl ${k}"><em class="cn">${KIND_LONG[k]}</em></span>`).join('');

  function monthHtml(d) {
    const today = d.today || bkkYmd();
    const [y, m] = d.from.split('-').map(Number);
    const byDate = {};
    d.classes.forEach((c, i) => (byDate[c.date] = byDate[c.date] || []).push(i));
    const line = i => { const c = d.classes[i];
      return `<button class="cl ${kindCls(c.kind)}${isFull(c) ? ' full' : ''}${c.cancelled ? ' off' : ''}"
        onclick="calOpen(event,${i})" title="${esc(lineTitle(c, today))}"><span class="ct">${calHm(c)}</span><em
        class="cn">${esc(shortName(c))}</em>${olTag(c)}<span class="cc"><b>${esc(countTxt(c))}</b>${shows(c, today)
          ? `<i>✓${esc(c.checkedIn)}</i>` : ''}</span></button>`; };
    let cells = T('wdShort').map(w => `<div class="wd">${esc(w)}</div>`).join('');
    for (let i = 0; i < dowOf(d.from); i++) cells += '<span></span>';
    for (let iso = d.from, n = 1; iso <= d.to; iso = addDays(iso, 1), n++) {
      const moon = d.moonDays[iso];
      // The cell holds buttons, so it is a div: a tap on the number or on an
      // empty part opens the day, a tap on a class line opens the class.
      cells += `<div class="d${moon ? ' moonday' : ''}${iso === today ? ' today' : ''}${iso < today ? ' was' : ''}"
        onclick="calDay('${iso}')"><button class="n" aria-label="${esc(ymdLong(iso, true))}">${n}</button>${moon ? moonChip(moon) : ''}
        ${(byDate[iso] || []).map(line).join('')}</div>`;
    }
    const month = new Date(Date.UTC(y, m - 1, 15)).toLocaleDateString(locale(), { month: 'long', timeZone: 'UTC' });
    return `<div class="cal">${calHead(`${esc(month)}<small>${LANG === 'th' ? y + 543 : y}</small>`)}
      <div class="grid">${cells}</div>
      <div class="legend">
        <div class="lr">${kindLegend()}</div>
        <div class="lr"><span class="cc"><b>18/42</b></span> ${esc(T('lgCount'))}
          <span class="cc"><i>✓15</i></span> ${esc(T('lgIn'))}
          <span class="cl full"><span class="cc"><b>42/42</b></span></span> ${esc(T('lgFull'))}
          <span class="cl off"><span class="cc"><b>9/42</b></span></span> ${esc(T('lgClosed'))}
          <b class="ol">${esc(T('lgOnline'))}</b>
          <span class="ch moon full">${esc(T('calMoon'))}</span></div></div></div>`;
  }

  function weekHtml(d) {
    const today = d.today || bkkYmd();
    const a = d.from, b = d.to, full = { day: 'numeric', month: 'short', year: 'numeric' };
    const label = a.slice(0, 7) === b.slice(0, 7) ? T('rRange', String(Number(a.slice(8))), ymdFmt(b, full))
      : a.slice(0, 4) === b.slice(0, 4) ? T('rRange', ymdFmt(a, { day: 'numeric', month: 'short' }), ymdFmt(b, full))
      : T('rRange', ymdFmt(a, full), ymdFmt(b, full));
    const block = (c, i) => `<button class="wb ${kindCls(c.kind)}${isFull(c) ? ' full' : ''}${c.cancelled ? ' off' : ''}"
        onclick="calOpen(event,${i})"><span class="ct">${calHm(c)}</span><em class="cn">${esc(plainTitle(c))}</em>${olTag(c)}
        ${c.teachers ? `<span class="tc">${esc(c.teachers)}</span>` : ''}
        <span class="cc"><b>${esc(T('nBooked', c.booked, c.capacity))}</b></span>
        ${shows(c, today) ? `<span class="ci">${esc(T('nIn', c.checkedIn))}</span>` : ''}
        ${c.cancelled ? `<span class="tc">${esc(T('closedNote', c.note))}</span>` : ''}</button>`;
    const cols = [0, 1, 2, 3, 4, 5, 6].map(k => {
      const iso = addDays(a, k), moon = d.moonDays[iso];
      const list = d.classes.map((c, i) => [c, i]).filter(([c]) => c.date === iso);
      return `<div class="wcol${iso === today ? ' today' : ''}${moon ? ' moonday' : ''}${iso < today ? ' was' : ''}">
        <button class="wh" onclick="calDay('${iso}')" aria-label="${esc(ymdLong(iso, true))}">${esc(ymdFmt(iso, { weekday: 'short' }))}<span
          class="wn">${Number(iso.slice(8))}</span>${moon ? moonChip(moon) : ''}</button>
        ${list.map(([c, i]) => block(c, i)).join('')}</div>`;
    }).join('');
    return `<div class="cal wk">${calHead(esc(label))}
      <div class="wkscroll" id="wkScroll" data-from="${a}"><div class="wkgrid">${cols}</div></div>
      <div class="legend"><div class="lr">${kindLegend()}</div></div></div>`;
  }

  function dayHtml(d) {
    const today = d.today || bkkYmd(), iso = d.from, moon = d.moonDays[iso];
    const rows = d.classes.map((c, i) => [c, i]).filter(([c]) => c.date === iso).map(([c, i]) => `<button
        class="drow ${kindCls(c.kind)}${isFull(c) ? ' full' : ''}${c.cancelled ? ' off' : ''}" onclick="calOpen(event,${i})">
        <span class="tm">${noTime(c) ? '--:--' : time(c.startAt)}</span>
        <span class="bd"><b>${esc(plainTitle(c))}${c.isOnline ? ` <span class="pill onl">${esc(T('lgOnline'))}</span>` : ''}</b>
          <span class="muted">${esc([noTime(c) ? T('noTime') : '', c.teachers, c.durationMin ? T('nMin', c.durationMin) : '',
            c.cancelled ? T('closedNote', c.note) : ''].filter(Boolean).join(' · '))}</span></span>
        <span class="cnt"><b>${esc(countTxt(c))}</b><span class="muted">${esc(T('lgBookedWord'))}</span>${shows(c, today)
          ? `<span class="in">${esc(T('nIn', c.checkedIn))}</span>` : ''}</span>
        <span class="go" aria-hidden="true">›</span></button>`).join('');
    return `<div class="box"><div class="dayhead">
        <button class="dnav" onclick="calNav(-1)" aria-label="${esc(T('prev'))}">‹</button>
        <b>${esc(ymdFmt(iso, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))}${iso === today
          ? ` <span class="pill upcoming">${T('today')}</span>` : ''}</b>
        <button class="dnav" onclick="calNav(1)" aria-label="${esc(T('next'))}">›</button></div>
      ${moon ? `<p class="warnline">${esc(T(moon === 'new' ? 'newMoon' : 'fullMoon'))}. ${esc(T('moonShut'))}</p>` : ''}
      ${rows || (d.loading ? '' : `<p class="muted">${T('dayEmpty')}</p>`)}</div>`;
  }

  window.calView = v => { CAL.view = v; store.set('aybkk_admin_calview', v); renderCalendar(); };
  window.calToday = () => { CAL.date = bkkYmd(); renderCalendar(); };
  window.calDay = iso => { CAL.view = 'day'; CAL.date = iso; window.scrollTo(0, 0); renderCalendar(); };
  // A month opens on today when today is in it, else on its first day: the
  // day a switch to Week or Day lands on.
  window.calNav = dir => {
    if (CAL.view === 'month') {
      const [y, m] = CAL.date.split('-').map(Number);
      const first = new Date(Date.UTC(y, m - 1 + dir, 1)).toISOString().slice(0, 10), today = bkkYmd();
      CAL.date = today.slice(0, 7) === first.slice(0, 7) ? today : first;
    } else CAL.date = addDays(CAL.date, dir * (CAL.view === 'week' ? 7 : 1));
    renderCalendar();
  };

  // ── inside one class ──────────────────────────────────────────────────────
  // from: where Back goes, the calendar or Today ({ who, top, y } to land on
  // the same Open class button). back: a profile opened here, to land on that name again.
  const CV = { ref: null, data: null, seq: 0, flash: null, from: null, back: null };
  const calBackBtn = () => `<button class="btn gray sm" onclick="calBack()">${T('back')}</button>`;
  window.calOpen = (e, i) => {
    if (e) e.stopPropagation();
    const c = CAL.data && CAL.data.classes[i];
    if (!c) return;
    CAL.y = window.scrollY;
    const sc = $('#wkScroll'); CAL.x = sc ? { from: sc.dataset.from, left: sc.scrollLeft } : null;
    CV.ref = c.slotId != null ? { slotId: c.slotId, date: c.date } : { date: c.date, time: time(c.startAt), title: c.title };
    CV.data = null; CV.flash = null; CV.from = null; CV.back = null;
    SUB = 'class';
    loadClass(true);
  };
  window.todayOpen = (slotId, date, id) => {
    const b = document.getElementById(id);
    CV.ref = { slotId, date };
    CV.data = null; CV.flash = null; CV.back = null;
    CV.from = { today: true, who: id, top: b ? b.getBoundingClientRect().top : null, y: window.scrollY };
    SUB = 'class';
    loadClass(true);
  };
  window.calBack = () => {
    SUB = null; CV.data = null;
    if (CV.from && CV.from.today) { renderToday({ back: CV.from }); return; }
    CAL.keepY = CAL.y; CAL.keepX = CAL.x; renderCalendar();
  };

  async function loadClass(top) {
    const seq = ++CV.seq, ref = CV.ref;
    $('#view').classList.remove('wide');
    if (top) { $('#view').innerHTML = `<p>${calBackBtn()}</p><p class="muted">${T('loadingTxt')}</p>`; window.scrollTo(0, 0); }
    await loadThNames();
    const r = await api('/api/bkk/admin/class?' + new URLSearchParams(ref)).catch(() => null);
    const j = r ? await r.json().catch(() => ({})) : {};
    if (seq !== CV.seq || SUB !== 'class' || CV.ref !== ref) return;
    if (!r || !r.ok || !j.class) { $('#view').innerHTML = `<p>${calBackBtn()}</p><div class="box">${esc(j.error || T('failed'))}</div>`; return; }
    CV.data = { ...j, roster: j.roster || [], cancelledList: j.cancelledList || [] };
    const key = JSON.stringify(ref);
    if (AD.key !== key) resetAdd(key);
    paintClass();
  }

  function paintClass() {
    const { class: c, roster, cancelledList } = CV.data;
    const today = bkkYmd(), canIn = c.date <= today;
    const end = c.endAt || (c.durationMin ? new Date(Date.parse(c.startAt) + c.durationMin * 60000).toISOString() : null);
    const moon = CAL.data && CAL.data.moonDays && CAL.data.moonDays[c.date];
    const left = c.capacity != null ? c.capacity - c.booked : null;
    const head = `<div class="box hhead"><p style="margin:0">${calBackBtn()}${c.canAdd
        ? ` <button class="btn pink sm" onclick="addJump()">${T('addJump')}</button>` : ''}</p>
      <h2>${esc(plainTitle(c))}${c.isOnline ? ` <span class="pill onl">${esc(T('lgOnline'))}</span>` : ''}</h2>
      <div class="muted">${esc([ymdLong(c.date, true), noTime(c) ? T('noTime')
        : end ? T('rRange', time(c.startAt), time(end)) : time(c.startAt), c.teachers].filter(Boolean).join(' · '))}</div>
      ${c.cancelled ? `<p class="warnline">${esc(T('closedNote', c.note))}</p>` : ''}
      ${moon ? `<p class="warnline">${esc(T('moonShut'))}</p>` : ''}
      ${c.slotId == null ? `<p class="muted">${esc(T('slotless'))}</p>` : c.ended ? `<p class="muted">${esc(T('ended'))}</p>` : ''}
      <div class="tiles">
        ${tile(T('tBooked'), c.capacity != null ? `${c.booked} / ${c.capacity}` : String(c.booked), c.noShows ? T('nNoShows', c.noShows) : '')}
        ${tile(T('tIn'), String(c.checkedIn))}
        ${c.mats ? tile(T('tMats'), String(c.mats)) : ''}
        ${left != null ? `<div class="tile${left <= 0 ? ' hot' : ''}"><span>${esc(T('tLeft'))}</span><b>${esc(left > 0 ? String(left)
          : left === 0 ? T('full') : T('nOver', -left))}</b></div>` : ''}
      </div>
      ${CV.flash ? `<p class="flash ${CV.flash.kind === 'warn' ? 'warn' : ''}" role="status">${esc(CV.flash.text)}</p>` : ''}</div>`;

    // A class with no slot is Rezerv history: it can be looked at, not changed.
    const fixed = c.slotId == null;
    const rows = roster.map(b => {
      const id = Number(b.bookingId);
      const st = b.status === 'noshow' ? `<span class="pill noshow">${esc(T('rNoShow'))}</span>`
        : b.checkedInAt ? `<span class="in">${esc(noTime(c) ? T('rCame') : T('rIn', time(b.checkedInAt)))}</span>`
        : `<span class="muted">${esc(T('rNotYet'))}</span>`;
      const cover = b.dropin ? T('covDrop') : b.cover === 'rezerv' ? 'Rezerv' : b.passName ? itemName(b.passName) : T('covPass');
      // A visit moved from Rezerv is cover and source Rezerv: say it once.
      const src = b.source && b.source !== 'student' && W(b.source) !== cover ? W(b.source) : '';
      const acts = [
        !fixed && canIn && !b.checkedInAt ? `<button class="btn sm" onclick="cvCheck(${id},false)">${T('btnIn')}</button>` : '',
        !fixed && b.checkedInAt ? `<button class="btn gray sm" onclick="cvCheck(${id},true)">${T('btnUndo')}</button>` : '',
        !fixed && b.status === 'booked' && !b.checkedInAt ? `<button class="btn red sm" onclick="cvCancel(${id})">${T('btnCancelBk')}</button>` : '',
        histBtn(b.code)].filter(Boolean).join('');
      return `<div class="rr${b.status === 'noshow' ? ' miss' : ''}">${face(b)}
        <div class="rm">${whoBtn(b.code, b.name, 'who-r-' + id)}${b.needMat && b.status === 'booked'
          ? ` <span class="pill mat" title="${esc(T('tMats'))}">${esc(T('matPill'))}</span>` : ''}<br><span class="muted">${esc([b.code, cover, src].filter(Boolean).join(' · '))}</span></div>
        <div class="rs">${st}</div><div class="ra">${acts}</div></div>`;
    });
    const rosterBox = `<div class="box"><b>${T('rosterH')}</b> <span class="muted">${roster.length}</span>
      ${rows.length ? rows.join('') : `<p class="muted">${T('rosterNone')}</p>`}</div>`;
    const cancelBox = cancelledList.length ? `<div class="box cxl"><b>${T('cancelledH')}</b> <span class="muted">${cancelledList.length}</span>
      ${cancelledList.map((x, i) => `<div>${whoBtn(x.code, x.name, 'who-x-' + i)} · ${esc([x.code, x.cancelledAt
        ? `${ymdLong(bkkYmd(Date.parse(x.cancelledAt)))} ${time(x.cancelledAt)}` : '', cxlWhy(x.reason)].filter(Boolean).join(' · '))}</div>`).join('')}</div>` : '';
    const closeBox = c.slotId == null ? '' : c.cancelled
      ? `<div class="box"><b>${T('reopenH')}</b><p class="muted">${T('reopenHelp')}</p>
          <p><button class="btn" onclick="cvReopen()">${T('reopenH')}</button></p></div>`
      : !c.started ? `<div class="box"><b>${T('closeH')}</b><p class="muted">${T('closeHelp')}</p>
          <p><button class="btn red" onclick="cvClose()">${T('closeH')}</button></p></div>` : '';
    $('#view').innerHTML = head + rosterBox + cancelBox + (c.canAdd ? addBoxHtml(c) : '') + closeBox;
    $('#view').querySelectorAll('.rr .av img').forEach(i => { i.onerror = () => { i.parentNode.textContent = i.dataset.ini; }; });
    if (c.canAdd) wireAdd();
    if (CV.back) { backTo(CV.back); CV.back = null; }
    // The result shows in the header; the button tapped may be far below it.
    if (CV.flash && CV.flash.fresh) {
      CV.flash.fresh = false;
      const f = $('#view .hhead .flash');
      if (f) f.scrollIntoView({ block: 'center' });
    }
  }

  // First and last word's first letter, as on the student's own account button
  // (public/bkk.html): a title or a name in brackets is skipped, and so is a Thai leading vowel.
  const TITLE = /^(mr|mrs|ms|miss|mx|dr|นาย|นาง|นางสาว|น\.ส\.|ด\.ช\.|ด\.ญ\.)\.?$/i;
  const initials = name => {
    const s = String(name || '');
    let ws = (s.replace(/[(（[][^)）\]]*[)）\]]/g, ' ').trim() || s).split(/\s+/).filter(Boolean);
    if (ws.length > 1 && TITLE.test(ws[0])) ws = ws.slice(1);
    ws = ws.map(w => (w.replace(/[\u0E40-\u0E44]/g, '').match(/\p{L}/u) || [''])[0]).filter(Boolean);
    return (ws.length > 1 ? ws[0] + ws[ws.length - 1] : ws[0] || '').toUpperCase();
  };
  const face = b => `<span class="av" aria-hidden="true">${b.photo
    ? `<img src="${esc(b.photo)}" alt="" loading="lazy" width="40" height="40" data-ini="${esc(initials(b.name))}">` : esc(initials(b.name))}</span>`;

  // The server writes "class cancelled: <reason>" in English; say it in the page's language.
  const cxlWhy = r => { const m = /^class cancelled: ([\s\S]*)$/.exec(r || '');
    return m ? T('closedNote', m[1] === 'no reason given' ? '' : m[1]) : r || ''; };

  window.cvCheck = async (id, undo) => {
    const r = await api(`/api/bkk/admin/bookings/${id}/checkin`, { method: 'POST',
      body: JSON.stringify(undo ? { undo: true } : {}) }).catch(() => null);
    if (!r) { alert(T('addNoNet')); return; }
    if (await shout(r)) { CV.flash = null; loadClass(); }
  };
  window.cvCancel = async id => {
    const c = CV.data && CV.data.class, b = c && CV.data.roster.find(x => Number(x.bookingId) === id);
    if (!b || !confirm(T('qCancelBk', b.name, plainTitle(c), `${ymdLong(c.date, true)} ${time(c.startAt)}`))) return;
    const r = await api(`/api/bkk/bookings/${id}/cancel`, { method: 'POST', body: '{}' }).catch(() => null);
    if (!r) { alert(T('addNoNet')); return; }
    const j = await shout(r);
    if (!j) return;
    // The server's rule decides the credit, and says its number of hours.
    const hrs = j.cutoffHours ?? (String(j.message || '').match(/(\d+)\s*h/) || [])[1];
    const rezerv = b.cover === 'rezerv' && !b.passName;
    CV.flash = { kind: j.creditReturned || rezerv ? 'ok' : 'warn', fresh: true,
      text: T('bkCancelled', b.name, !!j.creditReturned, hrs, rezerv) };
    loadClass();
  };
  window.cvClose = async () => {
    const c = CV.data && CV.data.class;
    if (!c || !confirm(T('qClose', plainTitle(c), `${ymdLong(c.date, true)} ${time(c.startAt)}`))) return;
    const reason = ask(T('qReason'), ''); if (reason === null) return;
    const r = await api('/api/bkk/admin/classes/cancel', { method: 'POST',
      body: JSON.stringify({ slotId: c.slotId, date: c.date, reason }) });
    const j = await shout(r);
    if (j) { alert(T('closed', j.released, j.notified)); CV.flash = null; loadClass(); }
  };
  window.cvReopen = async () => {
    const c = CV.data && CV.data.class;
    if (!c) return;
    const r = await api('/api/bkk/admin/classes/reopen', { method: 'POST',
      body: JSON.stringify({ slotId: c.slotId, date: c.date }) });
    if (await shout(r)) { CV.flash = { kind: 'ok', fresh: true, text: T('reopened') }; loadClass(); }
  };

  // ── add a student to the class (the door's walk-in, any day) ─────────────
  // sent: the last add tried and its requestId. Tapping again after a lost
  // reply resends the same id, so the server answers instead of adding twice.
  const AD = { key: null };
  const resetAdd = key => Object.assign(AD, { key, member: null, isNew: false, cover: null, method: null,
    hits: [], seq: (AD.seq || 0) + 1, sent: null, here: null, term: '', nn: '', ne: '', np: '', err: '', busy: false, lost: false });
  const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const seatOf = m => m && CV.data ? CV.data.roster.find(b => b.code === m.code) : null;
  // "Here now" only on the class's own day; ticked from an hour before it starts.
  // A class that is over takes someone only as came: ticked, and it stays ticked.
  const isOver = c => !!(c.ended && c.canAdd);
  const hereOk = c => c.date <= bkkYmd() && !isOver(c);
  const hereOn = c => isOver(c) || (hereOk(c) && (AD.here != null ? AD.here : Date.parse(c.startAt) - Date.now() <= 3600e3));
  window.addJump = () => {
    const box = $('#addBox'); if (!box) return;
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => { const q = $('#adQ'); if (q && !AD.member) q.focus({ preventScroll: true }); }, 350);
  };

  const addBoxHtml = c => `<div class="box" id="addBox"><b>${T('addH')}</b>
    <div id="adWho" style="margin-top:10px">
      <input id="adQ" placeholder="${esc(T('addSearchPh'))}" autocomplete="off" value="${esc(AD.term)}">
      <div id="adHits"></div>
      <button class="link" id="adNewBtn">${T('addNew')}</button>
      <div id="adNew" hidden>
        <input id="adNn" placeholder="${esc(T('addName'))}" autocomplete="off" value="${esc(AD.nn)}">
        <input id="adNp" type="tel" placeholder="${esc(T('addPhone'))}" autocomplete="off" value="${esc(AD.np)}">
        <input id="adNe" type="email" placeholder="${esc(T('addEmail'))}" autocomplete="off" value="${esc(AD.ne)}">
      </div>
    </div>
    <div id="adChosen" class="chosen" style="margin-top:10px" hidden><span id="adChosenName"></span>
      <button class="link" id="adChange">${T('addChange')}</button></div>
    <p class="lbl">${T('coverQ')}</p>
    <div class="opts" id="adCovers">
      <button class="opt" data-cover="pass">${T('covPassOpt')}</button>
      <button class="opt" data-cover="rezerv">${T('covRezervOpt')}</button>
      <button class="opt" data-cover="dropin">${T('covDropOpt')}<small>${DROP_PRICE ? '฿' + DROP_PRICE.toLocaleString('en-US') : ''}</small></button>
    </div>
    <div id="adMethods" hidden><p class="lbl">${T('methodQ')}</p><div class="opts">
      ${['cash', 'transfer', 'card'].map(m => `<button class="opt" data-method="${m}">${T('m_' + m)}</button>`).join('')}</div></div>
    <label class="here"><input type="checkbox" id="adHere"><span>${T('hereNow')}${isOver(c) ? `<small>${T('hereOver')}</small>`
      : hereOk(c) ? '' : `<small>${T('hereLater')}</small>`}</span></label>
    <p id="adHint" class="hint" aria-live="polite"></p>
    <button class="btn" id="adGo" disabled>${T('addGo')}</button></div>`;

  function wireAdd() {
    let wait = null;
    $('#adQ').addEventListener('input', () => {
      clearTimeout(wait);
      AD.term = $('#adQ').value;
      const term = AD.term.trim(), seq = ++AD.seq;
      AD.hits = term.length < 2 ? [] : null;           // null: a search is on its way
      paintHits();
      if (term.length < 2) return;
      wait = setTimeout(async () => {
        try {
          const c = CV.data && CV.data.class;
          const d = await api('/api/bkk/admin/members?' + new URLSearchParams({ q: term,
            ...(c && isOver(c) ? { on: c.date } : {}) })).then(r => r.json());
          if (seq !== AD.seq) return;
          AD.hits = d.members || [];
        } catch (_) { if (seq !== AD.seq) return; AD.hits = 'offline'; }
        paintHits();
      }, 250);
    });
    $('#adNewBtn').onclick = () => { AD.isNew = true; AD.member = null; AD.err = ''; paintAdd(); $('#adNn').focus(); };
    for (const k of ['nn', 'ne', 'np']) {
      const el = $('#ad' + k[0].toUpperCase() + k[1]);
      el.addEventListener('input', () => { AD[k] = el.value; AD.err = ''; paintAdd(); });
    }
    $('#adChange').onclick = () => { AD.member = null; AD.err = ''; paintAdd(); $('#adQ').focus(); };
    document.querySelectorAll('#adCovers .opt').forEach(b => b.onclick = () => { AD.cover = b.dataset.cover; AD.err = ''; paintAdd(); });
    document.querySelectorAll('#adMethods .opt').forEach(b => b.onclick = () => { AD.method = b.dataset.method; AD.err = ''; paintAdd(); });
    $('#adHere').onchange = e => { AD.here = e.target.checked; paintAdd(); };
    $('#adGo').onclick = addGo;
    paintHits();
    paintAdd();
  }

  function paintHits() {
    const box = $('#adHits'); if (!box) return;
    const term = AD.term.trim(), onList = new Set(CV.data.roster.map(b => b.code));
    box.innerHTML = term.length < 2 || AD.hits === null ? ''
      : AD.hits === 'offline' ? `<p class="muted">${T('addNoNet')}</p>`
      : !AD.hits.length ? `<p class="muted">${T('addNoHits')}</p>`
      : AD.hits.map((m, i) => {
        // A pass that only starts after this class: the profile says "Starts", so the hit does too.
        const later = m.has_pass && m.pass_starts && m.pass_starts > CV.data.class.date;
        return `<button class="hit" data-i="${i}"><b>${esc(m.name)}</b>
          <span>${esc([m.code, m.email, m.phone].filter(Boolean).join(' · '))}</span>
          <em class="${m.has_pass && !later ? 'ok' : ''}">${onList.has(m.code) ? esc(T('hitOn')) + ' · ' : ''}${esc(later
            ? T('hitPassFrom', ymdLong(m.pass_starts)) : T(m.has_pass ? 'hitPass' : 'hitNoPass'))}</em></button>`;
      }).join('');
    box.querySelectorAll('.hit').forEach(el => el.onclick = () => {
      AD.member = AD.hits[Number(el.dataset.i)]; AD.isNew = false; AD.err = ''; paintAdd();
    });
  }

  // Already on this class's list: the seat is paid for, so nothing is chosen
  // or sold here. Add only checks them in (or says they are on it).
  function paintAdd() {
    if (!$('#addBox') || !CV.data) return;
    const c = CV.data.class, chosen = AD.member || AD.isNew;
    $('#adWho').hidden = !!AD.member;
    $('#adNew').hidden = !AD.isNew;
    $('#adNewBtn').hidden = AD.isNew;
    $('#adChosen').hidden = !AD.member;
    if (AD.member) $('#adChosenName').textContent = AD.member.name + ' · ' + AD.member.code;
    const hasPass = !!(AD.member && AD.member.has_pass), on = seatOf(AD.member);
    if (on || (AD.cover === 'pass' && !hasPass)) AD.cover = null;
    document.querySelectorAll('#adCovers .opt').forEach(b => {
      b.disabled = !!on || (b.dataset.cover === 'pass' && !hasPass);
      b.classList.toggle('on', b.dataset.cover === AD.cover);
    });
    $('#adMethods').hidden = AD.cover !== 'dropin';
    document.querySelectorAll('#adMethods .opt').forEach(b => b.classList.toggle('on', b.dataset.method === AD.method));
    const here = hereOn(c), name = AD.nn.trim();
    $('#adHere').checked = here;
    $('#adHere').disabled = !hereOk(c);
    const ready = on ? here : (AD.member || (AD.isNew && name)) && AD.cover && (AD.cover !== 'dropin' || AD.method);
    $('#adGo').disabled = !ready || AD.busy;
    // A drop-in sale whose reply was lost: the same button sends the same id again.
    $('#adGo').textContent = T(AD.lost && AD.err ? 'retry' : isOver(c) ? 'addGoCame' : here ? 'addGoIn' : 'addGo');
    const hint = on ? T(here ? 'hOnIn' : 'hOnOnly')
      : !chosen ? T('hFind') : AD.isNew && !name ? T('hName')
      : !AD.cover ? (AD.member && !hasPass ? T('hNoPass') : T('hCover'))
      : AD.cover === 'dropin' && !AD.method ? T('hMethod') : '';
    const full = !on && isFull(c) ? T('hFull') : '';
    $('#adHint').className = 'hint' + (AD.err ? ' bad' : '');
    $('#adHint').textContent = AD.err || [hint, full].filter(Boolean).join(' ');
  }

  async function addGo() {
    const c = CV.data && CV.data.class, ref = CV.ref;
    if (!c || AD.busy || $('#adGo').disabled) return;
    // No cover chosen: they are already on the list, and the server checks in
    // a seat they hold whatever the cover says. checkIn is the box as shown:
    // its default moves with the clock, and the box is only redrawn on a change.
    // late: a class that is over still takes someone who came (the door never sends it).
    const box = $('#adHere'), on = seatOf(AD.member), checkIn = isOver(c) || (!!box && box.checked && !box.disabled);
    const body = { slotId: c.slotId, date: c.date, checkIn, late: true,
      cover: AD.cover || (on && on.cover === 'rezerv' ? 'rezerv' : 'pass') };
    if (body.cover === 'dropin') body.method = AD.method;
    if (AD.member) body.memberCode = AD.member.code;
    else Object.assign(body, { name: AD.nn.trim(), email: AD.ne.trim(), phone: AD.np.trim() });
    const what = JSON.stringify(body);
    if (!AD.sent || AD.sent.what !== what) AD.sent = { what, id: newId() };
    body.requestId = AD.sent.id;
    AD.busy = true; AD.err = ''; paintAdd();
    let r = null, d = {};
    try {
      r = await apiWait('/api/bkk/admin/walkin', { method: 'POST', body: JSON.stringify(body) }, SALE_WAIT);
      d = await r.json().catch(() => ({}));
    } catch (_) { d = { error: T('addNoNet') }; }
    AD.busy = false;
    if (SUB !== 'class' || CV.ref !== ref) return;
    // A sale with no answer may have gone through: say so, and keep its id for Retry.
    AD.lost = body.cover === 'dropin' && (!r || r.status >= 500);
    if (AD.lost) { AD.err = T('sellLost'); paintAdd(); return; }
    // The drop-in is sold but they are not on the list: the money stays,
    // and someone books them by hand.
    if (d.paid) { resetAdd(AD.key); alert(d.error || T('addPaidNot', d.refno)); loadClass(); return; }
    if (!r || !r.ok || !d.success) {
      AD.err = d.noPass && AD.member ? T('hNoPassOn', AD.member.name, ymdLong(d.date || c.date, true)) : d.error || T('addFail');
      paintAdd(); return;
    }
    // The server checks in anyone added to a class that is over, whatever the box said.
    const inn = d.checkedIn ?? checkIn;
    const msg = d.already
      ? (body.cover === 'dropin' ? T('addWasDrop', d.name) : inn ? T('addWasIn', d.name) : T('addWasOn', d.name))
      : T('addDone', d.name, inn);
    CV.flash = { kind: d.overCapacity ? 'warn' : 'ok', fresh: true,
      text: [msg, d.overCapacity ? T('addOver') : '', d.refno && !d.already ? T('addRef', d.refno) : ''].filter(Boolean).join(' ') };
    resetAdd(AD.key);
    loadClass();
  }

  async function progressBox() {
    const p = await api('/api/bkk/admin/progress').then(r => r.json()).catch(() => null);
    if (!p || p.error) return '';
    const row = (label, val, warn) => `<tr><td>${label}</td><td style="text-align:right"><b${warn ? ' style="color:#c33"' : ''}>${val}</b></td></tr>`;
    const who = list => list.length ? ' · ' + list.map(x => `${esc(x.name)} ${x.n}`).join(', ') : '';
    return `<div class="box"><b>${T('progTitle')}</b>
      <table>
        ${row(T('progStudents'), `${p.members.total} <span class="muted">(${T('progActive', p.members.active)})</span>`)}
        ${row(T('progEmail'), `${p.members.with_email} / ${p.members.total}`)}
        ${row(T('progLinks'), `${p.links.sent} <span class="muted">(${T('progToday', p.links.sent_today)})</span>`)}
        ${row(T('progQr'), `${p.links.qr} <span class="muted">(${T('progToday', p.links.qr_today)})</span>`)}
        ${row(T('progOpened'), `${p.links.opened}`)}
        ${row(T('progPhotos') + `<span class="muted">${who(p.uploaders)}</span>`, `${p.photos.today} <span class="muted">(${T('progStudentsIn', p.photos.students_today)})</span>`)}
        ${row(T('progUntagged'), p.photos.untagged_today, p.photos.untagged_today > 0)}
