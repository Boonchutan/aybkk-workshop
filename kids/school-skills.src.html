<title>Foundation Playground</title>

<style>
/* ── Faces, inlined so nothing depends on a blocked CDN ────────────── */
@font-face{font-family:'Shantell';src:url('@@FONT:shantell-var@@') format('woff2');font-weight:300 800;font-display:swap}
@font-face{font-family:'Figtree';src:url('@@FONT:figtree@@') format('woff2');font-weight:300 900;font-display:swap}
@font-face{font-family:'Pangolin';src:url('@@FONT:pangolin@@') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'SarabunTH';src:url('@@FONT:sarabun-th@@') format('woff2');font-weight:400 700;font-display:swap}

/* ── Tokens ────────────────────────────────────────────────────────── */
:root{
  --paper:#DCEBF0;
  --paper-2:#C6DEE7;
  --card:#FFFFFF;
  --card-2:#F3F9FB;
  --ink:#173540;
  --ink-soft:#517684;
  --line:#B4D3DE;
  --ring:#1C6FA8;

  --c-sounds:#0B7F63;
  --c-count:#C0730A;
  --c-code:#C63F28;
  --c-shape:#6B3FB5;
  --c-thai:#1C6FA8;
  --c-feel:#BE3A6E;
  --c-trace:#15616D;
  --c-add:#3D4E8F;
  --c-tall:#9A5B18;
  --c-word:#4F6B21;
  --c-memory:#5B4636;
  --on-accent:#FFFFFF;

  --good:#0B7F63;
  --gold:#F5C02B;
  --hero:#C63F28;
  --pill:#FFF1CC;
  --pill-ink:#7A5200;

  --lift:0 7px 0 rgba(23,53,64,.20);
  --lift-sm:0 4px 0 rgba(23,53,64,.18);
  --pop:0 10px 30px rgba(23,53,64,.14);

  --display:'Shantell','Figtree',system-ui,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,sans-serif;
  --school:'Pangolin','Shantell',system-ui,sans-serif;
  --thai:'SarabunTH','Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D2029;
    --paper-2:#08161C;
    --card:#17323D;
    --card-2:#132B34;
    --ink:#E8F5F8;
    --ink-soft:#9BBECA;
    --line:#28505F;
    --ring:#6FC0F2;
    --good:#22B98F;
    --hero:#FF7C5A;
    --pill:#3B3316;
    --pill-ink:#FFD873;
    --lift:0 7px 0 rgba(0,0,0,.45);
    --lift-sm:0 4px 0 rgba(0,0,0,.42);
    --pop:0 10px 34px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0D2029;
  --paper-2:#08161C;
  --card:#17323D;
  --card-2:#132B34;
  --ink:#E8F5F8;
  --ink-soft:#9BBECA;
  --line:#28505F;
  --ring:#6FC0F2;
  --good:#22B98F;
  --hero:#FF7C5A;
  --pill:#3B3316;
  --pill-ink:#FFD873;
  --lift:0 7px 0 rgba(0,0,0,.45);
  --lift-sm:0 4px 0 rgba(0,0,0,.42);
  --pop:0 10px 34px rgba(0,0,0,.5);
}

/* ── Base ──────────────────────────────────────────────────────────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--ui);
  font-size:17px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--ring);outline-offset:3px;border-radius:8px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

.app{
  min-height:100svh;min-height:100dvh;
  display:flex;flex-direction:column;
  max-width:1080px;margin:0 auto;
  padding:12px 14px 22px;
}

/* ── Top bar ───────────────────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:10px;min-height:60px}
.bar-title{
  font-family:var(--display);font-weight:700;font-size:22px;
  letter-spacing:.2px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.icon-btn{
  width:52px;height:52px;flex:none;
  display:grid;place-items:center;
  border-radius:16px;background:var(--card);
  box-shadow:var(--lift-sm);
  font-size:24px;line-height:1;
  transition:transform .12s,box-shadow .12s;
}
.icon-btn:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,0)}
.icon-btn[aria-pressed="false"]{opacity:.45}
.tally{
  display:flex;align-items:center;gap:6px;flex:none;
  background:var(--card);border-radius:16px;
  padding:9px 14px 9px 11px;box-shadow:var(--lift-sm);
  font-family:var(--display);font-weight:700;font-size:20px;
  font-variant-numeric:tabular-nums;
}
.tally .s{font-size:22px;line-height:1}
.tally.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-4deg)}100%{transform:scale(1)}}

/* ── Home ──────────────────────────────────────────────────────────── */
.hero{padding:14px 4px 4px;position:relative}
.eyebrow{
  font-family:var(--ui);font-weight:800;font-size:12.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
}
.hero h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(38px,10.5vw,64px);
  line-height:.95;margin:6px 0 8px;text-wrap:balance;
}
.hero h1 em{font-style:normal;color:var(--hero);display:inline-block;transform:rotate(-3deg)}
.hero p{margin:0;max-width:34ch;color:var(--ink-soft);font-size:16.5px}

.board{
  display:grid;gap:16px;margin:22px 0 8px;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
}
@media (max-width:520px){.board{grid-template-columns:repeat(2,1fr);gap:12px}}
.tile{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;min-height:214px;padding:16px 12px;
  border-radius:24px;color:var(--on-accent);text-align:center;
  background:var(--tile);box-shadow:var(--lift);
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),box-shadow .14s;
  overflow:hidden;
}
.tile:nth-child(odd){transform:rotate(-1.3deg)}
.tile:nth-child(even){transform:rotate(1.1deg)}
.tile:active{transform:translateY(6px) rotate(0deg);box-shadow:0 1px 0 rgba(23,53,64,.2)}
.tile .peek{
  width:108px;height:114px;flex:none;margin-bottom:4px;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));
}
.tile h2{
  font-family:var(--display);font-weight:800;font-size:23px;
  margin:0;line-height:1.02;text-wrap:balance;position:relative;
}
.tile .sub{font-size:13.5px;font-weight:600;opacity:.92;position:relative}
.tile .got{
  position:absolute;top:12px;left:12px;
  background:rgba(255,255,255,.22);border-radius:999px;
  padding:3px 10px;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:4px;
}
:root[data-theme="dark"] .tile,
:root:not([data-theme="light"]) .tile{filter:saturate(1.12) brightness(1.1)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .tile{filter:none}}

.footnote{
  margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  color:var(--ink-soft);font-size:14px;
}
.linky{
  font-weight:700;color:var(--ink);text-decoration:underline;
  text-decoration-thickness:2px;text-underline-offset:3px;
  padding:6px 2px;
}

/* ── Play surface ──────────────────────────────────────────────────── */
.play{
  flex:1;display:flex;flex-direction:column;gap:14px;
  padding-top:4px;
}
.stage{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;gap:14px;
  background:var(--card);border-radius:28px;
  padding:18px 16px 20px;box-shadow:var(--pop);
  position:relative;overflow:hidden;min-height:280px;
}
/* The middle band swallows the slack so the answers always sit at the bottom. */
.mid{
  flex:1;width:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;min-height:0;
}
.stage::after{
  content:"";position:absolute;inset:0;border-radius:28px;
  border:3px solid var(--accent);opacity:.18;pointer-events:none;
}
.dots{display:flex;gap:7px;justify-content:center}
.dot{width:13px;height:13px;border-radius:50%;background:var(--line);transition:transform .3s,background .3s}
.dot.on{background:var(--accent);transform:scale(1.25)}

.buddy{position:relative;display:flex;align-items:flex-end;gap:10px;align-self:flex-start}
.mascot{width:104px;height:112px;flex:none}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.bubble{
  position:relative;background:var(--card-2);color:var(--ink);
  border:2.5px solid var(--line);border-radius:18px;
  padding:9px 14px;font-family:var(--display);font-weight:700;font-size:16px;
  max-width:24ch;margin-bottom:16px;
}
.bubble::after{
  content:"";position:absolute;left:-9px;bottom:12px;
  width:14px;height:14px;background:var(--card-2);
  border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);
  transform:rotate(45deg);
}

.ask{
  font-family:var(--display);font-weight:700;font-size:19px;
  text-align:center;color:var(--ink-soft);margin:0;text-wrap:balance;
}
.big-letter{
  font-family:var(--school);
  font-size:clamp(92px,26vw,150px);line-height:.9;
  color:var(--accent);
}
.big-letter .cap{font-size:.44em;color:var(--ink-soft);margin-left:.08em}

.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
.choice{
  flex:1 1 0;min-width:92px;max-width:180px;
  min-height:106px;border-radius:22px;
  background:var(--card-2);border:3px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:52px;line-height:1;
  box-shadow:var(--lift-sm);
  transition:transform .12s,box-shadow .12s,background .2s,border-color .2s;
}
.choice .cap{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink-soft)}
.choice:active{transform:translateY(4px);box-shadow:none}
.choice.yes{background:var(--good);border-color:var(--good);color:#fff;animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
.choice.yes .cap{color:rgba(255,255,255,.92)}
.choice.no{animation:shake .4s ease-in-out;opacity:.45}
.choice.num{font-family:var(--school);font-size:64px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.hint{
  font-family:var(--display);font-weight:700;font-size:15px;
  color:var(--ink-soft);text-align:center;margin:0;min-height:1.4em;
}

/* ── Counting ──────────────────────────────────────────────────────── */
.herd{
  display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;
  max-width:420px;padding:4px;
}
.critter{
  font-size:44px;line-height:1;padding:4px;border-radius:14px;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),filter .2s,opacity .2s;
  position:relative;
}
.critter.counted{transform:translateY(-8px) scale(1.08);filter:drop-shadow(0 4px 0 var(--accent))}
.critter .tag{
  position:absolute;top:-6px;right:-4px;
  background:var(--accent);color:#fff;border-radius:999px;
  min-width:22px;height:22px;font-family:var(--school);font-size:14px;
  display:grid;place-items:center;padding:0 5px;
}

/* ── Coding ────────────────────────────────────────────────────────── */
.grid-wrap{--cw:clamp(50px,13vw,66px);display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.grid{
  display:grid;gap:5px;padding:8px;border-radius:20px;
  background:var(--card-2);border:3px solid var(--line);
  position:relative;
}
.cell{
  width:var(--cw);aspect-ratio:1;border-radius:12px;
  background:var(--card);display:grid;place-items:center;font-size:30px;
}
.cell.goal{background:color-mix(in srgb,var(--accent) 16%,var(--card))}
/* Sized to one cell and parked at the grid origin, so a plain cell-offset
   translate lands it dead centre of any square. */
.rider{
  position:absolute;left:0;top:0;width:var(--cw);height:var(--cw);
  display:grid;place-items:center;
  transition:transform .34s cubic-bezier(.4,1.3,.5,1);z-index:2;
  pointer-events:none;
}
.rider .mascot{width:58px;height:62px}
.tape{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  min-height:46px;width:100%;padding:6px 8px;border-radius:14px;
  background:var(--card-2);border:2.5px dashed var(--line);
  align-items:center;
}
.tape:empty::before{
  content:"tap the arrows to build a spell";
  font-family:var(--display);font-size:14px;color:var(--ink-soft);
}
.step{
  width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:19px;font-weight:800;
}
.step.now{animation:bump .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent)}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;justify-content:center}
.key{
  border-radius:16px;background:var(--card-2);border:3px solid var(--line);
  display:grid;place-items:center;font-size:26px;box-shadow:var(--lift-sm);
  transition:transform .1s,box-shadow .1s;
}
.key:active{transform:translateY(3px);box-shadow:none}
.key.go{background:var(--accent);border-color:var(--accent);color:#fff;font-family:var(--display);font-weight:800;font-size:19px}
.key.wipe{font-size:22px}
.row-keys{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* ── Shapes ────────────────────────────────────────────────────────── */
.shape-hero{width:clamp(120px,34vw,168px);height:clamp(120px,34vw,168px)}
.shape-hero svg,.shape-mini svg{width:100%;height:100%;display:block}
.shape-mini{width:56px;height:56px}
.strip{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.strip .slot{
  width:clamp(44px,11vw,58px);height:clamp(44px,11vw,58px);
  display:grid;place-items:center;
}
.strip .slot.blank{
  border:3px dashed var(--accent);border-radius:14px;
  font-family:var(--display);font-size:26px;color:var(--accent);
}

/* ── Thai ──────────────────────────────────────────────────────────── */
.thai-word{
  font-family:var(--thai);font-weight:700;
  font-size:clamp(46px,13vw,78px);line-height:1.5;
  color:var(--accent);text-align:center;
}
.roman{
  font-family:var(--display);font-weight:700;font-size:20px;
  color:var(--ink-soft);letter-spacing:.02em;margin:0;
}

/* ── Feelings ──────────────────────────────────────────────────────── */
.faces{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
.face-btn{
  flex:1 1 0;min-width:96px;max-width:170px;
  border-radius:24px;background:var(--card-2);border:3px solid var(--line);
  padding:8px;box-shadow:var(--lift-sm);
  transition:transform .12s,box-shadow .12s,border-color .2s,background .2s;
}
.face-btn:active{transform:translateY(4px);box-shadow:none}
.face-btn svg{width:100%;height:auto;display:block}
.face-btn.yes{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card-2));animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
.face-btn.no{animation:shake .4s ease-in-out;opacity:.45}
.feel-word{
  font-family:var(--display);font-weight:800;
  font-size:clamp(34px,9vw,52px);color:var(--accent);line-height:1;
}

/* ── Tracing ───────────────────────────────────────────────────────── */
.pickers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.pick{
  flex:1 1 auto;min-width:132px;
  border-radius:22px;background:var(--card-2);border:3px solid var(--line);
  padding:16px 18px;box-shadow:var(--lift-sm);
  font-family:var(--school);font-size:30px;color:var(--ink);line-height:1.1;
  transition:transform .12s,box-shadow .12s,border-color .2s;
}
.pick:active{transform:translateY(4px);box-shadow:none}
.pick .who{
  display:block;font-family:var(--ui);font-size:12.5px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;
}
.pick .got{position:static;display:inline-block;background:none;color:var(--accent);font-size:14px;padding:0}

.word{
  display:flex;gap:3px;justify-content:center;flex-wrap:wrap;
  font-family:var(--school);font-size:clamp(26px,7vw,38px);line-height:1.2;
}
.wl{color:var(--line);padding:0 3px;border-bottom:5px solid transparent}
.wl.done{color:var(--accent)}
.wl.now{color:var(--ink);border-bottom-color:var(--accent)}
.count-of{
  font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink-soft);margin:0;
}

.tracepad{
  position:relative;touch-action:none;cursor:crosshair;
  display:flex;justify-content:center;width:100%;
  -webkit-user-select:none;user-select:none;
}
.tracer{height:clamp(200px,34vh,380px);width:100%;display:block}
.tracepad canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
/* A pale "road" carries the letter shape so it still reads as a letter, and a
   dotted centreline on top says trace-along-here. Dots alone were unreadable. */
.g-road{
  fill:none;stroke:var(--line);stroke-width:17;
  stroke-linecap:round;stroke-linejoin:round;opacity:.55;
}
.g-road.now{stroke:color-mix(in srgb,var(--accent) 30%,var(--line));opacity:1}
.g-road.done{stroke:var(--accent);opacity:1}
.g-stroke{
  fill:none;stroke:var(--ink-soft);stroke-width:2.6;
  stroke-linecap:round;stroke-dasharray:2 7;opacity:.45;
}
.g-stroke.now{stroke:var(--accent);opacity:.95}
.g-stroke.done{opacity:0}
.start-dot{
  fill:var(--good);stroke:var(--card);stroke-width:3;
  transform-box:fill-box;transform-origin:50% 50%;
  animation:ping 1.5s ease-in-out infinite;
}
@keyframes ping{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.75}}
.start-arrow{fill:var(--good);stroke:var(--card);stroke-width:1.6}
.demo-dot{fill:var(--accent);opacity:0}
.demo-dot.run{opacity:1}
@media (prefers-reduced-motion:reduce){.start-dot{animation:none}}

/* ── Word builder ──────────────────────────────────────────────────── */
.spell{display:flex;gap:8px;justify-content:center;align-items:center}
.slot-l{
  font-family:var(--school);font-size:clamp(48px,13vw,80px);line-height:1;
  min-width:.7em;text-align:center;color:var(--ink);
}
.slot-l.gap{
  color:var(--accent);border-bottom:6px solid var(--accent);
  min-width:.85em;
}
.slot-l.gap.empty::after{content:"?";opacity:.4}
.big-pic{font-size:clamp(64px,17vw,104px);line-height:1}

/* ── Sums ──────────────────────────────────────────────────────────── */
.sum{
  display:flex;gap:clamp(8px,3vw,20px);align-items:center;justify-content:center;
  flex-wrap:wrap;font-family:var(--school);
  font-size:clamp(40px,11vw,68px);line-height:1;color:var(--ink);
}
.sum .op{color:var(--accent);font-family:var(--display);font-weight:800}
.heap{
  display:flex;flex-wrap:wrap;gap:3px;justify-content:center;
  max-width:clamp(96px,26vw,150px);font-size:clamp(22px,6vw,32px);line-height:1.05;
}
.heap .gone{opacity:.28;position:relative}
.heap .gone::after{
  content:"";position:absolute;left:-2px;right:-2px;top:50%;
  border-top:3px solid var(--c-code);transform:rotate(-14deg);
}

/* ── Tall & small ──────────────────────────────────────────────────── */
.grove{
  display:flex;gap:clamp(8px,3vw,20px);align-items:flex-end;justify-content:center;
  width:100%;min-height:clamp(150px,30vh,240px);
}
.tree{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  flex:0 0 auto;position:relative;padding:0 2px;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),opacity .2s;
}
.tree:active{transform:translateY(4px)}
.tree svg{display:block;width:clamp(44px,12vw,68px);height:auto}
.tree .rank{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
  font-family:var(--school);font-size:17px;display:grid;place-items:center;
}
.tree.picked{opacity:.55}
.tree.yes svg{filter:drop-shadow(0 0 0 var(--good))}
.tree.no{animation:shake .4s ease-in-out}

/* ── Memory ────────────────────────────────────────────────────────── */

}

  position:absolute;inset:0;border-radius:16px;
  transition:transform .34s cubic-bezier(.4,1.3,.5,1);
  transform-style:preserve-3d;
}
.card.up .inner{transform:rotateY(180deg)}
.card .side{
  position:absolute;inset:0;border-radius:16px;
  display:grid;place-items:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  font-size:clamp(26px,7vw,42px);

.card .back .mx-all{animation:none}

.card.made .front{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--card-2))}

  .card .inner{transition:none}

  .card .front{transform:none}

}

/* ── Level chip ────────────────────────────────────────────────────── */
.tile .lv{
  position:absolute;top:12px;right:12px;

  padding:3px 9px;font-size:12.5px;font-weight:800;letter-spacing:.04em;
}
.lv-up{

  color:var(--pill-ink);background:var(--pill);

}

/* ── Celebration ───────────────────────────────────────────────────── */
.curtain{
  position:fixed;inset:0;z-index:50;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.party{
  background:var(--card);border-radius:30px;box-shadow:var(--pop);

.party .mascot{width:150px;height:160px}

.party p{margin:0;color:var(--ink-soft);font-size:16px}
.sticker{
  font-size:15px;font-weight:800;color:var(--pill-ink);
  background:var(--pill);border-radius:999px;padding:7px 16px;
}
.btn{
  border-radius:18px;padding:15px 22px;min-height:58px;width:100%;
  font-family:var(--display);font-weight:800;font-size:19px;

.btn:active{transform:translateY(5px);box-shadow:none}
.btn.ghost{background:var(--card-2);color:var(--ink);border:3px solid var(--line);box-shadow:var(--lift-sm)}

/* ── Grown-ups panel ───────────────────────────────────────────────── */
.panel{
  position:fixed;inset:0;z-index:70;overflow-y:auto;
  background:color-mix(in srgb,var(--paper) 94%,transparent);
  backdrop-filter:blur(8px);padding:20px 16px 40px;
}
.panel-inner{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.panel h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 3px}

.map{display:flex;flex-direction:column;gap:10px}

function barHTML(title, back){
  return '<div class="bar">' +
    (back ? '<button class="icon-btn" data-back aria-label="Back to the board">←</button>' : '') +
    '<div class="bar-title">' + title + '</div>' +

    '<div class="tally" id="tally"><span class="s">⭐</span><span id="tallyN">' + S.stars + '</span></div>' +
    '</div>';
}
function wireBar(root){
  on(root, '[data-back]', function(){ sfx('tap'); hush(); G = null; home(); });
  on(root, '[data-sound]', function(el){
    S.sound = !S.sound; save();
    el.textContent = S.sound ? '🔊' : '🔇';
    el.setAttribute('aria-pressed', S.sound);
    if (S.sound) sfx('tap'); else hush();
  });
}
function addStar(id){
  S.stars++; S.got[id] = (S.got[id] || 0) + 1; save();
  var t = document.getElementById('tally'), n = document.getElementById('tallyN');
  if (n) n.textContent = S.stars;
  if (t){ t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump'); }
}

  on(app, '[data-panel]', function(){ sfx('tap'); grownups(); });
}

/* ═══ Play shell ══════════════════════════════════════════════════ */
var G = null;

function start(id){
  var a = act(id);
  GEN++;
  G = { a:a, round:0, correct:0, set:null, gi:0 };
  app.innerHTML = barHTML(a.title, true) +
    '<div class="play" style="--accent:' + a.color + '">' +
      '<div class="dots" id="dots"></div>' +
      '<div class="stage" id="stage"></div>' +
    '</div>';
  wireBar(app);
  next();
}
function dots(){
  var d = document.getElementById('dots'); if (!d) return;
  var out = '';
  for (var i=0;i<5;i++) out += '<span class="dot' + (i < G.correct ? ' on' : '') + '"></span>';
  d.innerHTML = out;
}
function stage(){ return document.getElementById('stage'); }

/* Every round lays out the same three bands: who's talking, the thing to
   look at, and the things to tap. */
function lay(line, middle, tail){
  return '<div class="buddy">' + mascotHTML(G.a.mascot) +
      (line ? '<div class="bubble">' + line + '</div>' : '') + '</div>' +
    '<div class="mid">' + middle + '</div>' +
    (tail || '');
}

/* One path for right, one for gently-not-yet. Nothing ever ends a game. */
function scored(ok, thenSay){
  if (ok){
    sfx('yes'); react('happy'); addStar(G.a.id);
    G.correct++;
    dots();
    if (thenSay) later(260, function(){ say(thenSay); });
    if (G.correct >= 5) { later(1150, party); return; }
    later(1500, next);
  } else {
    sfx('no'); react('oops');
    if (thenSay) later(260, function(){ say(thenSay); });
  }
}
function next(){
  if (!G || !stage()) return;
  GEN++;
  G.round++;
  dots();
  ({ trace:roundTrace, sounds:roundSounds, count:roundCount, code:roundCode,
     shape:roundShape, thai:roundThai, feel:roundFeel,
     word:roundWord, add:roundAdd, tall:roundTall, memory:roundMemory })[G.a.id]();
}

function party(){
  sfx('party'); burst(90); GEN++;
  var a = G.a;
  var lines = ['You did it!','Five stars!','Champion!','So clever!','Look at you go!'];
  var wrap = document.createElement('div');
  wrap.className = 'curtain';
  wrap.innerHTML = '<div class="party" style="--accent:' + a.color + '">' +
    mascotHTML(a.mascot, 'is-happy') +
    '<h2>' + pick(lines) + '</h2>' +
    '<p>Five in a row on ' + a.title + '.</p>' +
    '<span class="sticker">⭐ ' + S.stars + ' stars all up</span>' +
    '<span class="lv-up">' + (lvl(a.id) >= 4
      ? 'Level 4 — the hardest there is'
      : 'Level ' + lvl(a.id) + ' · ' + nextLevelIn(a.id) + ' more stars until it gets harder') + '</span>' +
    '<button class="btn" data-more>Play more</button>' +
    '<button class="btn ghost" data-home>Back to the board</button>' +
    '</div>';
  document.body.appendChild(wrap);
  say('Five stars! Well done.');
  on(wrap, '[data-more]', function(){ sfx('tap'); wrap.remove(); G.correct = 0; next(); });
  on(wrap, '[data-home]', function(){ sfx('tap'); wrap.remove(); G = null; home(); });
  wait(900, function(){ burst(50, innerWidth*0.3, innerHeight*0.4); });
}

/* ═══ 1 · Silly Sounds ════════════════════════════════════════════ */
/* Sounds children mix up. Once he is good, the wrong answers come from here
   instead of from a random unrelated letter. */
var CONFUSE = { b:'dp', d:'bg', p:'bq', g:'d', m:'n', n:'m', f:'v', v:'f',
                s:'z', z:'s', c:'k', k:'c', u:'n', i:'l', e:'a', a:'e', o:'a' };
function roundSounds(){
  var L = lvl('sounds'), n = L >= 3 ? 3 : 2;
  var item = pick(PHONICS);
  var right = pick(item.words);
  var others;
  if (L >= 2 && CONFUSE[item.l]){
    var near = PHONICS.filter(function(p){ return CONFUSE[item.l].indexOf(p.l) >= 0; });
    var rest = sample(PHONICS, n, [item].concat(near));
    others = shuffle(near).slice(0, n).concat(rest).slice(0, n);
  } else {
    others = sample(PHONICS, n, [item]);
  }
  others = others.map(function(p){ return pick(p.words); });
  var opts = shuffle([{ w:right, ok:true }].concat(others.map(function(w){ return { w:w, ok:false }; })));

  stage().innerHTML = lay(
    'What starts with <b>' + item.sound + '</b>?',
    '<div class="big-letter" aria-label="the letter ' + item.l + '">' + item.l + '<span class="cap">' + item.l.toUpperCase() + '</span></div>' +
    '<p class="ask" aria-live="polite">Which one begins with “' + item.sound + '”?</p>',
    '<div class="choices">' + opts.map(function(o,i){
      return '<button class="choice" data-i="' + i + '"><span>' + o.w[0] + '</span><span class="cap">' + o.w[1] + '</span></button>';
    }).join('') + '</div>'
  );

  later(340, function(){ say(item.sound + '. ' + item.sound + '. Which one starts with ' + item.sound + '?'); });

  var done = false;
  on(stage(), '.choice', function(el){
    var o = opts[+el.getAttribute('data-i')];
    if (done && o.ok === false) return;
    if (o.ok){
      if (done) return;
      done = true;
      el.classList.add('yes');
      scored(true, o.w[1] + '. ' + o.w[1] + ' starts with ' + item.sound + '.');
    } else {
      el.classList.add('no');
      scored(false, 'That is ' + o.w[1] + '. Try again.');
    }
  });
}

/* ═══ 2 · Count with Chang ════════════════════════════════════════ */
var NUMWORD = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
  'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function numWord(n){ return NUMWORD[n] || String(n); }
function roundCount(){
  var L = lvl('count');
  var lo = L >= 3 ? 8 : 1;
  var hi = L < 1 ? 5 : (L < 2 ? 10 : (L < 3 ? 14 : 20));
  var n = lo + Math.floor(Math.random() * (hi - lo + 1));
  var emo = pick(CRITTERS);
  // Once he is confident the wrong answers sit right next door, so a rough
  // guess at the size no longer gets there.
  var near = L >= 2 ? [n-1, n+1] : [n-2, n-1, n+1, n+2];
  var opts = shuffle([n].concat(sample(near.filter(function(x){ return x >= 1 && x <= hi + 2; }), 2)));
  var bump = 1;
  while (opts.length < 3){ if (opts.indexOf(n + bump) < 0 && n + bump >= 1) opts.push(n + bump); bump++; }

  var body = '';
  for (var i=0;i<n;i++) body += '<button class="critter" data-c="' + i + '">' + emo + '</button>';

  stage().innerHTML = lay(
    'Touch each one, then tell me how many.',
    '<div class="herd">' + body + '</div>' +
    '<p class="ask" aria-live="polite">How many altogether?</p>',
    '<div class="choices">' + opts.map(function(v){
      return '<button class="choice num" data-v="' + v + '">' + v + '</button>';
    }).join('') + '</div>' +
    '<p class="hint" id="hint"></p>'
  );

  later(340, function(){ say('Touch each one to count them.'); });

  var tapped = 0;
  on(stage(), '.critter', function(el){
    if (el.classList.contains('counted')) return;
    tapped++;
    el.classList.add('counted');
    el.insertAdjacentHTML('beforeend', '<span class="tag">' + tapped + '</span>');
    sfx('step');
    say(numWord(tapped), 'en-AU', 1);
    var hint = document.getElementById('hint');
    if (hint && tapped === n) hint.textContent = 'Now pick the number!';
  });

  var done = false;
  on(stage(), '.choice', function(el){
    var v = +el.getAttribute('data-v');
    if (v === n){
      if (done) return;
      done = true;
      el.classList.add('yes');
      scored(true, numWord(n) + '! There are ' + n + '.');
    } else {
      el.classList.add('no');
      scored(false, 'Count them again with your finger.');
    }
  });
}

/* ═══ 3 · Monkey King Code ════════════════════════════════════════ */
var DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
var ARROW = { up:'⬆', down:'⬇', left:'⬅', right:'➡' };
function roundCode(){
  var band = CODE_LEVELS[lvl('code')];
  var lv = band[(G.round - 1) % band.length];
  var W = lv.w, H = lv.w;
  var prog = [], running = false;
  var pos = lv.start.slice();

  function isFire(c,r){ return lv.fire.some(function(f){ return f[0] === c && f[1] === r; }); }

  var cells = '';
  for (var r=0;r<H;r++) for (var c=0;c<W;c++){
    var goal = (lv.goal[0] === c && lv.goal[1] === r);
    cells += '<div class="cell' + (goal ? ' goal' : '') + '" data-c="' + c + '" data-r="' + r + '">' +
      (goal ? '🍑' : (isFire(c,r) ? '🔥' : '')) + '</div>';
  }

  stage().innerHTML = lay(
    'Tell my cloud where to fly!',
    '<div class="grid-wrap">' +
      '<div class="grid" id="grid" style="grid-template-columns:repeat(' + W + ',auto)">' + cells +
        '<div class="rider" id="rider">' + mascotHTML('monkey') + '</div>' +
      '</div>' +
      '<div class="tape" id="tape"></div>' +
    '</div>',
    '<div class="pad">' +
      '<button class="key" data-d="left">⬅</button>' +
      '<button class="key" data-d="up">⬆</button>' +
      '<button class="key" data-d="right">➡</button>' +
      '<button class="key wipe" data-wipe aria-label="Clear the spell">↺</button>' +
      '<button class="key" data-d="down">⬇</button>' +
      '<button class="key go" data-run>GO</button>' +
    '</div>' +
    '<p class="hint" id="hint">Fly to the peach 🍑</p>'
  );

  var grid = document.getElementById('grid'), rider = document.getElementById('rider');
  function place(c, r, animate){
    var cell = grid.querySelector('[data-c="' + c + '"][data-r="' + r + '"]');
    if (!cell) return;
    if (!animate) rider.style.transition = 'none';
    rider.style.transform = 'translate(' + (cell.offsetLeft - rider.offsetLeft) + 'px,' + (cell.offsetTop - rider.offsetTop) + 'px)';
    if (!animate) { void rider.offsetWidth; rider.style.transition = ''; }
  }
  requestAnimationFrame(function(){ place(pos[0], pos[1], false); });

  function drawTape(active){
    var t = document.getElementById('tape'); if (!t) return;
    t.innerHTML = prog.map(function(d,i){
      return '<span class="step' + (i === active ? ' now' : '') + '">' + ARROW[d] + '</span>';
    }).join('');
  }
  later(340, function(){ say('Build a spell to fly to the peach.'); });

  on(stage(), '[data-d]', function(el){
    if (running || prog.length >= 8) return;
    prog.push(el.getAttribute('data-d'));
    sfx('tap'); drawTape(-1);
  });
  on(stage(), '[data-wipe]', function(){
    if (running) return;
    prog = []; drawTape(-1); sfx('tap');
    pos = lv.start.slice(); place(pos[0], pos[1], true);
  });

  on(stage(), '[data-run]', function(){
    if (running || !prog.length) return;
    running = true;
    pos = lv.start.slice();
    place(pos[0], pos[1], true);
    var i = 0;
    var hint = document.getElementById('hint');

    function step(){
      if (!document.getElementById('grid')) return;
      if (i >= prog.length){
        running = false;
        hint.textContent = 'Not there yet — try a different spell!';
        sfx('no'); react('oops');
        say('Almost! Try a different spell.');
        return;
      }
      drawTape(i);
      var d = DIRS[prog[i]];
      var nc = pos[0] + d[0], nr = pos[1] + d[1];
      i++;
      if (nc < 0 || nc >= W || nr < 0 || nr >= H || isFire(nc, nr)){
        running = false;
        sfx('bonk'); react('oops');
        hint.textContent = nc < 0 || nc >= W || nr < 0 || nr >= H ? 'Oops — off the edge!' : 'Ouch — hot mountain!';
        say('Oops! Try again.');
        later(700, function(){ pos = lv.start.slice(); place(pos[0], pos[1], true); drawTape(-1); });
        return;
      }
      pos = [nc, nr];
      place(nc, nr, true);
      sfx('step');
      if (nc === lv.goal[0] && nr === lv.goal[1]){
        running = false;
        hint.textContent = 'The peach! 🍑';
        scored(true, 'You got the peach!');
        return;
      }
      later(430, step);
    }
    step();
  });
}

/* ═══ 4 · Shape Web ═══════════════════════════════════════════════ */
function roundShape(){
  if (G.round % 2 === 1) shapeName(); else shapePattern();
}
var EASY_SHAPES = ['circle','square','triangle','rectangle'];
function shapePool(){ return lvl('shape') >= 2 ? SHAPE_NAMES : EASY_SHAPES; }
function shapeName(){
  var pool = shapePool(), n = lvl('shape') >= 3 ? 3 : 2;
  var right = pick(pool);
  var opts = shuffle([right].concat(sample(pool, n, [right])));

  stage().innerHTML = lay(
    'I caught a shape in my web!',
    '<div class="shape-hero" style="color:var(--accent)">' + shapeSVG(right) + '</div>' +
    '<p class="ask" aria-live="polite">What shape is it?</p>',
    '<div class="choices">' + opts.map(function(s){
      return '<button class="choice" data-s="' + s + '"><span class="shape-mini" style="color:var(--ink-soft)">' + shapeSVG(s) + '</span><span class="cap">' + s + '</span></button>';
    }).join('') + '</div>'
  );

  later(340, function(){ say('What shape is this?'); });

  var done = false;
  on(stage(), '.choice', function(el){
    var s = el.getAttribute('data-s');
    if (s === right){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, 'Yes! A ' + right + '.');
    } else {
      el.classList.add('no');
      scored(false, 'That is a ' + s + '. Look again.');
    }
  });
}
function shapePattern(){
  var L = lvl('shape'), pool = shapePool();
  var rules = L < 1 ? ['AB'] : (L < 2 ? ['AB','AAB','ABB'] : ['AB','AAB','ABB','ABC','AABB','ABCC']);
  var kinds = sample(pool, 3);
  var rule = pick(rules);
  var map = { A:kinds[0], B:kinds[1], C:kinds[2] };
  var seq = [];
  for (var i=0;i<7;i++) seq.push(map[rule[i % rule.length]]);
  var answer = seq[6];
  var opts = shuffle([answer].concat(sample(kinds.concat(pool), L >= 3 ? 3 : 2, [answer])));

  var strip = seq.slice(0,6).map(function(s){
    return '<span class="slot" style="color:var(--accent)">' + shapeSVG(s) + '</span>';
  }).join('') + '<span class="slot blank">?</span>';

  stage().innerHTML = lay(
    'My web has a pattern. What comes next?',
    '<div class="strip">' + strip + '</div>' +
    '<p class="ask" aria-live="polite">Which shape fills the gap?</p>',
    '<div class="choices">' + opts.map(function(s){
      return '<button class="choice" data-s="' + s + '"><span class="shape-mini" style="color:var(--ink-soft)">' + shapeSVG(s) + '</span><span class="cap">' + s + '</span></button>';
    }).join('') + '</div>'
  );

  later(340, function(){ say('What comes next in the pattern?'); });

  var done = false;
  on(stage(), '.choice', function(el){
    var s = el.getAttribute('data-s');
    if (s === answer){
      if (done) return;
      done = true; el.classList.add('yes');
      scored(true, 'The pattern keeps going. A ' + answer + '!');
    } else {
      el.classList.add('no');
      scored(false, 'Say the pattern out loud with me.');
    }
  });
}

/* ═══ 7 · Trace It ════════════════════════════════════════════════ */
function roundTrace(){
  if (!G.set) return traceMenu(false);
  if (G.gi >= G.set.items.length){ var done = G.set; G.set = null; return traceMenu(done); }
  traceItem();
}

function traceMenu(finished){
  stage().innerHTML = lay(
    finished ? 'You wrote the whole thing!' : 'What shall we write?',
    (finished ? '<div class="word">' + finished.label.split('').map(function(c){
        return '<span class="wl done">' + c + '</span>'; }).join('') + '</div>' : '') +
    '<p class="ask">Pick one to trace.</p>' +
    '<div class="pickers">' + TRACE_SETS.map(function(t){
      return '<button class="pick" data-set="' + t.id + '">' +
        '<span class="who">' + (t.kind === 'name' ? 'name' : 'numbers') + '</span>' + t.label +
        '</button>';
    }).join('') + '</div>'
  );
  later(340, function(){ say(finished ? 'You wrote the whole thing!' : 'What shall we write?'); });
  on(stage(), '[data-set]', function(el){
    var id = el.getAttribute('data-set');
    for (var i=0;i<TRACE_SETS.length;i++) if (TRACE_SETS[i].id === id) G.set = TRACE_SETS[i];
    G.gi = 0; sfx('tap'); next();
  });
}

function traceItem(){
  var set = G.set, item = set.items[G.gi], chars = item.split('');
  var boxW = 100 * chars.length;

  var roads = '', dots = '';
  chars.forEach(function(ch, k){
    var open = '<g transform="translate(' + (k * 100) + ',0)">', close = '</g>';
    roads += open + GLYPH[ch].map(function(d){ return '<path class="g-road" d="' + d + '"/>'; }).join('') + close;
    dots  += open + GLYPH[ch].map(function(d){ return '<path class="g-stroke" d="' + d + '"/>'; }).join('') + close;
  });
  var guides = roads + dots;

  var head = set.kind === 'name'
    ? '<div class="word">' + set.items.map(function(c, i){
        return '<span class="wl ' + (i < G.gi ? 'done' : (i === G.gi ? 'now' : '')) + '">' + c + '</span>';
      }).join('') + '</div>'
    : '<p class="count-of">Number ' + item + ' — ' + (G.gi + 1) + ' of ' + set.items.length + '</p>';

  stage().innerHTML = lay(
    'Follow my silk with your finger.',
    head +
    '<div class="tracepad" id="pad">' +
      '<svg class="tracer" id="tracer" viewBox="0 0 ' + boxW + ' 140" aria-label="trace ' + item + '">' +
        guides +
        '<circle class="start-dot" id="sdot" r="9" cx="-99" cy="-99"/>' +
        '<polygon class="start-arrow" id="sarrow" points="-1,-6 11,0 -1,6" opacity="0"/>' +
        '<circle class="demo-dot" id="ddot" r="11" cx="-99" cy="-99"/>' +
      '</svg>' +
      '<canvas id="ink"></canvas>' +
    '</div>',
    '<div class="row-keys">' +
      '<button class="btn ghost" data-demo style="width:auto">👆 Show me</button>' +
      '<button class="btn ghost" data-rub style="width:auto">↺ Rub out</button>' +
    '</div>' +
    '<p class="hint" id="hint"></p>'
  );

  var svg = document.getElementById('tracer');
  var pad = document.getElementById('pad');
  var ink = document.getElementById('ink');
  var sdot = document.getElementById('sdot');
  var sarrow = document.getElementById('sarrow');
  var ddot = document.getElementById('ddot');
  var ctx2 = ink.getContext('2d');

  var roadEls = svg.querySelectorAll('.g-road');
  var strokes = Array.prototype.map.call(svg.querySelectorAll('.g-stroke'), function(el, i){
    var g = el.parentNode.getAttribute('transform') || '';
    var m = /translate\(([-\d.]+)/.exec(g);
    return { el:el, road:roadEls[i], i:i, ox: m ? parseFloat(m[1]) : 0,
             len: el.getTotalLength(), pts:[], head:0, done:false };
  });
  var at = 0, tol = 26, drawing = false, finished = false;

  function sizeInk(){
    var r = svg.getBoundingClientRect();
    ink.width = Math.round(r.width * devicePixelRatio);
    ink.height = Math.round(r.height * devicePixelRatio);
    ctx2.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx2.lineCap = 'round'; ctx2.lineJoin = 'round';
    ctx2.strokeStyle = (getComputedStyle(pad).getPropertyValue('--accent') || '').trim() || '#15616D';
    // Scale the catch radius (and the child's ink) to how big the glyph
    // actually rendered, so the game is equally forgiving on phone and tablet.
    tol = Math.max(20, Math.min(48, 15 * (r.height / 140))) * (1 - lvl('trace') * 0.06);
    ctx2.lineWidth = tol * 0.72;
  }
  function resample(){
    strokes.forEach(function(s){
      var ctm = s.el.getScreenCTM();
      if (!ctm) return;
      var n = Math.max(3, Math.round(s.len / 3.5));
      s.pts = [];
      for (var i=0;i<=n;i++){
        var p = s.el.getPointAtLength(s.len * i / n);
        var q = new DOMPoint(p.x, p.y).matrixTransform(ctm);
        s.pts.push({ x:q.x, y:q.y });
      }
    });
  }
  function layout(){
    if (!document.getElementById('tracer')){ removeEventListener('resize', layout); return; }
    sizeInk(); resample(); markCurrent();
  }

  function markCurrent(){
    strokes.forEach(function(s, i){
      var now = !s.done && i === at;
      [s.el, s.road].forEach(function(e){
        if (!e) return;
        e.classList.toggle('done', s.done);
        e.classList.toggle('now', now);
      });
    });
    var s = strokes[at];
    if (!s || finished){ sdot.setAttribute('cx', -99); sarrow.setAttribute('opacity', 0); return; }
    var p0 = s.el.getPointAtLength(0);
    sdot.setAttribute('cx', p0.x + s.ox); sdot.setAttribute('cy', p0.y);
    if (s.len > 8){
      var p1 = s.el.getPointAtLength(Math.min(s.len, 18));
      var a = Math.atan2(p1.y - p0.y, p1.x - p0.x);
      sarrow.setAttribute('opacity', 1);
      sarrow.setAttribute('transform',
        'translate(' + (p0.x + s.ox + Math.cos(a) * 27) + ',' + (p0.y + Math.sin(a) * 27) + ') ' +
        'rotate(' + (a * 180 / Math.PI) + ')');
    } else {
      sarrow.setAttribute('opacity', 0);
    }
  }

  function clearInk(){ ctx2.clearRect(0, 0, ink.width, ink.height); }

  function finishStroke(){
    var s = strokes[at];
    s.done = true; s.head = s.pts.length;
    clearInk(); sfx('step');
    at++;
    while (at < strokes.length && strokes[at].done) at++;
    if (at >= strokes.length) return finishItem();
    markCurrent();
  }

  function finishItem(){
    finished = true; markCurrent();
    G.gi++;
    var what = set.kind === 'name'
      ? (G.gi >= set.items.length ? 'You finished ' + set.label + '!' : item)
      : 'Number ' + item;
    scored(true, what);
  }

  /* Advance only from at-or-just-ahead of where the pencil should be, so a
     scribble across the letter cannot complete it. */
  function feed(x, y){
    var s = strokes[at];
    if (!s || finished || !s.pts.length) return;
    var top = Math.min(s.pts.length, s.head + 16);
    for (var i = s.head; i < top; i++){
      var p = s.pts[i];
      if (Math.hypot(p.x - x, p.y - y) <= tol) s.head = i + 1;
    }
    if (s.head >= s.pts.length - 1) finishStroke();
  }

  function local(ev){
    var r = svg.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  pad.addEventListener('pointerdown', function(ev){
    if (finished) return;
    var s = strokes[at]; if (!s) return;
    ctx(); // unlock audio on first touch
    if (s.len <= 8){ // the dot on an i — a tap, not a drag
      var d = s.pts[0];
      if (d && Math.hypot(d.x - ev.clientX, d.y - ev.clientY) <= tol * 1.6) finishStroke();
      return;
    }
    drawing = true;
    try { pad.setPointerCapture(ev.pointerId); } catch(e){}
    var l = local(ev);
    ctx2.beginPath(); ctx2.moveTo(l.x, l.y);
    feed(ev.clientX, ev.clientY);
    ev.preventDefault();
  });
  pad.addEventListener('pointermove', function(ev){
    if (!drawing || finished) return;
    var l = local(ev);
    ctx2.lineTo(l.x, l.y); ctx2.stroke();
    ctx2.beginPath(); ctx2.moveTo(l.x, l.y);
    feed(ev.clientX, ev.clientY);
    ev.preventDefault();
  });
  function lift(){
    if (!drawing) return;
    drawing = false;
    var s = strokes[at];
    var hint = document.getElementById('hint');
    if (s && !s.done && s.head === 0 && hint) hint.textContent = 'Start on the green dot 🟢';
  }
  pad.addEventListener('pointerup', lift);
  pad.addEventListener('pointercancel', lift);

  on(stage(), '[data-rub]', function(){
    clearInk(); sfx('tap');
    var s = strokes[at]; if (s) s.head = 0;
    var hint = document.getElementById('hint'); if (hint) hint.textContent = '';
  });
  on(stage(), '[data-demo]', function(){
    var s = strokes[at]; if (!s || finished) return;
    sfx('tap');
    var t0 = performance.now(), dur = reduce ? 400 : 1400;
    ddot.classList.add('run');
    (function frame(now){
      if (!document.getElementById('ddot')) return;
      var k = Math.min(1, (now - t0) / dur);
      var p = s.el.getPointAtLength(s.len * k);
      ddot.setAttribute('cx', p.x + s.ox); ddot.setAttribute('cy', p.y);
      if (k < 1) requestAnimationFrame(frame);
      else { ddot.classList.remove('run'); ddot.setAttribute('cx', -99); }
    })(performance.now());
  });

  requestAnimationFrame(layout);
  addEventListener('resize', layout);
  later(360, function(){
    say(set.kind === 'name' ? 'Trace the letter ' + item : 'Trace number ' + item);
  });
}

/* ═══ 8 · Word Builder ════════════════════════════════════════════ */
/* CVC words — the step after naming a first sound is blending three. */
var CVC = [
  ['cat','🐈'],['dog','🐕'],['pig','🐷'],['cup','🥤'],['sun','☀️'],['bus','🚌'],
  ['hat','🎩'],['bed','🛏️'],['log','🪵'],['jam','🫙'],['fox','🦊'],['box','📦'],
  ['bag','🎒'],['van','🚐'],['web','🕸️'],['pen','🖊️'],['bat','🦇'],['pot','🍲'],
  ['cap','🧢'],['fan','🪭'],['hen','🐔'],['leg','🦵'],['lip','👄'],['map','🗺️'],
  ['nut','🥜'],['pin','📌'],['rat','🐀'],['six','6️⃣'],['ten','🔟'],['yak','🐃'],
  ['egg','🥚'],['bee','🐝'],['key','🔑'],['cow','🐄']
];
var VOWELS = ['a','e','i','o','u'];
var CONSO = 'bcdfghjklmnpqrstvwxyz'.split('');

function roundWord(){
  var L = lvl('word');
  var w = pick(CVC), word = w[0], letters = word.split('');
  // Which letter to hide: first, then the vowel in the middle, then the last.
  var slot = L < 1 ? 0 : (L < 2 ? pick([0, 2]) : (L < 3 ? 1 : pick([0, 1, 2])));
  if (slot >= letters.length) slot = 0;
  var whole = L >= 4;
  var answer = letters[slot];
  var isVowel = VOWELS.indexOf(answer) >= 0;
  var wrongPool = isVowel ? VOWELS : CONSO;
  var opts = shuffle([answer].concat(sample(wrongPool, L >= 3 ? 3 : 2, [answer])));

  var built = whole ? [] : null;
  function spellHTML(){
    return letters.map(function(c, i){
      if (whole) return '<span class="slot-l gap' + (built[i] ? '' : ' empty') + '">' + (built[i] || '') + '</span>';
      return i === slot
        ? '<span class="slot-l gap empty" id="gap"></span>'
        : '<span class="slot-l">' + c + '</span>';
    }).join('');
  }

  if (whole){
    for (var i=0;i<letters.length;i++) built.push('');
    var bank = shuffle(letters.slice());
    stage().innerHTML = lay(
      'Build the whole word.',
      '<div class="big-pic">' + w[1] + '</div>' +
      '<div class="spell" id="spell">' + spellHTML() + '</div>' +
      '<p class="ask" aria-live="polite">Tap the letters in order.</p>',
      '<div class="choices">' + bank.map(function(c, i){
        return '<button class="choice num" data-c="' + c + '" data-i="' + i + '">' + c + '</button>';
      }).join('') + '</div>'
    );
    later(340, function(){ say('Build the word ' + word); });
    var at = 0, done = false;
    on(stage(), '.choice', function(el){
      if (done) return;
      var c = el.getAttribute('data-c');
      if (c === letters[at]){
        built[at] = c; at++;
        el.classList.add('yes'); el.disabled = true;
        document.getElementById('spell').innerHTML = spellHTML();
        sfx('step'); say(c, 'en-AU', 1);
        if (at >= letters.length){ done = true; scored(true, word + '! ' + word + '.'); }
      } else {
        el.classList.add('no');
        scored(false, 'Not that one yet.');
      }
    });
    return;
  }

  stage().innerHTML = lay(
    'Which letter is missing?',
    '<div class="big-pic">' + w[1] + '</div>' +
    '<div class="spell">' + spellHTML() + '</div>' +
    '<p class="ask" aria-live="polite">Finish the word “' + word + '”.</p>',
    '<div class="choices">' + opts.map(function(c){
      return '<button class="choice num" data-c="' + c + '">' + c + '</button>';
    }).join('') + '</div>'
  );
  later(340, function(){ say(word + '. ' + word.split('').join(' ') + '. Which letter is missing?'); });

  var settled = false;
  on(stage(), '.choice', function(el){
    var c = el.getAttribute('data-c');
    if (c === answer){
      if (settled) return;
      settled = true;
      el.classList.add('yes');
      var g = document.getElementById('gap');
      if (g){ g.textContent = answer; g.classList.remove('empty'); }
      scored(true, word + '!');
    } else {
      el.classList.add('no');
      scored(false, 'Say it slowly. ' + word + '.');
    }
  });
}

/* ═══ 9 · Add & Take Away ═════════════════════════════════════════ */
function roundAdd(){
  var L = lvl('add');
  var top = L < 1 ? 5 : (L < 2 ? 10 : (L < 4 ? 15 : 20));
  var show = L < 2;                       // objects to count, until he is ready
  var sub = L >= 2 && Math.random() < 0.45;
  var emo = pick(CRITTERS);
  var a, b, ans;
  if (sub){
    a = 2 + Math.floor(Math.random() * (top - 1));
    b = 1 + Math.floor(Math.random() * (a - 1));
    ans = a - b;
  } else {
    a = 1 + Math.floor(Math.random() * (top - 1));
    b = 1 + Math.floor(Math.random() * (top - a));
    ans = a + b;
  }
  var opts = shuffle([ans].concat(sample([ans-2,ans-1,ans+1,ans+2].filter(function(x){ return x >= 0 && x <= top + 2; }), 2)));
  var bump = 1;
  while (opts.length < 3){ if (opts.indexOf(ans + bump) < 0 && ans + bump >= 0) opts.push(ans + bump); bump++; }

  function heap(n, goneFrom){
    var out = '';
    for (var i=0;i<n;i++) out += '<span' + (goneFrom != null && i >= goneFrom ? ' class="gone"' : '') + '>' + emo + '</span>';
    return '<span class="heap">' + out + '</span>';
  }
  var body = sub
    ? (show ? heap(a, a - b) : '<span>' + a + '</span>') + '<span class="op">−</span>' +
      (show ? '<span>' + b + '</span>' : '<span>' + b + '</span>')
    : (show ? heap(a) : '<span>' + a + '</span>') + '<span class="op">+</span>' +
      (show ? heap(b) : '<span>' + b + '</span>');

  stage().innerHTML = lay(
    sub ? 'Take some away!' : 'Put them together!',
    '<div class="sum">' + body + '<span class="op">=</span><span class="op">?</span></div>' +
    '<p class="ask" aria-live="polite">' + a + (sub ? ' take away ' : ' add ') + b + '?</p>',
    '<div class="choices">' + opts.map(function(v){
      return '<button class="choice num" data-v="' + v + '">' + v + '</button>';
    }).join('') + '</div>'
  );
  later(340, function(){ say(a + (sub ? ' take away ' : ' plus ') + b + '. How many?'); });

  var settled = false;
  on(stage(), '.choice', function(el){
    var v = +el.getAttribute('data-v');
    if (v === ans){
      if (settled) return;
      settled = true; el.classList.add('yes');
      scored(true, a + (sub ? ' take away ' : ' plus ') + b + ' is ' + ans);
    } else {
      el.classList.add('no');
      scored(false, show ? 'Count them all again.' : 'Try counting on your fingers.');
    }
  });
}

/* ═══ 10 · Tall & Small ═══════════════════════════════════════════ */
/* h is 0..1. Trunk stays on the ground and the crown grows upward, so the
   only thing that varies between trees is the thing being compared. */
function treeSVG(h){
  var H = 74 + Math.round(h * 150), crown = H - 30;
  return '<svg viewBox="0 0 60 ' + H + '" style="height:' + H + 'px" aria-hidden="true">' +
    '<rect x="25" y="' + (H - 32) + '" width="11" height="32" rx="4" fill="#7A5A2E"/>' +
    '<ellipse cx="30" cy="' + (crown / 2) + '" rx="27" ry="' + (crown / 2) + '" fill="#4E9B45"/>' +
    '<ellipse cx="21" cy="' + (crown / 2.4) + '" rx="8" ry="' + (crown / 3.4) + '" fill="#6BBF5C" opacity=".55"/>' +
    '</svg>';
}
function roundTall(){
  var L = lvl('tall');
  var mode = L < 1 ? 'pick' : (L < 3 ? (G.round % 2 ? 'pick' : 'order') : 'order');
  var count = L < 2 ? 3 : (L < 4 ? 4 : 4);
  var numbers = L >= 4 && mode === 'order';

  var hs = [];
  while (hs.length < count){
    var v = Math.round(Math.random() * 100) / 100;
    if (hs.every(function(x){ return Math.abs(x - v) > (L >= 2 ? 0.14 : 0.24); })) hs.push(v);
  }
  var vals = numbers ? shuffle([3,7,11,15,19,4,8,12,16,20]).slice(0, count) : hs;
  var items = vals.map(function(v, i){ return { v:v, i:i, h:hs[i] }; });
  var wantBig = Math.random() < 0.5;

  var body = '<div class="grove" id="grove">' + items.map(function(t){
    return '<button class="tree" data-i="' + t.i + '" style="color:var(--accent)" aria-label="' +
      (numbers ? 'number ' + t.v : 'a tree') + '">' +
      (numbers ? '<span class="slot-l">' + t.v + '</span>' : treeSVG(t.h)) + '</button>';
  }).join('') + '</div>';

  var askText = mode === 'pick'
    ? (wantBig ? 'Tap the tallest tree.' : 'Tap the shortest tree.')
    : (numbers ? 'Tap the numbers from smallest to biggest.' : 'Tap them from shortest to tallest.');

  stage().innerHTML = lay(
    mode === 'pick' ? 'I can only reach the tall ones!' : 'Line them up for me!',
    body + '<p class="ask" aria-live="polite">' + askText + '</p>',
    ''
  );
  later(340, function(){ say(askText); });

  var sortedAsc = items.slice().sort(function(x, y){ return x.v - y.v; });
  var target = mode === 'pick'
    ? [wantBig ? sortedAsc[sortedAsc.length - 1] : sortedAsc[0]]
    : sortedAsc;
  var step = 0, settled = false;

  on(stage(), '.tree', function(el){
    if (settled) return;
    var i = +el.getAttribute('data-i');
    if (i === target[step].i){
      step++;
      sfx('step');
      if (mode === 'order'){
        el.classList.add('picked');
        el.insertAdjacentHTML('beforeend', '<span class="rank">' + step + '</span>');
      }
      if (step >= target.length){
        settled = true;
        scored(true, mode === 'pick' ? 'That one!' : 'Smallest to biggest. Perfect.');
      }
    } else {
      el.classList.add('no');
      later(500, function(){ el.classList.remove('no'); });
      if (mode === 'order' && step > 0){
        step = 0;
        Array.prototype.forEach.call(stage().querySelectorAll('.tree'), function(t){
          t.classList.remove('picked');
          var r = t.querySelector('.rank'); if (r) r.remove();
        });
        scored(false, 'Start again from the smallest.');
      } else {
        scored(false, 'Look again.');
      }
    }
  });
}

/* ═══ 11 · Memory Burrow ══════════════════════════════════════════ */
var MEM_FACES = ['🍉','🐠','🌵','🎈','🚂','🦉','🍄','🌻','🐙','⛵','🪁','🧁','🦩','🥁','🪐','🐞'];

/* Memory scores per pair rather than per round, so the board keeps going. */
function gainStar(){
  addStar(G.a.id); G.correct++; dots();
  if (G.correct >= 5){ later(1000, party); return true; }
  return false;
}
function roundMemory(){
  var L = lvl('memory');
  var pairs = [3, 4, 5, 6, 8][L];
  var cols = pairs <= 4 ? pairs : (pairs <= 6 ? Math.ceil(pairs * 2 / 3) : 4);
  var faces = sample(MEM_FACES, pairs);
  var deck = shuffle(faces.concat(faces));

  stage().innerHTML = lay(
    'Two of each are hiding down here.',
    '<div class="deck" id="deck" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr));max-width:min(100%,' + (cols * 116) + 'px)">' +
      deck.map(function(f, i){
        return '<button class="card" data-i="' + i + '" data-f="' + f + '" aria-label="hidden card">' +
          '<span class="inner">' +
            '<span class="side back">' + SVG.armadillo + '</span>' +
            '<span class="side front">' + f + '</span>' +
          '</span></button>';
      }).join('') +
    '</div>',
    '<p class="hint" id="hint">Find a matching pair</p>'
  );
  later(340, function(){ say('Find the matching pairs.'); });

  var open = [], busy = false, made = 0;
  on(stage(), '.card', function(el){
    if (busy || el.classList.contains('up') || el.classList.contains('made')) return;
    el.classList.add('up');
    el.setAttribute('aria-label', el.getAttribute('data-f'));
    sfx('tap');
    open.push(el);
    if (open.length < 2) return;
    busy = true;
    var a = open[0], b = open[1];
    if (a.getAttribute('data-f') === b.getAttribute('data-f')){
      later(320, function(){
        a.classList.add('made'); b.classList.add('made');
        open = []; busy = false; made++;
        sfx('yes'); react('happy');
        var hint = document.getElementById('hint');
        if (hint) hint.textContent = made + ' of ' + pairs + ' found';
        if (gainStar()) return;
        if (made >= pairs){
          say('You found them all!');
          later(1100, next);
        }
      });
    } else {
      later(820, function(){
        a.classList.remove('up'); b.classList.remove('up');
        a.setAttribute('aria-label', 'hidden card'); b.setAttribute('aria-label', 'hidden card');
        open = []; busy = false;
        sfx('no');
      });
    }
  });
}

/* ═══ Grown-ups ═══════════════════════════════════════════════════ */
function grownups(){
  var rows = ACTS.map(function(a){
    return '<div class="map-row" style="--tile:' + a.color + '">' +
      '<div><h3>' + a.title + '</h3>' +
      '<div class="area">' + a.area + '</div>' +
      '<p style="margin-top:6px">' + a.note + '</p></div></div>';
  }).join('');

  var wrap = document.createElement('div');
  wrap.className = 'panel';
  wrap.innerHTML = '<div class="panel-inner">' +
    '<div class="bar"><div class="bar-title" style="font-size:26px">For grown-ups</div>' +
    '<button class="icon-btn" data-close aria-label="Close">✕</button></div>' +
    '<p>Eleven games covering the learning areas in the AISB Foundation letter, each with its own animal. Everything runs in the page — no accounts, no network, no ads, nothing to buy. Progress is saved on this device only.</p>' +
    '<p><b>It gets harder as he plays.</b> Every game keeps its own level: ten stars in that game buys the next one, up to level 4, and the level shows on its tile. Levels widen the number range, bring in confusable letter sounds and near-identical feelings, add flaming mountains and a bigger grid to the coding quests, and move Word Builder from the first letter to the vowel in the middle. Nothing you have to set — it just stops being easy.</p>' +
    '<div class="map">' + rows + '</div>' +
    '<p><b>How it behaves:</b> a wrong tap never ends anything — the mascot wobbles, the answer stays open, and the voice gives a nudge. Five correct in a row earns a celebration. There are no timers and no scores to lose.</p>' +
    '<p><b>If it is silent:</b> tap 🔊 in the top bar, and check the device is not on mute. The voice uses whichever Australian or English voice the device has; Thai words use a Thai voice when one is installed, otherwise it reads the romanisation aloud instead.</p>' +
    '<button class="btn ghost" data-reset style="--accent:var(--c-code)">Clear the star count</button>' +
    '</div>';
  document.body.appendChild(wrap);
  on(wrap, '[data-close]', function(){ sfx('tap'); wrap.remove(); });
  on(wrap, '[data-reset]', function(el){
    if (el.getAttribute('data-armed')){
      S.stars = 0; S.got = {}; save(); wrap.remove(); home();
    } else {
      el.setAttribute('data-armed','1');
      el.textContent = 'Tap again to clear ' + S.stars + ' stars';
    }
  });
}

/* ═══ Go ══════════════════════════════════════════════════════════ */
home();

/* First tap anywhere unlocks audio on iOS/Safari. */
document.addEventListener('pointerdown', function once(){
  ctx();
  document.removeEventListener('pointerdown', once);
}, { once:true });

})();
