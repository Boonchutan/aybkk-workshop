<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYBKK — Timetable &amp; Packages</title>
<link rel="preload" href="/fonts/longcang.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plexthai.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* AYBKK Bangkok — Aubergine & Blush.
     Long Cang (brush) carries display only; body text is a plain face so the
     small print stays readable. Self-hosted font: the Google CDN is blocked in China. */
  @font-face{font-family:'Long Cang';src:url('/fonts/longcang.woff2') format('woff2');font-display:swap}
  /* Two cuts of one family under one name: the browser picks the Thai file only
     for Thai characters, so Thai and Latin sit on the same baseline. */
  @font-face{font-family:'Plex';src:url('/fonts/plexthai.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Plex';src:url('/fonts/plexthai-th.woff2') format('woff2');
    unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;font-display:swap}
  :root{
    --ink:#17121a;          /* near-black, violet cast */
    --wall:#f7f1f5;         /* blush-tinted room */
    --paper:#ffffff;
    --blush:#fbe7f0;        /* pink surface */
    --blush-line:#f3d3e2;
    --plum:#5c2160;         /* aubergine */
    --plum-deep:#43164a;
    --plum-soft:#8b4c90;
    --pink:#e8458c;         /* the contrast */
    --pink-deep:#c92f74;
    --soft:#6b5d70;
    --line:rgba(23,18,26,.11);
    --on-dark:#fdf7fa;
    --header:#17121a;   /* fixed: never flips with the theme */
    --radius:8px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#f5e9f0; --wall:#140f18; --paper:#1e1723; --blush:#2b1c2b; --blush-line:#3d2740;
      --plum:#c07ec8; --plum-deep:#d9a5de; --plum-soft:#a468ac;
      --pink:#ff6fae; --pink-deep:#ff8dc0; --soft:#b09cb6;
      --line:rgba(245,233,240,.14); --on-dark:#17121a; --header:#17121a;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f5e9f0; --wall:#140f18; --paper:#1e1723; --blush:#2b1c2b; --blush-line:#3d2740;
    --plum:#c07ec8; --plum-deep:#d9a5de; --plum-soft:#a468ac; --pink:#ff6fae; --pink-deep:#ff8dc0;
    --soft:#b09cb6; --line:rgba(245,233,240,.14); --on-dark:#17121a; --header:#17121a;
  }
  :root[data-theme="light"]{
    --ink:#17121a; --wall:#f7f1f5; --paper:#ffffff; --blush:#fbe7f0; --blush-line:#f3d3e2;
    --plum:#5c2160; --plum-deep:#43164a; --plum-soft:#8b4c90; --pink:#e8458c; --pink-deep:#c92f74;
    --soft:#6b5d70; --line:rgba(23,18,26,.11); --on-dark:#fdf7fa; --header:#17121a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--wall);color:var(--ink);
    font:16px/1.6 'Plex',-apple-system,'Helvetica Neue','PingFang SC',sans-serif}
  .brush{font-family:'Long Cang',cursive;font-weight:400}

  header{background:var(--header);color:#fdf7fa;padding:34px 20px 30px;text-align:center;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
    background:linear-gradient(90deg,var(--plum),var(--pink))}
  header h1{margin:0;font-size:clamp(52px,14vw,80px);line-height:1;letter-spacing:.04em}
  header .sub{margin:6px 0 0;font-size:15px;letter-spacing:.03em;color:#f0d6e3}
  header .where{margin:5px 0 0;font-size:13px;color:#b79cab}
  header .dot{color:var(--pink)}

  nav.tabs{display:flex;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav.tabs button{flex:1;padding:15px 8px;border:none;background:none;font:600 14px/1 inherit;
    letter-spacing:.04em;color:var(--soft);cursor:pointer;position:relative}
  nav.tabs button.on{color:var(--plum)}
  nav.tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;
    border-radius:3px 3px 0 0;background:var(--pink)}

  main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
  .day{margin:26px 0 10px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}

  .cls{background:var(--paper);border-radius:var(--radius);padding:15px 16px;margin-bottom:11px;
    display:flex;gap:14px;align-items:center;border:1px solid var(--line)}
  .cls .t{font:600 21px/1 inherit;font-variant-numeric:tabular-nums;letter-spacing:.02em;
    color:var(--plum);min-width:62px}
  .cls .b{flex:1;min-width:0}
  .cls .n{font-weight:600;font-size:15.5px}
  .cls .m{font-size:13px;color:var(--soft);margin-top:1px}
  .cls .seats{font-size:12.5px;font-weight:600;color:var(--pink);margin-top:3px}
  /* pink is for scarcity; an empty class is just information */
  .cls .seats.quiet{color:var(--soft);font-weight:400}
  .cls.full{opacity:.45}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    background:var(--blush);color:var(--plum);border-radius:999px;padding:3px 9px;margin-left:6px}

  .btn{background:var(--plum);color:var(--on-dark);border:none;border-radius:8px;padding:11px 22px;
    font:600 14px/1 inherit;letter-spacing:.05em;cursor:pointer;transition:background .18s}
  .btn:hover{background:var(--plum-deep)}
  .btn.pink{background:var(--pink)}
  .btn.pink:hover{background:var(--pink-deep)}
  .btn.ghost{background:transparent;color:var(--plum);border:1px solid var(--line)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}

  .pkg{background:var(--paper);border-radius:var(--radius);padding:18px;margin-bottom:13px;border:1px solid var(--line)}
  .pkg.feature{background:var(--blush);border-color:var(--blush-line)}
  .pkg h3{margin:0 0 2px;font-family:'Long Cang',cursive;font-weight:400;font-size:27px;line-height:1.2;color:var(--ink)}
  .pkg .price{font-family:'Long Cang',cursive;font-size:42px;line-height:1.05;color:var(--pink)}
  .pkg .fee{font-size:12.5px;color:var(--soft);margin-top:2px}
  .pkg ul{margin:10px 0 15px;padding-left:17px;font-size:13.5px;color:var(--soft)}
  .pkg li{margin:3px 0}
  .note{font-size:13.5px;color:var(--soft);line-height:1.65}

  dialog{border:none;border-radius:12px;padding:22px;max-width:410px;width:92%;
    background:var(--paper);color:var(--ink);box-shadow:0 24px 60px rgba(23,18,26,.3)}
  dialog::backdrop{background:rgba(23,18,26,.55)}
  dialog h3{margin:0 0 14px;font-family:'Long Cang',cursive;font-weight:400;font-size:28px;line-height:1.2}
  label{display:block;font-size:12.5px;color:var(--soft);margin:11px 0 4px}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px;
    font-family:inherit;background:var(--wall);color:var(--ink)}
  input:focus{outline:2px solid var(--pink);outline-offset:1px}
  .msg{padding:12px 14px;border-radius:8px;margin-top:12px;font-size:14px}
  .msg.ok{background:var(--blush);color:var(--plum)}
  .msg.bad{background:#fdeaea;color:#a33}
  footer{text-align:center;color:var(--soft);font-size:12.5px;padding:26px 16px 44px}
  footer .brush{font-size:19px;color:var(--plum);display:block;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <h1 class="brush">AYBKK</h1>
  <p class="sub">Ashtanga Yoga Center of Bangkok</p>
  <p class="where">Mysore &amp; Led, seven days a week <span class="dot">·</span> S31 Hotel, Sukhumvit 31</p>
</header>

<nav class="tabs">
  <button id="t-schedule" class="on" onclick="tab('schedule')">Timetable</button>
  <button id="t-packages" onclick="tab('packages')">Packages</button>
  <button id="t-me" onclick="tab('me')">My pass</button>
</nav>

<main id="view"><p class="note">Loading…</p></main>
<footer><span class="brush">AYBKK</span>Ashtanga Yoga Center of Bangkok · S31 Hotel, Sukhumvit 31</footer>

<dialog id="dlg"><div id="dlgIn"></div></dialog>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const baht = n => '฿' + Number(n).toLocaleString('en-US');
  let CLASSES = [], PRODUCTS = [], SURCHARGE = 0;
  const myCode = () => localStorage.getItem('aybkk_member') || '';

  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const fmtDay = iso => {
    const d = new Date(iso);
    return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' +
      ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  };
  const fmtTime = iso => new Date(iso).toLocaleTimeString('en-GB',
    { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' });

  let current = 'schedule';
  window.tab = t => {
    current = t;
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.id === 't' + '-' + t));
    if (t === 'schedule') renderSchedule();
    if (t === 'packages') renderPackages();
    if (t === 'me') renderMe();
  };

  async function load() {
    try {
      const [s, p] = await Promise.all([
        fetch('/api/bkk/schedule?days=14').then(r => r.json()),
        fetch('/api/bkk/products').then(r => r.json()),
      ]);
      CLASSES = s.classes || [];
      PRODUCTS = p.products || [];
      SURCHARGE = p.surchargePct || 0;
      tab(current);
    } catch (e) {
      $('#view').innerHTML = '<p class="msg bad">Could not load. Please refresh.</p>';
    }
  }

  function renderSchedule() {
    if (!CLASSES.length) { $('#view').innerHTML = '<p class="note">No classes scheduled.</p>'; return; }
    let html = '', lastDay = '';
    for (const c of CLASSES) {
      const day = fmtDay(c.startAt);
      if (day !== lastDay) { html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
      const full = c.seatsLeft < 1;
      html += `<div class="cls ${full ? 'full' : ''}">
        <div class="t">${fmtTime(c.startAt)}</div>
        <div class="b">
          <div class="n">${esc(c.title)}${c.isOnline ? '<span class="pill">online</span>' : ''}</div>
          <div class="m">${c.durationMin} min${c.teachers ? ' · ' + esc(c.teachers) : ''}</div>
          <div class="seats ${c.booked ? '' : 'quiet'}">${
            full ? 'Class full'
            : c.booked ? c.seatsLeft + ' places left'
            : c.capacity + ' places'   /* nothing booked yet — "42 left" reads odd */
          }</div>
        </div>
        <button class="btn" ${full ? 'disabled' : ''} onclick="book(${c.slotId},'${c.date}')">Book</button>
      </div>`;
    }
    $('#view').innerHTML = html;
  }

  function renderPackages() {
    const html = PRODUCTS.map(p => {
      const lines = p.kind === 'unlimited'
        ? [`Unlimited classes for ${p.valid_days} days`, `${p.daily_cap} class bookings per day`]
        : [`${p.credits} class credit${p.credits > 1 ? 's' : ''}`,
           `Valid ${p.valid_days} day${p.valid_days > 1 ? 's' : ''} from your first booking`];
      return `<div class="pkg ${p.kind === 'unlimited' ? 'feature' : ''}">
        <h3>${esc(p.name_en)}</h3>
        <div class="price">${baht(p.total_thb)}</div>
        <div class="fee">${baht(p.price_thb)} + ${SURCHARGE}% online payment fee</div>
        <ul>${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
        <button class="btn pink" onclick="buy('${esc(p.code)}')">Buy</button>
      </div>`;
    }).join('');
    $('#view').innerHTML = html + `<p class="note">Classes are at AYBKK, S31 Hotel.
      Every student books a class and checks in before practice.
      Cancel at least 5 hours before class to keep your credit.</p>`;
  }

  async function renderMe() {
    const code = myCode();
    if (!code) {
      $('#view').innerHTML = `<p class="note">You have no pass on this device yet.</p>
        <p class="note">Buy a package, or enter your member code:</p>
        <label>Member code</label><input id="mc" placeholder="B…">
        <p><button class="btn" onclick="linkCode()">Find my pass</button></p>`;
      return;
    }
    try {
      const d = await fetch('/api/bkk/me/' + encodeURIComponent(code)).then(r => r.json());
      if (d.error) throw new Error(d.error);
      const passes = (d.passes || []).map(p => `<div class="pkg">
        <h3>${esc(p.name)}</h3>
        <div class="note">${p.kind === 'unlimited'
          ? 'Unlimited · ' + p.dailyCap + ' bookings per day'
          : (p.creditsLeft ?? 0) + ' classes left'}</div>
        <div class="note">${p.validUntil ? 'Valid until ' + p.validUntil
          : 'Starts when you book your first class'}</div>
      </div>`).join('') || '<p class="note">No pass yet.</p>';
      const bookings = (d.bookings || []).map(b => `<div class="cls">
        <div class="t">${fmtTime(b.start_at)}</div>
        <div class="b"><div class="n">${esc(b.title)}</div>
          <div class="m">${fmtDay(b.start_at)}</div></div>
        <button class="btn ghost" onclick="cancelBooking(${b.id})">Cancel</button>
      </div>`).join('') || '<p class="note">No upcoming classes booked.</p>';
      $('#view').innerHTML = `<p class="note">Member <b>${esc(d.member.code)}</b> · ${esc(d.member.name)}</p>
        <div class="day">Your pass</div>${passes}
        <div class="day">Upcoming classes</div>${bookings}`;
    } catch (e) {
      $('#view').innerHTML = `<p class="msg bad">${esc(e.message)}</p>`;
    }
  }

  window.linkCode = () => {
    const v = $('#mc').value.trim();
    if (v) { localStorage.setItem('aybkk_member', v); renderMe(); }
  };

  window.buy = (code) => {
    const p = PRODUCTS.find(x => x.code === code);
    if (!p) return;
    $('#dlgIn').innerHTML = `<h3>${esc(p.name_en)} · ${baht(p.total_thb)}</h3>
      <label>Your name</label><input id="bn" autocomplete="name">
      <label>Email</label><input id="be" type="email" autocomplete="email">
      <label>Phone (optional)</label><input id="bp" autocomplete="tel">
      <div id="bmsg"></div>
      <p style="margin-top:14px"><button class="btn pink" id="bgo">Continue to payment</button>
      <button class="btn ghost" onclick="document.getElementById('dlg').close()">Cancel</button></p>`;
    $('#dlg').showModal();
    $('#bgo').onclick = async () => {
      const name = $('#bn').value.trim(), email = $('#be').value.trim(), phone = $('#bp').value.trim();
      if (!name || !email) { $('#bmsg').innerHTML = '<div class="msg bad">Name and email are required.</div>'; return; }
      $('#bgo').disabled = true;
      try {
        const r = await fetch('/api/bkk/orders', { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productCode: code, name, email, phone }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'could not create order');
        localStorage.setItem('aybkk_member', j.member.code);
        if (j.pay) {
          // hand off to the gateway's hosted page
          const f = document.createElement('form');
          f.method = 'POST'; f.action = j.pay.action;
          for (const [k, v] of Object.entries(j.pay.fields)) {
            const i = document.createElement('input');
            i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i);
          }
          document.body.appendChild(f); f.submit();
        } else if (j.payLink) {
          $('#bmsg').innerHTML = `<div class="msg ok">
            <b>${esc(j.order.product)} — ฿${j.payLink.amount.toLocaleString()}</b><br>
            Reference <b>#${esc(j.payLink.refno)}</b> · member code <b>${esc(j.member.code)}</b><br>
            <span style="font-size:13px">${esc(j.payLink.note)}</span></div>
            <p style="margin-top:12px"><a class="btn pink" style="display:inline-block;text-decoration:none"
              href="${esc(j.payLink.url)}" target="_blank" rel="noopener">Pay ฿${j.payLink.amount.toLocaleString()}</a></p>`;
          $('#bgo').style.display = 'none';
        } else {
          $('#bmsg').innerHTML = `<div class="msg ok">Order ${esc(j.order.refno)} created.<br>
            ${esc(j.payUnavailable || '')}<br>Your member code is <b>${esc(j.member.code)}</b>.</div>`;
          $('#bgo').disabled = false;
        }
      } catch (e) {
        $('#bmsg').innerHTML = `<div class="msg bad">${esc(e.message)}</div>`;
        $('#bgo').disabled = false;
      }
    };
  };

  window.book = async (slotId, date) => {
    const code = myCode();
    if (!code) { alert('Please buy a package first, or open "My pass" and enter your member code.'); return; }
    try {
      const r = await fetch('/api/bkk/bookings', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ memberCode: code, slotId, date }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      alert('Booked. See you in the shala 🙏');
      load();
    } catch (e) { alert(e.message); }
  };

  window.cancelBooking = async (id) => {
    if (!confirm('Cancel this booking?')) return;
    try {
      const r = await fetch(`/api/bkk/bookings/${id}/cancel`, { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ memberCode: myCode() }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      alert(j.message);
      renderMe();
    } catch (e) { alert(e.message); }
  };

  // returning from the gateway: ?paid=<refno>
  (async () => {
    const m = new URLSearchParams(location.search).get('paid');
    if (m) {
      try {
        const j = await fetch('/api/bkk/pay/check/' + encodeURIComponent(m)).then(r => r.json());
        history.replaceState({}, '', location.pathname);
        if (j.status === 'paid') { current = 'me'; alert('Payment confirmed — your pass is active 🙏'); }
        else alert('We have not seen the payment confirmed yet. It can take a moment; open "My pass" to check.');
      } catch (_) {}
    }
    load();
  })();
})();
</script>
</body>
</html>
