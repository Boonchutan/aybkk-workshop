        ${row(T('progNotes') + `<span class="muted">${who(p.notes.byTeacher)}</span>`, p.notes.today)}
      </table>
      <p class="muted">${T('progAll', p.photos.total, p.photos.students_total, p.notes.total)}</p></div>`;
  }

  async function startBox() {
    const s = await api('/api/bkk/admin/start-stats').then(r => r.json()).catch(() => null);
    if (!s || s.error) return '';
    return `<div class="box"><b>${T('startTitle')}</b>
      ${s.sources.length ? `<table><tr class="muted"><td>${T('startSrc')}</td><td style="text-align:right">${T('startViews')}</td><td style="text-align:right">${T('startTaps')}</td></tr>
        ${s.sources.map(x => `<tr><td>${esc(x.src)}</td><td style="text-align:right">${x.views}</td><td style="text-align:right"><b>${x.taps}</b></td></tr>`).join('')}</table>`
      : `<p class="muted">${T('startNone')}</p>`}</div>`;
  }

  // back: a class or a profile opened from here, to land on the same button again.
  async function renderToday({ back } = {}) {
    const [d, prog0, start] = await Promise.all([api('/api/bkk/admin/today').then(r => r.json()), progressBox(), startBox()]);
    // Another tab was opened while this loaded (Calendar tapped right after unlock).
    if (current !== 'today' || SUB) return;
    const prog = prog0 + start;
    const rows = (d.bookings || []);
    const money = (d.money || []);
    const moneyBox = `<div class="box"><b>${T('moneyToday')}</b>
      ${money.length ? `<table>${money.map(x => `<tr><td>${esc(W(x.method))}</td><td class="muted">${T('sales', x.n)}</td>
        <td><b>฿${(x.total || 0).toLocaleString()}</b></td></tr>`).join('')}</table>
        <p class="muted">${T('countDrawer')}</p>`
      : `<p class="muted">${T('noSales')}</p>`}</div>`;
    // Today's whole timetable, booked or not, so someone who came without
    // booking can be added to any class; names on a class no longer on it still show.
    const groups = (d.classes || []).map(c => ({ slotId: c.slotId, date: c.date, title: c.title, startAt: c.startAt }));
    for (const b of rows) if (!groups.some(g => g.slotId === b.slot_id))
      groups.push({ slotId: b.slot_id, date: bkkYmd(Date.parse(b.start_at)), title: b.title, startAt: b.start_at });
    groups.sort((a, b) => Date.parse(a.startAt) - Date.parse(b.startAt));
    const blocks = groups.map(g => {
      const list = rows.filter(b => b.slot_id === g.slotId);
      const inCount = list.filter(b => b.checked_in_at).length;
      const mats = list.filter(b => b.need_mat).length;
      return `<div class="box"><div class="tdh"><div>
        <b>${time(g.startAt)} · ${esc(cls(g.title))}</b>
        <span class="muted" style="display:block">${T('bookedIn', list.length, inCount)}${mats ? ` · ${esc(T('tMats'))} ${mats}` : ''}</span></div>
        <button class="btn sm" id="open-${g.slotId}" onclick="todayOpen(${g.slotId},'${esc(g.date)}',this.id)">${T('openClass')}</button></div>
        ${list.length ? `<table class="tdl">${list.map(b => `<tr>
          <td class="nm">${whoBtn(b.code, b.name, `who-t-${g.slotId}-${b.code}`)}${b.need_mat ? ` <span class="pill mat">${esc(T('matPill'))}</span>` : ''}</td>
          <td class="muted">${esc(b.code)}</td>
          <td>${b.checked_in_at ? `<span class="in">${T('checkedIn')}</span>` : `<span class="muted">${T('notYet')}</span>`}</td>
        </tr>`).join('')}</table>` : `<p class="muted">${T('rosterNone')}</p>`}</div>`;
    }).join('');
    $('#view').innerHTML = prog + moneyBox
      + (blocks || `<div class="box"><b>${T('today')}</b><p class="muted">${T('noBookings')}</p></div>`);
    if (back) backTo(back);
  }

  // Every Buy on aybkk.net makes an order before the student pays, so leaving the
  // payment page, or trying again, leaves an unpaid order behind (Nov 2026).
  // Old ones, and ones a later payment for the same package replaced, fold away.
  // One sale, one row (15 Nov 2026): Rezerv history sits in its own fold, its ฿0
  // lines counted on the real payment next to them; a sale here says when Rezerv
  // has it too; a row with money here never folds.
  const HOUR = 3600e3;
  let ORD = [], ORD_TOTAL = 0, CHK = {}, TRIES_OPEN = false, RZ_OPEN = false, CHK_ALL = false;
  const ordAt = o => Date.parse(o.created_at) || 0;
  const isRz = o => o.source === 'rezerv';
  const online = o => !isRz(o) && (!o.method || o.method === 'online');
  const unpaid = o => online(o) && (o.status === 'pending' || o.status === 'failed');
  // A drop-in is bought for one class: two drop-ins match only for the same class on the same day.
  const sameClass = (a, b) => (a.slot_id == null && b.slot_id == null)
    || (a.slot_id === b.slot_id && String(a.class_date) === String(b.class_date));
  const samePkg = (a, b) => a.id !== b.id && a.member_id != null && a.member_id === b.member_id
    && a.product_id != null && a.product_id === b.product_id && sameClass(a, b);
  // Across the two systems a package is its name too: Rezerv's old 6 months and ours share one.
  const pkgKey = o => String(o.name_en || o.item_name || '').toLowerCase();
  const crossPkg = (a, b) => a.id !== b.id && a.member_id != null && a.member_id === b.member_id
    && ((a.product_id != null && a.product_id === b.product_id) || (!!pkgKey(a) && pkgKey(a) === pkgKey(b)));
  // One package under two names, as the server's PKG_FAMILY: one sale may sit under either.
  const FAM = { unlim6m: 'unlim6', unlim12m: 'unlim12', pack8m1: 'pack8' };
  const fam = o => o.product_code ? FAM[o.product_code] || o.product_code : '';
  const nearPkg = (a, b) => crossPkg(a, b) || (a.id !== b.id && a.member_id != null && a.member_id === b.member_id
    && !!fam(a) && fam(a) === fam(b));
  // The day the money came in, as the server pairs a sale with its Rezerv copy.
  const payDay = o => bkkYmd(Date.parse(o.verified_at || o.created_at) || 0);
  const payApart = (a, b) => Math.abs(Date.parse(payDay(a)) - Date.parse(payDay(b))) / 864e5;
  const after = (a, b) => ordAt(a) > ordAt(b) || (ordAt(a) === ordAt(b) && a.id > b.id);
  const ordDay = o => bkkYmd(ordAt(o));
  const daysApart = (a, b) => Math.abs(Date.parse(ordDay(a)) - Date.parse(ordDay(b))) / 864e5;
  const paidHere = o => !isRz(o) && o.status === 'paid' && o.amount_thb > 0;
  // "Ana Example" and "example ana." are one name: lower case, no punctuation, words sorted.
  const normName = n => String(n || '').toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu, ' ').split(/\s+/).filter(Boolean).sort().join(' ');
  // Only with the PaySolutions keys does an unpaid order mean "not paid". With a pay.sn
  // link, or no online payment, a student who paid also waits here for staff.
  const gw = () => PAY_MODE === 'gateway';
  function sortOrders(list, now) {
    const ours = list.filter(o => !isRz(o)), rz = list.filter(isRz);
    // Paid, then Buy tapped again for the same thing within 3 days.
    const paidBefore = o => ours.filter(p => p.status === 'paid' && samePkg(p, o) && after(o, p) && ordAt(o) - ordAt(p) <= 72 * HOUR)
      .sort((a, b) => ordAt(b) - ordAt(a))[0];
    // Only the newest unpaid try for a package and class stays out.
    const isTry = o => unpaid(o) && ((gw() && now - ordAt(o) > 24 * HOUR)
      || ours.some(p => (p.status === 'paid' || unpaid(p)) && samePkg(p, o) && after(p, o)) || !!paidBefore(o));
    const tries = ours.filter(isTry), main = ours.filter(o => !isTry(o));
    const triesN = {}, againN = {}, nth = {}, alsoRz = {}, rzLinked = {}, bonusN = {}, sameName = {};
    // Each try is counted once: on the payment it came after, or the nearest order for the same package left in view.
    for (const t of tries) {
      const p = paidBefore(t);
      if (p) { againN[p.id] = (againN[p.id] || 0) + 1; continue; }
      const gap = m => Math.abs(ordAt(m) - ordAt(t));
      const near = main.filter(m => samePkg(m, t) && gap(m) <= 24 * HOUR).sort((a, b) => gap(a) - gap(b))[0];
      if (near) triesN[near.id] = (triesN[near.id] || 0) + 1;
    }
    // Online and desk alike: the 2nd paid row for one package and class in 3 days.
    for (const o of main) if (paidHere(o)) {
      const k = ours.filter(p => paidHere(p) && samePkg(p, o) && after(o, p) && ordAt(o) - ordAt(p) <= 72 * HOUR).length;
      if (k) nth[o.id] = k + 1;
    }
    // The same package (or its family) in Rezerv within 5 days of the payment, as
    // the import pairs them, seen without opening the fold: its own twin always,
    // and any Rezerv line not linked to another sale.
    // Settled (grey) only when every such line is linked to this sale and the server
    // sees no live Rezerv pass for it; a line not linked first, as that is the one to check.
    for (const o of main) if (o.status !== 'void') {
      const gap = x => Math.abs(ordAt(x) - ordAt(o));
      const near = rz.filter(x => x.twin_of === o.id
        || (x.status === 'paid' && x.twin_of == null && nearPkg(x, o) && payApart(x, o) <= 5));
      if (!near.length) continue;
      const open = near.filter(x => x.twin_of !== o.id);
      alsoRz[o.id] = (open.length ? open : near).sort((a, b) => gap(a) - gap(b))[0];
      if (!open.length && !o.rz_pass) rzLinked[o.id] = true;
    }
    // In the fold, a ฿0 line goes onto the same person's nearest Rezerv payment within 3 days.
    const rzPaid = rz.filter(x => x.status === 'paid' && x.amount_thb > 0), rzRows = [];
    for (const x of rz) {
      const gap = p => Math.abs(ordAt(p) - ordAt(x));
      const near = x.status === 'paid' && x.amount_thb === 0
        && rzPaid.filter(p => p.member_id != null && p.member_id === x.member_id && daysApart(p, x) <= 3).sort((a, b) => gap(a) - gap(b))[0];
      if (near) bonusN[near.id] = (bonusN[near.id] || 0) + 1;
      else rzRows.push(x);
    }
    const codes = new Map();
    for (const o of list) {
      const k = normName(o.member_name);
      if (!k || !o.member_code) continue;
      if (!codes.has(k)) codes.set(k, new Set());
      codes.get(k).add(o.member_code);
    }
    for (const o of list) {
      const c = codes.get(normName(o.member_name));
      if (c && c.size > 1) sameName[o.id] = [...c].filter(x => x !== o.member_code).join(', ');
    }
    return { main, tries, rz: rzRows, rzAll: rz.length, triesN, againN, nth, alsoRz, rzLinked, bonusN, sameName };
  }
  // The class a drop-in was bought for, and the day of it; what Rezerv called a line it named otherwise.
  const dayShort = (d, weekday) => ymdLong(d, weekday, String(d).slice(0, 4) === bkkYmd().slice(0, 4));
  const ordClass = o => o.class_title ? [cls(o.class_title), o.class_day ? dayShort(o.class_day, true) : ''].filter(Boolean).join(' · ')
    : isRz(o) && o.item_name && o.item_name.toLowerCase() !== pkgKey(o) ? o.item_name : '';
  const ordPill = o => gw() && online(o) && o.status === 'pending' ? T('notPaidYet')
    : o.status === 'paid' && o.amount_thb === 0 ? '฿0'
    : (STR[LANG].ordPill || {})[o.status] || W(o.status);
  const byHand = o => /^MANUAL ACTIVATION/.test(o.gateway_note || '');
  const chkCls = c => 'chk' + (c && c.kind ? ' ' + c.kind : '');
  const chkInner = c => c ? esc(c.text) + (c.raw ? `<small>${esc(c.raw)}</small>` : '') : '';
  const ordWhen = o => { const d = ordDay(o); return `${d.slice(0, 4) === bkkYmd().slice(0, 4) ? d.slice(5) : d} ${time(o.created_at)}`; };
  const ordRow = (o, s) => {
    const rz = s.alsoRz[o.id];
    const notes = [s.triesN[o.id] && T('nTries', s.triesN[o.id]), s.againN[o.id] && T('nAgain', s.againN[o.id]),
      s.nth[o.id] && [T('nthPay', s.nth[o.id]), true],
      rz && [T(s.rzLinked[o.id] ? 'alsoRzLinked' : 'alsoRz', dayShort(ordDay(rz)), baht(rz.amount_thb)), !s.rzLinked[o.id]],
      s.bonusN[o.id] && T('nBonus', s.bonusN[o.id]), s.sameName[o.id] && [T('sameName', s.sameName[o.id]), true]]
      .filter(Boolean).map(n => Array.isArray(n) ? n : [n, false]);
    const zero = o.status === 'paid' && o.amount_thb === 0, cl = ordClass(o);
    // A twin's note starts with the ref it copies, which the line above it says already.
    const note = o.status === 'twin' ? String(o.gateway_note || '').split(' | ').slice(1).join(' | ') : String(o.gateway_note || '');
    // A void row says why, first and whole, in the page's language.
    const said = () => {
      if (o.status !== 'void') return note.slice(0, 60);
      const first = note.split(' | ')[0], v = first.match(/^Void: (.*) \(by staff, (\d{4}-\d{2}-\d{2})\)$/),
        b = first.match(/^same Rezerv payment as order (\d+), imported twice$/);
      return (v ? T('voidNote', v[1], v[2]) : b ? T('rzTwice', b[1]) : first).slice(0, 160);
    };
    return `<tr>
      <td>${o.member_code ? whoBtn(o.member_code, o.member_name, 'who-' + o.id) : `<b>${esc(o.member_name || '–')}</b>`}<br><span class="muted">${esc(o.email || '')}<br>${esc(o.member_code)}</span>
        ${notes.map(([n, w]) => `<span class="onote${w ? ' warn' : ''}">${esc(n)}</span>`).join('')}</td>
      <td>${esc(pkgName(o))}${cl ? `<span class="onote">${esc(cl)}</span>` : '<br>'}<b${o.status === 'void' ? ' class="gone"' : ''}>฿${o.amount_thb.toLocaleString()}</b>
        <br><span class="muted">${o.base_thb.toLocaleString()} + ${T('fee')} ${o.fee_thb.toLocaleString()} + ${T('vat')} ${(o.vat_thb || 0).toLocaleString()}</span></td>
      <td><span class="pill ${zero ? 'zero' : esc(o.status)}">${esc(ordPill(o))}</span> <span class="muted">${esc(W(o.method || 'online'))}</span>${isRz(o) ? ' <span class="badge">Rezerv</span>' : ''}<br>
        <span class="muted">${o.created_at ? ordWhen(o) : ''}</span>
        ${byHand(o) && o.status === 'paid' ? `<br><span class="pill hand">${esc(T('byHand'))}</span>` : ''}
        ${o.status === 'twin' && o.twin_refno ? `<span class="onote">${esc(T('twinOf', o.twin_refno))}</span>` : ''}
        ${note ? `<span class="onote">${esc(said())}</span>` : ''}
        <span class="${chkCls(CHK[o.id])}" id="chk-${o.id}" role="status">${chkInner(CHK[o.id])}</span></td>
      <td class="muted ref" data-l="${esc(T('thRef'))}" style="word-break:break-all;font-size:12px">${o.refno}</td>
      <td><div class="ordact">${[gw() && unpaid(o) && `<button class="btn sm" id="chkb-${o.id}" onclick="chkPay(${o.id})">${T('chkPay')}</button>`,
        ['pending', 'failed', 'mismatch'].includes(o.status) && !isRz(o) && `<button class="btn red" onclick="force(${o.id})">${T('activate')}</button>`]
        .filter(Boolean).join('')}</div></td>
    </tr>`;
  };
  const ordTable = rows => `<div style="overflow-x:auto"><table class="ord"><tr><th>${T('thStudent')}</th><th>${T('thPackage')}</th><th>${T('thStatus')}</th><th>${T('thRef')}</th><th></th></tr>
      ${rows}</table></div>`;

  // flash: { text, warn } to show above the list. keep: the notes from Check payment stay.
  // show: an order to bring into view (a paid one leaves the fold). back: the spot to return
  // to from a student's profile.
  async function renderOrders({ flash, keep, show, back } = {}) {
    await loadThNames();
    const d = await api('/api/bkk/admin/orders').then(r => r.json());
    if (current !== 'orders' || SUB) return;
    if (!keep) CHK = {};
    ORD = d.orders || [];
    ORD_TOTAL = d.total || ORD.length;
    const now = Date.now(), s = sortOrders(ORD, now);
    const fresh = gw() ? ORD.filter(o => online(o) && o.status === 'pending' && now - ordAt(o) < 72 * HOUR).length : 0;
    $('#view').innerHTML = `<div class="box"><b>${T('payments')}</b>
      <button class="btn gray rfr" style="float:right" onclick="tab('orders')" aria-label="${esc(T('reload'))}">↻</button>
      ${ORD_TOTAL > ORD.length ? `<br><span class="muted">${esc(T('ordNewest', ORD.length.toLocaleString(), ORD_TOTAL.toLocaleString()))}</span>` : ''}
      ${fresh ? `<p><button class="btn sm" id="chkAll" onclick="chkAll()">${T('chkAll')}</button>
        <span class="muted" id="chkAllMsg" role="status"></span></p>` : ''}
      ${flash ? `<div class="flash${flash.warn ? ' warn' : ''}" role="status">${esc(flash.text)}</div>` : ''}
      ${s.main.length ? ordTable(s.main.map(o => ordRow(o, s)).join(''))
        : s.tries.length || s.rzAll ? '' : ordTable(`<tr><td class="muted">${T('noOrders')}</td></tr>`)}
      ${s.tries.length ? `<details class="tries" id="tries"${TRIES_OPEN ? ' open' : ''}>
        <summary>${esc(T('triesH', s.tries.length))}<span class="muted">${esc(T(gw() ? 'triesSub' : 'triesSubLink'))}</span></summary>
        ${ordTable(s.tries.map(o => ordRow(o, s)).join(''))}</details>` : ''}
      ${s.rzAll ? `<details class="tries" id="rzFold"${RZ_OPEN ? ' open' : ''}>
        <summary>${esc(T('rzH', s.rzAll))}<span class="muted">${esc(T('rzHelp'))}</span></summary>
        ${ordTable(s.rz.map(o => ordRow(o, s)).join(''))}</details>` : ''}
      <p class="muted">${T(gw() ? 'ordersHelp' : 'ordersHelpLink')}</p></div>`;
    const f = $('#tries');
    if (f) f.addEventListener('toggle', () => { TRIES_OPEN = f.open; });
    const z = $('#rzFold');
    if (z) z.addEventListener('toggle', () => { RZ_OPEN = z.open; });
    const who = id => id && document.getElementById(id);
    if (back) backTo(back);
    const c = show && $(`#chk-${show}`), tr = c && c.closest('tr');
    if (tr) {
      const r = tr.getBoundingClientRect();
      if (r.top < 0 || r.bottom > innerHeight) tr.scrollIntoView({ block: 'center' });
      if (who('who-' + show)) who('who-' + show).focus({ preventScroll: true });
    }
  }

  // The same check the student's browser makes on the way back from paying: it
  // asks PaySolutions, and turns the pass on only for a paid, matching amount.
  // The words are for staff; the raw answer stays under them, small, for whoever fixes it.
  async function payCheck(o) {
    const b = $(`#chkb-${o.id}`);
    if (b) { b.disabled = true; b.textContent = T('chkWait'); }
    const r = await fetch('/api/bkk/pay/check/' + encodeURIComponent(o.refno)).catch(() => null);
    const j = r ? await r.json().catch(() => ({})) : {};
    const st = r && r.ok ? j.status : null, note = String(j.note || '');
    const c = CHK[o.id] = !st ? { text: T('chkErr'), raw: j.error || (r ? `http ${r.status}` : '') }
      : st === 'paid' ? { text: T('chkPaid'), kind: 'ok' }
      : st === 'mismatch' ? { text: T('chkMismatch'), kind: 'warn' }
      : st === 'unknown' ? { text: T('chkUnknown') }
      : note === 'gateway not configured' ? { text: T('chkNoGw') }
      // A refused key also comes back "not paid": only the HTTP code tells them apart.
      : /\b(http|inquiry) 40[13]\b/.test(note) ? { text: T('chkKey'), raw: note }
      // No answer (timeout, network) or a server error is not "not paid".
      : /^inquiry failed:|\b(http|inquiry) (?!200\b)\d{3}\b/.test(note) ? { text: T('chkErr'), raw: note }
      : { text: T('chkNot'), raw: note };
    const out = $(`#chk-${o.id}`);
    if (out) { out.className = chkCls(c); out.innerHTML = chkInner(c); }
    if (b) { b.disabled = false; b.textContent = T('chkPay'); }
    return st;
  }
  const stillHere = () => current === 'orders' && !SUB;
  window.chkPay = async id => {
    const o = ORD.find(x => x.id === id);
    if (!o) return;
    const st = await payCheck(o);
    // Paid or wrong amount moves the row (out of the fold, too): draw again and bring it into view.
    if (stillHere() && (st === 'paid' || st === 'mismatch')) renderOrders({ keep: true, show: id });
  };
  window.chkAll = async () => {
    if (CHK_ALL) return;
    CHK_ALL = true;
    const list = gw() ? ORD.filter(o => online(o) && o.status === 'pending' && Date.now() - ordAt(o) < 72 * HOUR) : [];
    let paid = 0, moved = false;
    try {
      for (const [i, o] of list.entries()) {
        if (!stillHere()) return;
        const b = $('#chkAll');
        if (b) { b.disabled = true; b.textContent = T('chkAllWait', i + 1, list.length); }
        const st = await payCheck(o);
        if (st === 'paid') paid++;
        if (st === 'paid' || st === 'mismatch') moved = true;
      }
    } finally { CHK_ALL = false; }
    if (!stillHere()) return;
    const text = T('chkAllDone', list.length, paid);
    if (moved) { renderOrders({ keep: true, flash: { text } }); return; }
    const b = $('#chkAll');
    if (b) { b.disabled = false; b.textContent = T('chkAll'); }
    if ($('#chkAllMsg')) $('#chkAllMsg').textContent = text;
  };

  // A try whose package the student already paid for: the server names that payment, and staff say yes once more.
  const whenPaid = at => at ? `${dayShort(bkkYmd(Date.parse(at)))} ${time(at)}` : '';
  window.force = async (id) => {
    if (!confirm(T('qActivate'))) return;
    let r = await api(`/api/bkk/admin/orders/${id}/force-activate`, { method: 'POST', body: '{}' });
    let j = await r.json().catch(() => ({}));
    if (r.status === 409 && j.paidAlready) {
      const p = j.paidAlready;
      if (!confirm(T('qPaidAlready', whenPaid(p.at), p.refno, W(p.method || 'online')))) return;
      r = await api(`/api/bkk/admin/orders/${id}/force-activate`, { method: 'POST', body: JSON.stringify({ confirm: true }) });
      j = await r.json().catch(() => ({}));
    }
    if (!r.ok) alert(j.error || T('failed'));
    // A drop-in bought for a class that was cancelled or over by now: the pass
    // is live but nobody is on the list, and this list does not show the class.
    else if (j.bookingError) alert(T('activatedNoClass', j.bookingError));
    renderOrders({ keep: true, show: r.ok ? id : null });
  };

  // ── shared by history, reports and the import ─────────────────────────────
  const baht = n => (n < 0 ? '-' : '') + '฿' + Math.abs(Number(n) || 0).toLocaleString('en-US');
  const bkkYmd = (ms = Date.now()) => new Date(ms + 7 * 3600e3).toISOString().slice(0, 10);
  const ymdLong = (ymd, weekday, noYear) => {
    if (!ymd) return '';
    try {
      return new Date(ymd + 'T12:00:00+07:00').toLocaleDateString(locale(), { timeZone: 'Asia/Bangkok',
        ...(weekday ? { weekday: 'short' } : {}), day: 'numeric', month: 'short', ...(noYear ? {} : { year: 'numeric' }) });
    } catch { return ymd; }
  };
  const tile = (label, val, sub) =>
    `<div class="tile"><span>${esc(label)}</span><b>${esc(val)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  // heads: [label, 'n' for a number column]; wide tables scroll sideways on a phone.
  const tbl = (heads, rows, empty, wide) => rows.length
    ? `<div class="scroll ${wide ? 'wide' : ''}"><table><tr>${heads.map(h => `<th class="${h[1] || ''}">${esc(h[0])}</th>`).join('')}</tr>
      ${rows.join('')}</table></div>`
    : `<p class="muted">${esc(empty || T('noneYet'))}</p>`;
  const saveBlob = (blob, name) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  // The key travels in a header, so a download is a fetch, not a plain link.
  const csvDownload = async (what, qs) => {
    const r = await api(`/api/bkk/admin/export/${what}.csv?${new URLSearchParams(qs)}`).catch(() => null);
    if (!r || !r.ok) { const j = r ? await r.json().catch(() => ({})) : {}; alert(j.error || T('failed')); return; }
    const name = ((r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/) || [])[1] || `aybkk-${what}.csv`;
    saveBlob(await r.blob(), name);
  };
  const histBtn = code => `<button class="btn sm" onclick="showHistory('${esc(code)}')">${T('histBtn')}</button>`;
  // A student's name opens their profile. id: Back finds the same name again.
  const whoBtn = (code, name, id) => `<button class="link who" id="${esc(id)}" data-code="${esc(code)}"
    onclick="showHistory(this.dataset.code, this.id)">${esc(name || code)}</button>`;
  // Back lands where staff left: on the same button, at the same height on screen.
  const backTo = f => {
    const b = f && f.who && document.getElementById(f.who);
    window.scrollTo(0, b && f.top != null ? window.scrollY + b.getBoundingClientRect().top - f.top : (f && f.y) || 0);
    if (b) b.focus({ preventScroll: true });
  };

  // ── one student, all of it ────────────────────────────────────────────────
  let HIST = null, HIST_FROM = null, HIST_SEQ = 0, HIST_ALL = {};
  const HIST_ROWS = 60;
  const backBtn = () => `<button class="btn gray sm back" onclick="histBack()">${T('back')}</button>`;
  // from: the id of the button that opened it, so Back lands on the same row (Payments).
  window.showHistory = async (code, from) => {
    const seq = ++HIST_SEQ;
    const fromEl = from && document.getElementById(from);
    if (SUB !== 'history') HIST_FROM = { tab: current, term: current === 'students' && $('#q') ? $('#q').value.trim() : '',
      cls: SUB === 'class' ? CV.ref : null, y: window.scrollY, who: fromEl ? from : null,
      top: fromEl ? fromEl.getBoundingClientRect().top : null };
    SUB = 'history'; HIST = null; HIST_ALL = {};
    $('#view').innerHTML = `<p>${backBtn()}</p><p class="muted">${T('loadingTxt')}</p>`;
    window.scrollTo(0, 0);
    await loadThNames();
    const r = await api(`/api/bkk/admin/members/${encodeURIComponent(code)}/history`).catch(() => null);
    const j = r ? await r.json().catch(() => ({})) : {};
    if (seq !== HIST_SEQ || SUB !== 'history') return;
    if (!r || !r.ok) { $('#view').innerHTML = `<p>${backBtn()}</p><div class="box">${esc(j.error || T('failed'))}</div>`; return; }
    HIST = j;
    paintHistory();
  };
  window.histBack = () => {

    if (f.cls) { SUB = 'class'; CV.ref = f.cls; CV.back = f; loadClass(true); return; }
    if (f.tab === 'students') renderStudents(f.term, f);
    else if (f.tab === 'reports') { REP.back = f; renderReports(true); }
    else if (f.tab === 'orders') renderOrders({ keep: true, back: f });
    else if (f.tab === 'today') renderToday({ back: f });
    else tab(f.tab);
  };
  window.histMore = k => { HIST_ALL[k] = true; paintHistory(); };
  // Take a Rezerv class they came to from their aybkk.net pass, or undo that
  // (16 Nov 2026). A dry run first, so the question names the pass, what is
  // left and anything to check in Rezerv; then the same pass is sent.
  window.ontoPass = async (id, undo = false) => {
    const v = HIST && HIST.visits.find(x => Number(x.id) === id);
    if (!v) return;
    const send = body => api(`/api/bkk/admin/bookings/${id}/onto-pass`, { method: 'POST',
      body: JSON.stringify({ undo, ...body }) }).catch(() => null);
    const left = p => p.kind === 'unlimited' ? null : p.creditsLeft;
    const pname = p => itemName((LANG === 'th' && p.nameTh) || p.name || '–');
    const day = d => d ? ymdLong(d) : '…';
    const when = [ymdLong(v.date, true), v.time].filter(Boolean).join(' '), c = cls(v.class || '');
    const r1 = await send({ dryRun: true });
    if (!r1) { alert(T('addNoNet')); return; }
    const j1 = await r1.json().catch(() => ({}));
    if (!r1.ok) { alert(j1.notBegun ? T('ontoNotBegun', j1.notBegun === true ? null : day(j1.notBegun)) : j1.error || T('failed')); return; }
    const k = j1.check;
    const q = [undo ? T('ontoUndoQ', c, when, pname(j1.pass), left(j1.pass)) : T('ontoQ', c, when, pname(j1.pass), left(j1.pass)),
      !k ? '' : k.why === 'rezerv' ? T('ontoRz', itemName(k.name), day(k.from), day(k.until))
        : T('ontoCopy', k.classes, day(k.on), k.same ? null : itemName(k.pass))];
    if (!confirm(q.filter(Boolean).join('\n\n'))) return;
    const r2 = await send(undo ? {} : { passId: j1.pass.id, sure: !!j1.needSure });
    if (!r2) { alert(T('addNoNet')); return; }
    const j2 = await shout(r2);
    if (!j2) return;
    alert(T('ontoDone', pname(j2.pass), left(j2.pass)));
    const code = HIST.member.code, seq = ++HIST_SEQ, y = window.scrollY;
    const r = await api(`/api/bkk/admin/members/${encodeURIComponent(code)}/history`).catch(() => null);
    const j = r ? await r.json().catch(() => ({})) : {};
    if (seq !== HIST_SEQ || SUB !== 'history') return;
    if (!r || !r.ok) { alert(j.error || T('failed')); return; }
    HIST = j; paintHistory(); window.scrollTo(0, y);
  };
  window.histCsv = what => { if (HIST) csvDownload(what, { member: HIST.member.code }); };

  // What they can use today, first thing on the profile (Nov 2026): each pass
  // valid today, then one paused, then one that starts later, as the server
  // lists them (h.membership), each with its dates and how they came on it;
  // then the classes they have booked. No pass valid today says so in red.
  function nowBox(h) {
    const name = p => esc((LANG === 'th' && (p.nameTh || TH_BY_EN[p.name])) || p.name || '–');
    // A day in the last 300 needs no year: "last came Fri 13 Nov" can only be the one just gone.
    const recent = bkkYmd(Date.now() - 300 * 864e5);
    // Each part stays whole, so a phone breaks the line between parts, not inside one.
    const line = (parts, c = '') => { const p = parts.filter(Boolean);
      return p.length ? `<span class="l${c}">${p.map((x, i) => `<span>${i ? '<i>· </i>' : ''}${esc(x)}</span>`).join(' ')}</span>` : ''; };
    const pass = p => `<div class="np"><b>${name(p)}</b>${
      p.state === 'frozen' ? `<span class="pill frozen">${esc(T('nowFrozen', p.frozenUntil ? ymdLong(p.frozenUntil) : ''))}</span>`
      : p.state === 'starts' ? `<span class="pill upcoming">${esc(T('nowStarts', ymdLong(p.validFrom)))}</span>` : ''}${
      line(p.state === 'firstClass' ? [T('nowFirst')] : [
        p.state !== 'starts' && p.validFrom ? T(p.started ? 'nowStarted' : 'nowStarts', ymdLong(p.validFrom)) : '',
        p.validUntil ? T('tUntil', ymdLong(p.validUntil)) : '',
        p.state === 'active' && p.daysLeft != null ? T('nowDays', p.daysLeft) : ''])}${
      p.kind !== 'unlimited' ? line([T('nowUsed', p.creditsDone, p.creditsTotal),
        p.creditsBooked ? T('nowBooked', p.creditsBooked) : '', T('tLeftN', p.creditsLeft)]) : ''}${
      !p.started ? '' : !p.cameDays ? line([T('nowCame0')]) : line([T('nowCame', p.cameDays),
        p.cameOnline ? T('nowOnline', p.cameOnline) : '', p.perWeek ? T('nowWeek', p.perWeek) : '',
        T('nowCame28', p.cameLast28), T('nowLast', ymdLong(p.lastCame, true, p.lastCame > recent))])}${
      p.endsSoonCameLittle ? line([T('nowEndsLow')], ' nt') : ''}</div>`;
    const list = h.membership || [], next = h.nextBookings || [];
    const none = !list.some(p => p.state === 'active' || p.state === 'firstClass');
    // The coming days need no year, so when and class fit side by side on a phone.
    const row = v => `<span>${esc([ymdLong(v.date, true, true), v.time].filter(Boolean).join(' · '))}</span><span>${esc(cls(v.class || ''))}${
      v.onNow ? ` <span class="pill upcoming">${esc(T('nowOn'))}</span>` : ''}${v.cover === 'rezerv' ? ' <span class="muted">Rezerv</span>' : ''}</span>`;
    return `<div class="now${none ? ' none' : ''}"><h3>${esc(T('nowH'))}</h3>${list.map(pass).join('')}
      ${none ? `<p class="no">${esc(T('nowNone'))}</p><p class="muted">${esc(T('nowNoneHint'))}</p>` : ''}
      <h3>${esc(T('nowNextH'))}</h3>${next.length ? `<div class="nbs">${next.map(row).join('')}</div>`
        : `<p class="muted">${esc(T('nowNoBook'))}</p>`}
      ${h.nextBookingsMore ? `<p class="muted">${esc(T('nowMoreBook', h.nextBookingsMore))}</p>` : ''}</div>`;
  }

  function paintHistory() {
    const h = HIST, m = h.member, s = h.summary;
    const more = (k, list) => !HIST_ALL[k] && list.length > HIST_ROWS
      ? `<p><button class="btn gray sm" onclick="histMore('${k}')">${T('showAll', list.length.toLocaleString())}</button></p>` : '';
    const cut = (k, list) => HIST_ALL[k] ? list : list.slice(0, HIST_ROWS);
    const about = [m.source === 'rezerv' ? T('hRezerv') : T('hHere'), m.rezervId ? T('hRezervId', m.rezervId) : '',
      m.joinedOn ? T('hJoined', ymdLong(m.joinedOn)) : '', m.createdAt ? T('hSince', ymdLong(bkkYmd(Date.parse(m.createdAt)))) : ''];
    const head = `<div class="box hhead">${backBtn()}
      <h2>${esc(m.name)}</h2>
      <div class="muted">${[m.code, m.email, m.phone].filter(Boolean).map(esc).join(' · ')}</div>
      ${nowBox(h)}
      <div class="muted">${about.filter(Boolean).map(esc).join(' · ')}</div>
      <div class="tiles">
        ${tile(T('tCame'), s.visits.toLocaleString(), s.firstVisit ? T('tFirst', ymdLong(s.firstVisit)) : '')}
        ${tile(T('tLastVisit'), s.lastVisit ? ymdLong(s.lastVisit, true) : T('tNever'))}
        ${tile(T('tLast30'), String(s.visitsLast30), T('tLast90', s.visitsLast90))}
        ${tile(T('tPaid'), baht(s.totalPaid), T('tPayN', s.payments))}
        ${tile(T('tMissed'), `${s.noShows} · ${s.cancellations}`, T('tPhotos', h.photos))}
      </div>
      <p>${['visits', 'payments'].map(w => `<button class="btn gray sm" onclick="histCsv('${w}')">${T('csv_' + w)}</button>`).join(' ')}</p>
    </div>`;

    // A past "booked" that never got a check-in reads differently from one still to come.
    const vState = v => v.status === 'booked' ? (v.upcoming ? 'upcoming' : 'past') : v.status;
    // A Rezerv visit they came to while an aybkk.net pass of theirs, begun, with
    // a class left, ran. The server checks pauses and the rest.
    const passFor = d => h.passes.some(p => p.source !== 'rezerv' && (p.status === 'active' || p.status === 'frozen')
      && (p.kind === 'unlimited' || p.creditsLeft > 0) && p.validFrom && p.validFrom <= d && (!p.validUntil || p.validUntil >= d));
    const visits = cut('visits', h.visits).map(v => {
      const st = vState(v);
      return `<tr><td class="nowrap">${esc(ymdLong(v.date, true))}</td><td>${esc(v.time || '')}</td>
        <td>${esc(cls(v.class || ''))}</td>
        <td><span class="pill ${st}">${esc(W(st === 'upcoming' ? 'booked' : st))}</span>
          ${st === 'attended' && v.checkedInAt && v.source !== 'rezerv' ? `<br><span class="muted">${esc(T('inAt', time(v.checkedInAt)))}</span>` : ''}
          ${v.cancelReason ? `<br><span class="muted">${esc(v.cancelReason)}</span>` : ''}</td>
        <td class="muted">${esc([W(v.source || 'aybkk'), v.cover === 'rezerv' && v.source !== 'rezerv' ? 'Rezerv' : '',
          v.moved ? T('ontoMoved') : ''].filter(Boolean).join(' · '))}${
          v.moved ? ` <button class="btn gray sm" onclick="ontoPass(${Number(v.id)}, true)">${esc(T('ontoUndoBtn'))}</button>`
          : v.status === 'attended' && v.cover === 'rezerv' && !v.passId && passFor(v.date)
            ? ` <button class="btn gray sm" onclick="ontoPass(${Number(v.id)})">${esc(T('ontoBtn'))}</button>` : ''}</td></tr>`;
    });
    const pays = cut('payments', h.payments).map(o => `<tr>
      <td class="nowrap">${esc(ymdLong(o.date))}${o.time && !(o.source === 'rezerv' && o.time === '00:00') ? `<br><span class="muted">${esc(o.time)}</span>` : ''}</td>
      <td>${esc(itemName(o.item || '–'))}</td>
      <td class="n"><b>${baht(o.amount)}</b>${o.vat ? `<br><span class="muted">${T('vat')} ${baht(o.vat)}</span>` : ''}</td>
      <td>${esc(W(o.method || 'online'))}</td>
      <td><span class="pill ${esc(o.status)}">${esc(W(o.status))}</span><br><span class="muted">${esc(W(o.source))}</span></td>
      <td class="muted" style="word-break:break-all;font-size:12px">${esc(o.refno)}${o.note ? `<br>${esc(String(o.note).slice(0, 80))}` : ''}</td></tr>`);
    const passes = h.passes.map(p => `<tr>
      <td>${esc((LANG === 'th' && p.nameTh) || p.name || '–')}</td>
      <td><span class="pill ${esc(p.status)}">${esc(W(p.status))}</span><br><span class="muted">${esc(W(p.source === 'order' ? 'bought' : p.source))}</span></td>
      <td>${esc(p.kind === 'unlimited' ? (p.dailyCap ? T('unlimCap', p.dailyCap) : T('unlimOnly')) : T('leftOf', p.creditsLeft, p.creditsTotal))}</td>
      <td>${esc(p.validFrom || p.validUntil ? T('rRange', p.validFrom ? ymdLong(p.validFrom) : '…', p.validUntil ? ymdLong(p.validUntil) : '…') : T('tStartsFirst'))}
        ${p.frozenFrom ? `<br><span class="muted">${esc(T('paused', ymdLong(p.frozenFrom), ymdLong(p.frozenUntil)))}</span>` : ''}</td>
      <td class="muted" style="font-size:12.5px">${esc(p.note || '')}</td></tr>`);
    const notes = h.notes.map(n => `<tr>
      <td class="nowrap">${esc(ymdLong(n.date || bkkYmd(Date.parse(n.createdAt))))}</td><td>${esc(n.teacher || '')}</td>
      <td>${n.toWorkOn ? `<b>${esc(T('workOnTxt'))}:</b> ${esc(n.toWorkOn)}<br>` : ''}${esc(n.body || '')}</td>
      <td class="muted">${esc(n.shared ? T('shared') : T('teamOnly'))}</td></tr>`);
    const checks = (h.checks || []).map(c => `<tr><td class="nowrap">${esc(ymdLong(c.date))}</td>
      <td class="n">${esc(c.restingHr ?? '–')}</td><td class="n">${esc(c.sleepHours ?? '–')}</td>
      <td>${c.feel ? '★'.repeat(Math.min(5, c.feel)) : '–'}</td><td class="muted">${esc(c.note || '')}</td></tr>`);
    const box = (title, n, body) => `<div class="box"><b>${esc(title)}</b>${n != null ? ` <span class="muted">${n.toLocaleString()}</span>` : ''}${body}</div>`;
    $('#view').innerHTML = head
      + box(T('hVisits'), h.visits.length, tbl([[T('thDate')], [T('thTime')], [T('thClass')], [T('thStatus')], [T('thFrom')]], visits, '', true)
        + more('visits', h.visits))
      + box(T('hPays'), h.payments.length, tbl([[T('thDate')], [T('thItem')], [T('thAmount'), 'n'], [T('thMethod')], [T('thStatus')], [T('thRef')]], pays, '', true)
        + more('payments', h.payments))
      + box(T('hPasses'), h.passes.length, tbl([[T('thPass')], [T('thStatus')], [T('thClasses')], [T('thValid')], [T('thNote')]], passes, '', true))
      + box(T('hNotes'), h.notes.length, tbl([[T('thDate')], [T('thTeacher')], [T('thNote')], ['']], notes, '', true))
      + (checks.length ? box(T('hChecks'), null, tbl([[T('thDate')], [T('thHr'), 'n'], [T('thSleep'), 'n'], [T('thFeel')], [T('thNote')]], checks)) : '');

  // ── reports ───────────────────────────────────────────────────────────────
  // Quick picks run up to today, so "came" and "booked" compare like with like.
  const REP = { pick: 'month', from: '', to: '', data: null, seq: 0, back: null };
  function rangeFor(pick) {
    const today = bkkYmd();
    const [y, m, d] = today.split('-').map(Number);
    const iso = ms => new Date(ms).toISOString().slice(0, 10);
    if (pick === 'week') return [iso(Date.UTC(y, m - 1, d - (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7)), today];
    if (pick === 'month') return [iso(Date.UTC(y, m - 1, 1)), today];
    if (pick === 'lastMonth') return [iso(Date.UTC(y, m - 2, 1)), iso(Date.UTC(y, m - 1, 0))];
    if (pick === 'year') return [`${y}-01-01`, today];
    return [today, today];
  }
  const repShell = () => `<div class="box"><b>${T('repTitle')}</b>
    <div class="seg">${['today', 'week', 'month', 'lastMonth', 'year', 'custom'].map(p =>
      `<button class="${REP.pick === p ? 'on' : ''}" onclick="repPick('${p}')">${T('r_' + p)}</button>`).join('')}</div>
    ${REP.pick === 'custom' ? `<div class="row2">
      <label>${T('rFrom')}<br><input type="date" id="rFrom" value="${esc(REP.from)}"></label>
      <label>${T('rTo')}<br><input type="date" id="rTo" value="${esc(REP.to)}"></label>
      <button class="btn" onclick="repCustom()">${T('rShow')}</button></div>` : ''}
    <p class="muted">${esc(T('rRange', ymdLong(REP.from, true), ymdLong(REP.to, true)))}</p>
    <p>${['visits', 'payments', 'members'].map(w => `<button class="btn gray sm" onclick="repCsv('${w}')">${T('csv_' + w)}</button>`).join(' ')}</p>
    </div><div id="repOut"><p class="muted">${T('loadingTxt')}</p></div>`;

  async function renderReports(cached) {
    if (!REP.from) [REP.from, REP.to] = rangeFor(REP.pick);
    $('#view').innerHTML = repShell();
    await loadThNames();
    if (cached && REP.data && REP.data.from === REP.from && REP.data.to === REP.to) { paintReport(); return; }
    const seq = ++REP.seq;
    const r = await api(`/api/bkk/admin/report?${new URLSearchParams({ from: REP.from, to: REP.to })}`).catch(() => null);
    const j = r ? await r.json().catch(() => ({})) : {};
    if (seq !== REP.seq || current !== 'reports' || SUB) return;
    if (!r || !r.ok) { $('#repOut').innerHTML = `<div class="box">${esc(j.error || T('failed'))}</div>`; return; }
    REP.data = j;
    paintReport();
  }
  window.repPick = p => {
    REP.pick = p;
    if (p !== 'custom') { [REP.from, REP.to] = rangeFor(p); renderReports(); return; }
    renderReports(true);
  };
  window.repCustom = () => {
    const f = $('#rFrom').value, t = $('#rTo').value;
    if (!f || !t || f > t || (Date.parse(t) - Date.parse(f)) / 864e5 + 1 > 400) { alert(T('rBadRange')); return; }
    REP.from = f; REP.to = t;
    renderReports();
  };
  window.repCsv = what => csvDownload(what, { from: REP.from, to: REP.to });

  function paintReport() {
    const out = $('#repOut'), d = REP.data;
    if (!out || !d) return;
    const v = d.visits, m = d.money;
    // Over two months, a row per day is too long to read: a row per month.
    const long = (Date.parse(d.to) - Date.parse(d.from)) / 864e5 > 62;
    const key = x => long ? x.slice(0, 7) : x;
    const rows = new Map();
    const at = k => { if (!rows.has(k)) rows.set(k, { came: 0, booked: 0, money: 0 }); return rows.get(k); };
    for (const x of v.byDay) { const b = at(key(x.date)); b.came += x.attended; b.booked += x.booked; }
    for (const x of m.byDay) at(key(x.date)).money += x.total;
    const monthName = k => new Date(k + '-15T12:00:00+07:00').toLocaleDateString(locale(),
      { timeZone: 'Asia/Bangkok', month: 'long', year: 'numeric' });
    const days = [...rows.keys()].sort().map(k => { const b = rows.get(k); return `<tr>
      <td class="nowrap">${esc(long ? monthName(k) : ymdLong(k, true))}</td><td class="n">${b.came}</td>
      <td class="n">${b.booked}</td><td class="n">${b.money ? baht(b.money) : ''}</td></tr>`; });
    // A refund is money going back: said on its own, never a count of 0 next to a minus.
    const nPaid = x => x.refunds ? (x.n ? `${x.n} + ${T('nRefunds', x.refunds)}` : T('nRefunds', x.refunds)) : String(x.n);

    const who = (x, k) => `${whoBtn(x.code, x.name, `who-${k}-${x.code}`)}<br><span class="muted">${esc(x.code)}</span> ${histBtn(x.code)}`;
    out.innerHTML = `<div class="box"><b>${T('rVisitsH')}</b>
        <div class="tiles">${tile(T('kCame'), v.total.toLocaleString())}${tile(T('kBooked'), v.booked.toLocaleString())}
          ${tile(T('kNoShows'), String(v.noShows))}${tile(T('kCancelled'), String(v.cancelled))}
          ${tile(T('kStudents'), String(v.uniqueStudents))}${tile(T('kNew'), String(v.newStudents))}</div>
        <p><b>${T('rByClass')}</b></p>
        ${tbl([[T('thClass')], [T('thTime')], [T('thCame'), 'n'], [T('thHeld'), 'n'], [T('thAvg'), 'n']],
          v.byClass.map(c => `<tr><td>${esc(cls(c.title))}</td><td>${esc(c.time || '')}</td><td class="n">${c.attended}</td>
            <td class="n">${c.classes}</td><td class="n">${c.avgPerClass}</td></tr>`), T('rNothing'), true)}
        ${v.bySource.length ? `<p><b>${T('rBySource')}</b></p>${tbl([[T('thFrom')], [T('thCount'), 'n']],
          v.bySource.map(x => `<tr><td>${esc(W(x.source))}</td><td class="n">${x.n}</td></tr>`))}` : ''}
      </div>
      <div class="box"><b>${T('rMoneyH')}</b>
        <div class="tiles">${tile(T('kMoney'), baht(m.total))}${tile(T('kVat'), baht(m.vat))}
          ${tile(T('kPayments'), String(m.count))}${tile(T('kSold'), String(d.passes.sold))}</div>
        ${m.manual && m.manual.n ? `<p class="muted">${esc(T('rManual', m.manual.n, baht(m.manual.total)))}</p>` : ''}
        ${m.byMethod.length ? `<p><b>${T('rByMethod')}</b></p>${tbl(moneyHeads(T('thMethod')), money(m.byMethod, x => W(x.method || 'online')))}` : ''}
        ${m.byItem.length ? `<p><b>${T('rByItem')}</b></p>${tbl(moneyHeads(T('thItem')), money(m.byItem, x => itemName(x.item)
          + (x.price && m.byItem.some(y => y !== x && y.item === x.item) ? ' · ' + baht(x.price) : '')))}` : ''}
        ${m.bySource.length ? `<p><b>${T('rMoneySource')}</b></p>${tbl(moneyHeads(T('thFrom')), money(m.bySource, x => W(x.source)))}` : ''}
      </div>
      <div class="box"><b>${T(long ? 'rByMonth' : 'rByDay')}</b>
        ${tbl([[T(long ? 'thMonth' : 'thDate')], [T('thCame'), 'n'], [T('thBooked'), 'n'], [T('thMoney'), 'n']], days, T('rNothing'))}</div>
      <div class="box"><b>${T('rExpH')}</b> <span class="muted">${d.passes.expiringNext14.length}</span>
        <p class="muted">${T('rExpHelp')}</p>
        ${tbl([[T('thStudent')], [T('thPass')], [T('thUntil')]], d.passes.expiringNext14.map(x => `<tr>
          <td>${who(x, 'e')}</td><td>${esc(itemName(x.item || ''))}</td>
          <td class="nowrap">${esc(ymdLong(x.until, true))}</td></tr>`))}</div>
      <div class="box"><b>${T('rNotSeenH')}</b> <span class="muted">${d.notSeen.length}</span>
        <p class="muted">${T('rNotSeenHelp')}</p>
        ${tbl([[T('thStudent')], [T('thLast')], [T('thPass')], [T('thUntil')]], d.notSeen.map(x => `<tr>
          <td>${who(x, 'n')}</td>

        j = await r.json().catch(() => ({}));
      } catch (e) { j = { error: e.message }; }
      if (!r || !r.ok) { sum.stopped = { row: b.first, error: j.error || (r ? 'HTTP ' + r.status : T('failed')) }; break; }
      for (const x of ['total', 'added', 'matched', 'updated', 'newMembers']) sum[x] += j[x] || 0;
      sum.skipped.push(...(j.skipped || []));
      for (const w of j.warnings || []) {
        if (w.row == null && w.code === 'pastBooked') sum.pastBooked += Number(w.vals[0]) || 0; else sum.warnings.push(w);
      }
      done += b.rows.length;
      CI.prog = T(dry ? 'ciChecking' : 'ciImporting', done, total);
      const p = $('#ciProg'); if (p) p.textContent = CI.prog;
    }
    CI.busy = false; window.onbeforeunload = null;
    CI.prog = '';
    CI.result = sum;
    CI.checkedSig = dry && !sum.stopped ? sig : null;
    paintImport();
  };

  window.ciSkippedCsv = () => {
    const s = CI.result;
    if (!s || !s.skipped.length) return;
    const byN = new Map(CI.rows.map(r => [r.n, r]));
    const fields = Object.keys(CI_KINDS[CI.kind].fields).filter(f => CI.map[f] != null);
    const cell = v => `"${String(v ?? '').replace(/^[=+\-@\t\r]/, "'$&").replace(/"/g, '""')}"`;
    const lines = [['row', 'reason', ...fields].join(',')].concat(s.skipped.map(x => {
      const r = byN.get(x.row);
      return [x.row, cell(ciSay(x, x.reason)), ...fields.map(f => cell(r ? r.cells[CI.map[f]] : ''))].join(',');
    }));
    saveBlob(new Blob(['﻿' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' }),
      `${CI.file.replace(/\.[^.]*$/, '')}-skipped.csv`);
  };

  let LINKS = {};                       // social links, loaded with the tab

  async function renderSettings() {
    const p = await fetch('/api/bkk/products').then(r => r.json());
    LINKS = await fetch('/api/bkk/settings').then(r => r.json())
      .then(d => d.links || {}).catch(() => ({}));
    TEAM = await api('/api/bkk/admin/teachers').then(r => r.json())
      .then(d => d.teachers || []).catch(() => []);
    TEES = await api('/api/bkk/admin/tees').then(r => r.json())
      .then(d => d.tees || []).catch(() => []);
    const { counts: letter = [], doors = [] } = await api('/api/bkk/admin/newsletter').then(r => r.json()).catch(() => ({}));
    const PW = await api('/api/bkk/admin/settings').then(r => r.ok ? r.json() : null).catch(() => null);
    if (current !== 'settings' || SUB) return;
    const byStatus = {};
    for (const c of letter) byStatus[c.status] = (byStatus[c.status] || 0) + c.n;
    $('#view').innerHTML = `${PW ? pwBox(PW) : ''}<div class="box">
      <b>${T('feeTitle')}</b>
      <p class="muted">${T('feeHelp')}</p>
      <p><input id="sur" type="number" min="0" max="20" step="0.5" value="${p.surchargePct}" style="width:90px"> %
      <button class="btn" onclick="saveSur()">${T('save')}</button></p>
      </div>
      <div class="box"><b>${T('packages')}</b>
      <p class="muted">${T('pkgHelp')}</p>
      <table><tr><th>${T('thPackage')}</th><th>${T('thBase')}</th><th>${T('thPays')}</th><th></th></tr>
      ${p.products.map(x => `<tr><td>${esc(pkgName(x))}<br><span class="muted">${esc(x.code)}</span></td>
        <td>฿${x.price_thb.toLocaleString()}</td>
        <td><b>฿${x.total_thb.toLocaleString()}</b></td>
        <td><button class="btn gray" onclick="editProduct('${esc(x.code)}',${x.price_thb})">${T('price')}</button>
            <button class="btn red" onclick="retireProduct('${esc(x.code)}')">${T('retire')}</button></td>
      </tr>`).join('')}</table>
      <p><button class="btn pink" onclick="newProduct()">${T('addPkg')}</button></p>
      </div>
      <div class="box"><b>${T('teesTitle')}</b>
      <p class="muted">${T('teesHelp')}</p>
      ${[...TEES, {}].map(teeForm).join('')}
      </div>
      <div class="box"><b>${T('letterTitle')}</b>
      <p class="muted">${T('letterHelp')}</p>
      ${letter.length ? `<table>${['confirmed', 'pending', 'unsubscribed'].map(k => `<tr><td>${T('letterStatus')[k]}</td>
        <td><b>${byStatus[k] || 0}</b> <span class="muted">${letter.filter(c => c.status === k)
          .map(c => `${esc(c.lang)} ${c.n}`).join(' · ')}</span></td></tr>`).join('')}</table>`
        : `<p class="muted">${T('letterNone')}</p>`}
      ${doors.length ? `<p class="muted">${T('letterDoors')} ${doors.map(d => `${esc(d.ch)} <b>${d.n}</b>`).join(' · ')}</p>` : ''}
      <p><button class="btn" onclick="letterCsv()">${T('letterCsv')}</button></p>
      </div>
      <div class="box"><b>${T('links')}</b>
      <p class="muted">${T('linksHelp')}</p>
      ${['instagram', 'youtube', 'tiktok', 'line', 'wechat', 'facebook', 'shop', 'telegram']
        .map(k => `<label style="display:block;margin-top:8px">${T('linkNames')[k] || k}</label>
          <input id="lk_${k}" style="width:100%" placeholder="https://…"
                 value="${esc((LINKS || {})[k] || '')}">`).join('')}
      <p style="margin-top:12px"><button class="btn" onclick="saveLinks()">${T('saveLinks')}</button></p>
      </div>
      <div class="box"><b>${T('team')}</b>
      <p class="muted">${T('teamHelp')}</p>
      <table>${TEAM.map(x => `<tr><td>${esc(x.name)}${x.active ? '' : ` <span class="muted">(${T('teamOff')})</span>`}</td>
        <td><button class="btn gray" onclick="resetTeam(${x.id},'${esc(x.name)}')">${T('resetTeam')}</button>
            <button class="btn ${x.active ? 'red' : ''}" onclick="toggleTeam(${x.id},${!x.active})">${T(x.active ? 'offTeam' : 'onTeam')}</button></td></tr>`).join('')}</table>
      <p><button class="btn pink" onclick="addTeam()">${T('addTeam')}</button></p>
      </div>`;
  }
  // The payment watch: its switches, the money line's time, whether Telegram gets
  // through, and a check of stuck online payments on demand (15 Nov 2026).
  const PW_ON = { paySweep: 'pwSweep', pingEachSale: 'pwEach', dailyMoney: 'pwDaily' };
  const pwWhen = iso => bkkYmd(Date.parse(iso)) === bkkYmd() ? time(iso) : `${day(iso)} ${time(iso)}`;
  const tgHtml = t => {
    const l = !t || !t.set ? { text: T('tgNotSet'), warn: true }
      : t.last && !t.last.ok ? { text: T('tgFail', pwWhen(t.last.at)), warn: true, raw: t.last.error }
      : t.last && t.last.okAt ? { text: T('tgOk', pwWhen(t.last.okAt)) } : { text: T('tgNone'), plain: true };
    return `<p class="${l.plain ? 'muted' : 'flash' + (l.warn ? ' warn' : '')}" id="tgLine" role="status">${esc(l.text)}${l.raw ? `<small>${esc(l.raw)}</small>` : ''}</p>`;
  };
  const pwBox = d => {
    const s = d.payWatch || {};
    const sw = k => `<label class="pwl"><input type="checkbox" id="${PW_ON[k]}"${s[k] === 'on' ? ' checked' : ''}><span>${T(PW_ON[k])}</span></label>`;
    return `<div class="box pw"><b>${T('pwTitle')}</b>
      <p class="muted">${T('pwHelp')}</p>
      ${sw('paySweep')}${sw('pingEachSale')}
      <div class="pwrow">${sw('dailyMoney')}<input type="time" id="pwAt" value="${esc(s.dailyMoneyAt || '21:00')}" aria-label="${esc(T('pwDaily') + ' (' + T('pwBkk') + ')')}">
        <span class="muted">${T('pwBkk')}</span></div>
      <p><button class="btn" onclick="savePw()">${T('save')}</button> <span class="muted" id="pwMsg" role="status"></span></p>
      ${tgHtml(d.telegram)}
      <p><button class="btn gray" id="tgTestBtn" onclick="testPing()">${T('tgTest')}</button></p>
      <div id="tgTestOut" role="status"></div>
      <p style="margin-top:12px"><button class="btn gray" id="pwRun" onclick="runSweep()">${T('pwRun')}</button></p>
      <div id="pwOut" role="status"></div></div>`;
  };
  window.savePw = async () => {
    const at = $('#pwAt').value;
    const body = { paySweep: $('#pwSweep').checked, pingEachSale: $('#pwEach').checked, dailyMoney: $('#pwDaily').checked };
    if (at) body.dailyMoneyAt = at;
    const j = await shout(await api('/api/bkk/admin/settings', { method: 'POST', body: JSON.stringify(body) }));
    if (!j || current !== 'settings' || SUB) return;
    if ($('#pwMsg')) $('#pwMsg').textContent = T('pwSaved');
    if (j.telegram && $('#tgLine')) $('#tgLine').outerHTML = tgHtml(j.telegram);
  };
  // Which bot the server sends as, and Telegram's own answer (15 Nov 2026).
  let TG_TEST = false;
  window.testPing = async () => {
    if (TG_TEST) return;
    TG_TEST = true;
    const btn = on => { const b = $('#tgTestBtn'); if (b) { b.disabled = !on; b.textContent = T(on ? 'tgTest' : 'tgTestWait'); } };
    btn(false);
    let r = null, j = {};
    try {
      r = await api('/api/bkk/admin/telegram/test', { method: 'POST' }).catch(() => null);
      j = r ? await r.json().catch(() => ({})) : {};
    } finally { TG_TEST = false; }
    const out = $('#tgTestOut');
    if (current !== 'settings' || SUB || !out) return;
    btn(true);
    const say = (text, cls = 'flash warn', raw = '') => `<p class="${cls}">${esc(text)}${raw ? `<small>${esc(raw)}</small>` : ''}</p>`;
    if (!r || !r.ok) { out.innerHTML = say(T('chkErr'), 'flash warn', j.error || (r ? `http ${r.status}` : '')); return; }
    const lines = [];
    if (!j.tokenSet) lines.push(say(T('tgtNoToken')));
    else if (j.botError) lines.push(say(T('tgtBadToken'), 'flash warn', j.botError));
    else if (j.bot) lines.push(say(T('tgtBot', j.bot.username ? '@' + j.bot.username : '?', j.bot.id ?? '?'), 'muted'));
    if (j.tokenSet && !j.chatSet) lines.push(say(T('tgtNoChat')));
    if (j.sent) lines.push(say(T('tgtSent'), 'flash'));
    else if (j.error) lines.push(say(T('tgtFail'), 'flash warn', j.error));
    out.innerHTML = lines.join('');
    if (j.telegram && $('#tgLine')) $('#tgLine').outerHTML = tgHtml(j.telegram);
  };
  let PW_RUN = false;
  window.runSweep = async () => {
    if (PW_RUN) return;
    PW_RUN = true;
    const btn = on => { const b = $('#pwRun'); if (b) { b.disabled = !on; b.textContent = T(on ? 'pwRun' : 'pwRunWait'); } };
    btn(false);
    let r = null, j = {};
    try {
      r = await api('/api/bkk/admin/pay/sweep', { method: 'POST' }).catch(() => null);
      j = r ? await r.json().catch(() => ({})) : {};
    } finally { PW_RUN = false; }
    const out = $('#pwOut');
    if (current !== 'settings' || SUB || !out) return;
    btn(true);
    const word = st => st === 'pending' ? T('notPaidYet') : (STR[LANG].ordPill || {})[st] || W(st);
    const say = (text, cls = 'flash warn', raw = '') => `<p class="${cls}">${esc(text)}${raw ? `<small>${esc(raw)}</small>` : ''}</p>`;
    if (!r || !r.ok) { out.innerHTML = say(T('chkErr'), 'flash warn', j.error || (r ? `http ${r.status}` : '')); return; }
    if (!j.ran) { out.innerHTML = say(T(j.reason === 'busy' ? 'pwBusy' : 'chkNoGw')); return; }
    if (!j.orders.length) { out.innerHTML = say(T('pwNone'), 'muted'); return; }
    out.innerHTML = say(T('pwDone', j.asked, j.paid), j.paid ? 'flash' : 'muted')
      + `<table>${j.orders.map(o => `<tr><td><span class="muted">${esc(T('thRef'))} ${esc(o.refno)}</span><br>
        <span class="pill ${esc(o.before)}">${esc(word(o.before))}</span> → <span class="pill ${esc(o.after)}">${esc(word(o.after))}</span>
        ${o.note && !['paid', 'mismatch'].includes(o.after) ? `<br><span class="muted" style="overflow-wrap:anywhere">${esc(o.note)}</span>` : ''}</td></tr>`).join('')}</table>`
      + (j.due > j.asked ? say(T('pwStopped'), 'muted') : '');
  };
  let TEES = [];
  const teeForm = x => `<div class="teeRow" data-id="${x.id || ''}" style="border-top:1px solid #eee;padding:10px 0">
      ${x.photo ? `<img src="${esc(x.photo)}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:6px;float:right">` : ''}
      <input data-k="name" placeholder="${T('teeName')}" value="${esc(x.name || '')}" style="width:60%">
      <input data-k="priceThb" type="number" min="1" placeholder="${T('teePrice')}" value="${x.priceThb || ''}" style="width:30%">
      <input data-k="payLink" placeholder="${T('teeLink')}" value="${esc(x.payLink || '')}" style="width:100%;margin-top:6px">
      <input data-k="photo" placeholder="${T('teePhoto')}" value="${esc(x.photo || '')}" style="width:100%;margin-top:6px">
      <input data-k="sizes" placeholder="${T('teeSizes')}" value="${esc(x.sizes || '')}" style="width:100%;margin-top:6px">
      <p style="margin-top:6px"><label style="display:inline"><input data-k="active" type="checkbox" ${x.id && !x.active ? '' : 'checked'} style="width:auto"> ${T('teeOn')}</label>
      <button class="btn ${x.id ? '' : 'pink'}" onclick="saveTee(this)">${x.id ? T('save') : T('teeAdd')}</button></p></div>`;
  window.saveTee = async (btn) => {
    const row = btn.closest('.teeRow'), v = k => row.querySelector(`[data-k="${k}"]`);
    const body = { id: row.dataset.id ? Number(row.dataset.id) : undefined, name: v('name').value,
      priceThb: Number(v('priceThb').value), payLink: v('payLink').value, photo: v('photo').value,
      sizes: v('sizes').value, active: v('active').checked };
    const j = await shout(await api('/api/bkk/admin/tees', { method: 'POST', body: JSON.stringify(body) }));
    if (j) { alert(T('teeSaved')); renderSettings(); }
  };
  let TEAM = [];
  window.addTeam = async () => {
    const name = ask(T('qTeamName')); if (!name) return;
    const passcode = ask(T('qTeamCode')); if (passcode === null) return;
    const r = await api('/api/bkk/admin/teachers', { method: 'POST', body: JSON.stringify({ name, passcode }) });
    const j = await shout(r);
    if (j && j.passcode) { alert(T('teamCode', j.teacher.name, j.passcode)); renderSettings(); }
  };
  window.resetTeam = async (id, name) => {
    const passcode = ask(T('qTeamCode')); if (passcode === null) return;
    const r = await api(`/api/bkk/admin/teachers/${id}/reset`, { method: 'POST', body: JSON.stringify({ passcode }) });
    const j = await shout(r);
    if (j && j.passcode) alert(T('teamCode', name, j.passcode));
  };
  window.toggleTeam = async (id, active) => {
    const r = await api('/api/bkk/admin/teachers', { method: 'POST', body: JSON.stringify({ id, active }) });
    if (await shout(r)) renderSettings();
  };

  window.editProduct = async (code, current) => {
    const v = ask(T('qNewPrice', code), String(current));
    if (v === null) return;
    const r = await api('/api/bkk/admin/products', { method: 'POST',
      body: JSON.stringify({ code, priceThb: Number(v) }) });
    if (await shout(r)) renderSettings();
  };

  window.retireProduct = async (code) => {
    if (!confirm(T('qRetire', code))) return;
    const r = await api('/api/bkk/admin/products', { method: 'POST',
      body: JSON.stringify({ code, active: false }) });
    if (await shout(r)) renderSettings();
  };

  window.newProduct = async () => {
    const nameEn = ask(T('qPkgName')); if (!nameEn) return;
    const code = ask(T('qPkgCode'),
      nameEn.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12)); if (!code) return;
    const kind = ask(T('qPkgKind'), 'credits');
    if (!kind) return;
    const priceThb = ask(T('qPkgPrice')); if (!priceThb) return;
    const validDays = ask(T('qPkgDays'), '90'); if (!validDays) return;
    const credits = kind === 'credits' ? ask(T('qPkgClasses'), '10') : null;
    if (kind === 'credits' && !credits) return;
    const r = await api('/api/bkk/admin/products', { method: 'POST', body: JSON.stringify({
      code, nameEn, kind, priceThb: Number(priceThb),
      validDays: Number(validDays), credits: credits ? Number(credits) : undefined }) });
    if (await shout(r)) renderSettings();
  };

  window.letterCsv = async () => {
    const r = await api('/api/bkk/admin/newsletter?csv=1');
    if (!r.ok) { alert(T('failed')); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob());
    a.download = 'aybkk-letter-emails.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  window.saveLinks = async () => {
    const links = {};
    for (const k of ['instagram', 'youtube', 'tiktok', 'line', 'wechat', 'facebook', 'shop', 'telegram']) {
      links[k] = $('#lk_' + k).value.trim();
    }
    const r = await api('/api/bkk/admin/settings', { method: 'POST', body: JSON.stringify({ links }) });
    const j = await shout(r);
    if (j) { LINKS = links; alert(T('saved')); }
  };

  window.saveSur = async () => {
    const v = Number($('#sur').value);
    const r = await api('/api/bkk/admin/settings', { method: 'POST',
      body: JSON.stringify({ surchargePct: v }) });
    if (!r.ok) return alert(T('failed'));
    renderSettings();
  };

  if (KEY) { $('#key').value = KEY; unlock(); }
})();
</script>
</body>
</html>
