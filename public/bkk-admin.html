<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYBKK Bangkok Admin</title>
<style>
  @font-face{font-family:'Work Sans';src:url('/fonts/worksans.woff2') format('woff2');font-weight:100 900;font-display:swap}
  @font-face{font-family:'Plex';src:url('/fonts/plexthai.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Plex';src:url('/fonts/plexthai-th.woff2') format('woff2');
    unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;font-display:swap}
  :root{--ink:#17121a;--wall:#f7f1f5;--paper:#fff;--blush:#fbe7f0;--plum:#5c2160;--plum-deep:#43164a;
    --pink:#e8458c;--soft:#6b5d70;--line:rgba(23,18,26,.11);--on-dark:#fdf7fa;--header:#17121a}
  @media (prefers-color-scheme:dark){:root{--ink:#f5e9f0;--wall:#140f18;--paper:#1e1723;--blush:#2b1c2b;
    --plum:#c07ec8;--plum-deep:#d9a5de;--pink:#ff6fae;--soft:#b09cb6;--line:rgba(245,233,240,.14);--on-dark:#17121a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--wall);color:var(--ink);font:16px/1.6 'Plex',-apple-system,'Helvetica Neue','PingFang SC',sans-serif}
  header{background:var(--header);color:#fdf7fa;padding:16px;display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:26px;flex:1;font-family:'Work Sans','Plex',sans-serif;font-weight:900;line-height:1.1;letter-spacing:.01em}
  nav{display:flex;background:var(--paper);border-bottom:1px solid var(--line)}
  nav button{flex:1;padding:13px;border:none;background:none;font:inherit;font-weight:700;font-size:15px;color:var(--soft);cursor:pointer}
  nav button.on{color:var(--plum);box-shadow:inset 0 -3px 0 var(--plum)}
  main{max-width:820px;margin:0 auto;padding:14px}
  .box{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px}
  .box b{font-family:'Work Sans','Plex',sans-serif;font-weight:800}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--soft);font-size:12px}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
  .pending{background:#fff3d6;color:#8a6a12}.paid{background:#e6f6ec;color:#187a43}
  .mismatch,.failed{background:#fdeaea;color:#a33}
  .btn{padding:9px 14px;border:none;border-radius:7px;background:var(--plum);color:var(--on-dark);font-weight:700;font-size:14px;cursor:pointer;font-family:'Work Sans','Plex',sans-serif;font-weight:800}
  .btn.gray{background:var(--plum-deep)}.btn.pink{background:var(--pink)}.btn.red{background:#b3453c}
  input{padding:10px;border:1.5px solid var(--line);border-radius:7px;font-size:15px;font-family:inherit;background:var(--wall);color:var(--ink)}
  #gate{max-width:340px;margin:16vh auto;text-align:center}
  .muted{color:var(--soft);font-size:12.5px}
  .in{color:#187a43;font-weight:700}
  .lang{display:flex;gap:4px}
  .lang button{padding:6px 8px;border:1.5px solid rgba(253,247,250,.35);border-radius:6px;background:none;color:#fdf7fa;
    font:700 13px/1 'Work Sans','Plex',sans-serif;cursor:pointer}
  .lang button.on{background:#fdf7fa;color:#17121a;border-color:#fdf7fa}
  #gate .lang{justify-content:center;margin-bottom:10px}
  #gate .lang button{color:var(--soft);border-color:var(--line)}
  #gate .lang button.on{background:var(--plum);color:var(--on-dark);border-color:var(--plum)}
  .attended,.active{background:#e6f6ec;color:#187a43}.upcoming{background:#fff3d6;color:#8a6a12}
  .noshow{background:#fdeaea;color:#a33}.cancelled,.void,.past{background:#eeeaf0;color:#5d5463}
  .refund,.frozen{background:#e3eefa;color:#2a5d8f}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:7px 11px;font-size:13px}
  select{padding:9px;border:1.5px solid var(--line);border-radius:7px;font-size:15px;font-family:inherit;
    background:var(--wall);color:var(--ink);max-width:100%}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
  .tile{background:var(--wall);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
  .tile span,.tile small{display:block;color:var(--soft);font-size:12px;line-height:1.4}
  .box .tile b{display:block;font-size:20px;line-height:1.3;overflow-wrap:anywhere}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .scroll.wide table{min-width:560px}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .nowrap{white-space:nowrap}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .seg button{padding:8px 13px;border:1.5px solid var(--line);border-radius:99px;background:var(--paper);color:var(--ink);
    font:700 13.5px/1.2 'Plex',sans-serif;cursor:pointer}
  .seg button.on{background:var(--plum);border-color:var(--plum);color:var(--on-dark)}
  .row2{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:6px 0}
  .row2 label{font-size:13px;color:var(--soft)}
  .cimap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:8px 12px;align-items:center;margin:8px 0}
  .cimap label{font-size:14px}
  .cimap select{width:100%}
  .list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:8px 10px;
    background:var(--paper);font-size:13.5px;line-height:1.5}
  .list div{padding:2px 0;border-bottom:1px solid var(--line)}
  .warnline{background:#fff3d6;color:#6b520e;border-radius:7px;padding:8px 10px;font-size:14px}
  .hhead h2{margin:4px 0 2px;font-family:'Work Sans','Plex',sans-serif;font-weight:800;font-size:24px;line-height:1.2}
  @media (max-width:480px){nav{overflow-x:auto}nav button{flex:1 0 auto;padding:12px 4px;font-size:13px;line-height:1.3;white-space:nowrap}
    header h1{font-size:22px}
    .cimap{grid-template-columns:1fr;gap:2px}.cimap label{margin-top:8px}}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="lang"><button data-lang="en" onclick="setLang('en')">EN</button><button data-lang="th" onclick="setLang('th')">ไทย</button></div>
    <h2 data-t="title" style="margin:4px 0 12px;font-family:'Work Sans','Plex',sans-serif;font-weight:800">AYBKK Bangkok Admin</h2>
    <input id="key" type="password" data-ph="passcode" placeholder="passcode" style="width:100%">
    <button class="btn" data-t="enter" style="width:100%;margin-top:12px" onclick="unlock()">Enter</button>
    <p class="muted" id="gateMsg"></p>
  </div>
</div>

<div id="app" style="display:none">
<header><h1 data-t="title">AYBKK Bangkok Admin</h1>
  <div class="lang"><button data-lang="en" onclick="setLang('en')">EN</button><button data-lang="th" onclick="setLang('th')">ไทย</button></div>
  <button class="btn gray" data-t="lock" onclick="logout()">Lock</button></header>
<nav>
  <button id="t-today" class="on" data-t="tabToday" onclick="tab('today')">Today</button>
  <button id="t-students" data-t="tabStudents" onclick="tab('students')">Students</button>
  <button id="t-classes" data-t="tabClasses" onclick="tab('classes')">Classes</button>
  <button id="t-orders" data-t="tabOrders" onclick="tab('orders')">Payments</button>
  <button id="t-reports" data-t="tabReports" onclick="tab('reports')">Reports</button>
  <button id="t-settings" data-t="tabSettings" onclick="tab('settings')">Settings</button>
</nav>
<main id="view"></main>
</div>

  };

    { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Bangkok' });
  const ask = (q, d = '') => { const v = prompt(q, d); return v === null ? null : v.trim(); };
  const shout = async (r) => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.error || T('failed')); return null; }
    return j;
  };

  // ── students ──────────────────────────────────────────────────────────────
  async function renderStudents(term) {
    $('#view').innerHTML = `<div class="box">
      <b>${T('students')}</b>
      <p class="muted">${T('searchHelp')}</p>
      <p><input id="q" placeholder="${esc(T('searchPh'))}" style="width:68%" value="${esc(term || '')}">
      <button class="btn" onclick="findStudents()">${T('search')}</button></p>
      <div id="results"></div>
    </div>
    <div class="box">
      <b>${T('sellTitle')}</b>
      <p class="muted">${T('sellHelp')}</p>
      <p><button class="btn pink" onclick="sellDesk()">${T('sellBtn')}</button></p>
    </div>
    <div class="box">
      <b>${T('giveTitle')}</b>
      <p class="muted">${esc(T('giveHelp'))}</p>
      <p><button class="btn pink" onclick="grantPass()">${T('giveBtn')}</button></p>
    </div>
    <div class="box" id="ciBox">${importInner()}</div>
    <div class="box">
      <b>${T('impTitle')}</b>
      <p class="muted">${esc(T('impHelp'))}</p>
      <textarea id="imp" rows="8" style="width:100%;font:13px/1.5 ui-monospace,monospace;padding:10px;border:1.5px solid var(--line);border-radius:7px;background:var(--wall);color:var(--ink)"
        placeholder="Mei Xu | mei@example.com | 1 month | 3 Oct 2026&#10;Diane Rostaing | | 10 class pack | 12 Dec 2026 | 7"></textarea>
      <p><button class="btn pink" onclick="importRezerv()">${T('impBtn')}</button></p>
      <div id="impOut"></div>
    </div>`;
    $('#q').onkeydown = e => { if (e.key === 'Enter') findStudents(); };
    if (term) findStudents();
  }

  window.importRezerv = async () => {
    const rows = $('#imp').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const [name, email, plan, until, classesLeft] = l.split(/\s*[|\t]\s*/);
      return { name, email, plan, until, classesLeft };
    });
    if (!rows.length) return;
    const r = await api('/api/bkk/admin/import', { method: 'POST', body: JSON.stringify({ rows }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.error || T('failed')); return; }
    $('#impOut').innerHTML = `<div class="box" style="background:var(--blush)">${esc(T('impDone', j))}
      ${j.skipped.length ? `<br><b>${T('impSkipped')}</b><br>${j.skipped.map(esc).join('<br>')}` : ''}</div>`;
  };

  window.findStudents = async () => {
    const term = $('#q').value.trim();
    if (term.length < 2) { $('#results').innerHTML = `<p class="muted">${T('twoLetters')}</p>`; return; }
    await loadThNames();
    const d = await api('/api/bkk/admin/members?q=' + encodeURIComponent(term)).then(r => r.json());
    const ms = d.members || [];
    FOUND = Object.fromEntries(ms.map(m => [m.code, m]));
    if (!ms.length) { $('#results').innerHTML = `<p class="muted">${T('nobody')}</p>`; return; }
    $('#results').innerHTML = ms.map(m => `<div style="border-top:1px solid var(--line);padding:12px 0">
      <b>${esc(m.name)}</b> <span class="muted">${esc(m.code)}</span>
      <button class="btn sm" style="float:right" onclick="showHistory('${esc(m.code)}')">${T('histBtn')}</button><br>
      <span class="muted">${esc(m.email || T('noEmail'))}${m.phone ? ' · ' + esc(m.phone) : ''}
        · ${T('upcoming', m.booked)}${m.source === 'rezerv' ? ' · Rezerv' + (m.rezerv_id ? ' ' + esc(m.rezerv_id) : '') : ''}</span>
      ${(m.passes || []).map(p => `<div style="margin-top:8px">
        <span class="pill ${p.status === 'active' ? 'paid' : 'pending'}">${esc(W(p.status))}</span>
        ${esc(pkgName(p))} —
        ${p.kind === 'unlimited' ? T('unlimited') : T('left', p.credits_total - p.credits_used)}
        ${p.valid_until ? T('until', String(p.valid_until).slice(0, 10)) : T('notStarted')}
        <br>
        <button class="btn gray" onclick="passAct(${p.id},'freeze')">${T('freeze')}</button>
        <button class="btn gray" onclick="passAct(${p.id},'unfreeze')">${T('unfreeze')}</button>
        <button class="btn gray" onclick="passAct(${p.id},'extend')">${T('extend')}</button>
        <button class="btn red" onclick="passAct(${p.id},'void')">${T('void')}</button>
      </div>`).join('') || `<p class="muted">${T('noPass')}</p>`}
      <p style="margin-top:8px"><button class="btn" onclick="bookFor('${esc(m.code)}')">${T('bookBtn')}</button>
        <button class="btn pink" onclick="signinLink('${esc(m.code)}')">${T('linkBtn')}</button>
        <button class="btn gray" onclick="changeEmail('${esc(m.code)}')">${T('emailBtn')}</button>
        <button class="btn red" onclick="signOutAll('${esc(m.code)}')">${T('outBtn')}</button></p>
      <div id="sl_${esc(m.code)}"></div>
    </div>`).join('');
  };

  let FOUND = {};
  // Fix a wrong email. One that sits on another profile moves only after M
  // confirms which profile it leaves.
  window.changeEmail = async (code) => {
    const m = FOUND[code]; if (!m) return;
    const email = ask(T('qEmail', m.name), m.email || ''); if (email === null) return;
    const send = body => api(`/api/bkk/admin/members/${encodeURIComponent(code)}/email`,
      { method: 'POST', body: JSON.stringify(body) });
    let r = await send({ email });
    if (r.status === 409) {
      const j = await r.json().catch(() => ({}));
      if (!j.owner || !confirm(T('qMove', email, j.owner))) { if (!j.owner) alert(j.error || T('failed')); return; }
      r = await send({ email, takeFrom: j.owner.code });
    }
    if (await shout(r)) { alert(T('emailDone')); findStudents(); }
  };
  // An email left on the profile would let the wrong person straight back in
  // (email link, checkout), so M says whose it is, against the email as it is
  // now: the server refuses a sign-out decided on a stale search. Typed answers,
  // so Cancel, Esc or Back never removes anyone's email.
  const emailFate = (name, email) => {
    const a = ask(T('qOutMail', name, email), '');
    if (a === null) return null;
    if (/^(keep|เก็บ)$/i.test(a)) return false;
    if (/^(remove|ลบ)$/i.test(a)) return true;
    alert(T('qOutMailBad'));
    return null;
  };
  window.signOutAll = async (code) => {
    const m = FOUND[code]; if (!m) return;
    const now = ((await api('/api/bkk/admin/members?q=' + encodeURIComponent(code)).then(r => r.json())
      .catch(() => ({}))).members || []).find(x => x.code === code);
    if (!now) { alert(T('failed')); return; }
    const body = { expectEmail: now.email || null };
    if (now.email) { const c = emailFate(now.name, now.email); if (c === null) return; body.clearEmail = c; }
    if (!confirm(T('qOut', now.name))) return;
    const send = () => api(`/api/bkk/admin/members/${encodeURIComponent(code)}/signout`,
      { method: 'POST', body: JSON.stringify(body) });
    let r = await send();
    if (r.status === 409) {
      const j = await r.clone().json().catch(() => ({}));
      if (j.needEmailDecision) {
        const c = emailFate(now.name, j.email); if (c === null) return;
        body.expectEmail = j.email; body.clearEmail = c;
        r = await send();
      }
    }
    const j = await shout(r);
    if (!j) return;
    $('#q').value = j.member.code;
    await findStudents();
    alert(T('outDone', now.name, j.linksStopped, j.removedEmail));
  };

  // A one-time link M pastes into the student's LINE, WhatsApp or WeChat.
  window.signinLink = async (code) => {
    const r = await api(`/api/bkk/admin/members/${encodeURIComponent(code)}/signin-link`, { method: 'POST', body: '{}' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.error || T('failed')); return; }
    const msg = `สวัสดีค่ะ คุณ${j.name} 🙏 โปรไฟล์ AYBKK ของคุณพร้อมแล้ว รูปการฝึกของคุณจะอยู่ที่นี่ เห็นได้เฉพาะคุณ\n`
      + `Hi ${j.name} 🙏 Your AYBKK profile is ready. Your class photos are here, only for you.\n\n`
      + `${j.link}\n\n`
      + `(ลิงก์ใช้ได้ ${j.days} วัน · This link works for ${j.days} days.)`;
    let copied = false;
    try { await navigator.clipboard.writeText(msg); copied = true; } catch (_) {}
    $('#sl_' + code).innerHTML = `<div class="box" style="background:var(--blush);margin-top:8px">
      <b style="font-size:15px">${copied ? T('linkCopied') : T('linkCopyHand')}</b>
      <textarea readonly style="width:100%;margin-top:6px;font-size:13px" rows="6">${esc(msg)}</textarea></div>`;
  };

  window.passAct = async (id, what) => {
    let body = {};
    if (what === 'freeze') {
      const days = ask(T('qPauseDays'), '30'); if (days === null) return;
      const reason = ask(T('qPauseWhy'), ''); if (reason === null) return;
      body = { days: Number(days), reason };
    } else if (what === 'extend') {
      const days = ask(T('qAddDays'), '7'); if (days === null) return;
      const credits = ask(T('qAddClasses'), '0'); if (credits === null) return;
      body = { days: Number(days), credits: Number(credits), reason: ask(T('qNote'), '') || '' };
    } else if (what === 'void') {
      if (!confirm(T('qVoid'))) return;
      body = { reason: ask(T('qWhy'), '') || '' };
    }
    const r = await api(`/api/bkk/admin/passes/${id}/${what}`, { method: 'POST', body: JSON.stringify(body) });
    if (await shout(r)) findStudents();
  };

  window.grantPass = async () => {
    const d = await fetch('/api/bkk/products').then(r => r.json());
    const codes = d.products.map(p => p.code).join(', ');
    const productCode = ask(T('qWhichCode', codes), 'pack10'); if (!productCode) return;
    const name = ask(T('qName')); if (!name) return;
    const email = ask(T('qEmailFind')); if (email === null) return;
    const validFrom = ask(T('qStart'), '');
    if (validFrom === null) return;
    let validUntil = '';
    if (validFrom) { validUntil = ask(T('qExpires')); if (!validUntil) return; }
    const r = await api('/api/bkk/admin/passes', { method: 'POST', body: JSON.stringify({
      productCode, name, email, source: 'manual',
      validFrom: validFrom || null, validUntil: validUntil || null,
      note: ask(T('qNoteWhy'), '') || '' }) });
    const j = await shout(r);
    if (j) { alert(T('doneMember', j.member.name, j.member.code)); renderStudents(name); }
  };

  window.sellDesk = async () => {
    const d = await fetch('/api/bkk/products').then(r => r.json());
    const ps = d.products || [];
    const withVat = p => p.price_thb + Math.round(p.price_thb * (d.vatPct || 0) / 100);
    const pick = ask(T('qWhichPkg') + '\n' + ps.map((p, i) =>
      `${i + 1}. ${pkgName(p)} · ฿${withVat(p).toLocaleString()} ${T('inclVat')}`).join('\n'), '1');
    if (!pick) return;
    const p = ps[Number(pick) - 1];
    if (!p) return alert(T('noPkgNum'));
    const name = ask(T('qName')); if (!name) return;
    const email = ask(T('qEmailReceipt'), ''); if (email === null) return;
    const phone = ask(T('qPhone'), ''); if (phone === null) return;
    const m = ask(T('qPaidHow'), '1'); if (!m) return;
    const method = { 1: 'cash', 2: 'transfer', 3: 'card' }[m];
    if (!method) return alert(T('pick123'));
    if (!confirm(T('confirmSale', name, pkgName(p), '฿' + withVat(p).toLocaleString(), W(method)))) return;
    const r = await api('/api/bkk/admin/sales', { method: 'POST',
      body: JSON.stringify({ productCode: p.code, name, email, phone, method }) });
    const j = await shout(r);
    if (j) { alert(T('doneSale', '฿' + j.order.amount.toLocaleString(), W(j.order.method), j.order.refno, j.member.name, j.member.code)); renderStudents(name); }
  };

  window.bookFor = async (code) => {
    const d = await fetch('/api/bkk/schedule?days=14').then(r => r.json());
    const list = (d.classes || []).slice(0, 40);
    const pick = ask(T('qWhichClass') + '\n' + list.map((c, i) =>
      `${i + 1}. ${day(c.startAt)} ${time(c.startAt)} ${cls(c.title)} (${T('seatsLeft', c.seatsLeft)})`).join('\n'), '1');
    if (!pick) return;
    const c = list[Number(pick) - 1];
    if (!c) return alert(T('noClassNum'));
    const r = await api('/api/bkk/bookings', { method: 'POST',
      body: JSON.stringify({ memberCode: code, slotId: c.slotId, date: c.date }) });
    if (await shout(r)) { alert(T('booked')); findStudents(); }
  };

  // ── classes ───────────────────────────────────────────────────────────────
  async function renderClasses() {
    const d = await fetch('/api/bkk/schedule?days=21').then(r => r.json());
    const rows = (d.classes || []).map(c => `<tr>
      <td>${day(c.startAt)}<br><span class="muted">${time(c.startAt)}</span></td>
      <td>${esc(cls(c.title))}<br><span class="muted">${T('bookedOf', c.booked, c.capacity)}</span></td>
      <td><button class="btn red" onclick="closeClass(${c.slotId},'${c.date}','${esc(cls(c.title))}')">${T('close')}</button></td>
    </tr>`).join('');
    $('#view').innerHTML = `<div class="box"><b>${T('nextWeeks')}</b>
      <p class="muted">${T('classesHelp')}</p>
      <table>${rows || `<tr><td class="muted">${T('noClasses')}</td></tr>`}</table>
      <p class="muted">${T('putBack')} <button class="btn gray" onclick="reopenClass()">${T('reopenBtn')}</button></p>
    </div>`;
  }

  window.closeClass = async (slotId, date, title) => {
    if (!confirm(T('qClose', title, date))) return;
    const reason = ask(T('qReason'), T('moonDay')); if (reason === null) return;
    const r = await api('/api/bkk/admin/classes/cancel', { method: 'POST',
      body: JSON.stringify({ slotId, date, reason }) });
    const j = await shout(r);
    if (j) { alert(T('closed', j.released, j.notified)); renderClasses(); }
  };

  window.reopenClass = async () => {
    const slotId = ask(T('qSlot')); if (!slotId) return;
    const date = ask(T('qDate')); if (!date) return;
    const r = await api('/api/bkk/admin/classes/reopen', { method: 'POST',
      body: JSON.stringify({ slotId: Number(slotId), date }) });
    if (await shout(r)) renderClasses();
  };

  async function progressBox() {
    const p = await api('/api/bkk/admin/progress').then(r => r.json()).catch(() => null);
    if (!p || p.error) return '';
    const row = (label, val, warn) => `<tr><td>${label}</td><td style="text-align:right"><b${warn ? ' style="color:#c33"' : ''}>${val}</b></td></tr>`;
    const who = list => list.length ? ' · ' + list.map(x => `${esc(x.name)} ${x.n}`).join(', ') : '';
    return `<div class="box"><b>${T('progTitle')}</b>
      <table>
        ${row(T('progStudents'), `${p.members.total} <span class="muted">(${T('progActive', p.members.active)})</span>`)}
        ${row(T('progEmail'), `${p.members.with_email} / ${p.members.total}`)}
        ${row(T('progLinks'), `${p.links.sent} <span class="muted">(${T('progToday', p.links.sent_today)})</span>`)}
        ${row(T('progOpened'), `${p.links.opened} / ${p.links.sent}`)}
        ${row(T('progPhotos') + `<span class="muted">${who(p.uploaders)}</span>`, `${p.photos.today} <span class="muted">(${T('progStudentsIn', p.photos.students_today)})</span>`)}
        ${row(T('progUntagged'), p.photos.untagged_today, p.photos.untagged_today > 0)}
        ${row(T('progNotes') + `<span class="muted">${who(p.notes.byTeacher)}</span>`, p.notes.today)}
      </table>
      <p class="muted">${T('progAll', p.photos.total, p.photos.students_total, p.notes.total)}</p></div>`;
  }

  async function startBox() {
    const s = await api('/api/bkk/admin/start-stats').then(r => r.json()).catch(() => null);
    if (!s || s.error) return '';
    return `<div class="box"><b>${T('startTitle')}</b>
      ${s.sources.length ? `<table><tr class="muted"><td>${T('startSrc')}</td><td style="text-align:right">${T('startViews')}</td><td style="text-align:right">${T('startTaps')}</td></tr>
        ${s.sources.map(x => `<tr><td>${esc(x.src)}</td><td style="text-align:right">${x.views}</td><td style="text-align:right"><b>${x.taps}</b></td></tr>`).join('')}</table>`
      : `<p class="muted">${T('startNone')}</p>`}</div>`;
  }

  async function renderToday() {
    const [d, prog0, start] = await Promise.all([api('/api/bkk/admin/today').then(r => r.json()), progressBox(), startBox()]);
    const prog = prog0 + start;
    const rows = (d.bookings || []);
    const money = (d.money || []);
    const moneyBox = `<div class="box"><b>${T('moneyToday')}</b>
      ${money.length ? `<table>${money.map(x => `<tr><td>${esc(W(x.method))}</td><td class="muted">${T('sales', x.n)}</td>
        <td><b>฿${(x.total || 0).toLocaleString()}</b></td></tr>`).join('')}</table>
        <p class="muted">${T('countDrawer')}</p>`
      : `<p class="muted">${T('noSales')}</p>`}</div>`;
    if (!rows.length) {
      $('#view').innerHTML = prog + moneyBox + `<div class="box"><b>${T('today')}</b><p class="muted">${T('noBookings')}</p></div>`;
      return;
    }
    const byClass = {};
    for (const b of rows) {
      const k = b.title + '|' + b.start_at;
      (byClass[k] = byClass[k] || []).push(b);
    }
    const blocks = Object.entries(byClass).map(([k, list]) => {
      const [title, startAt] = k.split('|');
      const inCount = list.filter(b => b.checked_in_at).length;
      return `<div class="box">
        <b>${time(startAt)} · ${esc(cls(title))}</b>
        <span class="muted">${T('bookedIn', list.length, inCount)}</span>
        <table>${list.map(b => `<tr>
          <td>${esc(b.name)}</td>
          <td class="muted">${esc(b.code)}</td>
          <td>${b.checked_in_at ? `<span class="in">${T('checkedIn')}</span>` : `<span class="muted">${T('notYet')}</span>`}</td>
        </tr>`).join('')}</table></div>`;
    }).join('');
    $('#view').innerHTML = prog + moneyBox + blocks;
  }

  async function renderOrders() {
    await loadThNames();
    const d = await api('/api/bkk/admin/orders').then(r => r.json());
    const rows = (d.orders || []).map(o => `<tr>
      <td><b>${esc(o.member_name)}</b><br><span class="muted">${esc(o.email || '')}<br>${esc(o.member_code)}</span></td>
      <td>${esc(pkgName(o))}<br><b>฿${o.amount_thb.toLocaleString()}</b>
        <br><span class="muted">${o.base_thb.toLocaleString()} + ${T('fee')} ${o.fee_thb.toLocaleString()} + ${T('vat')} ${(o.vat_thb || 0).toLocaleString()}</span></td>
      <td><span class="pill ${esc(o.status)}">${esc(W(o.status))}</span> <span class="muted">${esc(W(o.method || 'online'))}${o.source === 'rezerv' ? ' · Rezerv' : ''}</span><br>
        <span class="muted">${o.created_at ? `${bkkYmd(Date.parse(o.created_at)).slice(5)} ${time(o.created_at)}` : ''}</span>
        ${o.gateway_note ? `<br><span class="muted">${esc(String(o.gateway_note).slice(0, 60))}</span>` : ''}</td>
      <td class="muted" style="word-break:break-all;font-size:12px">${o.refno}</td>

    $('#view').innerHTML = `<div class="box"><b>${T('payments')}</b>
      <button class="btn gray" style="float:right" onclick="tab('orders')">↻</button>
      <div style="overflow-x:auto"><table><tr><th>${T('thStudent')}</th><th>${T('thPackage')}</th><th>${T('thStatus')}</th><th>${T('thRef')}</th><th></th></tr>
      ${rows || `<tr><td class="muted">${T('noOrders')}</td></tr>`}</table></div>
      <p class="muted">${T('ordersHelp')}</p></div>`;
  }

  window.force = async (id) => {
    if (!confirm(T('qActivate'))) return;
    const r = await api(`/api/bkk/admin/orders/${id}/force-activate`, { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) alert(j.error || T('failed'));
    // A drop-in bought for a class that was cancelled or over by now: the pass
    // is live but nobody is on the list, and this list does not show the class.
    else if (j.bookingError) alert(T('activatedNoClass', j.bookingError));
    renderOrders();
  };

  // ── shared by history, reports and the import ─────────────────────────────
  const baht = n => (n < 0 ? '-' : '') + '฿' + Math.abs(Number(n) || 0).toLocaleString('en-US');
  const bkkYmd = (ms = Date.now()) => new Date(ms + 7 * 3600e3).toISOString().slice(0, 10);
  const ymdLong = (ymd, weekday) => {
    if (!ymd) return '';
    try {
      return new Date(ymd + 'T12:00:00+07:00').toLocaleDateString(locale(), { timeZone: 'Asia/Bangkok',
        ...(weekday ? { weekday: 'short' } : {}), day: 'numeric', month: 'short', year: 'numeric' });
    } catch { return ymd; }
  };
  const tile = (label, val, sub) =>
    `<div class="tile"><span>${esc(label)}</span><b>${esc(val)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  // heads: [label, 'n' for a number column]; wide tables scroll sideways on a phone.
  const tbl = (heads, rows, empty, wide) => rows.length
    ? `<div class="scroll ${wide ? 'wide' : ''}"><table><tr>${heads.map(h => `<th class="${h[1] || ''}">${esc(h[0])}</th>`).join('')}</tr>
      ${rows.join('')}</table></div>`
    : `<p class="muted">${esc(empty || T('noneYet'))}</p>`;
  const saveBlob = (blob, name) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  // The key travels in a header, so a download is a fetch, not a plain link.
  const csvDownload = async (what, qs) => {
    const r = await api(`/api/bkk/admin/export/${what}.csv?${new URLSearchParams(qs)}`).catch(() => null);
    if (!r || !r.ok) { const j = r ? await r.json().catch(() => ({})) : {}; alert(j.error || T('failed')); return; }
    const name = ((r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/) || [])[1] || `aybkk-${what}.csv`;
    saveBlob(await r.blob(), name);
  };
  const histBtn = code => `<button class="btn sm" onclick="showHistory('${esc(code)}')">${T('histBtn')}</button>`;

  // ── one student, all of it ────────────────────────────────────────────────
  let HIST = null, HIST_FROM = null, HIST_SEQ = 0, HIST_ALL = {};
  const HIST_ROWS = 60;
  const backBtn = () => `<button class="btn gray sm" onclick="histBack()">${T('back')}</button>`;
  window.showHistory = async code => {
    const seq = ++HIST_SEQ;
    if (SUB !== 'history') HIST_FROM = { tab: current, term: current === 'students' && $('#q') ? $('#q').value.trim() : '' };
    SUB = 'history'; HIST = null; HIST_ALL = {};
    $('#view').innerHTML = `<p>${backBtn()}</p><p class="muted">${T('loadingTxt')}</p>`;
    window.scrollTo(0, 0);
    await loadThNames();
    const r = await api(`/api/bkk/admin/members/${encodeURIComponent(code)}/history`).catch(() => null);
    const j = r ? await r.json().catch(() => ({})) : {};
    if (seq !== HIST_SEQ || SUB !== 'history') return;
    if (!r || !r.ok) { $('#view').innerHTML = `<p>${backBtn()}</p><div class="box">${esc(j.error || T('failed'))}</div>`; return; }
    HIST = j;
    paintHistory();
  };
  window.histBack = () => {
    const f = HIST_FROM || { tab: 'students', term: '' };
    SUB = null; HIST = null;
    if (f.tab === 'students') renderStudents(f.term);
    else if (f.tab === 'reports') renderReports(true);
    else tab(f.tab);
  };
  window.histMore = k => { HIST_ALL[k] = true; paintHistory(); };
  window.histCsv = what => { if (HIST) csvDownload(what, { member: HIST.member.code }); };

  function paintHistory() {
    const h = HIST, m = h.member, s = h.summary, ap = s.activePass;
    const passTh = name => (LANG === 'th' && ((h.passes.find(p => p.name === name) || {}).nameTh || TH_BY_EN[name])) || name;
    const more = (k, list) => !HIST_ALL[k] && list.length > HIST_ROWS
      ? `<p><button class="btn gray sm" onclick="histMore('${k}')">${T('showAll', list.length.toLocaleString())}</button></p>` : '';
    const cut = (k, list) => HIST_ALL[k] ? list : list.slice(0, HIST_ROWS);
    const about = [m.source === 'rezerv' ? T('hRezerv') : T('hHere'), m.rezervId ? T('hRezervId', m.rezervId) : '',
      m.joinedOn ? T('hJoined', ymdLong(m.joinedOn)) : '', m.createdAt ? T('hSince', ymdLong(bkkYmd(Date.parse(m.createdAt)))) : ''];
    const head = `<div class="box hhead">${backBtn()}
      <h2>${esc(m.name)}</h2>
      <div class="muted">${[m.code, m.email, m.phone].filter(Boolean).map(esc).join(' · ')}</div>
      <div class="muted">${about.filter(Boolean).map(esc).join(' · ')}</div>
      <div class="tiles">
        ${tile(T('tCame'), s.visits.toLocaleString(), s.firstVisit ? T('tFirst', ymdLong(s.firstVisit)) : '')}
        ${tile(T('tLastVisit'), s.lastVisit ? ymdLong(s.lastVisit, true) : T('tNever'))}
        ${tile(T('tLast30'), String(s.visitsLast30), T('tLast90', s.visitsLast90))}
        ${tile(T('tPaid'), baht(s.totalPaid), T('tPayN', s.payments))}
        ${tile(T('tPass'), ap ? passTh(ap.name) : T('tNoPass'), ap ? [ap.creditsLeft != null ? T('tLeftN', ap.creditsLeft) : '',
          ap.until ? T('tUntil', ymdLong(ap.until)) : T('tStartsFirst')].filter(Boolean).join(' · ') : '')}
        ${tile(T('tMissed'), `${s.noShows} · ${s.cancellations}`, T('tPhotos', h.photos))}
      </div>
      <p>${['visits', 'payments'].map(w => `<button class="btn gray sm" onclick="histCsv('${w}')">${T('csv_' + w)}</button>`).join(' ')}</p>
    </div>`;

    // A past "booked" that never got a check-in reads differently from one still to come.
    const vState = v => v.status === 'booked' ? (v.upcoming ? 'upcoming' : 'past') : v.status;
    const visits = cut('visits', h.visits).map(v => {
      const st = vState(v);
      return `<tr><td class="nowrap">${esc(ymdLong(v.date, true))}</td><td>${esc(v.time || '')}</td>
        <td>${esc(cls(v.class || ''))}</td>
        <td><span class="pill ${st}">${esc(W(st === 'upcoming' ? 'booked' : st))}</span>
          ${st === 'attended' && v.checkedInAt && v.source !== 'rezerv' ? `<br><span class="muted">${esc(T('inAt', time(v.checkedInAt)))}</span>` : ''}
          ${v.cancelReason ? `<br><span class="muted">${esc(v.cancelReason)}</span>` : ''}</td>
        <td class="muted">${esc([W(v.source || 'aybkk'), v.cover === 'rezerv' && v.source !== 'rezerv' ? 'Rezerv' : ''].filter(Boolean).join(' · '))}</td></tr>`;
    });
    const pays = cut('payments', h.payments).map(o => `<tr>
      <td class="nowrap">${esc(ymdLong(o.date))}${o.time && !(o.source === 'rezerv' && o.time === '00:00') ? `<br><span class="muted">${esc(o.time)}</span>` : ''}</td>
      <td>${esc(itemName(o.item || '–'))}</td>
      <td class="n"><b>${baht(o.amount)}</b>${o.vat ? `<br><span class="muted">${T('vat')} ${baht(o.vat)}</span>` : ''}</td>
      <td>${esc(W(o.method || 'online'))}</td>
      <td><span class="pill ${esc(o.status)}">${esc(W(o.status))}</span><br><span class="muted">${esc(W(o.source))}</span></td>
      <td class="muted" style="word-break:break-all;font-size:12px">${esc(o.refno)}${o.note ? `<br>${esc(String(o.note).slice(0, 80))}` : ''}</td></tr>`);
    const passes = h.passes.map(p => `<tr>
      <td>${esc((LANG === 'th' && p.nameTh) || p.name || '–')}</td>
      <td><span class="pill ${esc(p.status)}">${esc(W(p.status))}</span><br><span class="muted">${esc(W(p.source === 'order' ? 'bought' : p.source))}</span></td>
      <td>${esc(p.kind === 'unlimited' ? (p.dailyCap ? T('unlimCap', p.dailyCap) : T('unlimOnly')) : T('leftOf', p.creditsLeft, p.creditsTotal))}</td>
      <td>${esc(p.validFrom || p.validUntil ? T('rRange', p.validFrom ? ymdLong(p.validFrom) : '…', p.validUntil ? ymdLong(p.validUntil) : '…') : T('tStartsFirst'))}
        ${p.frozenFrom ? `<br><span class="muted">${esc(T('paused', ymdLong(p.frozenFrom), ymdLong(p.frozenUntil)))}</span>` : ''}</td>
      <td class="muted" style="font-size:12.5px">${esc(p.note || '')}</td></tr>`);
    const notes = h.notes.map(n => `<tr>
      <td class="nowrap">${esc(ymdLong(n.date || bkkYmd(Date.parse(n.createdAt))))}</td><td>${esc(n.teacher || '')}</td>
      <td>${n.toWorkOn ? `<b>${esc(T('workOnTxt'))}:</b> ${esc(n.toWorkOn)}<br>` : ''}${esc(n.body || '')}</td>
      <td class="muted">${esc(n.shared ? T('shared') : T('teamOnly'))}</td></tr>`);
    const checks = (h.checks || []).map(c => `<tr><td class="nowrap">${esc(ymdLong(c.date))}</td>
      <td class="n">${esc(c.restingHr ?? '–')}</td><td class="n">${esc(c.sleepHours ?? '–')}</td>
      <td>${c.feel ? '★'.repeat(Math.min(5, c.feel)) : '–'}</td><td class="muted">${esc(c.note || '')}</td></tr>`);
    const box = (title, n, body) => `<div class="box"><b>${esc(title)}</b>${n != null ? ` <span class="muted">${n.toLocaleString()}</span>` : ''}${body}</div>`;
    $('#view').innerHTML = head
      + box(T('hVisits'), h.visits.length, tbl([[T('thDate')], [T('thTime')], [T('thClass')], [T('thStatus')], [T('thFrom')]], visits, '', true)
        + more('visits', h.visits))
      + box(T('hPays'), h.payments.length, tbl([[T('thDate')], [T('thItem')], [T('thAmount'), 'n'], [T('thMethod')], [T('thStatus')], [T('thRef')]], pays, '', true)
        + more('payments', h.payments))
      + box(T('hPasses'), h.passes.length, tbl([[T('thPass')], [T('thStatus')], [T('thClasses')], [T('thValid')], [T('thNote')]], passes, '', true))
      + box(T('hNotes'), h.notes.length, tbl([[T('thDate')], [T('thTeacher')], [T('thNote')], ['']], notes, '', true))
      + (checks.length ? box(T('hChecks'), null, tbl([[T('thDate')], [T('thHr'), 'n'], [T('thSleep'), 'n'], [T('thFeel')], [T('thNote')]], checks)) : '');
  }

  // ── reports ───────────────────────────────────────────────────────────────
  // Quick picks run up to today, so "came" and "booked" compare like with like.
  const REP = { pick: 'month', from: '', to: '', data: null, seq: 0 };
  function rangeFor(pick) {
    const today = bkkYmd();
    const [y, m, d] = today.split('-').map(Number);
    const iso = ms => new Date(ms).toISOString().slice(0, 10);
    if (pick === 'week') return [iso(Date.UTC(y, m - 1, d - (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7)), today];
    if (pick === 'month') return [iso(Date.UTC(y, m - 1, 1)), today];
    if (pick === 'lastMonth') return [iso(Date.UTC(y, m - 2, 1)), iso(Date.UTC(y, m - 1, 0))];
    if (pick === 'year') return [`${y}-01-01`, today];
    return [today, today];
  }
  const repShell = () => `<div class="box"><b>${T('repTitle')}</b>
    <div class="seg">${['today', 'week', 'month', 'lastMonth', 'year', 'custom'].map(p =>
      `<button class="${REP.pick === p ? 'on' : ''}" onclick="repPick('${p}')">${T('r_' + p)}</button>`).join('')}</div>
    ${REP.pick === 'custom' ? `<div class="row2">
      <label>${T('rFrom')}<br><input type="date" id="rFrom" value="${esc(REP.from)}"></label>
      <label>${T('rTo')}<br><input type="date" id="rTo" value="${esc(REP.to)}"></label>
      <button class="btn" onclick="repCustom()">${T('rShow')}</button></div>` : ''}
    <p class="muted">${esc(T('rRange', ymdLong(REP.from, true), ymdLong(REP.to, true)))}</p>
    <p>${['visits', 'payments', 'members'].map(w => `<button class="btn gray sm" onclick="repCsv('${w}')">${T('csv_' + w)}</button>`).join(' ')}</p>
    </div><div id="repOut"><p class="muted">${T('loadingTxt')}</p></div>`;

  async function renderReports(cached) {
    if (!REP.from) [REP.from, REP.to] = rangeFor(REP.pick);
    $('#view').innerHTML = repShell();
    await loadThNames();
    if (cached && REP.data && REP.data.from === REP.from && REP.data.to === REP.to) { paintReport(); return; }
    const seq = ++REP.seq;
    const r = await api(`/api/bkk/admin/report?${new URLSearchParams({ from: REP.from, to: REP.to })}`).catch(() => null);
    const j = r ? await r.json().catch(() => ({})) : {};
    if (seq !== REP.seq || current !== 'reports' || SUB) return;
    if (!r || !r.ok) { $('#repOut').innerHTML = `<div class="box">${esc(j.error || T('failed'))}</div>`; return; }
    REP.data = j;
    paintReport();
  }
  window.repPick = p => {
    REP.pick = p;
    if (p !== 'custom') { [REP.from, REP.to] = rangeFor(p); renderReports(); return; }
    renderReports(true);
  };
  window.repCustom = () => {
    const f = $('#rFrom').value, t = $('#rTo').value;
    if (!f || !t || f > t || (Date.parse(t) - Date.parse(f)) / 864e5 + 1 > 400) { alert(T('rBadRange')); return; }
    REP.from = f; REP.to = t;
    renderReports();
  };
  window.repCsv = what => csvDownload(what, { from: REP.from, to: REP.to });

  function paintReport() {
    const out = $('#repOut'), d = REP.data;
    if (!out || !d) return;
    const v = d.visits, m = d.money;
    // Over two months, a row per day is too long to read: a row per month.
    const long = (Date.parse(d.to) - Date.parse(d.from)) / 864e5 > 62;
    const key = x => long ? x.slice(0, 7) : x;
    const rows = new Map();
    const at = k => { if (!rows.has(k)) rows.set(k, { came: 0, booked: 0, money: 0 }); return rows.get(k); };
    for (const x of v.byDay) { const b = at(key(x.date)); b.came += x.attended; b.booked += x.booked; }
    for (const x of m.byDay) at(key(x.date)).money += x.total;
    const monthName = k => new Date(k + '-15T12:00:00+07:00').toLocaleDateString(locale(),
      { timeZone: 'Asia/Bangkok', month: 'long', year: 'numeric' });
    const days = [...rows.keys()].sort().map(k => { const b = rows.get(k); return `<tr>
      <td class="nowrap">${esc(long ? monthName(k) : ymdLong(k, true))}</td><td class="n">${b.came}</td>
      <td class="n">${b.booked}</td><td class="n">${b.money ? baht(b.money) : ''}</td></tr>`; });
    const money = (list, label) => list.map(x => `<tr><td>${esc(label(x))}</td><td class="n">${x.n}</td><td class="n">${baht(x.total)}</td></tr>`);
    const moneyHeads = first => [[first], [T('thCount'), 'n'], [T('thTotal'), 'n']];
    // The call lists are worked from a phone: History sits under the name, never off to the side.
    const who = x => `${esc(x.name)}<br><span class="muted">${esc(x.code)}</span> ${histBtn(x.code)}`;
    out.innerHTML = `<div class="box"><b>${T('rVisitsH')}</b>
        <div class="tiles">${tile(T('kCame'), v.total.toLocaleString())}${tile(T('kBooked'), v.booked.toLocaleString())}
          ${tile(T('kNoShows'), String(v.noShows))}${tile(T('kCancelled'), String(v.cancelled))}
          ${tile(T('kStudents'), String(v.uniqueStudents))}${tile(T('kNew'), String(v.newStudents))}</div>
        <p><b>${T('rByClass')}</b></p>
        ${tbl([[T('thClass')], [T('thTime')], [T('thCame'), 'n'], [T('thHeld'), 'n'], [T('thAvg'), 'n']],
          v.byClass.map(c => `<tr><td>${esc(cls(c.title))}</td><td>${esc(c.time || '')}</td><td class="n">${c.attended}</td>
            <td class="n">${c.classes}</td><td class="n">${c.avgPerClass}</td></tr>`), T('rNothing'), true)}
        ${v.bySource.length ? `<p><b>${T('rBySource')}</b></p>${tbl([[T('thFrom')], [T('thCount'), 'n']],
          v.bySource.map(x => `<tr><td>${esc(W(x.source))}</td><td class="n">${x.n}</td></tr>`))}` : ''}
      </div>
      <div class="box"><b>${T('rMoneyH')}</b>
        <div class="tiles">${tile(T('kMoney'), baht(m.total))}${tile(T('kVat'), baht(m.vat))}
          ${tile(T('kPayments'), String(m.count))}${tile(T('kSold'), String(d.passes.sold))}</div>
        ${m.byMethod.length ? `<p><b>${T('rByMethod')}</b></p>${tbl(moneyHeads(T('thMethod')), money(m.byMethod, x => W(x.method || 'online')))}` : ''}
        ${m.byItem.length ? `<p><b>${T('rByItem')}</b></p>${tbl(moneyHeads(T('thItem')), money(m.byItem, x => itemName(x.item)))}` : ''}
        ${m.bySource.length ? `<p><b>${T('rMoneySource')}</b></p>${tbl(moneyHeads(T('thFrom')), money(m.bySource, x => W(x.source)))}` : ''}
      </div>
      <div class="box"><b>${T(long ? 'rByMonth' : 'rByDay')}</b>
        ${tbl([[T(long ? 'thMonth' : 'thDate')], [T('thCame'), 'n'], [T('thBooked'), 'n'], [T('thMoney'), 'n']], days, T('rNothing'))}</div>
      <div class="box"><b>${T('rExpH')}</b> <span class="muted">${d.passes.expiringNext14.length}</span>
        <p class="muted">${T('rExpHelp')}</p>
        ${tbl([[T('thStudent')], [T('thPass')], [T('thUntil')]], d.passes.expiringNext14.map(x => `<tr>
          <td>${who(x)}</td><td>${esc(itemName(x.item || ''))}</td>
          <td class="nowrap">${esc(ymdLong(x.until, true))}</td></tr>`))}</div>
      <div class="box"><b>${T('rNotSeenH')}</b> <span class="muted">${d.notSeen.length}</span>
        <p class="muted">${T('rNotSeenHelp')}</p>
        ${tbl([[T('thStudent')], [T('thLast')], [T('thPass')], [T('thUntil')]], d.notSeen.map(x => `<tr>
          <td>${who(x)}</td>
          <td class="nowrap">${esc(x.lastVisit ? ymdLong(x.lastVisit) : T('neverCame'))}</td>
          <td>${esc(itemName(x.pass || ''))}</td><td class="nowrap">${esc(x.until ? ymdLong(x.until) : '')}</td></tr>`), '', true)}</div>`;
  }

  // ── the move from Rezerv: CSV files read here, sent in batches ────────────
  // Columns are matched to our fields by their headings, English or Thai; an
  // alias list's order is its priority. Only matched columns are ever sent, so
  // a birthday, an address or a card number in the file never leaves this page.
  const AL = {
    customer: ['customer id', 'member id', 'client id', 'user id', 'customer no', 'customer number', 'member no',
      'member number', 'rezerv id', 'รหัสลูกค้า', 'รหัสสมาชิก'],
    name: ['name', 'full name', 'customer name', 'member name', 'client name', 'student name', 'customer', 'member',
      'client', 'student', 'first name', 'firstname', 'given name', 'ชื่อ', 'ชื่อลูกค้า', 'ชื่อสมาชิก', 'ชื่อนามสกุล', 'ชื่อจริง'],
    lastName: ['last name', 'lastname', 'surname', 'family name', 'นามสกุล'],
    email: ['email', 'e-mail', 'email address', 'e-mail address', 'mail', 'อีเมล', 'อีเมล์'],
    phone: ['phone', 'mobile', 'phone number', 'mobile number', 'mobile phone', 'tel', 'telephone', 'contact number',
      'เบอร์โทร', 'เบอร์โทรศัพท์', 'โทรศัพท์', 'มือถือ', 'เบอร์มือถือ', 'เบอร์'],
  };
  const WHO = { memberRezervId: AL.customer, name: AL.name, lastName: AL.lastName, email: AL.email, phone: AL.phone };
  const CI_KINDS = {
    members: { need: ['name'], fields: { rezervId: ['id', ...AL.customer], name: AL.name, lastName: AL.lastName,
      email: AL.email, phone: AL.phone,
      joinedOn: ['joined', 'joined on', 'join date', 'date joined', 'member since', 'registered', 'registration date',
        'sign up date', 'signup date', 'created', 'created at', 'created date', 'วันที่สมัคร', 'สมัครเมื่อ', 'วันที่ลงทะเบียน'] } },
    visits: { need: ['date'], who: true, fields: {
      rezervId: ['booking id', 'reservation id', 'booking ref', 'booking reference', 'booking number', 'booking no', 'id',
        'รหัสการจอง', 'เลขที่การจอง'],
      ...WHO,
      date: ['class date', 'session date', 'date', 'booking date', 'class start', 'datetime', 'date time', 'start',
        'วันที่เรียน', 'วันที่', 'วันที่จอง'],
      time: ['time', 'start time', 'class time', 'session time', 'เวลา', 'เวลาเริ่ม', 'เวลาเรียน'],
      className: ['class', 'class name', 'service', 'service name', 'session', 'session name', 'activity', 'program',
        'course', 'class type', 'คลาส', 'ชื่อคลาส', 'บริการ'],
      status: ['status', 'booking status', 'attendance status', 'attendance', 'สถานะ', 'สถานะการจอง'],
      checkedInAt: ['checked in at', 'checked in', 'check in time', 'check in', 'checkin', 'checkin time',
        'เวลาเช็คอิน', 'เช็คอิน', 'เช็กอิน'] } },
    payments: { need: ['date', 'amount'], who: true, fields: {
      rezervId: ['payment id', 'transaction id', 'receipt no', 'receipt number', 'invoice no', 'invoice number', 'order id',
        'order no', 'order number', 'reference', 'ref', 'id', 'เลขที่ใบเสร็จ', 'เลขที่อ้างอิง', 'เลขที่ชำระเงิน'],
      ...WHO,
      date: ['payment date', 'paid at', 'paid on', 'date paid', 'transaction date', 'purchase date', 'date', 'created',
        'created at', 'วันที่ชำระ', 'วันที่ชำระเงิน', 'วันที่จ่าย', 'วันที่'],
      amount: ['amount', 'amount paid', 'paid', 'total', 'total paid', 'grand total', 'net', 'price', 'ยอดเงิน', 'ยอดชำระ',
        'จำนวนเงิน', 'ยอดรวม', 'ราคา', 'รวม'],
      item: ['item', 'item name', 'package', 'package name', 'product', 'product name', 'description', 'plan', 'membership',
        'pass', 'service', 'รายการ', 'แพ็กเกจ', 'แพ็คเกจ', 'สินค้า'],
      method: ['method', 'payment method', 'payment type', 'paid by', 'paid with', 'channel', 'payment channel', 'gateway',
        'วิธีชำระ', 'วิธีชำระเงิน', 'ช่องทางชำระเงิน', 'ชำระโดย'],
      vat: ['vat', 'vat amount', 'tax', 'tax amount', 'ภาษี', 'ภาษีมูลค่าเพิ่ม'],
      note: ['note', 'notes', 'remark', 'remarks', 'comment', 'comments', 'หมายเหตุ'],
      status: ['status', 'payment status', 'transaction status', 'payment state', 'state', 'transaction type',
        'สถานะ', 'สถานะการชำระ', 'สถานะการชำระเงิน', 'type'] } },
    passes: { need: ['plan', 'until'], who: true, fields: {
      ...WHO,
      plan: ['plan', 'package', 'package name', 'membership', 'pass', 'product', 'item', 'แพ็กเกจ', 'แพ็คเกจ'],
      until: ['until', 'valid until', 'end date', 'end', 'expiry', 'expiry date', 'expires', 'expires on',
        'expiration date', 'expiration', 'วันหมดอายุ', 'หมดอายุ', 'ใช้ได้ถึง'],
      start: ['start', 'start date', 'valid from', 'from', 'activated', 'activation date', 'วันเริ่ม', 'วันที่เริ่ม', 'เริ่ม'],
      classesLeft: ['classes left', 'credits left', 'remaining', 'remaining classes', 'remaining credits', 'sessions left',
        'balance', 'ครั้งที่เหลือ', 'คงเหลือ', 'เหลือ'] } },
  };
  const nh = s => String(s ?? '').normalize('NFC').toLowerCase().replace(/[\s\-_./:()#*'"]+/g, '');
  const CI_ALL = new Set(Object.values(CI_KINDS).flatMap(k => Object.values(k.fields).flat()).map(nh));
  const CI_BATCH = 1000;
  const CI = { kind: 'members', file: '', rows: [], heads: [], headRow: 0, map: {}, pastBooked: false,
    busy: false, prog: '', msg: '', result: null, checkedSig: null };
  const fieldName = f => STR.en[`f_${CI.kind}_${f}`] ? T(`f_${CI.kind}_${f}`) : T('f_' + f);

  // Excel on a Thai Windows saves "CSV" in the Thai code page, not UTF-8.
  function decodeFile(buf) {
    const b = new Uint8Array(buf);
    if ((b[0] === 0x50 && b[1] === 0x4B) || (b[0] === 0xD0 && b[1] === 0xCF)) return null;   // .xlsx or .xls
    if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b);
    if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(b);
    try { return new TextDecoder('utf-8', { fatal: true }).decode(b); }
    catch { return new TextDecoder('windows-874').decode(b); }
  }
  // Quotes, commas or new lines inside quotes, CRLF; the separator is whichever
  // of , ; or tab the top of the file uses most.
  function parseCsv(text) {
    text = text.replace(/^﻿/, '');
    const n = { ',': 0, ';': 0, '\t': 0 };
    let inQ = false;
    for (const ch of text.slice(0, 4000)) { if (ch === '"') inQ = !inQ; else if (!inQ && ch in n) n[ch]++; }
    const sep = Object.keys(n).reduce((a, b) => n[b] > n[a] ? b : a);
    const recs = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch !== '"') cell += ch;
        else if (text[i + 1] === '"') { cell += '"'; i++; }
        else q = false;
      } else if (ch === '"' && cell === '') q = true;
      else if (ch === sep) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); recs.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); recs.push(row); }
    return recs.map((cells, i) => ({ n: i + 1, cells }));
  }
  function autoMap(kind, heads) {
    const norm = heads.map(nh), used = new Set(), map = {};
    for (const [f, aliases] of Object.entries(CI_KINDS[kind].fields)) {
      for (const a of aliases) {
        const i = norm.findIndex((h, j) => h === nh(a) && !used.has(j));
        if (i >= 0) { map[f] = i; used.add(i); break; }
      }
    }
    return map;
  }
  // One file row as the server reads it: only mapped fields, trimmed, no blanks.
  function rowFor(r) {
    const o = {}, val = i => String(r.cells[i] ?? '').trim();
    for (const f of Object.keys(CI_KINDS[CI.kind].fields)) {
      if (f === 'lastName' || CI.map[f] == null) continue;
      const v = val(CI.map[f]);
      if (v) o[f] = v;
    }
    if (CI.map.lastName != null && val(CI.map.lastName)) o.name = [o.name, val(CI.map.lastName)].filter(Boolean).join(' ');
    return o;
  }
  // What makes a row with no Rezerv ID that row, as the server tells them apart.
  const CI_SAME = { visits: ['memberRezervId', 'email', 'phone', 'name', 'date', 'time', 'className'],
    payments: ['memberRezervId', 'email', 'phone', 'name', 'date', 'item', 'amount'] };
  // Batches of consecutive file rows, so the server's row numbers match the file.
  // Identical rows (two drop-ins on one day, no payment ID) are numbered over
  // the whole file: the server sees one batch, and would take the second one,
  // sent in the next batch, for the first.
  function ciBatches() {
    const out = [], seen = new Map(), same = CI_SAME[CI.kind];
    for (const r of CI.rows) {
      const o = rowFor(r);
      if (same && !o.rezervId) {
        const k = JSON.stringify(same.map(f => o[f] ?? ''));
        const n = (seen.get(k) || 0) + 1;
        seen.set(k, n);
        if (n > 1) o.nth = n;
      }
      const cur = out[out.length - 1];
      if (cur && cur.rows.length < CI_BATCH && r.n === cur.first + cur.rows.length) cur.rows.push(o);
      else out.push({ first: r.n, rows: [o] });
    }
    return out;
  }
  // The server's reasons and notes come in English, with a code to say them in Thai.
  const ciSay = (x, text) => LANG !== 'en' && x.code && STR[LANG]['ci_' + x.code] ? T('ci_' + x.code, ...(x.vals || [])) : text;
  const ciSig = () => JSON.stringify([CI.kind, CI.file, CI.rows.length,
    Object.keys(CI_KINDS[CI.kind].fields).map(f => CI.map[f] ?? null), CI.kind === 'visits' && CI.pastBooked]);
  const ciReset = () => { CI.result = null; CI.prog = ''; };
  function paintImport() { const b = $('#ciBox'); if (b) b.innerHTML = importInner(); }

  window.ciKind = k => { if (CI.busy || !CI_KINDS[k]) return; CI.kind = k; CI.map = autoMap(k, CI.heads); ciReset(); paintImport(); };
  window.ciMap = (f, v) => { if (CI.busy) return; if (v === '') delete CI.map[f]; else CI.map[f] = Number(v); ciReset(); paintImport(); };
  window.ciPast = on => { if (CI.busy) return; CI.pastBooked = !!on; ciReset(); paintImport(); };
  window.ciPick = async input => {
    const f = input.files && input.files[0];
    if (!f || CI.busy) return;
    Object.assign(CI, { file: f.name, rows: [], heads: [], headRow: 0, map: {}, msg: '', checkedSig: null });
    ciReset();
    let text;
    try { text = decodeFile(await f.arrayBuffer()); } catch { CI.msg = T('ciBadFile'); paintImport(); return; }
    if (text == null) { CI.msg = T('ciExcel'); paintImport(); return; }
    const filled = parseCsv(text).filter(r => r.cells.some(c => c.trim()));
    // The headings are the row, of the first ten, that names the most fields we know.
    let head = filled[0], best = 0;
    for (const r of filled.slice(0, 10)) {
      const k = r.cells.filter(c => CI_ALL.has(nh(c))).length;
      if (k > best) { best = k; head = r; }
    }
    const rows = head ? filled.filter(r => r.n > head.n) : [];
    if (!rows.length) { CI.msg = T('ciEmpty'); paintImport(); return; }
    CI.headRow = head.n;
    CI.heads = head.cells.map((c, i) => c.trim() || `#${i + 1}`);
    CI.rows = rows;
    CI.map = autoMap(CI.kind, CI.heads);
    paintImport();
  };

  function importInner() {
    const k = CI.kind, K = CI_KINDS[k], dis = CI.busy ? 'disabled' : '';
    let h = `<b>${T('ciTitle')}</b><p class="muted">${esc(T('ciHelp'))}</p>
      <div class="row2"><label>${T('ciKind')}<br><select onchange="ciKind(this.value)" ${dis}>
        ${Object.keys(CI_KINDS).map(x => `<option value="${x}" ${x === k ? 'selected' : ''}>${esc(T('kind_' + x))}</option>`).join('')}</select></label>
      <label>${T('ciFile')}<br><input type="file" accept=".csv,.tsv,.txt,text/csv" onchange="ciPick(this)" ${dis} style="max-width:100%"></label></div>`;
    if (CI.msg) h += `<p class="warnline">${esc(CI.msg)}</p>`;
    if (!CI.rows.length) return h;
    const fields = Object.keys(K.fields);
    h += `<p class="muted">${esc(T('ciRead', CI.file, CI.rows.length.toLocaleString(), CI.headRow))}</p>
      <p style="margin-bottom:0"><b>${T('ciMapH')}</b></p><p class="muted" style="margin-top:2px">${esc(T('ciMapHelp'))}</p>
      <div class="cimap">${fields.map(f => `<label for="cm_${f}">${esc(fieldName(f))}${K.need.includes(f) ? ' *' : ''}</label>
        <select id="cm_${f}" onchange="ciMap('${f}',this.value)" ${dis}><option value="">${esc(T('ciNotUsed'))}</option>
          ${CI.heads.map((c, i) => `<option value="${i}" ${CI.map[f] === i ? 'selected' : ''}>${esc(CI.heads.indexOf(c) === i ? c : `${c} (${i + 1})`)}</option>`).join('')}
        </select>`).join('')}</div>`;
    const cols = fields.filter(f => f !== 'lastName' && (CI.map[f] != null || (f === 'name' && CI.map.lastName != null)));
    h += `<p style="margin-bottom:4px"><b>${T('ciPreviewH')}</b></p>
      ${tbl([[T('thRow'), 'n'], ...cols.map(f => [fieldName(f)])], CI.rows.slice(0, 5).map(r => {
        const o = rowFor(r);
        return `<tr><td class="n muted">${r.n}</td>${cols.map(f => `<td>${o[f] != null ? esc(o[f]) : '<span class="muted">–</span>'}</td>`).join('')}</tr>`;
      }), '', cols.length > 3)}`;
    if (k === 'visits') h += `<p><label style="display:flex;gap:8px;align-items:flex-start;font-size:14px">
      <input type="checkbox" style="width:auto;margin-top:4px" ${CI.pastBooked ? 'checked' : ''} onchange="ciPast(this.checked)" ${dis}>
      <span>${esc(T('ciPastBooked'))}</span></label></p>`;
    const miss = K.need.filter(f => CI.map[f] == null);
    const noWho = K.who && !Object.keys(WHO).some(f => CI.map[f] != null);
    if (miss.length) h += `<p class="warnline">${esc(T('ciNeed', miss.map(fieldName).join(', ')))}</p>`;
    if (noWho) h += `<p class="warnline">${esc(T('ciNeedWho'))}</p>`;
    const ready = !miss.length && !noWho, checked = CI.checkedSig === ciSig();
    h += `<p><button class="btn" onclick="ciRun(true)" ${!ready || CI.busy ? 'disabled' : ''}>${T('ciCheck')}</button>
      <button class="btn pink" onclick="ciRun(false)" ${!ready || CI.busy || !checked ? 'disabled' : ''}>${T('ciImport')}</button></p>
      ${ready && !checked && !CI.busy && !CI.result ? `<p class="muted">${T('ciCheckFirst')}</p>` : ''}
      <p id="ciProg" class="muted" aria-live="polite">${esc(CI.prog)}</p>`;
    if (CI.result) h += ciResult(CI.result);
    return h;
  }

  function ciResult(s) {
    const n = [['ciTotal', s.total], ['ciAdded', s.added], ['ciMatched', s.matched], ['ciUpdated', s.updated],
      ['ciNewMembers', s.newMembers], ['ciSkipped', s.skipped.length]];
    return `<div class="box" style="background:var(--blush);margin-bottom:0">
      <b>${T(s.dry ? 'ciCheckDone' : 'ciImportDone')}</b>
      ${s.stopped ? `<p class="warnline">${esc(T('ciStopped', s.stopped.row, s.stopped.error))}</p>` : ''}
      <div class="tiles">${n.map(([k, v]) => tile(T(k), v.toLocaleString())).join('')}</div>
      ${s.pastBooked ? `<p class="warnline">${esc(T('ciPastNote', s.pastBooked))}</p>` : ''}
      ${s.dry && s.batches > 1 && s.newMembers ? `<p class="muted">${esc(T('ciBatchNote'))}</p>` : ''}
      ${s.skipped.length ? `<p style="margin-bottom:4px"><b>${T('ciSkippedH')}</b>
        <button class="btn gray sm" onclick="ciSkippedCsv()">${T('ciSkippedCsv')}</button></p>
        <div class="list">${s.skipped.map(x => `<div><span class="muted">${esc(T('ciRow', x.row))}</span> ${esc(ciSay(x, x.reason))}</div>`).join('')}</div>` : ''}
      ${s.warnings.length ? `<p style="margin-bottom:4px"><b>${T('ciWarnH')}</b></p>
        <div class="list">${s.warnings.map(w => `<div>${w.row != null ? `<span class="muted">${esc(T('ciRow', w.row))}</span> ` : ''}${esc(ciSay(w, w.message))}</div>`).join('')}</div>` : ''}
    </div>`;
  }

  // Check (dryRun) or Import, every batch in turn. A batch that fails stops the
  // run: what came before it is saved, and running again adds nothing twice.
  window.ciRun = async dry => {
    if (CI.busy || !CI.rows.length) return;
    const k = CI.kind, total = CI.rows.length;
    if (!dry && (CI.checkedSig !== ciSig() || !confirm(T('ciConfirm', total.toLocaleString(), T('kind_' + k))))) return;
    const sig = ciSig(), batches = ciBatches();
    const sum = { dry, total: 0, added: 0, matched: 0, updated: 0, newMembers: 0, skipped: [], warnings: [],
      pastBooked: 0, batches: batches.length, stopped: null };
    CI.busy = true; CI.result = null; CI.prog = T(dry ? 'ciChecking' : 'ciImporting', 0, total);
    window.onbeforeunload = () => true;
    paintImport();
    let done = 0;
    for (const b of batches) {
      let r = null, j = {};
      try {
        r = await api('/api/bkk/admin/import/' + k, { method: 'POST', body: JSON.stringify({ rows: b.rows, dryRun: dry,
          firstRow: b.first, ...(k === 'visits' && CI.pastBooked ? { pastBookedAttended: true } : {}) }) });
        j = await r.json().catch(() => ({}));
      } catch (e) { j = { error: e.message }; }
      if (!r || !r.ok) { sum.stopped = { row: b.first, error: j.error || (r ? 'HTTP ' + r.status : T('failed')) }; break; }
      for (const x of ['total', 'added', 'matched', 'updated', 'newMembers']) sum[x] += j[x] || 0;
      sum.skipped.push(...(j.skipped || []));
      for (const w of j.warnings || []) {
        if (w.row == null && w.code === 'pastBooked') sum.pastBooked += Number(w.vals[0]) || 0; else sum.warnings.push(w);
      }
      done += b.rows.length;
      CI.prog = T(dry ? 'ciChecking' : 'ciImporting', done, total);
      const p = $('#ciProg'); if (p) p.textContent = CI.prog;
    }
    CI.busy = false; window.onbeforeunload = null;
    CI.prog = '';
    CI.result = sum;
    CI.checkedSig = dry && !sum.stopped ? sig : null;
    paintImport();
  };

  window.ciSkippedCsv = () => {
    const s = CI.result;
    if (!s || !s.skipped.length) return;
    const byN = new Map(CI.rows.map(r => [r.n, r]));
    const fields = Object.keys(CI_KINDS[CI.kind].fields).filter(f => CI.map[f] != null);
    const cell = v => `"${String(v ?? '').replace(/^[=+\-@\t\r]/, "'$&").replace(/"/g, '""')}"`;
    const lines = [['row', 'reason', ...fields].join(',')].concat(s.skipped.map(x => {
      const r = byN.get(x.row);
      return [x.row, cell(ciSay(x, x.reason)), ...fields.map(f => cell(r ? r.cells[CI.map[f]] : ''))].join(',');
    }));
    saveBlob(new Blob(['﻿' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' }),
      `${CI.file.replace(/\.[^.]*$/, '')}-skipped.csv`);
  };

  let LINKS = {};                       // social links, loaded with the tab

      <input data-k="name" placeholder="${T('teeName')}" value="${esc(x.name || '')}" style="width:60%">

  };

  window.retireProduct = async (code) => {
    if (!confirm(T('qRetire', code))) return;
    const r = await api('/api/bkk/admin/products', { method: 'POST',
      body: JSON.stringify({ code, active: false }) });
    if (await shout(r)) renderSettings();
  };

  window.newProduct = async () => {
    const nameEn = ask(T('qPkgName')); if (!nameEn) return;
    const code = ask(T('qPkgCode'),
      nameEn.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12)); if (!code) return;
    const kind = ask(T('qPkgKind'), 'credits');
    if (!kind) return;
    const priceThb = ask(T('qPkgPrice')); if (!priceThb) return;
    const validDays = ask(T('qPkgDays'), '90'); if (!validDays) return;
    const credits = kind === 'credits' ? ask(T('qPkgClasses'), '10') : null;
    if (kind === 'credits' && !credits) return;
    const r = await api('/api/bkk/admin/products', { method: 'POST', body: JSON.stringify({
      code, nameEn, kind, priceThb: Number(priceThb),
      validDays: Number(validDays), credits: credits ? Number(credits) : undefined }) });
    if (await shout(r)) renderSettings();
  };

  window.letterCsv = async () => {
    const r = await api('/api/bkk/admin/newsletter?csv=1');
    if (!r.ok) { alert(T('failed')); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob());
    a.download = 'aybkk-letter-emails.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  window.saveLinks = async () => {
    const links = {};
    for (const k of ['instagram', 'youtube', 'tiktok', 'line', 'wechat', 'facebook', 'shop', 'telegram']) {
      links[k] = $('#lk_' + k).value.trim();
    }
    const r = await api('/api/bkk/admin/settings', { method: 'POST', body: JSON.stringify({ links }) });
    const j = await shout(r);
    if (j) { LINKS = links; alert(T('saved')); }
  };

  window.saveSur = async () => {
    const v = Number($('#sur').value);
    const r = await api('/api/bkk/admin/settings', { method: 'POST',
      body: JSON.stringify({ surchargePct: v }) });
    if (!r.ok) return alert(T('failed'));
    renderSettings();
  };

  if (KEY) { $('#key').value = KEY; unlock(); }
})();
</script>
</body>
</html>
