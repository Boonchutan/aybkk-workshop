<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>AYBKK Door</title>
<style>
  @font-face{font-family:'Work Sans';src:url('/fonts/worksans.woff2') format('woff2');font-weight:100 900;font-display:swap}
  @font-face{font-family:'Plex';src:url('/fonts/plexthai.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Plex';src:url('/fonts/plexthai-th.woff2') format('woff2');
    unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;font-display:swap}
  /* The door tablet at 05:20 in a dark shala: dark whatever the iPad's theme is.
     Plain CSS for iPadOS 16 Safari: no nesting, no :has(), no container queries. */
  :root{--wall:#120d16;--paper:#1e1723;--paper2:#271e2d;--ink:#f5e9f0;--soft:#b6a3bc;--line:rgba(245,233,240,.14);
    --plum:#c07ec8;--pink:#ff6fae;--in:#3ddc97;--warn:#ffc857;--bad:#ff8f8f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--wall);color:var(--ink)}
  body{font:18px/1.45 'Plex',-apple-system,'Helvetica Neue','PingFang SC','Hiragino Sans GB',sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow-x:hidden}
  button{font:inherit;color:inherit;touch-action:manipulation}
  .num{font-family:'Work Sans','Plex',-apple-system,'Helvetica Neue','PingFang SC','Hiragino Sans GB',sans-serif;font-variant-numeric:tabular-nums}
  .th{font-size:.92em;color:var(--soft)}
  /* Plex has no Cyrillic or Chinese: a Russian or Chinese line takes the iPad's own font from end to end,
     so its digits and commas match its letters. Names and times keep theirs. */
  .w:lang(ru),.w:lang(zh){font-family:-apple-system,'Helvetica Neue','PingFang SC','Hiragino Sans GB',sans-serif}

  /* No internet: a yellow bar over everything, the list greyed and still. */
  #offline{position:fixed;left:0;right:0;top:0;z-index:40;background:var(--warn);color:#241a02;
    padding:14px 24px calc(14px + env(safe-area-inset-top,0px));font-weight:700;font-size:19px;text-align:center}
  #offline span{display:block;font-weight:600;font-size:16px}
  body.off .grid,body.off .qrbox p{filter:grayscale(1);opacity:.45}
  body.off{padding-top:var(--offH,0px)}
  body.off header{top:var(--offH,0px)}

  /* Pairing */
  #pair{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
  #pair h1{font-family:'Work Sans',sans-serif;font-weight:900;font-size:44px;letter-spacing:.04em;margin:0}
  #pair .sub{color:var(--soft);margin:4px 0 36px}
  #code{font-family:'Work Sans',sans-serif;font-weight:800;font-size:96px;letter-spacing:.12em;line-height:1.1;
    background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 36px;margin:0 0 28px;white-space:nowrap}
  #pair .say{font-size:22px;max-width:640px;margin:0 0 6px}
  #pair .say.th{font-size:20px}
  #pairMsg{min-height:1.5em;margin-top:22px;color:var(--warn)}
  #pair .stu{background:var(--paper);border:1px solid var(--warn);border-radius:16px;padding:16px 24px;margin:0 0 30px;max-width:720px}
  #pair .stu b{display:block;font-size:24px}
  #pair .stu span{display:block;font-size:20px;color:var(--soft)}
  #pair .stu span.more{font-size:18px}

  /* The class list */
  header{position:sticky;top:0;z-index:10;background:#17121a;border-bottom:1px solid var(--line);
    padding:16px 24px;display:flex;align-items:center;gap:20px}
  header .cls{flex:1;min-width:0}
  header .cls b{display:block;font-size:24px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  header .cls b .num{color:var(--plum);margin-right:8px}
  header .cls > span{display:block;color:var(--soft);font-size:16px}
  header .cls.keep,#offline.keep{display:flex;flex-direction:column;justify-content:center}
  #clock{font-size:54px;font-weight:700;line-height:1}
  .langs{display:flex;gap:8px}
  .langs button{min-width:62px;height:52px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);
    font-size:18px;font-weight:600;cursor:pointer}
  .langs button.on{background:var(--plum);border-color:var(--plum);color:#17121a}
  main{padding:20px 24px 24px}
  .lead{font-size:21px;margin:0 0 18px}
  .lead .th{display:block}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:16px}
  .tile{position:relative;min-height:176px;min-width:0;border-radius:18px;border:1px solid var(--line);background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px 10px;cursor:pointer;text-align:center}
  .tile:active{background:var(--paper2)}
  .ini{position:relative;overflow:hidden;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Work Sans',sans-serif;font-weight:700;font-size:32px;color:#17121a;flex:none}
  /* The student's photo over the initials, drawn only once it has loaded. */
  .ini img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:0;transition:opacity .2s}
  .ini img.on{opacity:1}
  .tile .nm{font-size:23px;font-weight:600;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
  .tile .at{position:absolute;top:10px;left:12px;font-size:14px;color:var(--soft)}
  .tile.in{border-color:rgba(61,220,151,.45);background:#18131c}
  .tile.in .ini,.tile.in .nm,.tile.in .at{opacity:.4}
  .tile .ok{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:var(--in);color:#0d1a14;
    display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;line-height:1}
  .empty{color:var(--soft);font-size:21px;text-align:center;padding:40px 10px}
  /* Pinned to the bottom of the screen: a walk-in sees it however long the list is. */
  .qrbox{position:-webkit-sticky;position:sticky;bottom:12px;z-index:5;margin-top:24px;display:flex;align-items:center;gap:22px;
    background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 20px;box-shadow:0 0 0 12px var(--wall)}
  #qr{flex:none;width:124px;height:124px;background:#fff;border-radius:10px;padding:5px}
  #qr svg{display:block;width:100%;height:100%}
  .qrbox p{margin:0;font-size:21px;font-weight:600}
  .qrbox p.th{font-size:19px;font-weight:400;margin-top:4px}

  /* Waiting, moon day, night */
  .still{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px}
  .still .big{font-size:160px;font-weight:700;line-height:1;letter-spacing:.02em}
  .still .next{font-size:30px;margin:34px 0 6px;max-width:900px}
  .still .next.th{font-size:26px;margin-top:0}
  .still .next.more{font-size:22px;color:var(--soft);margin:16px 0 0}
  .still .next.more + .more{margin-top:4px}
  .still .next.more:empty{display:none}
  #waitZh{word-break:keep-all}
  #night{background:#000}
  #night .num{font-size:40px;color:#4a3d50}

  /* Is this you? / Welcome / See the teacher: full screen over the list */
  .over{position:fixed;inset:0;z-index:30;background:#0d0910;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:40px 32px}
  .over .ini{width:150px;height:150px;font-size:58px;margin-bottom:26px}
  .over .q{font-size:34px;margin:0}
  .over .q2{font-size:24px;color:var(--soft);margin:2px 0 0}
  .over .who{font-size:64px;font-weight:700;margin:14px 0 40px;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
  .over .when{font-size:26px;color:var(--plum);margin:-28px 0 34px}
  #result .r0{font-size:26px;color:var(--plum);margin:0 0 10px}
  #yes{min-width:420px;max-width:100%;padding:28px 40px;border:none;border-radius:20px;background:var(--in);color:#0d1a14;
    font-size:32px;font-weight:700;cursor:pointer}
  #yes small{display:block;font-size:20px;font-weight:600;opacity:.8}
  #yes:disabled{opacity:.5}
  #no{margin-top:22px;min-width:220px;padding:16px 30px;border:1px solid var(--line);border-radius:16px;background:var(--paper);
    font-size:22px;cursor:pointer}
  #no small{display:block;font-size:16px;color:var(--soft)}
  .over .langs{margin-top:44px}
  #result.good{background:#092419}
  #result.good .mark{width:150px;height:150px;border-radius:50%;background:var(--in);color:#0d1a14;display:flex;align-items:center;
    justify-content:center;font-size:96px;font-weight:800;margin-bottom:30px}
  #result.bad{background:#1a141e}
  #result.bad .mark{width:150px;height:150px;border-radius:50%;background:var(--paper2);border:3px solid var(--warn);color:var(--warn);
    display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:800;margin-bottom:30px}
  #result .r1{font-size:44px;font-weight:700;margin:0;max-width:960px;overflow-wrap:anywhere}
  #result .r2{font-size:30px;margin:8px 0 0;max-width:960px}
  #result .r3{font-size:24px;color:var(--soft);margin:22px 0 0;max-width:960px}
  #result .r4{font-size:22px;color:var(--soft);margin:4px 0 0;max-width:960px}

  @media (max-width:700px){
    header{flex-wrap:wrap;padding:12px 16px}
    #clock{font-size:40px}
    main{padding:16px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:12px}
    .qrbox{flex-direction:column;text-align:center;position:static}
    #code{font-size:54px;padding:16px 20px}
    .still .big{font-size:96px}
    .over .who{font-size:44px}
    #yes{min-width:0;width:100%}
  }
</style>
</head>
<body>

<div id="offline" class="w" hidden role="alert"></div>

<section id="pair" hidden>
  <h1>AYBKK</h1>
  <p class="sub">แท็บเล็ตหน้าประตู · Door tablet</p>
  <p class="stu" id="stu"></p>
  <div id="code" class="num" aria-live="polite">&nbsp;</div>
  <p class="say">Ask Boonchu or M to type this code in Admin, Settings, Door tablets.</p>
  <p class="say th">ให้ Boonchu หรือ M พิมพ์รหัสนี้ใน Admin หน้า ตั้งค่า ช่อง แท็บเล็ตหน้าประตู</p>
  <p class="th" style="margin-top:14px">รหัสเปลี่ยนทุก 10 นาที · The code changes every 10 minutes.</p>
  <p id="pairMsg" role="status"></p>
</section>

<section id="list" hidden>
  <header>
    <div class="cls w" id="classes"></div>
    <div class="langs" id="langsTop"></div>
    <div id="clock" class="num" aria-label="Bangkok time"></div>
  </header>
  <main>
    <p class="lead w" id="lead"></p>
    <div class="grid" id="grid"></div>
    <div class="qrbox">
      <div id="qr" aria-hidden="true"></div>
      <div><p class="w" id="qrA"></p>
        <p class="th" id="qrB"></p></div>
    </div>
  </main>
</section>

<section id="wait" class="still" hidden>
  <div class="big num" id="waitClock"></div>
  <p class="next" id="waitEn" lang="en"></p>
  <p class="next th" id="waitTh" lang="th"></p>
  <p class="next more w" id="waitZh" lang="zh-Hans"></p>
  <p class="next more w" id="waitRu" lang="ru"></p>
</section>

<section id="night" class="still" hidden><div class="num" id="nightClock"></div></section>

<div id="confirm" class="over" hidden role="dialog" aria-modal="true" aria-labelledby="cWho">
  <div class="ini" id="cIni"></div>
  <p class="q w" id="cQ"></p>
  <p class="q2" id="cQ2"></p>
  <div class="who" id="cWho"></div>
  <p class="when num" id="cAt" hidden></p>
  <button id="yes" class="w"></button>
  <button id="no" class="w"></button>
  <div class="langs" id="langsOver"></div>
</div>

<div id="result" class="over" hidden role="status" aria-live="assertive">
  <div class="mark" id="rMark"></div>
  <p class="r0 num" id="rAt" hidden></p>
  <p class="r1 w" id="r1"></p>
  <p class="r2 w" id="r2"></p>
  <p class="r3 w" id="r3"></p>
  <p class="r4 w" id="r4"></p>
</div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (_) {} },
  };
  // This browser is the door: no staff key, no student sign-in, ever.
  ['aybkk_bkk_key', 'aybkk_member', 'aybkk_teacher_key', 'aybkk_teacher_known', 'aybkk_shop_key', 'aybkk_loc_key'].forEach(store.del);
  try { sessionStorage.clear(); } catch (_) {}
  var KEY_NAME = 'aybkk_door_key';
  var KEY = store.get(KEY_NAME) || '';

  // Every word a student reads here. LANG null = Thai and English together; a
  // language button turns the list, the confirm and the result into that one
  // language for this student only. Screens with no buttons show all four.
  var WORDS = {
    th: { q: 'ใช่คุณไหม', yes: 'ใช่ เช็กอินเลย', no: 'ไม่ใช่',
      hi: function (n) { return 'ยินดีต้อนรับ ' + n; }, done: 'เช็กอินเรียบร้อยแล้ว',
      already: function (t) { return 'เช็กอินไว้แล้วเมื่อ ' + t + ' น.'; },
      bad: 'เช็กอินที่นี่ไม่ได้', bad2: 'กรุณาบอกครู หรือทักมาทาง LINE @aybkk',
      lead: 'แตะชื่อของคุณเพื่อเช็กอิน', qr: 'ไม่เจอชื่อของคุณ? จองคลาสในโทรศัพท์ก่อน แล้วแตะชื่อของคุณ',
      none: 'ยังไม่มีชื่อในรายการ', isIn: 'เช็กอินแล้ว',
      off: 'ไม่มีอินเทอร์เน็ต ระบบยังไม่ได้บันทึกการเช็กอิน กรุณาบอกครู',
      stop: 'ตอนนี้ยังเช็กอินที่นี่ไม่ได้ กรุณาบอกครู',
      moon: 'วันพระจันทร์ AYBKK ปิดวันนี้',
      tomorrow: 'พรุ่งนี้', days: ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'],
      time: function (t) { return t + ' น.'; },
      next: function (d, c, t, o) { return 'คลาสถัดไป: ' + (d ? d + ' ' : '') + c + ' ' + t + ' น. รายชื่อขึ้นตั้งแต่ ' + o + ' น.'; } },
    en: { q: 'Is this you?', yes: 'Yes, check me in', no: 'No',
      hi: function (n) { return 'Welcome, ' + n.replace(/\.$/, '') + '.'; }, done: 'You are checked in.',
      already: function (t) { return 'Already checked in at ' + t + '.'; },
      bad: 'We can’t check you in here.', bad2: 'Please see the teacher, or message LINE @aybkk.',
      lead: 'Tap your name to check in.', qr: 'Not on the list? Book on your phone, then tap your name.',
      none: 'Nobody is on the list yet.', isIn: 'checked in',
      off: 'No internet. Your tap is not saved. Please tell the teacher.',
      stop: 'Check-in is not working right now. Please tell the teacher.',
      moon: 'Moon day. The shala is closed today.',
      tomorrow: 'Tomorrow', days: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
      time: function (t) { return t; },
      next: function (d, c, t, o) { return 'Next class: ' + (d ? d + ', ' : '') + c + ' ' + t + '. Names show from ' + o + '.'; } },
    zh: { q: '这是你吗？', yes: '是的，帮我签到', no: '不是',
      hi: function (n) { return '欢迎你，' + n; }, done: '签到成功。',
      already: function (t) { return '你已在 ' + t + ' 签到。'; },
      bad: '这里无法为你签到。', bad2: '请找老师，或在 LINE 上联系 @aybkk。',
      lead: '点击你的名字签到。', qr: '名单上没有你？先用手机预约，再点击你的名字。',
      none: '名单上还没有人。', isIn: '已签到',
      off: '没有网络，签到未保存。请告诉老师。',
      stop: '现在无法在这里签到，请告诉老师。',
      moon: '今天是月亮日，道场停课。',
      tomorrow: '明天', days: ['周日', '周一', '周二', '周三', '周四', '周五', '周六'],
      time: function (t) { return t; },
      next: function (d, c, t, o) { return '下一节课：' + (d ? d + ' ' : '') + t + ' ' + c + '。' + o + ' 开始显示名单。'; } },
    ru: { q: 'Это вы?', yes: 'Да, отметьте меня', no: 'Нет',
      hi: function (n) { return 'Добро пожаловать, ' + n + '!'; }, done: 'Вы отмечены.',
      already: function (t) { return 'Вы уже отмечены в ' + t + '.'; },
      bad: 'Здесь не получается отметиться.', bad2: 'Подойдите к учителю или напишите нам в LINE @aybkk.',
      lead: 'Нажмите на своё имя, чтобы отметиться.', qr: 'Вас нет в списке? Запишитесь на занятие с телефона, затем нажмите на своё имя.',
      none: 'В списке пока никого нет.', isIn: 'отметка есть',
      off: 'Нет интернета. Отметка не сохранилась. Пожалуйста, сообщите учителю.',
      stop: 'Сейчас здесь не получается отметиться. Пожалуйста, сообщите учителю.',
      moon: 'Лунный день. Сегодня шала закрыта.',
      tomorrow: 'завтра', days: ['в воскресенье', 'в понедельник', 'во вторник', 'в среду', 'в четверг', 'в пятницу', 'в субботу'],
      time: function (t) { return t; },
      next: function (d, c, t, o) { return 'Следующее занятие: ' + (d ? d + ' ' : '') + 'в ' + t + ', ' + c + '. Список появится в ' + o + '.'; } },
  };
  var LANGS = [['th', 'ไทย'], ['en', 'EN'], ['zh', '中文'], ['ru', 'RU']];
  var HTML_LANG = { th: 'th', en: 'en', zh: 'zh-Hans', ru: 'ru' };
  var LANG = null;
  // Class names as the booking page (bkk.html) shows them, so a student sees the
  // name they booked. Anything not listed stays as the shala wrote it.
  var CLASS_WORDS = {
    th: [[/\[Online\]/g, '[ออนไลน์]'], [/Mysore Sunday/g, 'มายซอร์ วันอาทิตย์'], [/Mysore/g, 'มายซอร์'],
      [/\(1st batch\)/g, '(รอบแรก)'], [/\(2nd batch\)/g, '(รอบสอง)'], [/ series/g, '']],
    zh: [[/\[Online\]/g, '[线上]'], [/Mysore Sunday/g, '周日迈索尔'], [/Mysore/g, '迈索尔'],
      [/\(1st batch\)/g, '（第一批）'], [/\(2nd batch\)/g, '（第二批）'],
      [/Led Primary series/g, '初级序列引导课'], [/Led Intermediate series/g, '中级序列引导课']],
    ru: [[/\[Online\]/g, '[Онлайн]'], [/Mysore Sunday/g, 'Майсор, воскресенье'], [/Mysore/g, 'Майсор'],
      [/\(1st batch\)/g, '(1-й поток)'], [/\(2nd batch\)/g, '(2-й поток)'],
      [/Led Primary series/g, 'Led: первая серия'], [/Led Intermediate series/g, 'Led: промежуточная серия']],
  };
  var cls = function (l, t) { return (CLASS_WORDS[l] || []).reduce(function (s, r) { return s.replace(r[0], r[1]); }, String(t || '')); };

  // Bangkok time from the server's clock, never the iPad's time zone.
  var base = { server: 0, local: 0 };
  var nowMs = function () { return base.server ? base.server + (Date.now() - base.local) : Date.now(); };
  var bkk = function (ms) { return new Date(ms + 7 * 3600000).toISOString(); };
  var hm = function (ms) { return bkk(ms).slice(11, 16); };
  var bkkMin = function (ms) { var s = bkk(ms); return Number(s.slice(11, 13)) * 60 + Number(s.slice(14, 16)); };
  var atMs = function (d, t) { return Date.parse(d + 'T' + t + ':00+07:00'); };

  var DATA = null, PENDING = null, OFF = false, SCREEN = '', OPEN = null, lastTouch = 0, STALE = false;
  // Seats checked in from this screen (handle: time), kept on any list that was
  // fetched before the tap, so a tile never looks not checked in again.
  var DONE = {};
  var timers = { load: null, over: null, poll: null };
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function show(id) {
    SCREEN = id;
    ['pair', 'list', 'wait', 'night'].forEach(function (s) { $('#' + s).hidden = s !== id; });
  }
  function setOffline(on) {
    OFF = on;
    $('#offline').hidden = !on;
    document.body.classList.toggle('off', on);
    if (on) document.documentElement.style.setProperty('--offH', $('#offline').offsetHeight + 'px');
  }
  // The words on the list screen and the offline bar: one language when one is
  // picked, else as they always were (English over Thai; the bar Thai over English).
  function paintWords() {
    var L = LANG ? WORDS[LANG] : null;
    $('#lead').textContent = L ? L.lead : WORDS.en.lead;
    if (!L) $('#lead').appendChild(el('span', 'th', WORDS.th.lead));
    $('#qrA').textContent = L ? L.qr : WORDS.en.qr;
    $('#qrB').textContent = L ? '' : WORDS.th.qr;
    $('#qrB').hidden = !!L;
    var bar = $('#offline');
    bar.textContent = L ? L.off : WORDS.th.off;
    if (!L) bar.appendChild(el('span', '', WORDS.en.off));
    if (OFF) setOffline(true);
  }
  // While a language is picked, the header, the lead line, the list, the QR box and the bar keep the
  // height they had in Thai + English, so the buttons and the tiles stay put.
  var KEEP = ['#classes', '#lead', '#grid', '.qrbox', '#offline'];
  function setLang(l) {
    KEEP.forEach(function (s) {
      var e = $(s);
      if (l && !LANG) e.style.minHeight = e.getBoundingClientRect().height + 'px';
      if (!l) e.style.minHeight = '';
      e.classList.toggle('keep', !!l);
    });
    LANG = l;
    document.documentElement.lang = HTML_LANG[l || 'th'];
    langButtons($('#langsTop'));
    paintWords();
  }

  var api = function (url, opts) {
    opts = opts || {};
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var t = ctl ? setTimeout(function () { ctl.abort(); }, 10000) : null;
    var h = { 'Content-Type': 'application/json' };
    if (KEY) h['X-Door-Key'] = KEY;
    return fetch(url, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined,
      cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { clearTimeout(t); return r; }, function (e) { clearTimeout(t); throw e; });
  };
  var json = function (r) { return r.json().catch(function () { return {}; }); };

  // ── pairing: this tablet shows a code, staff type it in Admin ─────────────
  function unpaired() {
    KEY = ''; store.del(KEY_NAME);
    DATA = null; PENDING = null; DONE = {}; FACES = {}; closeOverlays();
    clearTimeout(timers.load);
    setOffline(false);
    setLang(null);
    pair();
  }
  // GEN: only the newest pairing request is followed; an older loop stops.
  var GEN = 0;
  function pair() {
    var g = ++GEN;
    show('pair');
    clearTimeout(timers.poll);
    $('#code').textContent = ' ';
    api('/api/bkk/door/pair/start', { method: 'POST' }).then(function (r) {
      return json(r).then(function (d) {
        if (g !== GEN) return;
        if (!r.ok || !d.secret) {
          $('#pairMsg').textContent = r.status === 429 ? 'รอสักครู่ · Please wait a few minutes.' : 'กำลังลองใหม่ · Trying again';
          timers.poll = setTimeout(pair, r.status === 429 ? 60000 : 10000);
          return;
        }
        $('#pairMsg').textContent = '';
        $('#code').textContent = d.code;
        claim(d.secret, g);
      });
    }, function () {
      if (g !== GEN) return;
      $('#pairMsg').textContent = 'ไม่มีอินเทอร์เน็ต · No internet';
      timers.poll = setTimeout(pair, 10000);
    });
  }
  function claim(secret, g) {
    timers.poll = setTimeout(function () {
      if (g !== GEN) return;
      api('/api/bkk/door/pair/claim', { method: 'POST', body: { secret: secret } }).then(function (r) {
        return json(r).then(function (d) {
          if (g !== GEN) return;
          if (d.ok && d.key) { GEN++; KEY = d.key; store.set(KEY_NAME, KEY); start(); return; }
          if (r.status === 404 || d.gone) { pair(); return; }
          claim(secret, g);
        });
      }, function () { if (g === GEN) claim(secret, g); });
    }, 3000);
  }

  // ── the list ───────────────────────────────────────────────────────────────
  function start() {
    $('#pairMsg').textContent = '';
    loadQr();
    load();
  }
  function loadQr() {
    api('/api/bkk/door/qr?origin=' + encodeURIComponent(location.origin)).then(function (r) {
      if (r.status === 401) return;
      return json(r).then(function (d) { if (d.svg) $('#qr').innerHTML = d.svg; });
    }, function () {});
  }
  function schedule(ms) { clearTimeout(timers.load); timers.load = setTimeout(load, ms); }
  var loading = false;
  function load() {
    if (!KEY || loading) return;
    loading = true;
    api('/api/bkk/door/now').then(function (r) {
      if (r.status === 401) { loading = false; unpaired(); return; }
      return json(r).then(function (d) {
        loading = false;
        setOffline(false);
        if (!r.ok) { schedule(20000); return; }
        base = { server: d.now, local: Date.now() };
        if (!$('#qr').firstChild) loadQr();
        if (busy()) PENDING = d; else take(d);
        schedule(d.classes ? 20000 : 60000);
      });
    }, function () {
      loading = false;
      setOffline(true);
      if (SCREEN === 'list') paintList();
      schedule(10000);
    });
  }
  // The list stays still while someone is reading it: the confirm is open, or a
  // finger touched the screen in the last 5 seconds.
  var busy = function () { return !!OPEN || Date.now() - lastTouch < 5000; };
  function take(d) {
    if (!d.classes) DONE = {};
    var keep = {};
    (d.seats || []).forEach(function (s) { if (s.f) keep[faceKey(s.f)] = true; });
    Object.keys(FACES).forEach(function (k) { if (!keep[k]) delete FACES[k]; });
    (d.seats || []).forEach(function (s) { if (!s.in && DONE[s.t]) { s.in = true; s.at = DONE[s.t]; } });
    DATA = d; PENDING = null; render();
  }

  function render() {
    if (!DATA) return;
    var now = nowMs(), m = bkkMin(now);
    if (DATA.classes) { show('list'); paintList(); return; }
    if (m >= 21 * 60 || m < 4 * 60 + 30) { show('night'); $('#nightClock').textContent = hm(now); return; }
    show('wait');
    $('#waitClock').textContent = hm(now);
    // Nobody can pick a language here: all four, English and Thai first.
    var n = DATA.next;
    var today = bkk(now).slice(0, 10), tomorrow = bkk(now + 86400000).slice(0, 10);
    var wd = n ? new Date(n.date + 'T12:00:00Z').getUTCDay() : 0;
    // "Mysore Sunday" already says the day.
    var named = n && String(n.title || '').indexOf(WORDS.en.days[wd]) >= 0;
    [['en', '#waitEn'], ['th', '#waitTh'], ['zh', '#waitZh'], ['ru', '#waitRu']].forEach(function (x) {
      var L = WORDS[x[0]];
      var day = !n || n.date === today ? '' : n.date === tomorrow ? L.tomorrow : named ? '' : L.days[wd];
      $(x[1]).textContent = DATA.moon ? L.moon : n ? L.next(day, cls(x[0], n.title), n.start, n.opens) : '';
    });
  }

  var TONES = ['#c07ec8', '#ff8fbf', '#8fc7ff', '#ffc857', '#7fdcb4', '#f0a882', '#b7a6ff', '#e6d27a'];
  var tone = function (s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return TONES[h % TONES.length]; };
  // "Ana E." gives AE; a Thai leading vowel is not the letter.
  function initials(n) {
    var ws = String(n || '').split(/\s+/).filter(Boolean);
    var first = function (w) { var c = Array.from(w.replace(/^[เ-ไ]+/, '')); return c.length ? c[0] : ''; };
    return ((ws[0] ? first(ws[0]) : '') + (ws.length > 1 ? first(ws[1]) : '')).toUpperCase();
  }
  // A student's profile photo (f) over their initials, in the tile and on "Is
  // this you?" (Boonchu, 20 Nov 2026). Each <img> is kept and moved into the
  // new tile on every repaint, so a photo never blinks and stays on screen with
  // no internet. One that fails to load is taken out (the initials show) and
  // tried again a minute later. Kept by the photo's id, the first part of the
  // link: the link itself changes every 6 hours (07:00 is one), and the photo
  // on screen stays until the new link has loaded. slot: one <img> per tile of
  // that student, and 'c' for "Is this you?".
  var FACES = {};
  var faceKey = function (src) { return String(src).split('/').pop().split('.')[0]; };
  function nextFace(f, slot, old, src) {
    if (!old.className) { old.src = src; return; }
    if (old.nextSrc === src) return;
    old.nextSrc = src;
    var img = document.createElement('img');
    img.alt = '';
    img.onload = function () {
      img.className = 'on';
      if (f.imgs[slot] !== old) return;
      f.imgs[slot] = img;
      if (old.parentNode) old.parentNode.replaceChild(img, old);
    };
    img.src = src;
  }
  function faceImg(src, slot) {
    var k = faceKey(src);
    var f = FACES[k] || (FACES[k] = { imgs: {}, bad: 0, src: src });
    if (f.src !== src) { f.src = src; f.bad = 0; }
    if (f.bad && Date.now() - f.bad < 60000) return null;
    var img = f.imgs[slot];
    if (img) { if (img.getAttribute('src') !== src) nextFace(f, slot, img, src); return img; }
    img = document.createElement('img');
    img.alt = '';
    img.onload = function () { img.className = 'on'; };
    img.onerror = function () {
      f.bad = Date.now();
      if (f.imgs[slot] === img) delete f.imgs[slot];
      if (img.parentNode) img.parentNode.removeChild(img);
    };
    img.src = src;
    if (img.complete && img.naturalWidth) img.className = 'on';
    f.imgs[slot] = img;
    return img;
  }
  function paintIni(box, s, slot) {
    box.textContent = initials(s.n);
    box.style.background = tone(s.n);
    var img = s.f ? faceImg(s.f, slot) : null;
    if (img) box.appendChild(img);
  }
  function paintList() {
    if (!DATA || !DATA.classes) return;
    var head = $('#classes');
    head.textContent = '';
    DATA.classes.forEach(function (c) {
      var b = el('b');
      b.appendChild(el('span', 'num', LANG ? WORDS[LANG].time(c.start) : c.start));
      b.appendChild(document.createTextNode(LANG ? cls(LANG, c.title) : c.title));
      head.appendChild(b);
      if (!LANG) head.appendChild(el('span', '', cls('th', c.title) + ' ' + c.start + ' น.'));
    });
    $('#clock').textContent = hm(nowMs());
    var many = DATA.classes.length > 1;
    // Read aloud in the picked language; with none, in English as always.
    var A = WORDS[LANG || 'en'], sep = LANG === 'zh' ? '，' : ', ';
    var grid = $('#grid');
    grid.textContent = '';
    if (!DATA.seats.length) {
      var p = el('p', 'empty w', LANG ? A.none : WORDS.en.none);
      if (!LANG) p.appendChild(el('span', 'th', ' ' + WORDS.th.none));
      grid.appendChild(p);
      return;
    }
    var used = {};
    DATA.seats.forEach(function (s) {
      var b = el('button', 'tile' + (s.in ? ' in' : ''));
      b.type = 'button';
      b.setAttribute('data-t', s.t);
      var ini = el('span', 'ini');
      if (s.f) used[s.f] = (used[s.f] || 0) + 1;
      paintIni(ini, s, 'g' + (s.f ? used[s.f] : 0));
      ini.setAttribute('aria-hidden', 'true');
      b.appendChild(ini);
      b.appendChild(el('span', 'nm', s.n));
      if (many) b.appendChild(el('span', 'at num', LANG ? A.time(s.c) : s.c));
      if (s.in) { var ok = el('span', 'ok', '✓'); ok.setAttribute('aria-hidden', 'true'); b.appendChild(ok); }
      b.setAttribute('aria-label', s.n + (s.in ? sep + A.isIn : '') + (many ? sep + A.time(s.c) : ''));
      grid.appendChild(b);
    });
  }
  $('#grid').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.tile') : null;
    if (!b || OFF || OPEN || !DATA || !DATA.seats) return;
    var t = b.getAttribute('data-t');
    var s = DATA.seats.filter(function (x) { return x.t === t; })[0];
    if (!s) return;
    // Two people with the same name: the teacher checks them in.
    if (s.same) { result('bad'); return; }
    if (s.in) { result('good', { n: s.n, already: true, at: s.at, c: s.c }); return; }
    ask(s);
  });

  // ── Is this you? ───────────────────────────────────────────────────────────
  function langButtons(box) {
    box.textContent = '';
    LANGS.forEach(function (l) {
      var b = el('button', LANG === l[0] ? 'on' : '', l[1]);
      b.type = 'button';
      b.setAttribute('lang', l[0]);
      b.setAttribute('aria-pressed', LANG === l[0] ? 'true' : 'false');
      b.addEventListener('click', function () {
        setLang(LANG === l[0] ? null : l[0]);
        if (SCREEN === 'list') paintList();
        if (OPEN && OPEN.kind === 'confirm') { paintConfirm(); if (!OPEN.sent) armOver(8000); }
      });
      box.appendChild(b);
    });
  }
  var w = function (k) { return LANG ? [WORDS[LANG][k]] : [WORDS.th[k], WORDS.en[k]]; };
  function twoLines(btn, k) {
    var v = w(k);
    btn.textContent = v[0];
    if (v[1]) btn.appendChild(el('small', '', v[1]));
  }
  function paintConfirm() {
    var s = OPEN.seat, q = w('q');
    paintIni($('#cIni'), s, 'c');
    $('#cQ').textContent = q[0];
    $('#cQ2').textContent = q[1] || '';
    $('#cWho').textContent = s.n;
    $('#cAt').textContent = classAt(s.c);
    $('#cAt').hidden = !classAt(s.c);
    twoLines($('#yes'), 'yes');
    twoLines($('#no'), 'no');
    langButtons($('#langsOver'));
  }
  function armOver(ms) { clearTimeout(timers.over); timers.over = setTimeout(back, ms); }
  // With two classes on the list, the confirm and welcome say which one.
  var classAt = function (c) {
    if (!c || !DATA || !DATA.classes || DATA.classes.length < 2) return '';
    var k = DATA.classes.filter(function (x) { return x.start === c; })[0];
    if (LANG) return WORDS[LANG].time(c) + (k ? ' ' + cls(LANG, k.title) : '');
    return c + (k ? ' ' + k.title : '');
  };
  // A tap that lands in the first moment of a screen is the second half of a
  // double tap on what was under it: ignored, so Yes is always read first.
  var SETTLE_MS = 500;
  var settled = function () { return OPEN && Date.now() - OPEN.at >= SETTLE_MS; };
  function ask(s) {
    OPEN = { kind: 'confirm', seat: s, sent: false, at: Date.now() };
    $('#yes').disabled = false;
    paintConfirm();
    $('#confirm').hidden = false;
    armOver(8000);
  }
  function closeOverlays() {
    clearTimeout(timers.over);
    $('#confirm').hidden = true;
    $('#result').hidden = true;
    OPEN = null;
  }
  // Back to the list, in the default languages. A refresh that waited is drawn
  // only once nobody has touched the screen for 5 s (here, or by the 1 s tick),
  // so the tiles never move under a finger. After a result the next student
  // starts at the top of the list.
  function back() {
    var done = OPEN && OPEN.kind === 'result';
    closeOverlays();
    setLang(null);
    if (done) window.scrollTo(0, 0);
    if (PENDING && !busy()) take(PENDING); else render();
  }
  $('#no').addEventListener('click', function () { if (settled()) back(); });
  $('#yes').addEventListener('click', function () {
    if (!OPEN || OPEN.kind !== 'confirm' || OPEN.sent || !settled()) return;
    var s = OPEN.seat;
    OPEN.sent = true;
    $('#yes').disabled = true;
    clearTimeout(timers.over);
    api('/api/bkk/door/checkin', { method: 'POST', body: { t: s.t } }).then(function (r) {
      if (r.status === 401) { unpaired(); return; }
      return json(r).then(function (d) {
        setOffline(false);
        if (r.ok && d.ok) {
          s.in = true; s.at = d.at; DONE[s.t] = d.at;
          result('good', { n: d.n || s.n, already: !!d.already, at: d.at, c: s.c });
        } else {
          result('bad');
          load();
        }
      });
    }, function () {
      // No internet: the bar in the student's language, 15 s from now, as if they had just touched it.
      lastTouch = Date.now();
      setOffline(true);
      closeOverlays();
      render();
    });
  });

  function result(kind, d) {
    $('#confirm').hidden = true;
    OPEN = { kind: 'result', at: Date.now() };
    $('#rAt').textContent = d ? classAt(d.c) : '';
    $('#rAt').hidden = !$('#rAt').textContent;
    var box = $('#result');
    box.className = 'over ' + kind;
    var langs = LANG ? [LANG] : ['th', 'en'];
    var lines;
    if (kind === 'good') {
      $('#rMark').textContent = '✓';
      lines = d.already ? langs.map(function (l) { return WORDS[l].already(d.at); })
        : [].concat.apply([], langs.map(function (l) { return [WORDS[l].hi(d.n), WORDS[l].done]; }));
      if (d.already) lines.unshift(d.n);
    } else {
      $('#rMark').textContent = '!';
      lines = [].concat.apply([], langs.map(function (l) { return [WORDS[l].bad, WORDS[l].bad2]; }));
    }
    ['#r1', '#r2', '#r3', '#r4'].forEach(function (id, i) { $(id).textContent = lines[i] || ''; $(id).hidden = !lines[i]; });
    box.hidden = false;
    armOver(kind === 'good' ? 4000 : 8000);
  }
  $('#result').addEventListener('click', function () { if (settled()) back(); });

  // ── around the clock ───────────────────────────────────────────────────────
  document.addEventListener('pointerdown', function () { lastTouch = Date.now(); wake(); }, true);
  var PAGE_TAG = null, reloading = false;
  // Reload only once the server answers: a reload with no internet lands on the
  // browser's error page, which never comes back by itself.
  function reloadWhenUp() {
    if (reloading) return;
    reloading = true;
    fetch(location.pathname, { cache: 'no-store' }).then(function (r) {
      reloading = false;
      if (r.ok && STALE && !OPEN && !OFF) { STALE = false; location.reload(); }
    }, function () { reloading = false; });
  }
  // A newer copy of this page on the server (staff phones ran old pages for days
  // on 12 Nov): reload by itself, but only when nobody is using the screen.
  function checkPage() {
    fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      var tag = r.ok ? [r.headers.get('ETag'), r.headers.get('Last-Modified')].filter(Boolean).join(' ') : '';
      if (!tag) return;
      if (PAGE_TAG == null) PAGE_TAG = tag; else if (tag !== PAGE_TAG) STALE = true;
    }, function () {});
  }
  var lastMin = -1, opened = false;
  setInterval(function () {
    var now = nowMs();
    if (SCREEN === 'list') $('#clock').textContent = hm(now);
    if (SCREEN === 'wait') $('#waitClock').textContent = hm(now);
    if (SCREEN === 'night') $('#nightClock').textContent = hm(now);
    if (PENDING && !busy()) take(PENDING);
    var idle = Date.now() - lastTouch;
    // A language someone picked on the list and walked away from.
    if (LANG && !OPEN && idle > 15000) { setLang(null); if (SCREEN === 'list') paintList(); }
    if (!OPEN && idle > 30000 && window.scrollY > 0) window.scrollTo(0, 0);
    if (STALE && !OPEN && !OFF && idle > 60000) reloadWhenUp();
    var m = bkkMin(now);
    if (m !== lastMin) { lastMin = m; if (SCREEN === 'wait' || SCREEN === 'night') render(); }
    // The next window opens: ask now, not at the next minute's refresh.
    var n = DATA && !DATA.classes && DATA.next;
    if (n && !opened && now >= atMs(n.date, n.opens)) { opened = true; load(); }
    if (!n) opened = false;
  }, 1000);
  setInterval(checkPage, 5 * 60000);
  checkPage();

  // Stay awake where Safari has it (16.4 and later); Guided Access keeps Auto-Lock off anyway.
  var lock = null;
  function wake() {
    if (lock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
    try {
      navigator.wakeLock.request('screen').then(function (l) {
        lock = l;
        l.addEventListener('release', function () { lock = null; });
      }, function () {});
    } catch (_) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { wake(); if (KEY) load(); }
  });

  // The pairing screen has no buttons: the student line in all four.
  ['en', 'th', 'zh', 'ru'].forEach(function (l, i) {
    var s = el(i ? 'span' : 'b', i > 1 ? 'more w' : '', WORDS[l].stop);
    s.lang = HTML_LANG[l];
    $('#stu').appendChild(s);
  });
  setLang(null);
  wake();
  if (KEY) start(); else pair();
})();
</script>
</body>
</html>
