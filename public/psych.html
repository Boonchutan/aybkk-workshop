<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind Stash · Psychology</title>
<meta name="description" content="A spaced-repetition card deck for studying psychology.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d5a4c'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='Georgia,serif'%3E%E2%97%86%3C/text%3E%3C/svg%3E">
<style>
  @font-face{font-family:'Inter';src:url('/fonts/inter.woff2') format('woff2');font-weight:100 900;font-display:swap}
  @font-face{font-family:'Gloock';src:url('/fonts/gloock.woff2') format('woff2');font-weight:400;font-display:swap}

  :root{
    --bg:#f4f2ee; --surface:#ffffff; --surface-2:#faf9f7;
    --ink:#1c1a17; --ink-2:#55504a; --ink-3:#8a837a;
    --line:#e4e0d9; --line-2:#d3cec4;
    --accent:#3d5a4c; --accent-soft:#e8efea; --accent-ink:#2b4438;
    --warn:#8a5a1f; --warn-soft:#f7eddd;
    --bad:#8f3a34; --bad-soft:#f8e7e5;
    --display:'Gloock',Georgia,serif;
    --text:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    --r:16px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#16161a; --surface:#1f1f25; --surface-2:#26262d;
      --ink:#f0eeea; --ink-2:#b5b0a8; --ink-3:#847e75;
      --line:#32323a; --line-2:#41414b;
      --accent:#8fbfa6; --accent-soft:#22322a; --accent-ink:#a9d4bc;
      --warn:#d9a45f; --warn-soft:#33291a;
      --bad:#d98d85; --bad-soft:#33211f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16161a; --surface:#1f1f25; --surface-2:#26262d;
    --ink:#f0eeea; --ink-2:#b5b0a8; --ink-3:#847e75;
    --line:#32323a; --line-2:#41414b;
    --accent:#8fbfa6; --accent-soft:#22322a; --accent-ink:#a9d4bc;
    --warn:#d9a45f; --warn-soft:#33291a;
    --bad:#d98d85; --bad-soft:#33211f;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--text);
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}

  /* ---------- top bar ---------- */
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .bar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .brand{font-family:var(--display);font-size:20px;letter-spacing:.01em;margin-right:auto}
  .stat{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);
        background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
  #themeBtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;
            width:32px;height:32px;display:grid;place-items:center;font-size:14px;padding:0}

  /* ---------- tabs ---------- */
  nav{max-width:640px;margin:0 auto;padding:10px 16px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{background:none;border:1px solid transparent;border-radius:999px;padding:7px 14px;
       font-size:14px;font-weight:600;color:var(--ink-3);white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-soft)}
  .tab .pill{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:999px;
             background:var(--accent);color:var(--bg);font-size:11px;font-weight:700;line-height:18px;text-align:center}
  .tab[aria-selected="true"] .pill{background:var(--accent-ink);color:var(--surface)}

  main{max-width:640px;margin:0 auto;padding:16px 16px 90px}
  .panel[hidden]{display:none}

  /* ---------- idea card ---------- */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:22px; box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card .topic{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .card h2{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.25;margin:0 0 12px}
  .card .body{color:var(--ink-2);font-size:16px;line-height:1.68;margin:0}
  .card .body p{margin:0 0 11px}
  .card .body p:last-child{margin-bottom:0}
  .card .src{margin-top:16px;padding-top:13px;border-top:1px solid var(--line);
             font-size:13px;color:var(--ink-3);font-style:italic}
  .card .apply{margin-top:14px;background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;
               padding:11px 14px;font-size:14px;line-height:1.55}
  .card .apply b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;
                 text-transform:uppercase;opacity:.75;margin-bottom:4px}
  .card .flag{margin-top:13px;background:var(--warn-soft);color:var(--warn);border-radius:10px;
              padding:10px 13px;font-size:13.5px;line-height:1.5;font-style:normal}
  .card .flag b{font-weight:700}

  /* ---------- actions ---------- */
  .actions{display:flex;gap:9px;margin-top:15px}
  .btn{flex:1;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;
       padding:13px 10px;font-size:15px;font-weight:600;text-align:center;transition:transform .06s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .btn.primary,
  :root:not([data-theme="light"]) .btn.primary{color:#16161a}
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
  .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

  .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
        font-size:13px;color:var(--ink-3);font-weight:500}

  /* ---------- recall ---------- */
  .recall{margin-top:15px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px}
  .recall .q{font-weight:600;font-size:15.5px;margin:0 0 4px}
  .recall .hint{font-size:13px;color:var(--ink-3);margin:0}
  .recall .a{margin:12px 0 0;padding-top:12px;border-top:1px dashed var(--line-2);color:var(--ink-2);font-size:15px}
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
  .grade{border:1px solid var(--line-2);background:var(--surface);border-radius:11px;padding:11px 4px;
         font-size:13px;font-weight:600;text-align:center;line-height:1.3}
  .grade small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}
  .grade.g0{color:var(--bad)} .grade.g0:active{background:var(--bad-soft)}
  .grade.g3{color:var(--accent-ink)} .grade.g3:active{background:var(--accent-soft)}

  /* ---------- topics ---------- */
  .tlist{display:flex;flex-direction:column;gap:9px}
  .trow{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);
        border-radius:13px;padding:14px 15px;text-align:left;width:100%}
  .trow.off{opacity:.5}
  .trow .tx{flex:1;min-width:0}
  .trow .tn{font-weight:600;font-size:15.5px}
  .trow .td{font-size:13px;color:var(--ink-3);margin-top:1px}
  .trow .chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);
             display:grid;place-items:center;font-size:13px;flex:0 0 auto;color:transparent}
  .trow:not(.off) .chk{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- progress ---------- */
  .pbar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:7px}
  .pbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
  .sbox{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px}
  .sbox .n{font-family:var(--display);font-size:29px;line-height:1;font-variant-numeric:tabular-nums}
  .sbox .l{font-size:12.5px;color:var(--ink-3);margin-top:5px}

  h3.sec{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
         color:var(--ink-3);margin:24px 0 11px}
  h3.sec:first-child{margin-top:0}

  .empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
  .empty .big{font-family:var(--display);font-size:22px;color:var(--ink-2);margin-bottom:7px}

  .mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;
        margin-bottom:9px;width:100%;text-align:left;display:block}
  .mini .mt{font-weight:600;font-size:15px;line-height:1.35}
  .mini .mb{font-size:13px;color:var(--ink-3);margin-top:3px;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mini .mtop{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}

  #search{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;
          background:var(--surface);color:var(--ink);font-size:16px;margin-bottom:14px}
  #search::placeholder{color:var(--ink-3)}

  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(70px);bottom:24px;
         background:var(--ink);color:var(--bg);padding:11px 19px;border-radius:999px;font-size:14px;
         font-weight:600;z-index:60;opacity:0;transition:.24s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .drill{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:16px 18px;margin-top:14px}
  .drill .dl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px}
  .drill .dt{font-size:16px;line-height:1.6;color:var(--ink)}
  textarea#jrn{width:100%;min-height:120px;margin-top:12px;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;
               background:var(--surface);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.55;resize:vertical}
  .jitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:8px}
  .jitem .jd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .jitem .jt{font-weight:600;font-size:14.5px;margin:3px 0 4px}
  .jitem .jx{font-size:14px;color:var(--ink-2);white-space:pre-wrap}
  .note{font-size:13.5px;color:var(--ink-3);line-height:1.6;background:var(--surface-2);
        border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:16px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="brand">Mind Stash</span>
    <span class="stat" title="Day streak">🔥 <b id="sStreak">0</b></span>
    <span class="stat" title="Cards mastered">◆ <b id="sMastered">0</b></span>
    <button id="themeBtn" aria-label="Toggle theme">◐</button>
  </div>
  <nav role="tablist">
    <button class="tab" role="tab" data-p="feed" aria-selected="true">Feed</button>
    <button class="tab" role="tab" data-p="study" aria-selected="false">Study<span class="pill" id="dueCount">0</span></button>
    <button class="tab" role="tab" data-p="practice" aria-selected="false">Practice</button>
    <button class="tab" role="tab" data-p="stash" aria-selected="false">Stash</button>
    <button class="tab" role="tab" data-p="topics" aria-selected="false">Topics</button>
    <button class="tab" role="tab" data-p="progress" aria-selected="false">Progress</button>
  </nav>
</header>

<main>
  <section class="panel" id="p-feed"></section>
  <section class="panel" id="p-study" hidden></section>
  <section class="panel" id="p-practice" hidden></section>
  <section class="panel" id="p-stash" hidden></section>
  <section class="panel" id="p-topics" hidden></section>
  <section class="panel" id="p-progress" hidden></section>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";

const TOPICS = [
  {id:"choice",   name:"How Choices Get Made",           desc:"The machinery behind a decision"},
  {id:"value",    name:"How Value Is Felt",              desc:"Why the same thing is worth more or less"},
  {id:"attention",name:"Attention",                      desc:"What gets noticed, what never arrives"},
  {id:"sticky",   name:"What Makes A Message Stick",     desc:"Memory, applied to what you say"},
  {id:"yes",      name:"Why People Say Yes",             desc:"The levers behind compliance"},
  {id:"tribes",   name:"Identity & Tribes",              desc:"People as members, not individuals"},
  {id:"story",    name:"Story & Emotion",                desc:"How feeling is built and moved"},
  {id:"action",   name:"Getting Someone To Act",         desc:"The gap between wanting and doing"},
  {id:"offer",    name:"The Offer",                      desc:"Price, risk, and the pain of paying"},
  {id:"evidence", name:"Reading The Evidence",           desc:"Telling real findings from noise"},
  {id:"structure",name:"Storytelling Structure",         desc:"How one creator builds a piece — verified"},
  {id:"humor",    name:"Sarcasm That Does Not Cost You", desc:"Dry jokes that punch up and keep the practice sacred"}
];

const CARDS = [

/* ============ HOW CHOICES GET MADE ============ */
{id:"c1",topic:"choice",title:"The first number pulls every number after it",
body:"<p>Show someone a number. Then ask them to guess something. Their guess slides toward that first number. This happens even when the number is plainly random. It happens even when you warn them the number means nothing. It happens to experts too. Scientists call this anchoring, because the first number works like a boat anchor.</p><p>People do move away from the first number. But they never move far enough. Where the guess starts is most of where it ends.</p>",
apply:"The first number a buyer sees becomes the ruler they measure everything with. That could be your price, another teacher's fee, or a number in your headline. Pick that first number on purpose. If you do not, the market picks it for you.",
recall:"Why does knowing about anchoring not protect you from it?",
answer:"People move away from the first number, but never far enough. Warnings do not remove the pull. Plainly random numbers still pull. Experts are pulled too.",
src:"Tversky & Kahneman, 1974",
drill:"Open your China cohort page. Find the first number a reader sees on it. Write it on a sticky note. Next to it, write the number you want them to measure 150,000 THB against. Done when both numbers are on the note and you can say out loud which one wins."},

{id:"c2",topic:"choice",title:"The same offer, said two ways, gets two answers",
body:"<p>Picture a sickness that will hit 600 people. Doctors describe a plan as saving 200 of the 600. Most people pick that safe plan. Now describe the very same plan as 400 of the 600 dying. Now most people pick the gamble instead. The plan did not change. Only the words did. One sentence was built from what you win. The other was built from what you lose.</p><p>Win words push people to the sure thing. Loss words push people to take the risk. Scientists call this framing, like putting the same picture in two different frames.</p>",
apply:"You can never describe your offer in a neutral way. There is no neutral way. 'Keep practising through your forties' and 'stop losing years to bad practice' sell two different decisions.",
recall:"How does a person's taste for risk change between win words and loss words?",
answer:"Win words make people play safe and take the sure thing. Loss words make people take the gamble to avoid the loss.",
src:"Tversky & Kahneman, 1981",
drill:"Take one line from your cohort page or a reel caption. Write it two ways: once as a win, once as a loss. Say both out loud. Done when both lines are written and you have circled the one that fits the decision you want the reader to make."},

{id:"c3",topic:"choice",title:"Whatever needs no decision usually wins",
body:"<p>When one choice is already ticked for you, far more people end up with it. The famous example is organ donors. In countries where you are signed up unless you say no, more than 90 percent are on the list. In countries where you must sign up yourself, the number is often under 30 percent.</p><p>The people in those countries are not different. What differs is how much work it takes to end up somewhere else. The already-ticked choice is called the default.</p>",
apply:"Every form field, every pre-ticked box, every 'most people choose this' label is a default. Look at what yours make easy right now. That is what most people will do.",
recall:"Why do defaults move so many people?",
answer:"They take away the need to decide. A choice that needs work to escape is picked far less than the same choice already set.",
flag:"The effect is real. But the organ donor case is partly about how governments run their sign-up lists, not only about how people's minds work. The direction is solid. Treat the exact percentages as a picture, not a fixed fact.",
src:"Johnson & Goldstein, 2003",
drill:"Open one of your live forms, like the tee shop or the cohort application. Find every box or option that is already set. Write down what a person gets if they touch nothing. Done when you have that list and have said out loud whether it is what you want them to get."},

{id:"c4",topic:"choice",title:"Too many options can stop the decision completely",
body:"<p>A famous supermarket study in 2000 set out a jam table. Some shoppers saw six jams. Others saw twenty-four. The big table drew more people over. But far fewer of them bought anything. More choice felt nice and made choosing harder.</p><p>Here is the catch. In 2010 scientists pooled many studies together. The average effect across all of them came out close to zero. The effect shows up mainly in certain cases: when people are rushed, when they do not know the area, or when they have no favourite yet.</p>",
apply:"Do not assume more options help. But do not assume cutting options always works either. A serious buyer who knows what they want often does better with more information.",
recall:"Where does the too-many-choices idea stand today?",
answer:"It is real in certain cases: rushed people, an area they do not know, no favourite yet. But across the wider set of studies the average effect is close to zero.",
flag:"This is a good example of a finding that spread into marketing lore in a much stronger form than the evidence supports.",
src:"Iyengar & Lepper, 2000; Scheibehenne et al., 2010 meta-analysis",
drill:"Count the options on your shop page: sizes, colours, products. Write the number down. Next to it write who your buyer is: rushed and new, or serious and sure. Done when you have the count and one sentence saying whether that buyer needs fewer options or more information."},

{id:"c5",topic:"choice",title:"A vivid story beats the real numbers",
body:"<p>Tell people about a quiet, careful person who loves details. Then ask: librarian or salesperson? Most say librarian. But there are far more salespeople than librarians in the world. The description matches a picture in the head. That match answers the question before any counting can start.</p><p>People do not reject the real numbers. The numbers simply never get into the room. Scientists call this the representativeness effect: a case that looks like the picture feels like the answer.</p>",
apply:"This is why one student's story beats a statistic. It is also why you should not trust your own feel for your market. A few vivid conversations feel like data. They are not.",
recall:"What pushes the real numbers out of everyday judgment?",
answer:"Likeness. How closely a case looks like the picture in your head. That likeness crowds out how common each answer really is.",
src:"Kahneman & Tversky, 1973",
drill:"Write down the one conversation that shaped your idea of who buys the China cohort. Then write the number of real inquiries it stands for. Done when both are on paper and you have said out loud whether one story is carrying too much weight."},

{id:"c6",topic:"choice",title:"How fast an example comes to mind stands in for how common it is",
body:"<p>Ask people how often something happens. They do not count. They check how fast an example pops into their head. Then they treat that speed as the answer. Recent, dramatic, or upsetting events feel common because they are easy to remember. Scientists call this the availability heuristic. A heuristic is a quick mental shortcut. Here the shortcut is: if it is easy to find in memory, it feels common.</p><p>Anything that gets talked about a lot gets guessed too high. Anything that is common but boring gets guessed too low.</p>",
apply:"Your loudest complaints are not your most common ones. They are the ones you remember best. Count before you rebuild anything around them.",
recall:"What does the availability heuristic use instead of real counting?",
answer:"How fast an example comes to mind. Easy to remember gets read as common.",
src:"Tversky & Kahneman, 1973",
drill:"Name the one student complaint that bugs you most. Then open your LINE or DM history and count how many times it actually came up in the last month. Done when you have a real number written beside your guess."},

{id:"c7",topic:"choice",title:"You look for evidence that agrees with you",
body:"<p>Give someone a belief. They look for things that would show up if it were true. They rarely look for things that would show up only if it were false. Both feel like honest checking. Only the second kind can fix a mistake.</p><p>This is how a wrong idea can survive years of reading. Every book and post you chose to open was picked, without you noticing, because it agreed with you.</p>",
apply:"Before you commit to a positioning, write down what you would expect to see if it were wrong. Then go looking for exactly that.",
recall:"What is lopsided about the way people gather evidence for their own beliefs?",
answer:"They look for evidence that agrees with them, not for evidence that could prove them wrong. Only the prove-me-wrong kind can fix an error.",
src:"Wason, 1960",
drill:"Write one sentence: 'My China cohort positioning is wrong if I see ___.' Then spend five minutes looking for that exact thing in your DMs or on a competitor's page. Done when the sentence is written and you have looked for it once."},


/* ============ HOW VALUE IS FELT ============ */
{id:"v1",topic:"value",title:"Nothing has a price on its own. It only has a price next to something else",
body:"<p>People are bad at judging what a thing is worth by itself. They are good at judging it next to something else. Every price gets compared to some other number. What it cost before. What the other choice costs. What things like it cost.</p><p>Change the thing it sits next to, and the same price feels cheap or expensive. The number did not move at all.</p>",
apply:"You are not just picking a price. You are picking what your price sits next to. Put the cohort next to other workshops and it looks expensive. Put it next to years of practising alone with no teacher, and it does not.",
recall:"Why is a price never judged on its own?",
answer:"People feel value by comparing. Every price is judged next to some other number. Move that other number and the same price feels cheaper or more expensive, even though the price did not change.",
src:"Kahneman & Tversky, 1979; Ariely, 2008",
drill:"Open the China cohort page. Write one line that says what the 150,000 THB is being compared to right now. Then write a second line that compares it to years of practising with no teacher. Done when both lines are written and the second one is on the page or in your notes."},

{id:"v2",topic:"value",title:"A sign is believed when it costs a lot to make",
body:"<p>A sign is trusted when it would cost too much to fake. A peacock's huge tail shows it is strong and healthy. A weak bird could not carry one. Anyone can say they are the best. Words are cheap, so they tell you nothing.</p><p>Big, costly adverts once worked partly this way. The message was not the words. It was that the company could clearly afford to spend so much.</p>",
apply:"Your best sign is one another teacher cannot copy cheaply. Anyone can say they teach the traditional way. Eighteen years with Sharath, written down and on record, cannot be bought this year.",
recall:"What makes a sign believable, in signalling theory?",
answer:"It costs so much that someone without the real quality could not fake it.",
src:"Zahavi, 1975; Spence, 1973",
drill:"Look at the top of your cohort page or your Instagram bio. Find every claim. Cross out each one that another teacher could type in one minute. Keep only what took you years. Done when one line is left that no one else could write."},

{id:"v3",topic:"value",title:"Owning a thing makes you value it more",
body:"<p>Scientists gave some people a mug. Then they asked, how much money to give it back? Other people got no mug. They were asked how much they would pay for one. The mug owners wanted about twice as much. Just owning it made it feel worth more.</p><p>This pattern shows up again and again in many studies. But why it happens is still argued about. Maybe losing hurts more than getting feels good. Maybe people get attached. Maybe it is a quirk of how the tests are set up. Nobody is sure.</p>",
apply:"Free trials, samples and free periods work partly because of this. Once someone has started a practice or holds a place, giving it up feels worse than getting it felt good.",
recall:"What is the endowment effect, and how sure should you be about why it happens?",
answer:"People value a thing more once they own it than the same thing they do not own. The pattern is solid and repeats across many studies. The reason for it is still argued about.",
src:"Kahneman, Knetsch & Thaler, 1990",
drill:"Write one sentence for a student who holds a place in the cohort or a trial spot. Say it as your place or your mat, not a place. Done when the sentence uses the word your and you have put it in a real message or page."},

{id:"v4",topic:"value",title:"Paying hurts, and that hurt is separate from the price",
body:"<p>Handing over money hurts. That hurt is separate from whether the price is fair. When the payment is easy to miss, it hurts less. Think of a monthly plan, a card kept on file, or one fee that bundles many things. The amount is the same. It just stings less.</p><p>This works both ways. Hiding the payment makes people spend more. Making it visible again is how people rein in their own spending.</p>",
apply:"How people pay is a different lever from what they pay. Paying in parts (instalments) can get more people to say yes at the same total. You have made the paying hurt less, not made the thing cheaper.",
recall:"What does pain of paying mean?",
answer:"The bad feeling at the moment you hand over money. It is separate from whether the price seems fair. Changing how people pay changes it without changing the amount.",
src:"Prelec & Loewenstein, 1998",
drill:"Open the cohort page. Count how many times the full 150,000 THB appears with no payment plan next to it. Write one line that shows the price split into parts, like three payments. Done when you have the count and the line."},

{id:"v5",topic:"value",title:"What you expect changes what you feel, not just what you say",
body:"<p>Scientists told people a wine was expensive. People said they liked it more. That is not the surprising part. The scientists also looked at their brains in a scanner. The pleasure parts of the brain really did light up more. People were not just being polite. Expecting it to be good made it feel better.</p><p>The same thing happens with painkillers labelled as expensive. And with food described in more detail.</p>",
apply:"What you tell someone before an experience changes the experience itself. Everything a student reads before their first class is already part of that class.",
recall:"What did the wine study show that people's own words could not?",
answer:"Brain scans showed the pleasure areas responded more when people expected a high price. So expecting it to be good changed the real feeling, not just what people said about it.",
src:"Plassmann et al., 2008",
drill:"Read the first message a new China cohort student gets before class one, whether by email, LINE or WeChat. Add one line that tells them what they will notice or feel in that first class. Done when the line is in the message."},

{id:"v6",topic:"value",title:"Money already spent keeps people going the wrong way",
body:"<p>Say you already spent money, time or sweat on something. Now it looks like a poor bet. People keep going anyway. But the money and time are gone either way. They cannot come back. So they should not count for the next choice. People count them anyway.</p><p>The pull is stronger when the earlier spending was done in public, or took hard work.</p>",
apply:"Two sides. It keeps students who have started from quitting. It also keeps you in a losing ad campaign long after the numbers said stop. Decide from what is left ahead, never from what you already spent.",
recall:"Why should what you already spent not matter for the next choice?",
answer:"It is gone whichever way you choose. Only future costs and gains should count.",
src:"Arkes & Blumer, 1985",
drill:"Pick one thing you are still paying for or working on, like an ad, a reel series, or a shop product. Write two lines. Line one: what it has cost so far. Line two: what it will bring in from today on. Cover line one with your hand and decide from line two. Done when you have written keep or stop."},

{id:"v7",topic:"value",title:"Work you put in makes the thing feel worth more",
body:"<p>People rate things higher when they built them or worked for them. The same thing handed to them finished gets a lower score. Part of this is telling yourself the work was worth it. Part is real attachment from having your hands in it.</p><p>There is a famous story about instant cake mix. It is said sales went up once the recipe asked for a real egg. That story is the folk tale version of a real lab effect.</p>",
apply:"An application form that takes some work does two jobs. It filters out people who are not serious. And it makes the thing being applied for feel worth more. Easy entry is not always the goal.",
recall:"What does a person's own effort do to how much they value a thing?",
answer:"It raises it. Things people built or earned themselves are valued above the same things received finished.",
flag:"The egg-in-the-cake-mix story is told everywhere in marketing but has thin proof behind it. The lab effect is real. Do not use the cake story as evidence.",
src:"Norton, Mochon & Ariely, 2012",
drill:"Open the China cohort application form. Count the questions. If fewer than three need real thought, add one that asks the person to write about their own practice. Done when the form has at least one question that takes a few minutes to answer."},


/* ============ ATTENTION ============ */
{id:"a1",topic:"attention",title:"Looking at something is not the same as seeing it",
body:"<p>Scientists showed people a video of a basketball game. They asked them to count the passes. While they counted, a person in a gorilla suit walked through the middle. It stopped and beat its chest. About half of the viewers never saw it. Their eyes were pointed right at it. It never got into their mind.</p><p>So attention is not a torch that lights up a picture you already have. Attention decides what gets put into the picture at all. Scientists call this inattentional blindness. That means being blind to a thing because your attention is somewhere else.</p>",
apply:"Your audience is not ignoring your message. Most of the time it never got in. Start by assuming your message is invisible. Then build it so it cannot be missed.",
recall:"What does the gorilla study show about looking and seeing?",
answer:"They are not the same thing. Something can be right in front of your eyes and never reach your mind if your attention is busy somewhere else.",
src:"Simons & Chabris, 1999",
drill:"Open your last reel. Watch only the first 3 seconds with the sound off. Ask: if a viewer was busy counting something else, would they still notice this? Write down one thing you could change in those 3 seconds to make it harder to miss. Done when you have one change written on paper."},

{id:"a2",topic:"attention",title:"Seeing something often is enough to make you like it",
body:"<p>Show someone the same thing again and again. A shape, a face, a word, a brand name. They start to like it more. Nothing else is added. No facts, no reasons. It even works when people cannot remember seeing the thing before. Scientists call this the mere exposure effect. Mere exposure just means seeing it, nothing more.</p><p>It works best when the thing is neutral or a little bit nice. If the first time felt bad, more repeats can make people like it less, not more.</p>",
apply:"Saying the same thing over and over adds up. The same phrase, same name, same face. Repeating builds liking on its own. So say one thing many times, not many things once.",
recall:"What does the mere exposure effect need, besides seeing something many times?",
answer:"Nothing. Seeing it again and again is enough to make people like it more, even if they do not remember seeing it. But it can flip the other way if the first look felt bad.",
src:"Zajonc, 1968",
drill:"Look at your last five reels or posts. Count how many different names you use for your program or your teaching. If it is more than one, pick one name and write it on a sticky note by your desk. Done when the sticky note is up."},

{id:"a3",topic:"attention",title:"Easy to read feels true",
body:"<p>People judge a claim as more likely true when it is easy to take in. A clear font helps. A rhyme helps. Just saying it again helps. The mind treats 'this was easy' as a small sign of 'this is true'.</p><p>Repeating a claim makes it feel more true even when people already knew it was false. Scientists call this the illusory truth effect. That means a feeling of truth that was not earned by facts.</p>",
apply:"Plain, rhythmic, repeated words are not dumbing down. They really do make people believe you more. This also cuts the other way. Be careful of claims that just feel obviously true.",
recall:"What is the illusory truth effect?",
answer:"When a claim is repeated, people rate it as more true than a new claim. This happens even for claims the person already knew were false.",
src:"Hasher et al., 1977; Reber & Schwarz, 1999",
drill:"Take the top line of your China cohort page. Read it out loud. Count the words. If it is over 12 words, cut it until it is under 12 and still true. Done when you can say the new line out loud in one breath."},

{id:"a4",topic:"attention",title:"Working memory holds about four things",
body:"<p>Working memory is the small space where you hold things in mind right now. You may have heard it holds 'seven, plus or minus two' things. That number came from Miller in 1956. But his tests let people repeat things in their head and bunch them into groups. Take those tricks away, and the real number is nearer three or four. Cowan showed this in 2001.</p><p>That is a hard limit. It is how many new pieces someone can hold in mind while you explain something.</p>",
apply:"A message with more than about four moving parts is being lost. The fix is to cut parts, not to write shorter sentences.",
recall:"Why is 'seven plus or minus two' too high for working memory?",
answer:"Those tests let people repeat things in their head and group them. Take that away and the real limit is closer to four.",
src:"Miller, 1956; revised by Cowan, 2001",
drill:"Open your China cohort page. Count the separate ideas a reader must hold at once on the first screen. Write the number down. If it is more than four, cross out ideas until four are left. Done when the count is four or fewer."},

{id:"a5",topic:"attention",title:"What you expect shapes what you see and hear",
body:"<p>Seeing and hearing are not just about what comes in through your eyes and ears. Your brain mixes what comes in with what it expects. Play someone a badly garbled recording of speech. They hear noise. Tell them the words. Now they hear the words clearly. And they cannot go back to hearing noise. The expecting is not a layer on top of the hearing. It is part of the hearing.</p><p>When what comes in is unclear, the brain always picks the answer that fits the situation. Gregory showed this in 1970.</p>",
apply:"What someone reads before they arrive shapes what they feel when they get there. Framing is not wrapping paper around the product. It gets inside the product.",
recall:"Why can you not un-hear garbled speech once you know the words?",
answer:"Expecting is part of hearing itself. Once your brain knows what to expect, it uses that to decide what the unclear sound means.",
src:"Gregory, 1970",
drill:"Find the last message a new student reads before their first class with you. It might be a LINE reply or the booking page. Read it out loud. Write one sentence that tells them what the first class will feel like. Add it. Done when that sentence is in the message."},

{id:"a6",topic:"attention",title:"Multitasking is really switching, and switching costs",
body:"<p>The brain does not do two hard jobs at the same time. It flips between them. Every flip costs something. It takes time. It causes mistakes. And the cost lasts a little while after each flip. Monsell showed this in 2003.</p><p>It really does feel like doing two things at once. That feeling is real. Doing both at the same time is not.</p>",
apply:"Your audience is always flipping between things. They are never fully on you. Anything that needs long, steady attention to make sense will lose most of the people it reaches.",
recall:"Why is 'multitasking' the wrong word?",
answer:"Hard tasks are not done side by side. The brain switches fast between them, and every switch costs time and causes mistakes.",
src:"Monsell, 2003",
drill:"Pick one reel. Watch it while scrolling something else on your phone at the same time. Then say out loud, in one sentence, what the reel was about. If you cannot, the point needs to land sooner. Write down which second the main point should land on. Done when that second is written down."},

{id:"a7",topic:"attention",title:"Anything that stays the same disappears",
body:"<p>Your senses notice change, not sameness. A smell in a room fades after a few minutes. A fridge hum vanishes. You stop feeling your shirt on your skin. The smell, the hum and the shirt are all still there. Your brain just stopped reporting them. Helson wrote about this in 1964.</p><p>The same thing happens over months and years. A life that stays the same, good or bad, stops being noticed. Brickman and Campbell showed this long-term version in 1971.</p>",
apply:"A message that never changes stops being noticed, even by people who still see it. That is not a reason to change what you say. It is a reason to change how you say it.",
recall:"What one idea links fading smells and getting used to a good or bad life?",
answer:"The brain notices change, not the steady level. So anything that stays the same fades from notice.",
src:"Helson, 1964; Brickman & Campbell, 1971",
drill:"Put your last three reels side by side. Look at the opening shot of each one. If all three open the same way, write a different opening for the next reel. Done when the new opening line is written down."},


/* ============ WHAT MAKES A MESSAGE STICK ============ */
{id:"s1",topic:"sticky",title:"Trying to remember beats reading again, by a lot",
body:"<p>Trying to remember something works far better than reading it again. In 2006, Roediger and Karpicke tested this. One group read a text a second time. Another group shut the book and tried to recall it. Both got the same amount of time. Right away, the re-reading group did as well or even better. But after a few days, the recall group won clearly. The longer the wait, the bigger the gap.</p><p>The hard work is the point. Pulling a fact out of your own head makes it stronger, like pulling a rope tight. Reading it again barely touches it. Scientists call this the testing effect: testing yourself teaches more than looking again.</p>",
apply:"This is why you use this card app instead of reading a list. It is also why a question in your reel or post works better than a plain statement. You make the reader pull the answer out of their own head.",
recall:"When does the testing effect look largest?",
answer:"When there is a long wait before the final test. Right after learning, reading again can do as well or better. But once days pass, testing yourself wins clearly.",
src:"Roediger & Karpicke, 2006",
drill:"Open your last reel caption or post. Find one sentence that just tells the reader a fact. Rewrite it as a question the reader must answer in their head before you tell them. Done when the new line ends with a question mark and the answer sits one line below it."},

{id:"s2",topic:"sticky",title:"Forgetting is fast at first, then almost flat",
body:"<p>In 1885, a scientist named Ebbinghaus tested his own memory over and over, for a long time. He found that forgetting happens fast at first. Most of what you will lose is gone in the first hours and days. After that the loss slows down and goes almost flat. So when you look at something again matters more than how many times you look at it.</p><p>Each time you review and still remember, the drop gets less steep. So the next gap can be longer. That is the whole idea behind spaced repetition: review at growing gaps, just before you would forget.</p>",
apply:"A message seen once is gone within days. Reaching the same person again, with gaps between, beats reaching more new people once. This is a case for sequence over reach.",
recall:"Why does review timing matter more than review quantity?",
answer:"Forgetting is steep early and flat later. If you review just before the big drop, and then stretch the gaps, you keep more memory for less work.",
src:"Ebbinghaus, 1885",
drill:"Pick one thing you want the China cohort to remember, like the ten-place limit or your years with Sharath. Write three dates on paper: tomorrow, next week, next month. Next to each date, write one line saying where that message goes out that day. Done when all three dates have a place and a line."},

{id:"s3",topic:"sticky",title:"The same study time, spread out, teaches more",
body:"<p>Take the same amount of study time. Spread it across days instead of doing it all in one go. People remember much more later. Nothing else changes, only the schedule. In 2006, Cepeda and his team gathered many studies on this into one big review. The answer came out the same again and again.</p><p>It is one of the best-tested findings in psychology. It is also one of the least used. Why? Cramming feels like it works while you do it. You do better on a test right away, and it all feels smooth and easy. Spreading it out feels slower, but you keep it longer.</p>",
apply:"This shapes how you teach and how you order your content. It also applies to you: five cards a day for a month beats a weekend of reading.",
recall:"Why is spacing under-used despite being so well established?",
answer:"Cramming gives better results right away and feels smooth and easy. Spacing feels slower but you remember more later.",
src:"Cepeda et al., 2006 meta-analysis",
drill:"Take one thing you teach in one big go, like a talk on breath or a drishti rule. Cut it into three small pieces. Write one line for each piece and mark which day of the week each goes out. Done when you have three lines, each with its own day."},

{id:"s4",topic:"sticky",title:"Feeling smooth is not the same as knowing",
body:"<p>Reading something again makes it feel familiar. Feeling familiar gets mixed up with knowing. In 2005, Koriat and Bjork showed this. People who re-read gave themselves high marks and then did badly on the test. People who tested themselves gave themselves lower marks and did better.</p><p>Your confidence follows how easy the material feels. But easy comes from seeing it many times, not from understanding it. Smooth is not the same as known.</p>",
apply:"If your explanation feels easy to your audience, they may have learned nothing. If you need them to keep it, make them do something with it.",
recall:"Why does re-reading produce overconfidence?",
answer:"Re-reading makes the material feel easy and familiar. People read that ease as knowing. But the ease comes from seeing it many times, not from understanding it.",
src:"Koriat & Bjork, 2005",
drill:"Pick one point from your last reel. Message one student who watched it. Ask them to tell you that point in one line without watching again. Done when the message is sent."},

{id:"s5",topic:"sticky",title:"Memory is rebuilt each time, not replayed",
body:"<p>A memory is not a video you press play on. Each time you remember, your brain builds the memory fresh. It uses the bits it kept, plus what it expects such an event to be like. Gaps get filled in without you noticing. The result feels whole and smooth. Bartlett showed this in 1932. He had people retell a strange story, and over time they changed it to fit what they expected.</p><p>This is why feeling sure and being right are two different things. The rebuilt memory feels the same whether the pieces were true or not.</p>",
apply:"What a student remembers of your teaching is partly built from what they expected before they came. Set that expectation first, and you shape the memory before it happens.",
recall:"Why can a memory feel vivid and certain while being wrong?",
answer:"Memory is rebuilt each time from kept pieces plus what you expect. The rebuilt memory feels the same whether the pieces were right or wrong.",
src:"Bartlett, 1932",
drill:"Open the first message a new student gets from you before class, on LINE or the orientation page. Add one line that says what they should notice in the first class. Done when the line names one concrete thing, like the sound of the breath or the counting."},

{id:"s6",topic:"sticky",title:"What you hear afterward gets mixed into the memory",
body:"<p>In 1974, Loftus and Palmer showed people a film of a car crash. Then they asked questions. Some people heard the cars 'smashed'. Others heard the cars 'hit'. The 'smashed' group guessed higher speeds. A week later they were more likely to say they saw broken glass. There was no broken glass.</p><p>New details given after an event do not sit in a separate box marked 'told later'. They mix into the memory itself, and you cannot tell them apart. Questions that hint at the answer, called leading questions, do this again and again. People report the changed memory with full confidence.</p>",
apply:"What you say after an experience edits the memory of it. Your follow-up message is not a summary of what happened. It is partly a rewrite.",
recall:"Why is misleading post-event information so damaging?",
answer:"It mixes into the original memory instead of being stored on its own. The person cannot tell what they saw from what they were told.",
src:"Loftus & Palmer, 1974",
drill:"Open the last follow-up message you sent after a class or workshop day. Underline every word that names a feeling or a result, like 'deep', 'strong', or 'breakthrough'. Count them. For each one ask: is this what happened, or what I want them to remember? Done when you have the count and have kept or cut each word on purpose."},

{id:"s7",topic:"sticky",title:"Guessing first beats being told",
body:"<p>Guessing first helps you remember. If you try to come up with an answer before you see the right one, you remember it better later. This works even when your guess is wrong. Slamecka and Graf found this in 1978. Kornell and his team showed in 2009 that even a failed guess helps.</p><p>The wrong guess is not wasted. It is like digging the hole before you plant. When the right answer comes, it has somewhere to go. So a question that makes someone try, and then shows the answer, beats just telling them.</p>",
apply:"Build your explanations as a puzzle the reader tries first, then you solve it. The trying is what makes the answer stick.",
recall:"Does a wrong guess before feedback help or hurt learning?",
answer:"It helps. Trying to answer before you see the right answer makes memory better later, even when the guess was wrong.",
src:"Slamecka & Graf, 1978; Kornell et al., 2009",
drill:"Take one tip you plan to post this week. Write it as a puzzle in one line: 'Why do we...?' or 'What happens if...?' Then write the answer under it. Read both out loud. Done when the question comes first and the answer sits at least one line below it."},


/* ============ WHY PEOPLE SAY YES ============ */
{id:"y1",topic:"yes",title:"Six levers behind most yeses",
body:"<p>In 1984 a scientist named Cialdini watched how people get a yes. He found six levers that came up again and again. Giving first (he called it reciprocity). Staying in line with what you already did (commitment and consistency). Copying the crowd (social proof). Trusting the expert (authority). Liking the person. And fear of missing out (scarcity).</p><p>These are patterns he noticed, not one big theory that explains them all. Some of the six have strong proof behind them. Some have weaker proof. So it is a good checklist, but a weak explanation.</p>",
apply:"Use the list to check your offer, not to build it. Run your China cohort page against all six and see which one it leans on. If the answer is fear of missing out, something is wrong.",
recall:"Name Cialdini's six levers.",
answer:"Giving first (reciprocity), staying in line with past actions (commitment and consistency), copying the crowd (social proof), trusting experts (authority), liking, and fear of missing out (scarcity).",
src:"Cialdini, 1984",
drill:"Open the China cohort page. Write the six levers down the side of a piece of paper. Read the page once and put a tick next to each lever the page uses. Done when all six have a tick or a cross, and for every tick you can point to the exact line on the page."},

{id:"y2",topic:"yes",title:"A gift you never asked for still makes you owe something",
body:"<p>When someone gives you something, you feel you owe them. This works even when the gift was tiny, or you did not want it, or you never asked for it. And people often give back more than they got.</p><p>Gouldner wrote about this rule in 1960. Regan tested it in 1971 by having a stranger hand people a free drink. Those people then bought more raffle tickets from the stranger. Every free sample in a shop works this way.</p>",
apply:"Free teaching that really helps makes people feel they owe you. That is exactly why it has to really help. A thin free thing made only to trigger the debt gets spotted, and people resent it.",
recall:"Why can the 'you owe me' feeling be used against people?",
answer:"It kicks in even for gifts that were small, unwanted, or never asked for. And people often pay back far more than they were given.",
src:"Gouldner, 1960; Regan, 1971",
drill:"Open your latest free reel or post. Ask out loud: would a 10-year practitioner learn one real thing from this? Say yes or no. If no, write one line that adds one real thing. Done when you can say in one sentence what the viewer takes away."},

{id:"y3",topic:"yes",title:"A small yes makes a big yes more likely",
body:"<p>Say yes to a tiny ask, and you become much more likely to say yes to a big ask later. Freedman and Fraser showed this in 1966. It is called foot-in-the-door. Once the door is open a crack, it opens wider.</p><p>Why does it work? The first yes tells you something about yourself. 'I am the kind of person who helps with this.' The second yes just fits that picture. Scientists call this self-perception: you watch what you do, and you decide who you are from it.</p>",
apply:"The order of the asks matters more than the ask itself. Someone who has already read your post, replied, or come to one class is a different person to ask than a stranger.",
recall:"Why does a small yes lead to a bigger yes?",
answer:"Self-perception. The first small yes changes how the person sees themselves. The bigger ask then fits that new picture of who they are.",
src:"Freedman & Fraser, 1966",
drill:"Write down the very first thing you ask a new China cohort lead to do. Is it small, like reply or watch? If it is big, like apply or pay, write one smaller ask to go before it. Done when you have a two-line list: small ask first, big ask second."},

{id:"y4",topic:"yes",title:"Less of a thing pulls people in, until it looks like a trick",
body:"<p>When there is less of something, people want it more. Worchel and his team showed this in 1975 with jars of cookies. A jar with two cookies was rated better than a jar with ten. A jar that went from ten down to two was rated best of all. A new shortage beats an old shortage.</p><p>But there is a catch. Brehm found in 1966 that people push back when they feel someone is trying to control their choice. He called this reactance. So a limit can pull people in or push them away. It depends on whether the limit looks real.</p>",
apply:"Ten places is true, so say ten. A countdown clock on a lineage programme looks made up. It makes serious buyers push back, and they are the exact people you wanted.",
recall:"When does a limit push people away instead of pulling them in?",
answer:"When the limit looks like a deliberate trick to control the person's choice, not a real fact about the offer.",
src:"Worchel et al., 1975; Brehm, 1966",
drill:"Open the China cohort page and find every word about limits: places, dates, deadlines. For each one say out loud: is this true right now? Cut or fix any you cannot say yes to. Done when every limit on the page is a fact you could prove."},

{id:"y5",topic:"yes",title:"The costume works even without the expert inside it",
body:"<p>People obey titles, uniforms and badges. It mostly does not matter if the person really knows anything. Bickman showed this in 1974. A man in a guard uniform told strangers to pick up a bag or give a coin to someone. Far more people did it than when the same man wore normal clothes. He was not a real guard.</p><p>People see the costume and skip the checking. That is exactly why fake titles are worth so much to people selling things.</p>",
apply:"Your authority is real and can be checked. That is rarer than it sounds. Say it exactly as it is and let the exactness do the work. Puffing it up turns a real asset into a costume anyone could wear.",
recall:"What does the authority effect really respond to?",
answer:"The outside signs of authority, like titles, uniforms and badges. Not real skill that has been checked.",
src:"Bickman, 1974",
drill:"Find the one line on your page or bio that says who you are as a teacher. Read it out loud. Is every word exactly true and checkable? If one word stretches, cut it. Done when the line has only facts you could show a stranger proof of."},

{id:"y6",topic:"yes",title:"People copy people, most of all when unsure",
body:"<p>When people are not sure what to do, they look at others and copy. The more unsure they are, the more they copy. And they copy more when the other people seem like them.</p><p>It works even when their own eyes say otherwise. In 1951, Asch asked people which of three lines matched a test line. The answer was easy to see. But when everyone before them gave the wrong answer on purpose, people went along with it about one time in three. Cialdini wrote about this copying in 1984 as social proof.</p>",
apply:"Proof from people your buyer sees as 'like me' is worth far more than big numbers. Ten named practitioners beat a thousand nameless ones.",
recall:"What two things make people copy others more?",
answer:"Being unsure what the right thing to do is, and feeling that the people they are watching are like them.",
src:"Asch, 1951; Cialdini, 1984",
drill:"Count the student names or quotes on your China cohort page. Next to each, write: long-time practitioner, beginner, or no name. Done when you know how many are named 10-year practitioners. If the number is zero, write the name of one student you could ask today."},

{id:"y7",topic:"yes",title:"One different voice breaks the copying",
body:"<p>In the same line test, Asch tried a small change in 1951. He let one other person in the group give a different answer. Just one. Even if that person was also wrong, the copying dropped a lot.</p><p>So the size of the group was never the point. What mattered was whether everyone agreed with no gaps. One crack in the wall, and people felt free to say what they saw.</p>",
apply:"You do not need more people on your side than the whole field has. You only need to be the one voice saying something different, where people can see you. That is a much cheaper spot to stand in.",
recall:"What one thing cuts copying the most?",
answer:"Breaking the full agreement. One person giving a different answer, even a wrong one, cuts copying sharply.",
src:"Asch, 1951",
drill:"Write one sentence that starts: 'Most Ashtanga teachers say X. I say Y.' Use a real X you hear a lot. Say it out loud once. Done when you have a sentence you would be happy to use as a reel hook."},


/* ============ IDENTITY & TRIBES ============ */
{id:"t1",topic:"tribes",title:"A team forms out of nothing at all",
body:"<p>Scientists split people into two groups by a coin flip. Or by which painter they said they liked. Then they asked people to hand out points. People gave more points to their own group right away. No history, no meeting, no contest, nothing to win.</p><p>Here is the odd part. People often chose a smaller prize for their own group if it meant beating the other group by more. Being ahead mattered more than getting the most.</p>",
apply:"A group forms around any marker, even a silly one. A word, a way of practising, a way of doing things. You do not need a big audience to have a tribe. You need a line people can see: this is us, that is not us.",
recall:"What does the minimal group test show?",
answer:"People favour their own group even when the group was made by a coin flip or a painter choice. No real reason is needed. And people often pick being ahead of the other group over getting the most for their own group.",
src:"Tajfel et al., 1971",
drill:"Write one line that finishes this sentence: \"People who practise with me ___.\" Make it something an outsider would not say about themselves. Done-test: read it out loud and name one kind of person it leaves out. If you can, you are done."},

{id:"t2",topic:"tribes",title:"Everyone disagrees in private and goes along in public",
body:"<p>Picture a class where nobody likes a rule, but nobody says so. Each person thinks, \"Everyone else must like it, because they are quiet.\" So each person stays quiet too. Scientists call this pluralistic ignorance. It means many people wrongly think they are the only one who disagrees.</p><p>Silence looks like agreement. So a rule almost nobody wants can last for years. But it falls apart fast once one person says the quiet thing out loud.</p>",
apply:"If you think many people in your field quietly believe the standard advice is wrong, say it in public. That is a cheap move with a big payoff. You are not making people agree. You are showing them they already do.",
recall:"What keeps a rule alive under pluralistic ignorance, and what breaks it?",
answer:"Everyone stays quiet, and everyone reads the quiet as agreement. That keeps it alive. One person saying their private view out loud breaks it.",
src:"Prentice & Miller, 1993",
drill:"Write one sentence that starts \"Most Ashtanga teachers say ___, but I think ___.\" Save it as a reel hook draft. Done-test: it is one sentence, and the first blank is a real piece of standard advice you have actually heard."},

{id:"t3",topic:"tribes",title:"Who you are beats what you get paid",
body:"<p>People act like the person they think they are. Sometimes they do this even when it costs them money. In one study, asking people to \"be a voter\" got more people to vote than asking them \"to vote\". Same action. The first one describes a kind of person. The second one describes a chore.</p><p>Once a habit is part of who you are, you need much less pushing to keep it going. Nobody has to pay you to be yourself.</p>",
apply:"Do not sell a service. Sell a kind of person to become. \"Someone who practises every day\" is a stronger thing to be than \"someone who bought a course\".",
recall:"Why does \"be a voter\" work better than \"to vote\"?",
answer:"\"Be a voter\" describes a kind of person. People act to match who they think they are. So the action needs much less outside push than a one-off task like \"to vote\" does.",
src:"Bryan et al., 2011",
drill:"Open the China cohort page. Find one line that says what the student gets. Rewrite it as who the student becomes. Done-test: the new line starts with \"You are\" or \"Someone who\"."},

{id:"t4",topic:"tribes",title:"We like people like us, and we say yes to people we like",
body:"<p>People say yes much more often to people they like. And liking comes from things that have little to do with being good at anything. We like people who are like us. We like good-looking people. We like faces we have seen many times. And we like people who work with us toward the same goal.</p><p>Of these four, being alike is the strongest. It is also the cheapest to show honestly. You do not have to fake it if it is true.</p>",
apply:"Being clearly one of them does more than any certificate. Same practice, same struggles, same history on the mat. This is the part of authority nobody can buy.",
recall:"Name four things that make people like someone.",
answer:"Being alike, being good-looking, being familiar from being seen many times, and working together toward the same goal.",
src:"Cialdini, 1984; Zajonc, 1968",
drill:"Pick one recent reel. Count the seconds that show you practising, and the seconds that show you talking at the camera. Done-test: you have both numbers written down."},

{id:"t5",topic:"tribes",title:"Others are rude, you were just tired",
body:"<p>When someone else is short with you, you think, \"They are rude.\" When you are short with someone, you think, \"I was tired and late.\" You judge other people by their character. You judge yourself by your situation.</p><p>Why the difference? Partly it is what you know. You can feel your own pressures but not theirs. Partly it is what you see. The other person stands out like a figure in a picture. Their situation is just the background.</p>",
apply:"When a prospect goes quiet, the gut says \"they are not serious\". Usually they were just busy. Build for the busy situation and you will get more yeses than by judging the person.",
recall:"What are the two reasons we judge others by character and ourselves by situation?",
answer:"One, what you know: you feel your own pressures but not theirs. Two, what stands out: the other person is the figure in the picture and their situation is the background.",
flag:"This effect is weaker in East Asian groups, and sometimes goes the other way. People there more often reach for the situation. So it is probably a habit of some cultures, not of all humans.",
src:"Jones & Harris, 1967; Ross, 1977",
drill:"Find one prospect who went quiet in the last month. Write one sentence about what was probably going on in their week. Then send them a two-line follow-up that assumes that. Done-test: the message is sent, and it does not ask \"are you still interested\"."},

{id:"t6",topic:"tribes",title:"More people watching can mean less help",
body:"<p>When more people are watching, each one is less likely to help. The job of helping gets spread thin. Everybody thinks someone else will do it. And when nobody else moves, that looks like proof that nothing is wrong.</p><p>But here is the catch. In 2020, scientists watched real video of clear, dangerous fights and attacks. Someone stepped in most of the time. So the effect is strongest when it is unclear what is happening. It is weakest when the danger is plain.</p>",
apply:"A message sent to everyone is acted on by nobody. Write to one person you can picture. Use their name, their situation, or a description only they fit. Then the job of answering does not get spread thin.",
recall:"When is the bystander effect weakest?",
answer:"In clear, plainly dangerous emergencies. Video studies find people step in most of the time.",
src:"Darley & Latané, 1968; Philpot et al., 2020",
drill:"Take your latest post or email. Find the words \"everyone\", \"anyone\", or \"you all\". Replace them with one specific person, like \"you, the teacher with ten years of Mysore practice who...\". Done-test: the message names one type of person and no crowd words are left."},

{id:"t7",topic:"tribes",title:"The prison study is a warning, not proof",
body:"<p>The Stanford Prison Experiment is still taught as proof that a bad setup turns normal people cruel. Students played guards and prisoners, and the guards turned harsh. But old tapes show the guards were coached to be harsh. And one famous prisoner breakdown was later called acting by the person who did it.</p><p>There was no comparison group. The sample was tiny. And the man running the study was inside it, playing the prison boss and rooting for his own idea. So it is a story about bad science, not evidence about people.</p>",
apply:"Use this as a test for your sources. If a marketing book calls this study settled proof about human nature, you now know how carefully it checks its other claims.",
recall:"Name three problems with the Stanford Prison Experiment.",
answer:"The guards were coached to be harsh. There was no comparison group. The sample was tiny, and the scientist ran it from inside as a player.",
src:"Le Texier, 2019; Blum, 2018",
drill:"Pick one marketing book or course on your shelf or phone. Search it for \"Stanford\" or \"prison\". Done-test: you have written one word next to its name, either \"cites it\" or \"clean\"."},


/* ============ STORY & EMOTION ============ */
{id:"e1",topic:"story",title:"The thing that happens does not make the feeling. Your read of it does",
body:"<p>Two people get the same news. One feels scared. One feels excited. Same news, different feeling. Even one person can feel differently about the same news on a different day. What changed is how each person read it. Is this a danger or a test I can pass. Is it my fault or not. Can I do something about it or not. A scientist named Lazarus wrote this down in 1991. He called this quick read an appraisal, which just means the story you tell yourself about what happened.</p><p>So the feeling does not come straight from the event. It goes event, then read, then feeling. The read sits in the middle. That is the only reason a feeling can be changed at all. Change the read and the feeling changes with it.</p>",
apply:"You almost never change a student's life. You give them a new way to read it. That is not a trick. It is where the feeling really comes from.",
recall:"Where does the read of an event sit, and why does that matter?",
answer:"It sits between the event and the feeling. The read is what makes the feeling, so if you change the read, the feeling changes too.",
src:"Lazarus, 1991",
drill:"Open one caption or DM reply you wrote this week. Find the line where you tell the reader what their situation means. If there is no such line, write one now, under 15 words, that gives them a new way to read it. Done when you can point to the line with your finger."},

{id:"e2",topic:"story",title:"When someone is lost in a story, they stop arguing back",
body:"<p>Tell someone a plain claim and a small voice in their head starts arguing. Put the same claim inside a story that pulls them in and the arguing mostly stops. Their views drift toward what the story says. Two scientists, Green and Brock, showed this in 2000. They called being pulled in like this transportation, like being carried off to another place.</p><p>Here is the catch. Being carried off does not care if the story is true. It only cares if the story is gripping. A made-up story pulls just as hard as a real one.</p>",
apply:"This is why one student's story beats a claim. It is also why you need to be careful. A story that carries a claim past someone's judgment is powerful and easy to misuse.",
recall:"What happens to arguing back when someone is pulled into a story?",
answer:"It drops a lot. Their views move toward what the story says, without the pushback a plain claim would get.",
src:"Green & Brock, 2000",
drill:"Pick one claim from your China cohort page. For example, why practising alone stalls people. Write it again as a two-sentence true story about one real student. No name needed. Done when the claim is gone as a sentence and only the story is left."},

{id:"e3",topic:"story",title:"Say the feeling's name and it gets smaller",
body:"<p>When you say out loud what you feel, the feeling gets weaker in your body. Not talking about the problem. Just naming the feeling. A team led by Lieberman showed this in 2007 with brain scans. The fear part of the brain, called the amygdala, got quieter. The thinking part at the front got busier.</p><p>It works in normal life too. Saying I am anxious about this does more than explaining all the reasons the thing is hard. The name is the medicine. The explanation is not.</p>",
apply:"Naming your reader's unspoken feeling before you argue anything is the most disarming move you have. It works because it is true.",
recall:"What is the difference between naming a feeling and talking about the problem?",
answer:"Naming says the feeling itself, like I am anxious. Talking about the problem describes the situation instead. The naming is what makes the feeling smaller.",
src:"Lieberman et al., 2007",
drill:"Take the first line of your next reel script or DM reply. Before it, add one line that names the feeling the reader has right now, in one word or two. Read both lines out loud once. Done when the feeling word is on the page and you have said it aloud."},

{id:"e4",topic:"story",title:"People guess wrong about how they will feel later",
body:"<p>Ask someone how they will feel after a big thing happens. They guess too strong and too long. This is true for good things and bad things. Exam results, breakups, getting a promotion, even bad news from a doctor. The real feeling is smaller and fades faster than the guess. Gilbert and Wilson showed this in 1998. The name for it is the impact bias, which means the guess about the impact is too big.</p><p>Two reasons why. First, people picture the one event all alone, like it will fill the whole day. Real days have lunch and traffic in them too. Second, people forget they will get used to it and find a way to explain it to themselves.</p>",
apply:"Promises about how someone will feel afterward are believed at the moment of buying and rarely match the real thing. Sell what actually happens, not the imagined feeling.",
recall:"What two things make people guess wrong about future feelings?",
answer:"One, they picture the event all alone, called focalism. Two, they forget they will get used to it and make sense of it.",
src:"Gilbert & Wilson, 1998",
drill:"Search your cohort page or shop page for a line that promises a feeling. Like \"you will feel amazing\" or \"transformed.\" Cross out one. In its place write what really happens. Like \"six days a week on the mat with the teacher watching.\" Done when one feeling promise is gone and one real thing is in its place."},

{id:"e5",topic:"story",title:"Your mood sneaks in as a clue about things it has nothing to do with",
body:"<p>People use their feelings as clues, even when the feeling came from somewhere else. In 1983, Schwarz and Clore phoned people and asked how happy their whole life was. On sunny days people said their life was better. On rainy days, worse. Their lives had not changed. Only the weather had. The mood from the weather got read as a clue about their whole life.</p><p>Here is the neat part. When the caller first mentioned the weather, the effect went away. Once people knew where the mood came from, they stopped using it as a clue.</p>",
apply:"Where and when someone sees your message becomes part of how they judge it. The setting is not just wrapping paper.",
recall:"What makes the sneaky mood stop changing an unrelated judgment?",
answer:"Pointing out the real source of the mood. Once the person knows where the feeling came from, they stop treating it as a clue about the question.",
src:"Schwarz & Clore, 1983",
drill:"Look at when your last three posts went out. Write next to each one what a 10-year practitioner is probably doing at that hour, like commuting, or just off the mat. Circle the one post that landed at the worst mood moment. Done when one post is circled."},

{id:"e6",topic:"story",title:"Changing the meaning works. Pushing the feeling down does not",
body:"<p>Two ways to handle a strong feeling look alike from the outside. They are not alike inside. Way one is to change what the situation means to you, which is called reappraisal. It lowers the feeling and it calms the body too. Way two is to keep your face flat while you feel it fully, which is called suppression. Gross studied both in 1998.</p><p>Suppression has three costs. The body stays just as worked up. You remember the moment worse. And the person you are talking to gets more stressed. Changing the meaning also works best if you do it early, before the feeling gets big.</p>",
apply:"Useful for you in hard talks with students and hosts. Hiding your irritation passes it on to them. Changing how you read the situation actually makes it smaller.",
recall:"What are the three costs of pushing a feeling down while keeping your face flat?",
answer:"The body stays just as worked up, memory of the moment gets worse, and the other person's stress goes up.",
src:"Gross, 1998",
drill:"Think of one host or student message that annoyed you this week. Write one sentence that gives a kinder reason for what they did, like they were rushed. Say it out loud once. Done when you have said the sentence and it sounds at least half true."},

{id:"e7",topic:"story",title:"More words for feelings means better control of feelings",
body:"<p>Some people feel in big blobs. Good, bad, stressed. Others can tell frustrated from disappointed from resentful. Barrett and her team found in 2001 that people who can tell feelings apart handle them better. When upset, they also lean less on drinking and less on lashing out.</p><p>Why would that be. A sharp name points to a sharp fix. Frustrated means try a different way. Disappointed means adjust what you hoped for. But bad only points to one thing, which is run away.</p>",
apply:"Writing that names one exact feeling instead of a vague one hits harder, because it shows you really know the reader's situation.",
recall:"Why would sharper names for feelings help someone handle them better?",
answer:"A sharp name points to a matching fix. A vague bad points only to escape.",
src:"Barrett et al., 2001",
drill:"Find one vague feeling word in your copy. Like \"frustrated\" or \"stuck.\" Swap it for the exact feeling a serious practitioner has. Like \"bored of the same primary series\" or \"scared they are past their peak.\" Done when the vague word is gone and the exact one is in."},


/* ============ GETTING SOMEONE TO ACT ============ */
{id:"n1",topic:"action",title:"Picking a time and place beats trying harder",
body:"<p>Saying 'I will practise more' fails a lot. Saying 'when it is 6am and I am in the kitchen, I will roll out my mat' works much better. The second one names a cue. The cue is the kitchen at 6am. The cue does the starting, so you do not have to feel brave in the moment.</p><p>These are called if-then plans. Scientists have tested them in many areas of life. The effect is medium size, and it shows up again and again. It is one of the more trustworthy tricks in the whole field.</p>",
apply:"Never end a message with 'get started'. End with a real when and a real where. What closes the gap between wanting and doing is a clear plan, not more motivation.",
recall:"Why does an if-then plan work better than just deciding to try?",
answer:"It hands the job of starting to a clear cue in the world, like a time or a place, instead of relying on willpower in the moment.",
src:"Gollwitzer, 1999; Gollwitzer & Sheeran, 2006 meta-analysis",
drill:"Open the last reel caption or student message you wrote that ends with 'start' or 'try'. Rewrite the last line as 'When [time] and [place], do [one action]'. Done when the new line has a real time, a real place and one action in it."},

{id:"n2",topic:"action",title:"Small bumps stop big plans",
body:"<p>Tiny hurdles stop people far more than you would guess. One extra box on a form. A login. Not knowing what to click next. Each one loses people. Tiny helps do the opposite. Make the next step easier and more people finish.</p><p>Here is the odd part. People care much more about how hard the very next step is than about how big the prize is at the end. A big prize behind a small bump loses to a small prize with no bump.</p>",
apply:"Before you add more selling, take away steps. Most 'people are not buying' problems are really 'the next step is annoying' problems in disguise.",
recall:"Why do small bumps have such a big effect on what people do?",
answer:"People react to how hard the very next step is, much more than to how big the reward at the end is.",
src:"Lewin, 1951; behavioural insights field literature",
drill:"Open your shop page or cohort application on your phone as if you were a new student. Count every tap, box and page between landing and finishing. Remove or merge one of them. Done when the count is one lower than when you started."},

{id:"n3",topic:"action",title:"Willpower is not a fuel tank",
body:"<p>For about twenty years the popular story was this: self-control is like petrol in a tank. Use some and there is less left. This idea was cited in thousands of papers and filled many self-help books.</p><p>Then 23 labs tried the test again together, with the plan written down before they started. They tested 2,141 people. The effect they found was d = 0.04, which is close to nothing, and the error range included zero. The old studies also look like the good results got published and the bad ones got left in a drawer.</p>",
apply:"Any book that says 'make hard choices in the morning because willpower runs out' is repeating a finding that did not survive. Check when the advice you follow was written.",
recall:"What did the big 23-lab retest of willpower depletion find?",
answer:"An effect of d = 0.04, with a 95 percent error range that included zero. In plain words, basically nothing, across 23 labs and 2,141 people.",
flag:"This is the clearest example in the whole deck. Famous, feels obviously true, quoted everywhere, and it did not pass careful retesting.",
src:"Baumeister et al., 1998; Hagger et al., 2016 — verified",
drill:"Look at one piece of advice you follow about when to do hard work, in a book, a note, or your own habit. Say out loud where it came from and what year. If it rests on the willpower tank idea, cross it out. Done when you have said the source and year out loud."},
