name: Fetch a public page (helper)

# One-shot helper: renders a public URL in headless Chromium and prints its
# visible text, so Claude can read pages the sandbox's network policy cannot
# reach (e.g. aybkk.com) and pages that are client-side rendered.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public URL to fetch"
        required: true
        default: "https://aybkk.com/package"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Render with headless Chromium and print text
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > ./render.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const url = process.env.TARGET_URL;
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1280, height: 2000 } });
            await p.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            await p.waitForTimeout(3000);
            // scroll to trigger lazy sections
            await p.evaluate(async () => {
              for (let y = 0; y < document.body.scrollHeight; y += 600) {
                window.scrollTo(0, y); await new Promise(r => setTimeout(r, 120));
              }
            });
            await p.waitForTimeout(1500);
            const text = await p.evaluate(() => document.body.innerText);
            console.log('== VISIBLE TEXT ==');
            console.log(text.split('\n').map(s => s.trim()).filter(Boolean).join('\n'));
            console.log('== LINKS ==');
            const links = await p.evaluate(() =>
              [...document.querySelectorAll('a')].map(a => a.textContent.trim() + ' -> ' + a.href)
                .filter(s => s.length > 4));
            console.log([...new Set(links)].slice(0, 60).join('\n'));
            await b.close();
          })().catch(e => { console.error('RENDER FAILED:', e.message); process.exit(1); });
          JS
          TARGET_URL="${{ inputs.url }}" node ./render.js
