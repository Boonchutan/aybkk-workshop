name: Shop products check

# Manual: prints the live shop product list so it can be verified from CI logs.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live products
        run: |
          curl -sf --max-time 20 "https://my.aybkk.com/api/shop/products" -o /tmp/p.json
          python3 - <<'EOF'
          import json
          d = json.load(open('/tmp/p.json'))
          ps = d['products']
          print(f"{len(ps)} products live")
          for p in ps:
              total = sum(p['sizes'].values())
              photo = 'photo:yes' if p.get('photo') else 'photo:NO'
              print(f"{p['id']:>10} | {p['nameEn'][:38]:38} | full {p.get('fullPrice')} pre {p['price']} | {total:3} pcs | {photo}")
          EOF
