<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYBKK Bangkok Admin</title>
<style>
  @font-face{font-family:'Long Cang';src:url('/fonts/longcang.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Plex';src:url('/fonts/plexthai.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Plex';src:url('/fonts/plexthai-th.woff2') format('woff2');
    unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;font-display:swap}
  :root{--ink:#17121a;--wall:#f7f1f5;--paper:#fff;--blush:#fbe7f0;--plum:#5c2160;--plum-deep:#43164a;
    --pink:#e8458c;--soft:#6b5d70;--line:rgba(23,18,26,.11);--on-dark:#fdf7fa;--header:#17121a}
  @media (prefers-color-scheme:dark){:root{--ink:#f5e9f0;--wall:#140f18;--paper:#1e1723;--blush:#2b1c2b;
    --plum:#c07ec8;--plum-deep:#d9a5de;--pink:#ff6fae;--soft:#b09cb6;--line:rgba(245,233,240,.14);--on-dark:#17121a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--wall);color:var(--ink);font:16px/1.6 'Plex',-apple-system,'Helvetica Neue','PingFang SC',sans-serif}
  header{background:var(--header);color:#fdf7fa;padding:16px;display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:26px;flex:1;font-family:'Long Cang',cursive;font-weight:400;line-height:1.1}
  nav{display:flex;background:var(--paper);border-bottom:1px solid var(--line)}
  nav button{flex:1;padding:13px;border:none;background:none;font:inherit;font-weight:700;font-size:15px;color:var(--soft);cursor:pointer}
  nav button.on{color:var(--plum);box-shadow:inset 0 -3px 0 var(--plum)}
  main{max-width:820px;margin:0 auto;padding:14px}
  .box{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px}
  .box b{font-family:'Long Cang',cursive;font-weight:400}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--soft);font-size:12px}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
  .pending{background:#fff3d6;color:#8a6a12}.paid{background:#e6f6ec;color:#187a43}
  .mismatch,.failed{background:#fdeaea;color:#a33}
  .btn{padding:9px 14px;border:none;border-radius:7px;background:var(--plum);color:var(--on-dark);font-weight:700;font-size:14px;cursor:pointer;font-family:'Long Cang',cursive;font-weight:400}
  .btn.gray{background:var(--plum-deep)}.btn.pink{background:var(--pink)}.btn.red{background:#b3453c}
  input{padding:10px;border:1.5px solid var(--line);border-radius:7px;font-size:15px;font-family:inherit;background:var(--wall);color:var(--ink)}
  #gate{max-width:340px;margin:16vh auto;text-align:center}
  .muted{color:var(--soft);font-size:12.5px}
  .in{color:#187a43;font-weight:700}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h2 style="margin:4px 0 12px;font-family:'Long Cang',cursive;font-weight:400">AYBKK Bangkok Admin</h2>
    <input id="key" type="password" placeholder="passcode" style="width:100%">
    <button class="btn" style="width:100%;margin-top:12px" onclick="unlock()">Enter</button>
    <p class="muted" id="gateMsg"></p>
  </div>
</div>

<div id="app" style="display:none">
<header><h1>AYBKK Bangkok Admin</h1><button class="btn gray" onclick="logout()">Lock</button></header>
<nav>
  <button id="t-today" class="on" onclick="tab('today')">Today</button>
  <button id="t-students" onclick="tab('students')">Students</button>
  <button id="t-classes" onclick="tab('classes')">Classes</button>
  <button id="t-orders" onclick="tab('orders')">Payments</button>
  <button id="t-settings" onclick="tab('settings')">Settings</button>
</nav>
<main id="view"></main>
</div>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  let KEY = localStorage.getItem('aybkk_bkk_key') || '';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const api = (url, opts = {}) => fetch(url, { ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Bkk-Key': KEY, ...(opts.headers || {}) } });
  const time = iso => new Date(iso).toLocaleTimeString('en-GB',
    { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' });

  window.unlock = async () => {
    KEY = $('#key').value.trim();
    const r = await api('/api/bkk/admin/orders');
    if (r.status === 401) { $('#gateMsg').textContent = 'wrong passcode'; return; }
    localStorage.setItem('aybkk_bkk_key', KEY);
    $('#gate').style.display = 'none'; $('#app').style.display = 'block';
    tab('today');
  };
  window.logout = () => { localStorage.removeItem('aybkk_bkk_key'); location.reload(); };

  let current = 'today';
  window.tab = t => {
    current = t;
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.id === 't-' + t));
    if (t === 'today') renderToday();
    if (t === 'students') renderStudents();
    if (t === 'classes') renderClasses();
    if (t === 'orders') renderOrders();
    if (t === 'settings') renderSettings();
  };

  const day = iso => new Date(iso).toLocaleDateString('en-GB',
    { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Bangkok' });
  const ask = (q, d = '') => { const v = prompt(q, d); return v === null ? null : v.trim(); };
  const shout = async (r) => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.error || 'failed'); return null; }
    return j;
  };

  // ── students ──────────────────────────────────────────────────────────────
  async function renderStudents(term) {
    $('#view').innerHTML = `<div class="box">
      <b>Students</b>
      <p class="muted">Search by name, email, phone or member code.</p>
      <p><input id="q" placeholder="e.g. Anna, or anna@…" style="width:68%" value="${esc(term || '')}">
      <button class="btn" onclick="findStudents()">Search</button></p>
      <div id="results"></div>
    </div>
    <div class="box">
      <b>Give a pass</b>
      <p class="muted">For a student who paid another way, a comp, or someone moving
      over from Rezerv. No payment is recorded and no receipt is sent.</p>
      <p><button class="btn pink" onclick="grantPass()">Give a pass</button></p>
    </div>`;
    $('#q').onkeydown = e => { if (e.key === 'Enter') findStudents(); };
    if (term) findStudents();
  }

  window.findStudents = async () => {
    const term = $('#q').value.trim();
    if (term.length < 2) { $('#results').innerHTML = '<p class="muted">Type at least two letters.</p>'; return; }
    const d = await api('/api/bkk/admin/members?q=' + encodeURIComponent(term)).then(r => r.json());
    const ms = d.members || [];
    if (!ms.length) { $('#results').innerHTML = '<p class="muted">Nobody matches that.</p>'; return; }
    $('#results').innerHTML = ms.map(m => `<div style="border-top:1px solid var(--line);padding:12px 0">
      <b>${esc(m.name)}</b> <span class="muted">${esc(m.code)}</span><br>
      <span class="muted">${esc(m.email || 'no email')}${m.phone ? ' · ' + esc(m.phone) : ''}
        · ${m.booked} upcoming</span>
      ${(m.passes || []).map(p => `<div style="margin-top:8px">
        <span class="pill ${p.status === 'active' ? 'paid' : 'pending'}">${esc(p.status)}</span>
        ${esc(p.name_en)} —
        ${p.kind === 'unlimited' ? 'unlimited' : `${p.credits_total - p.credits_used} left`}
        ${p.valid_until ? ' · until ' + String(p.valid_until).slice(0, 10) : ' · not started'}
        <br>
        <button class="btn gray" onclick="passAct(${p.id},'freeze')">Freeze</button>
        <button class="btn gray" onclick="passAct(${p.id},'unfreeze')">Unfreeze</button>
        <button class="btn gray" onclick="passAct(${p.id},'extend')">Extend</button>
        <button class="btn red" onclick="passAct(${p.id},'void')">Void</button>
      </div>`).join('') || '<p class="muted">No pass.</p>'}
      <p style="margin-top:8px"><button class="btn" onclick="bookFor('${esc(m.code)}')">Book into a class</button></p>
    </div>`).join('');
  };

  window.passAct = async (id, what) => {
    let body = {};
    if (what === 'freeze') {
      const days = ask('Pause for how many days?', '30'); if (days === null) return;
      const reason = ask('Why? (injury, travel…)', ''); if (reason === null) return;
      body = { days: Number(days), reason };
    } else if (what === 'extend') {
      const days = ask('Add how many days? (0 for none)', '7'); if (days === null) return;
      const credits = ask('Add how many classes? (0 for none)', '0'); if (credits === null) return;
      body = { days: Number(days), credits: Number(credits), reason: ask('Note', '') || '' };
    } else if (what === 'void') {
      if (!confirm('Void this pass? The student will not be able to book with it.')) return;
      body = { reason: ask('Why?', '') || '' };
    }
    const r = await api(`/api/bkk/admin/passes/${id}/${what}`, { method: 'POST', body: JSON.stringify(body) });
    if (await shout(r)) findStudents();
  };

  window.grantPass = async () => {
    const d = await fetch('/api/bkk/products').then(r => r.json());
    const codes = d.products.map(p => p.code).join(', ');
    const productCode = ask('Which package? (' + codes + ')', 'pack10'); if (!productCode) return;
    const name = ask('Student name'); if (!name) return;
    const email = ask('Email (used to find them again)'); if (email === null) return;
    const validFrom = ask('Start date YYYY-MM-DD (blank = starts on first booking)', '');
    if (validFrom === null) return;
    let validUntil = '';
    if (validFrom) { validUntil = ask('Expires YYYY-MM-DD'); if (!validUntil) return; }
    const r = await api('/api/bkk/admin/passes', { method: 'POST', body: JSON.stringify({
      productCode, name, email, source: 'manual',
      validFrom: validFrom || null, validUntil: validUntil || null,
      note: ask('Note (why)', '') || '' }) });
    const j = await shout(r);
    if (j) { alert(`Done. ${j.member.name} — member code ${j.member.code}`); renderStudents(name); }
  };

  window.bookFor = async (code) => {
    const d = await fetch('/api/bkk/schedule?days=14').then(r => r.json());
    const list = (d.classes || []).slice(0, 40);
    const pick = ask('Which class?\n' + list.map((c, i) =>
      `${i + 1}. ${day(c.startAt)} ${time(c.startAt)} ${c.title} (${c.seatsLeft} left)`).join('\n'), '1');
    if (!pick) return;
    const c = list[Number(pick) - 1];
    if (!c) return alert('No class with that number.');
    const r = await api('/api/bkk/bookings', { method: 'POST',
      body: JSON.stringify({ memberCode: code, slotId: c.slotId, date: c.date }) });
    if (await shout(r)) { alert('Booked.'); findStudents(); }
  };

  // ── classes ───────────────────────────────────────────────────────────────
  async function renderClasses() {
    const d = await fetch('/api/bkk/schedule?days=21').then(r => r.json());
    const rows = (d.classes || []).map(c => `<tr>
      <td>${day(c.startAt)}<br><span class="muted">${time(c.startAt)}</span></td>
      <td>${esc(c.title)}<br><span class="muted">${c.booked} booked of ${c.capacity}</span></td>
      <td><button class="btn red" onclick="closeClass(${c.slotId},'${c.date}','${esc(c.title)}')">Close</button></td>
    </tr>`).join('');
    $('#view').innerHTML = `<div class="box"><b>Next three weeks</b>
      <p class="muted">Closing a class gives every booked student their credit back
      and emails them. A closed class disappears from the timetable.</p>
      <table>${rows || '<tr><td class="muted">no classes</td></tr>'}</table>
      <p class="muted">Put one back: <button class="btn gray" onclick="reopenClass()">Reopen a class</button></p>
    </div>`;
  }

  window.closeClass = async (slotId, date, title) => {
    if (!confirm(`Close ${title} on ${date}?\nEveryone booked gets their credit back and an email.`)) return;
    const reason = ask('Reason (students see this)', 'Moon day'); if (reason === null) return;
    const r = await api('/api/bkk/admin/classes/cancel', { method: 'POST',
      body: JSON.stringify({ slotId, date, reason }) });
    const j = await shout(r);
    if (j) { alert(`Closed. ${j.released} booking(s) released, ${j.notified} emailed.`); renderClasses(); }
  };

  window.reopenClass = async () => {
    const slotId = ask('Class number (slotId)'); if (!slotId) return;
    const date = ask('Date YYYY-MM-DD'); if (!date) return;
    const r = await api('/api/bkk/admin/classes/reopen', { method: 'POST',
      body: JSON.stringify({ slotId: Number(slotId), date }) });
    if (await shout(r)) renderClasses();
  };

  async function renderToday() {
    const d = await api('/api/bkk/admin/today').then(r => r.json());
    const rows = (d.bookings || []);
    if (!rows.length) {
      $('#view').innerHTML = '<div class="box"><b>Today</b><p class="muted">No bookings today.</p></div>';
      return;
    }
    const byClass = {};
    for (const b of rows) {
      const k = b.title + '|' + b.start_at;
      (byClass[k] = byClass[k] || []).push(b);
    }
    const blocks = Object.entries(byClass).map(([k, list]) => {
      const [title, startAt] = k.split('|');
      const inCount = list.filter(b => b.checked_in_at).length;
      return `<div class="box">
        <b>${time(startAt)} · ${esc(title)}</b>
        <span class="muted"> — ${list.length} booked, ${inCount} checked in</span>
        <table>${list.map(b => `<tr>
          <td>${esc(b.name)}</td>
          <td class="muted">${esc(b.code)}</td>
          <td>${b.checked_in_at ? '<span class="in">✓ in</span>' : '<span class="muted">not yet</span>'}</td>
        </tr>`).join('')}</table></div>`;
    }).join('');
    $('#view').innerHTML = blocks;
  }

  async function renderOrders() {
    const d = await api('/api/bkk/admin/orders').then(r => r.json());
    const rows = (d.orders || []).map(o => `<tr>
      <td><b>${esc(o.member_name)}</b><br><span class="muted">${esc(o.email || '')}<br>${esc(o.member_code)}</span></td>
      <td>${esc(o.name_en)}<br><b>฿${o.amount_thb.toLocaleString()}</b>
        <br><span class="muted">${o.base_thb.toLocaleString()} + fee ${o.fee_thb.toLocaleString()}</span></td>
      <td><span class="pill ${esc(o.status)}">${esc(o.status)}</span><br>
        <span class="muted">${(o.created_at || '').slice(5, 16).replace('T', ' ')}</span>
        ${o.gateway_note ? `<br><span class="muted">${esc(String(o.gateway_note).slice(0, 60))}</span>` : ''}</td>
      <td class="muted">${o.refno}</td>
      <td>${o.status !== 'paid'
        ? `<button class="btn red" onclick="force(${o.id})">Activate</button>`
        : ''}</td>
    </tr>`).join('');
    $('#view').innerHTML = `<div class="box"><b>Payments</b>
      <button class="btn gray" style="float:right" onclick="tab('orders')">↻</button>
      <table><tr><th>Student</th><th>Package</th><th>Status</th><th>Ref</th><th></th></tr>
      ${rows || '<tr><td class="muted">no orders yet</td></tr>'}</table>
      <p class="muted">Find the reference number in the PaySolutions dashboard, check the
      amount matches, then activate. Every activation here is recorded as manual.</p></div>`;
  }

  window.force = async (id) => {
    if (!confirm('Activate this pass?\nOnly do this once you have seen the money arrive in PaySolutions.')) return;
    const r = await api(`/api/bkk/admin/orders/${id}/force-activate`, { method: 'POST' });
    if (!r.ok) alert((await r.json()).error || 'failed');
    renderOrders();
  };

  let LINKS = {};                       // social links, loaded with the tab

  async function renderSettings() {
    const p = await fetch('/api/bkk/products').then(r => r.json());
    LINKS = await fetch('/api/bkk/settings').then(r => r.json())
      .then(d => d.links || {}).catch(() => ({}));
    $('#view').innerHTML = `<div class="box">
      <b>Online payment fee</b>
      <p class="muted">Added on top of every package price at checkout. It exists to
      cover the card fees — PaySolutions is cheaper than Stripe, so you may want to lower it.</p>
      <p><input id="sur" type="number" min="0" max="20" step="0.5" value="${p.surchargePct}" style="width:90px"> %
      <button class="btn" onclick="saveSur()">Save</button></p>
      </div>
      <div class="box"><b>Packages</b>
      <p class="muted">Change a price or retire one. What a package DOES — classes
      included, how long it lasts — is fixed once it exists, so passes already sold
      cannot be rewritten underneath the students who bought them.</p>
      <table><tr><th>Package</th><th>Base</th><th>Student pays</th><th></th></tr>
      ${p.products.map(x => `<tr><td>${esc(x.name_en)}<br><span class="muted">${esc(x.code)}</span></td>
        <td>฿${x.price_thb.toLocaleString()}</td>
        <td><b>฿${x.total_thb.toLocaleString()}</b></td>
        <td><button class="btn gray" onclick="editProduct('${esc(x.code)}',${x.price_thb})">Price</button>
            <button class="btn red" onclick="retireProduct('${esc(x.code)}')">Retire</button></td>
      </tr>`).join('')}</table>
      <p><button class="btn pink" onclick="newProduct()">Add a package</button></p>
      </div>
      <div class="box"><b>Links</b>
      <p class="muted">Where students are sent from their page. Leave one blank to
      hide it. Paste the full address, starting https://</p>
      ${['instagram', 'youtube', 'tiktok', 'line', 'wechat', 'facebook', 'shop']
        .map(k => `<label style="display:block;margin-top:8px">${k}</label>
          <input id="lk_${k}" style="width:100%" placeholder="https://…"
                 value="${esc((LINKS || {})[k] || '')}">`).join('')}
      <p style="margin-top:12px"><button class="btn" onclick="saveLinks()">Save links</button></p>
      </div>`;
  }

  window.editProduct = async (code, current) => {
    const v = ask(`New base price for ${code} (฿), before the online fee`, String(current));
    if (v === null) return;
    const r = await api('/api/bkk/admin/products', { method: 'POST',
      body: JSON.stringify({ code, priceThb: Number(v) }) });
    if (await shout(r)) renderSettings();
  };

  window.retireProduct = async (code) => {
    if (!confirm(`Stop selling ${code}?\nPasses already bought keep working.`)) return;
    const r = await api('/api/bkk/admin/products', { method: 'POST',
      body: JSON.stringify({ code, active: false }) });
    if (await shout(r)) renderSettings();
  };

  window.newProduct = async () => {
    const nameEn = ask('Name, as students see it'); if (!nameEn) return;
    const code = ask('Short code (letters and numbers, no spaces)',
      nameEn.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12)); if (!code) return;
    const kind = ask('Type: "credits" for a class pack, "unlimited" for a membership', 'credits');
    if (!kind) return;
    const priceThb = ask('Price in ฿, before the online fee'); if (!priceThb) return;
    const validDays = ask('Valid for how many days after the first class?', '90'); if (!validDays) return;
    const credits = kind === 'credits' ? ask('How many classes?', '10') : null;
    if (kind === 'credits' && !credits) return;
    const r = await api('/api/bkk/admin/products', { method: 'POST', body: JSON.stringify({
      code, nameEn, kind, priceThb: Number(priceThb),
      validDays: Number(validDays), credits: credits ? Number(credits) : undefined }) });
    if (await shout(r)) renderSettings();
  };

  window.saveLinks = async () => {
    const links = {};
    for (const k of ['instagram', 'youtube', 'tiktok', 'line', 'wechat', 'facebook', 'shop']) {
      links[k] = $('#lk_' + k).value.trim();
    }
    const r = await api('/api/bkk/admin/settings', { method: 'POST', body: JSON.stringify({ links }) });
    const j = await shout(r);
    if (j) { LINKS = links; alert('Saved.'); }
  };

  window.saveSur = async () => {
    const v = Number($('#sur').value);
    const r = await api('/api/bkk/admin/settings', { method: 'POST',
      body: JSON.stringify({ surchargePct: v }) });
    if (!r.ok) return alert('failed');
    renderSettings();
  };

  if (KEY) { $('#key').value = KEY; unlock(); }
})();
</script>
</body>
</html>
