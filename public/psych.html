/* ================= STATE ================= */
const KEY = "mindstash.v1";
const DAY = 86400000;
const byId = {};
CARDS.forEach(c => { byId[c.id] = c; });
const topicName = id => (TOPICS.find(t => t.id === id) || {}).name || id;

function blank(){
  return { topics: TOPICS.map(t => t.id), srs:{}, stash:[], seen:[],
           streak:0, lastDay:null, xp:0, theme:null, dailyLimit:5, newDay:null, newCount:0 };
}
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const p = JSON.parse(raw);
    const b = blank();
    return Object.assign(b, p, { topics: Array.isArray(p.topics) && p.topics.length ? p.topics : b.topics });
  }catch(e){ return blank(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const todayKey = () => new Date().toISOString().slice(0,10);

function touchStreak(){
  const t = todayKey();
  if(S.lastDay === t) return;
  const y = new Date(Date.now() - DAY).toISOString().slice(0,10);
  S.streak = (S.lastDay === y) ? S.streak + 1 : 1;
  S.lastDay = t;
  save();
}

/* ================= SPACED REPETITION (SM-2 lite) ================= */
function schedule(id, grade){
  const s = S.srs[id] || { ease:2.5, ivl:0, due:0, reps:0, lapses:0 };
  if(grade === 0){
    s.lapses++; s.reps = 0; s.ease = Math.max(1.3, s.ease - 0.2);
    s.ivl = 0; s.due = Date.now() + 600000;             // 10 minutes
  }else{
    if(s.reps === 0)      s.ivl = (grade === 1) ? 1 : (grade === 2 ? 1 : 3);
    else if(s.reps === 1) s.ivl = (grade === 1) ? 3 : (grade === 2 ? 4 : 6);
    else{
      const mult = (grade === 1) ? 1.2 : (grade === 2 ? s.ease : s.ease * 1.3);
      s.ivl = Math.round(s.ivl * mult);
    }
    if(grade === 1) s.ease = Math.max(1.3, s.ease - 0.15);
    if(grade === 3) s.ease = Math.min(3.2, s.ease + 0.1);
    s.reps++;
    s.due = Date.now() + s.ivl * DAY;
  }
  S.srs[id] = s;
  S.xp += (grade === 0) ? 2 : 5;
  touchStreak(); save();
}
function previewIvl(id, grade){
  const s = S.srs[id] || { ease:2.5, ivl:0, reps:0 };
  if(grade === 0) return "10m";
  let d;
  if(s.reps === 0)      d = (grade === 1) ? 1 : (grade === 2 ? 1 : 3);
  else if(s.reps === 1) d = (grade === 1) ? 3 : (grade === 2 ? 4 : 6);
  else{
    const mult = (grade === 1) ? 1.2 : (grade === 2 ? s.ease : s.ease * 1.3);
    d = Math.round(s.ivl * mult);
  }
  return d < 30 ? d + "d" : Math.round(d/30) + "mo";
}
const dueCards    = () => Object.keys(S.srs).filter(id => byId[id] && S.srs[id].due <= Date.now()).map(id => byId[id]);
const masteredIds = () => Object.keys(S.srs).filter(id => S.srs[id].ivl >= 21);

/* ================= HELPERS ================= */
const $ = sel => document.querySelector(sel);
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
let toastT;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1600);
}
function cardHTML(c){
  return '<div class="topic">' + esc(topicName(c.topic)) + '</div>' +
         '<h2>' + esc(c.title) + '</h2>' +
         '<div class="body">' + c.body + '</div>' +
         (c.apply ? '<div class="apply"><b>Use it</b>' + esc(c.apply) + '</div>' : '') +
         (c.flag ? '<div class="flag"><b>Worth flagging.</b> ' + esc(c.flag) + '</div>' : '') +
         '<div class="src">' + esc(c.src) + '</div>';
}

/* ================= FEED ================= */
let feedQueue = [];
function newToday(){
  if(S.newDay !== todayKey()){ S.newDay = todayKey(); S.newCount = 0; save(); }
  return S.newCount;
}
function countNew(){ newToday(); S.newCount++; save(); }
function buildFeed(){
  const seen = new Set(S.seen);
  feedQueue = CARDS.filter(c => S.topics.indexOf(c.topic) !== -1 && !seen.has(c.id));
  for(let i = feedQueue.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = feedQueue[i]; feedQueue[i] = feedQueue[j]; feedQueue[j] = t;
  }
}
function renderFeed(){
  const el = $("#p-feed");
  if(!feedQueue.length) buildFeed();
  if(!feedQueue.length){
    const total = CARDS.filter(c => S.topics.indexOf(c.topic) !== -1).length;
    el.innerHTML = '<div class="empty"><div class="big">You have seen all ' + total + ' cards</div>' +
      '<p>in the topics you switched on. Turn on more topics, or work your review queue in Study.</p>' +
      '<div class="actions" style="max-width:320px;margin:18px auto 0">' +
      '<button class="btn" id="fResetSeen">Reset feed</button>' +
      '<button class="btn primary" data-go="topics">Topics</button></div></div>';
    $("#fResetSeen").onclick = () => { S.seen = []; save(); buildFeed(); renderFeed(); toast("Feed reset"); };
    return;
  }
  if(S.dailyLimit && newToday() >= S.dailyLimit){
    const d = dueCards().length;
    el.innerHTML = '<div class="empty"><div class="big">Done for today</div>' +
      '<p>You have read your ' + S.dailyLimit + ' new cards. Spacing does the work now — ' +
      'more today mostly means more forgotten by Friday.</p>' +
      '<div class="actions" style="max-width:340px;margin:18px auto 0">' +
      (d ? '<button class="btn primary" data-go="study">Review ' + d + ' due</button>' : '') +
      '<button class="btn" id="fMore">Read 3 more anyway</button></div></div>';
    $("#fMore").onclick = () => { S.newCount = Math.max(0, S.newCount - 3); save(); renderFeed(); };
    return;
  }
  const c = feedQueue[0];
  const inStash = S.stash.indexOf(c.id) !== -1;
  const total = CARDS.filter(x => S.topics.indexOf(x.topic) !== -1).length;
  el.innerHTML =
    '<div class="meta"><span>' + (total - feedQueue.length + 1) + ' of ' + total + '</span>' +
    '<span>' + S.stash.length + ' stashed</span></div>' +
    '<article class="card">' + cardHTML(c) + '</article>' +
    '<div class="actions">' +
      '<button class="btn" id="fSkip">Skip</button>' +
      '<button class="btn ' + (inStash ? "on" : "primary") + '" id="fStash">' +
        (inStash ? "In your stash" : "Stash & study") + '</button>' +
    '</div>' +
    '<div class="note">Stashing adds the card to spaced repetition. It comes back for recall practice before you would forget it.</div>';

  $("#fSkip").onclick = () => { S.seen.push(c.id); countNew(); save(); feedQueue.shift(); renderFeed(); };
  $("#fStash").onclick = () => {
    if(S.stash.indexOf(c.id) === -1){
      S.stash.push(c.id);
      S.srs[c.id] = { ease:2.5, ivl:0, due:Date.now(), reps:0, lapses:0 };
      S.xp += 3; touchStreak();
    }
    if(S.seen.indexOf(c.id) === -1) S.seen.push(c.id);
    countNew(); save(); feedQueue.shift(); renderFeed(); paintStats();
    toast("Stashed — due in Study");
  };
}

/* ================= STUDY ================= */
let studyCard = null, revealed = false;
function renderStudy(){
  const el = $("#p-study");
  const due = dueCards();
  if(!due.length){
    const upcoming = Object.keys(S.srs).length;
    el.innerHTML = '<div class="empty"><div class="big">' +
      (upcoming ? "Nothing due right now" : "Your review queue is empty") + '</div>' +
      '<p>' + (upcoming
        ? "Reviews return on schedule. " + upcoming + " card" + (upcoming===1?"":"s") + " in rotation."
        : "Stash cards from the Feed and they will appear here for recall practice.") + '</p>' +
      '<div class="actions" style="max-width:320px;margin:18px auto 0">' +
      '<button class="btn primary" data-go="feed">Go to Feed</button></div></div>';
    return;
  }
  if(!studyCard || due.indexOf(studyCard) === -1){ studyCard = due[0]; revealed = false; }
  const c = studyCard;
  el.innerHTML =
    '<div class="meta"><span>' + due.length + ' due</span><span>' + esc(topicName(c.topic)) + '</span></div>' +
    '<article class="card">' +
      '<div class="topic">Recall</div>' +
      '<h2>' + esc(c.title) + '</h2>' +
      '<div class="recall">' +
        '<p class="q">' + esc(c.recall) + '</p>' +
        '<p class="hint">Answer it out loud before revealing. The effort is what builds the memory.</p>' +
        (revealed ? '<p class="a">' + esc(c.answer) + '</p>' : '') +
      '</div>' +
    '</article>' +
    (revealed
      ? '<div class="grades">' +
          '<button class="grade g0" data-g="0">Again<small>' + previewIvl(c.id,0) + '</small></button>' +
          '<button class="grade" data-g="1">Hard<small>' + previewIvl(c.id,1) + '</small></button>' +
          '<button class="grade" data-g="2">Good<small>' + previewIvl(c.id,2) + '</small></button>' +
          '<button class="grade g3" data-g="3">Easy<small>' + previewIvl(c.id,3) + '</small></button>' +
        '</div>' +
        '<div class="actions"><button class="btn" id="sFull">Read the full card</button></div>'
      : '<div class="actions"><button class="btn primary" id="sReveal">Show answer</button></div>');

  if(revealed){
    el.querySelectorAll(".grade").forEach(b => {
      b.onclick = () => {
        schedule(c.id, parseInt(b.dataset.g, 10));
        studyCard = null; revealed = false;
        renderStudy(); paintStats();
      };
    });
    $("#sFull").onclick = () => {
      const a = document.createElement("article");
      a.className = "card"; a.style.marginTop = "12px";
      a.innerHTML = cardHTML(c);
      $("#sFull").parentElement.after(a);
      $("#sFull").remove();
    };
  }else{
    $("#sReveal").onclick = () => { revealed = true; renderStudy(); };
  }
}

/* ================= STASH ================= */
function renderStash(){
  const el = $("#p-stash");
  const q = (window.__q || "").toLowerCase().trim();
  let list = S.stash.map(id => byId[id]).filter(Boolean).reverse();
  if(q) list = list.filter(c => (c.title + " " + c.body + " " + c.src).toLowerCase().indexOf(q) !== -1);
  el.innerHTML =
    '<input id="search" placeholder="Search your stash" value="' + esc(window.__q || "") + '">' +
    (list.length
      ? list.map(c => {
          const s = S.srs[c.id];
          const when = s ? (s.due <= Date.now() ? "due now" : "in " + Math.max(1, Math.round((s.due - Date.now())/DAY)) + "d") : "";
          return '<button class="mini" data-open="' + c.id + '">' +
                 '<div class="mtop">' + esc(topicName(c.topic)) + (when ? " · " + when : "") + '</div>' +
                 '<div class="mt">' + esc(c.title) + '</div>' +
                 '<div class="mb">' + esc(c.answer) + '</div></button>';
        }).join("")
      : '<div class="empty"><div class="big">' + (q ? "No match" : "Nothing stashed yet") + '</div>' +
        '<p>' + (q ? "Try another word." : "Cards you stash from the Feed collect here.") + '</p></div>');

  const si = $("#search");
  si.oninput = () => { window.__q = si.value; const p = si.selectionStart; renderStash();
                       const n = $("#search"); n.focus(); n.setSelectionRange(p, p); };
  el.querySelectorAll("[data-open]").forEach(b => {
    b.onclick = () => {
      const c = byId[b.dataset.open];
      const a = document.createElement("article");
      a.className = "card"; a.style.margin = "10px 0";
      a.innerHTML = cardHTML(c) +
        '<div class="actions"><button class="btn" data-un="' + c.id + '">Remove from stash</button></div>';
      b.replaceWith(a);
      a.querySelector("[data-un]").onclick = () => {
        S.stash = S.stash.filter(x => x !== c.id);
        delete S.srs[c.id]; save(); renderStash(); paintStats(); toast("Removed");
      };
    };
  });
}

/* ================= TOPICS ================= */
function renderTopics(){
  const el = $("#p-topics");
  el.innerHTML = '<h3 class="sec">What lands in your feed</h3><div class="tlist">' +
    TOPICS.map(t => {
      const on = S.topics.indexOf(t.id) !== -1;
      const n = CARDS.filter(c => c.topic === t.id).length;
      const done = CARDS.filter(c => c.topic === t.id && S.srs[c.id]).length;
      return '<button class="trow' + (on ? "" : " off") + '" data-t="' + t.id + '">' +
             '<span class="chk">✓</span><span class="tx"><span class="tn">' + esc(t.name) + '</span>' +
             '<span class="td">' + done + " of " + n + ' in rotation · ' + esc(t.desc) + '</span></span></button>';
    }).join("") + '</div>' +
    '<h3 class="sec">Daily pace</h3>' +
    '<div class="actions" id="paceRow">' +
      [3,5,8,0].map(n => '<button class="btn' + (S.dailyLimit === n ? ' on' : '') + '" data-n="' + n + '">' +
        (n ? n : 'No cap') + '</button>').join("") +
    '</div>' +
    '<div class="note">Ten topics, 70 cards, seven per topic. New cards a day is capped so the review queue stays survivable — reviews are never capped. Switching a topic off only hides it from the Feed; anything already stashed stays in your queue.</div>';
  el.querySelectorAll("#paceRow [data-n]").forEach(b => {
    b.onclick = () => { S.dailyLimit = parseInt(b.dataset.n, 10); save(); renderTopics();
                        toast(S.dailyLimit ? S.dailyLimit + " new cards a day" : "No daily cap"); };
  });
  el.querySelectorAll("[data-t]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.t;
      const i = S.topics.indexOf(id);
      if(i === -1) S.topics.push(id);
      else if(S.topics.length > 1) S.topics.splice(i, 1);
      else return toast("Keep at least one topic on");
      save(); buildFeed(); renderTopics();
    };
  });
}

/* ================= PROGRESS ================= */
function renderProgress(){
  const el = $("#p-progress");
  const inRot = Object.keys(S.srs).length;
  const mast = masteredIds().length;
  const lvl = Math.floor(S.xp / 100) + 1;
  el.innerHTML =
    '<div class="stats">' +
      '<div class="sbox"><div class="n">' + S.streak + '</div><div class="l">day streak</div></div>' +
      '<div class="sbox"><div class="n">' + inRot + '</div><div class="l">cards in rotation</div></div>' +
      '<div class="sbox"><div class="n">' + mast + '</div><div class="l">mastered (21d+)</div></div>' +
      '<div class="sbox"><div class="n">' + lvl + '</div><div class="l">level · ' + S.xp + ' xp</div></div>' +
    '</div>' +
    '<h3 class="sec">By topic</h3>' +
    TOPICS.map(t => {
      const all = CARDS.filter(c => c.topic === t.id);
      const m = all.filter(c => S.srs[c.id] && S.srs[c.id].ivl >= 21).length;
      const r = all.filter(c => S.srs[c.id]).length;
      return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:14px">' +
             '<b style="font-weight:600">' + esc(t.name) + '</b>' +
             '<span style="color:var(--ink-3)">' + m + '/' + all.length + '</span></div>' +
             '<div class="pbar"><i style="width:' + Math.round((r/all.length)*100) + '%"></i></div></div>';
    }).join("") +
    '<div class="note"><b>How the schedule works.</b> A stashed card returns for recall before you would have forgotten it. Rate honestly — grading everything Easy just means you meet it again too late to matter. A card counts as mastered once its interval passes 21 days.</div>' +
    '<div class="actions" style="margin-top:16px"><button class="btn" id="wipe">Reset all progress</button></div>';
  $("#wipe").onclick = () => {
    if(confirm("Delete your streak, stash and all review schedules? This cannot be undone.")){
      S = blank(); save(); buildFeed(); paintStats(); show("feed"); toast("Reset");
    }
  };
}

/* ================= CHROME ================= */
function paintStats(){
  $("#sStreak").textContent = S.streak;
  $("#sMastered").textContent = masteredIds().length;
  const d = dueCards().length;
  const pill = $("#dueCount");
  pill.textContent = d; pill.style.display = d ? "" : "none";
}
const RENDER = { feed:renderFeed, study:renderStudy, stash:renderStash, topics:renderTopics, progress:renderProgress };
function show(p){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.p === p)));
  document.querySelectorAll(".panel").forEach(s => { s.hidden = (s.id !== "p-" + p); });
  RENDER[p]();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(t => { t.onclick = () => show(t.dataset.p); });
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g) show(g.dataset.go);
});

/* theme */
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
$("#themeBtn").onclick = () => {
  S.theme = S.theme === "dark" ? "light" : (S.theme === "light" ? null : "dark");
  save(); applyTheme();
  toast(S.theme ? S.theme + " theme" : "system theme");
};

/* keyboard */
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  const cur = document.querySelector('.tab[aria-selected="true"]').dataset.p;
  if(cur === "feed"){
    if(e.key === "ArrowRight" || e.key === "s"){ const b = $("#fSkip"); if(b) b.click(); }
    if(e.key === " " || e.key === "Enter"){ e.preventDefault(); const b = $("#fStash"); if(b) b.click(); }
  }
  if(cur === "study"){
    if(e.key === " " || e.key === "Enter"){ e.preventDefault(); const b = $("#sReveal"); if(b) b.click(); }
    if("1234".indexOf(e.key) !== -1){
      const b = document.querySelector('.grade[data-g="' + (parseInt(e.key,10)-1) + '"]');
      if(b) b.click();
    }
  }
});

applyTheme(); buildFeed(); paintStats(); show("feed");
</script>
</body>
</html>
