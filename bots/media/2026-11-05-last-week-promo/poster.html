<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Plex';src:url('__WORKSANS__') format('woff2');font-weight:100 900}
  @font-face{font-family:'PlexTH';src:url('__PLEXTHAI__') format('woff2');font-weight:400;unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
  :root{--ink:#17121a;--on:#fdf7fa;--muted:#e2cbd7;--rule:rgba(253,247,250,.25);--gold:#d9a521;--gold-hi:#f2c94c;--gold-ink:#3e1442;--act:#c92f74}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:var(--H);background:var(--ink);color:var(--on);font-family:'Plex','PlexTH',sans-serif;-webkit-font-smoothing:antialiased}
  .page{position:relative;width:1080px;height:var(--H);overflow:hidden;display:flex;flex-direction:column;padding:var(--top) 64px 0}
  .mast{display:flex;align-items:center;gap:22px}
  .mast img{width:var(--logo);height:var(--logo)}
  .mast b{display:block;font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.01em}
  .mast span{display:block;font-weight:400;font-size:28px;line-height:1.25;color:var(--muted)}
  .kick{align-self:flex-start;margin-top:var(--g1);background:var(--gold);color:var(--gold-ink);font-weight:800;font-size:28px;
    letter-spacing:.06em;text-transform:uppercase;padding:10px 18px 9px}
  :lang(th) .kick{letter-spacing:0;text-transform:none;font-weight:700;font-size:30px;padding:8px 18px 10px}
  h1{margin-top:var(--g2);font-weight:800;font-size:var(--hs);line-height:.94;letter-spacing:-.045em}
  :lang(th) h1{font-weight:500;letter-spacing:0;line-height:1.16;font-size:var(--hs-th);font-synthesis:none}
  :lang(th) h1 .n{font-weight:800}
  .sub{margin-top:var(--g3);font-size:var(--ss);line-height:1.2;color:var(--muted);letter-spacing:-.01em}
  .offer{margin-top:var(--g2);border-left:8px solid var(--gold);padding:4px 0 6px 26px}
  .offer p{font-size:var(--os);line-height:1.3}
  .offer p.hi{font-weight:800;color:var(--gold-hi);font-size:calc(var(--os) + 6px)}
  :lang(th) .offer p.hi{font-weight:700}
  .when{margin-top:var(--g3);font-size:var(--os);font-weight:700;line-height:1.3;border-top:2px solid var(--rule);padding-top:18px}
  .cta{margin-top:var(--g3);display:flex;justify-content:space-between;align-items:center;background:var(--act);color:#fff;
    font-weight:800;font-size:var(--cs);padding:0 30px;height:var(--ch)}
  .cta span{font-weight:600;font-size:30px;opacity:.95}
  :lang(th) .cta{font-weight:700}
  .pic{position:relative;margin:var(--g3) -64px 0;flex:1;min-height:0;overflow:hidden}
  .pic img{position:absolute;width:calc(1600px * var(--zs));max-width:none;left:calc(540px - 730px * var(--zs));top:calc(var(--ztop) - 300px * var(--zs))}
</style></head>
<body><div class="page">
  <div class="mast"><img src="__LOGO__" alt=""><div><b>AYBKK</b><span>Ashtanga Yoga Bangkok</span></div></div>
  <div class="kick" id="kick"></div>
  <h1 id="h"></h1>
  <p class="sub" id="s"></p>
  <div class="offer"><p id="o1"></p><p class="hi" id="o2"></p></div>
  <p class="when" id="w"></p>
  <div class="cta"><b id="c"></b></div>
  <div class="pic"><img src="__PHOTO__" alt=""></div>
</div>
<script>
const T = {
  en: { kick: 'Last week · Sharathji promotion · New students', h: 'Give yourself<br>12 weeks.', s: 'You will earn 3 more months.',
        o1: '3 months unlimited: 25,800 + 7% VAT = 27,606\u00a0THB', o2: 'Yours for 6 months · ฿153 a day',
        w: 'Buy by Wed 11 Nov · Start by Thu 12 Nov', c: 'Book on LINE @aybkk' },
  th: { kick: 'สัปดาห์สุดท้าย · โปรโมชัน Sharathji · นักเรียนใหม่', h: 'ให้เวลากับตัว⁠เอง<br><span class="n">12</span> สัปดาห์', s: 'คุณจะได้เพิ่มอีก 3 เดือน',
        o1: 'เรียนไม่จำกัด 3 เดือน 25,800 บาท + VAT 7% รวม 27,606 บาท', o2: 'ใช้เองได้ 6 เดือน · ตกวันละ 153 บาท',
        w: 'ซื้อภายในวันพุธที่ 11 พ.ย. · เริ่มใช้ภายในวันพฤหัสที่ 12 พ.ย.', c: 'สมัครโปรโมชันทาง LINE @aybkk' },
};
const q = new URLSearchParams(location.search), lang = q.get('lang') || 'en', size = q.get('size') || 'feed';
const S = { feed:  { H: 1350, top: 56,  logo: 92,  g1: 40, g2: 30, g3: 26, hs: 132, 'hs-th': 112, ss: 50, os: 34, cs: 38, ch: 92, zs: 1.45, ztop: -22 },
            story: { H: 1920, top: 270, logo: 100, g1: 54, g2: 44, g3: 36, hs: 150, 'hs-th': 124, ss: 56, os: 34, cs: 44, ch: 108, zs: 1.75, ztop: -22 } }[size];
document.documentElement.lang = lang;
for (const [k, v] of Object.entries(S)) document.documentElement.style.setProperty('--' + k, typeof v === 'number' && k !== 'zs' ? v + 'px' : String(v));
for (const k of ['kick', 's', 'o1', 'o2', 'w', 'c']) document.getElementById(k).textContent = T[lang][k];
document.getElementById('h').innerHTML = T[lang].h;
</script></body></html>
