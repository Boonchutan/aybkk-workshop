name: Bangkok payment flow check

# Creates ONE test order on the live site and inspects what we would send to
# PaySolutions, then asks our own verify endpoint about it. No money moves and
# no card is entered — the point is to prove three things before a real payment:
#   1. the redirect form we build matches the published field spec
#   2. the reference number is 12 numeric digits
#   3. the Inquiry API accepts our credentials (an unpaid order comes back as
#      "no record"; a bad key comes back as an HTTP error we can read)
# It leaves a pending order behind, named so it is obvious in the admin.

on:
  workflow_dispatch:

jobs:
  payflow:
    runs-on: ubuntu-latest
    steps:
      - name: Create a test order and inspect the handoff
        run: |
          BASE=https://cn.aybkk.net
          curl -s --max-time 25 -X POST "$BASE/api/bkk/orders" \
            -H 'Content-Type: application/json' \
            -d '{"productCode":"dropin","name":"TEST do not activate","email":"test@aybkk.com"}' \
            -o /tmp/o.json
          python3 - <<'EOF'
          import json, re, sys
          try:
              d = json.load(open('/tmp/o.json'))
          except Exception:
              print('order: NOT JSON ->', open('/tmp/o.json').read()[:300]); raise SystemExit(1)
          if d.get('error'):
              print('order FAILED:', d['error']); raise SystemExit(1)
          o = d['order']
          print(f"order created: refno {o['refno']}  ฿{o['amount']}  {o['product']}")
          print(f"member code: {d['member']['code']}")
          open('/tmp/refno', 'w').write(str(o['refno']))

          pay = d.get('pay')
          if not pay:
              print('NO PAY FORM — mode is', 'link' if d.get('payLink') else 'none')
              raise SystemExit(1)
          print('\npost to:', pay['action'])
          f = pay['fields']
          for k in sorted(f):
              print(f'  {k:15} {f[k]}')

          ok = True
          def check(cond, msg):
              global ok
              print(('  PASS  ' if cond else '  FAIL  ') + msg)
              ok = ok and cond

          print('\nagainst the published spec:')
          check(pay['action'] == 'https://payments.paysolutions.asia/payment', 'endpoint')
          check(re.fullmatch(r'\d{12}', f['refno']) is not None, 'refno is 12 numeric digits')
          check(re.fullmatch(r'\d{8}', f['merchantid']) is not None, 'merchantid is 8 digits')
          check(f['cc'] == '00', 'currency 00 = THB')
          check(f['lang'] in ('EN', 'TH'), 'lang uppercase')
          check(float(f['total']) == float(o['amount']), 'total matches the order')
          check(len(f['productdetail']) <= 255, 'productdetail within 255')
          check(not re.search(r'[<>&"\']', f['productdetail']), 'productdetail has no HTML characters')
          check('hash' not in f, 'no hash field (their API defines none)')
          check('@' in f['customeremail'], 'customer email present')
          if not ok: raise SystemExit(1)
          EOF

          echo ""
          echo "== ask our verifier about this unpaid order =="
          echo "(expected: not paid. What matters is WHY — 'no record' means the"
          echo " credentials were accepted; an HTTP 401/403 means they were not.)"
          REF=$(cat /tmp/refno)
          curl -s --max-time 25 "$BASE/api/bkk/pay/check/$REF" -o /tmp/v.json
          python3 - <<'EOF'
          import json
          d = json.load(open('/tmp/v.json'))
          print('status:', d.get('status'), '| note:', d.get('note'))
          note = str(d.get('note') or '')
          if d.get('status') == 'paid':
              print('  UNEXPECTED: an unpaid order reported as paid'); raise SystemExit(1)
          import re
          m = re.search(r'http (\d{3})', note)
          code = m.group(1) if m else '?'
          if code in ('401', '403'):
              print('  FAIL  gateway rejected our credentials (http ' + code + ')'); raise SystemExit(1)
          if code == '200':
              print('  PASS  Inquiry API answered 200 with no record — credentials accepted')
          else:
              print('  ?     http ' + code + ' — read the note above')
          EOF

          echo ""
          echo "A pending order named 'TEST do not activate' is now in the admin."
          echo "Leave it, or use it to practise the Activate button. Never activate"
          echo "it in anger — no money was taken for it."
