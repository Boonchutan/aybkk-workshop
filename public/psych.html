{id:"n4",topic:"action",title:"Habits live in a place, so travel breaks them",
body:"<p>A habit is a link between a setting and an action. Same room, same time, same mat spot, done over and over. After enough repeats, the setting alone starts the action. You barely have to think. The steadier the setting, the stronger the habit.</p><p>Change the setting and the link snaps. A new home, a new schedule, a hotel room. The cues are gone, so the habit stops firing. You are back to having to decide on purpose every time.</p>",
apply:"Moving is the hardest time to keep a habit and the easiest time to build a new one. For a teacher who travels, that is a warning and a chance at the same time.",
recall:"Why does a new place break an old habit?",
answer:"Habits are started by steady cues in the setting. Take away the cues and nothing starts the action, so it goes back to needing a deliberate choice.",
src:"Wood & Neal, 2007",
drill:"Write one line for students arriving at your next workshop. It names the one cue to set up on day one in the new room. Like \"mat in the same spot at the same time.\" Done when the line names a place, a time and an action."},

{id:"n5",topic:"action",title:"People speed up when the finish is in sight",
body:"<p>People and animals both move faster as they get close to a reward. A coffee shop loyalty card is a good example. Give someone a card with two stamps already on it. They finish it faster than someone with an empty card, even when both need the same number of extra coffees.</p><p>The distance left is the same. What changed is the feeling of being already on the way. The lever is how much of the trip feels done, not how far is really left.</p>",
apply:"Show people where they already are, not how far they still have to go. The same journey feels shorter when it looks partly finished.",
recall:"Why do loyalty cards with two free stamps get finished faster?",
answer:"They make the same remaining work feel like progress already started, and effort goes up with how much of the goal feels done.",
src:"Kivetz et al., 2006",
drill:"Pick one student from the Huizhou roster. Write one line telling them what they have already done, such as poses learned or days attended, before saying what is next. Done when the line starts with something finished, not something to do."},

{id:"n6",topic:"action",title:"Paying people for what they love can kill the love",
body:"<p>Take something a person already does for fun. Start giving them a reward for it. Then stop the reward. Often their interest drops below where it started. In their head the story has changed. It used to be 'I do this because I like it'. Now it is 'I do this to get paid'.</p><p>The damage is worst when the reward is expected, is a real thing like money or a prize, and is given just for showing up rather than for doing well.</p>",
apply:"Discounts and freebies can quietly turn students who love the practice into students who came for the deal. How you bring someone in shapes why they stay.",
recall:"Which kind of reward does the most harm to a person's own interest?",
answer:"Rewards that are expected, are real things like money, and are given just for doing the task. Surprise rewards, and rewards for doing it well, do much less harm.",
src:"Deci, 1971; Lepper et al., 1973",
drill:"Look at your current shop or cohort promotions. Count how many are 'get money off just for signing up'. For one of them, write a one-line version that rewards effort or quality instead. Done when you have the count and the one new line."},

{id:"n7",topic:"action",title:"Three things keep motivation running on its own",
body:"<p>Self-determination theory is a big name for a simple idea. People keep going when three things are true. One, I chose this. Two, I can see myself getting better. Three, this connects me to other people. The names for these are autonomy, competence and relatedness.</p><p>Give someone all three and they keep going without being pushed. Give them none and they need nagging forever.</p>",
apply:"Keeping students is not about sending more reminders. Students leave when they cannot see progress, feel they had no choice, or feel alone. Check those three before writing another email.",
recall:"Name the three needs in self-determination theory.",
answer:"Autonomy, competence and relatedness. In plain words: I chose it, I can see myself improving, and it connects me to people.",
src:"Deci & Ryan, 1985",
drill:"Pick one student who has gone quiet. Write three short lines: did they choose it, can they see progress, do they feel part of the group. Mark each yes or no. Done when all three have a yes or a no next to them."},


/* ============ THE OFFER ============ */
{id:"o1",topic:"offer",title:"Losing hurts more than winning feels good, but less than you were told",
body:"<p>Here is a famous idea. Losing 100 baht hurts about twice as much as finding 100 baht feels good. Kahneman and Tversky said this in 1979. In many tests, losses do hurt more than gains feel good. That part holds up fairly well. But the exact \"two times\" number does not. It changes from test to test.</p><p>In 2018, two scientists, Gal and Rucker, looked at all the studies together. They said the proof does not show that losses matter more than gains overall. Other scientists said that goes too far. But even they agree the effect is smaller and less sure than the popular story says. So we are not sure how big it really is.</p>",
apply:"Try loss wording in your copy, but test it. Do not just assume it works. If a marketing book builds its whole method on a fixed \"two times\" rule, it is treating a shaky number as a solid one.",
recall:"What do we know today about the \"losses hurt twice as much\" rule?",
answer:"It is not settled. Losses do seem to hurt more than gains in many tests. But the \"two times\" number moves around, and some reviews (Gal and Rucker, 2018) doubt we need a general loss rule at all.",
src:"Kahneman & Tversky, 1979; Gal & Rucker, 2018 — verified",
drill:"Open one caption or sales line you wrote for the China cohort. Write it two ways: one about what a student gains, one about what they lose by waiting. Keep both. Done when both lines are saved in the same note and you have picked which one to test first."},

{id:"o2",topic:"offer",title:"Take the risk off the buyer and the real worry goes away",
body:"<p>When someone does not buy, you might think the price is too high. Usually it is not that. The real worry is \"what if I am wrong about this\". A guarantee works because it moves that worry from the buyer to the seller. Now there is no reason to wait.</p><p>A guarantee is only as strong as the risk it really takes on. Big bold words do not make it stronger. Taking on real risk does. This idea comes from people who sell by mail and online, and from research on how people avoid risk.</p>",
apply:"You cannot promise a result, and you should never try. No honest teacher can promise a student will reach a pose. Promise what you control: the teaching, the access to you, and that you will tell someone they are not ready before they pay.",
recall:"What worry does a guarantee really answer?",
answer:"The worry of being wrong, not the price. It works by taking away the reason to wait.",
src:"Direct response practice; risk-aversion literature",
drill:"Write one sentence for the cohort page that starts with \"I promise\" and only names things you control: the teaching, the access, telling someone if they are not ready. Read it out loud. Done when the sentence has no promise about a result or a pose in it."},

{id:"o3",topic:"offer",title:"A deal with no reason looks like a trick",
body:"<p>The better a deal looks, the more people wonder what the catch is. A reason fixes this faster than any sales talk. Why does this offer exist? Why now? Why this price? A reason gives the buyer something to check. Sales talk only gives them something to trust.</p><p>In 1978, Langer and her team tested this at a copy machine line. Asking to cut in with a reason worked much better than asking with no reason. Even a weak reason helped a lot. The word \"because\" did real work on its own.</p>",
apply:"Say plainly why the cohort exists, why the number is what it is, and why now. If you cannot answer one of those honestly, fix the offer, not the words.",
recall:"Why does giving a reason help, even when the reason is weak?",
answer:"A reason turns a bare request into an explained one. People respond to the fact that there is a reason at all, not only to how good the reason is.",
src:"Langer et al., 1978",
drill:"Take the cohort page. Write three lines, each starting with \"because\": why it exists, why the price, why now. Done when all three lines are true and you could show them to a student without blushing."},

{id:"o4",topic:"offer",title:"Exact numbers are trusted more than round ones",
body:"<p>An exact number sounds like someone worked it out. A round number sounds like someone picked it. So exact prices and exact claims are trusted more. Janiszewski and Uy showed this in 2008.</p><p>There is a second part. When people see a first number, they shift away from it a little. They shift less from an exact number than from a round one. So rounding \"18\" up to \"nearly 20\" looks neater but can cost you trust.</p>",
apply:"\"Eighteen years\" is stronger than \"nearly twenty years\". And it has one more thing going for it: it is exactly true. Being exact and being honest point the same way here.",
recall:"Why do people trust exact numbers more than round ones?",
answer:"An exact number looks worked out, not guessed, so it seems more true. And people shift away from an exact first number less than from a round one.",
src:"Janiszewski & Uy, 2008",
drill:"Read your cohort page or bio. Circle every rounded or vague number. Words like \"nearly\", \"over\", \"about\", \"many\". Replace each with the exact true number. Done when no \"nearly\" or \"about\" is left in front of a number."},

{id:"o5",topic:"offer",title:"What sits next to your offer changes what people pick",
body:"<p>Say a shop sells two things, A and B. Now the shop adds a third thing, C, that is clearly worse than B. Strange thing: more people now pick B. A and B did not change at all. Only the things next to them changed. Huber and his team showed this in 1982. It is called the decoy effect.</p><p>Here is the catch. When other scientists tried it again, the effect was smaller. It only shows up in some situations, not all. The popular story makes it sound stronger than it is.</p>",
apply:"Use this as a reason to think hard about what sits next to your offer on the page. Do not invent a fake cheaper option just to make the real one look good. A serious buyer can see a fake option that helps no one.",
recall:"What does the decoy effect tell us about what people want?",
answer:"What people prefer is not fixed inside the options. It is built from whatever is being compared at that moment.",
flag:"When scientists tried it again, the effect was smaller and only worked in some cases. Treat it as one thing to think about, not a tool you can count on.",
src:"Huber et al., 1982",
drill:"Look at the cohort page or the tee shop. Write down every option a buyer sees side by side. Next to each, write who it is really for. Done when every option has a real person it serves, or you have cut the one that does not."},

{id:"o6",topic:"offer",title:"Free is a different thing, not just a lower price",
body:"<p>Cut a price from 20 to 10 and a few more people buy. Cut it from 10 to 0 and a crowd shows up. The jump at zero is much bigger than the same-size cut anywhere else. Shampanier, Mazar and Ariely showed this in 2007. The brain seems to treat free as \"no risk\", not as \"very cheap\".</p><p>Free also changes who comes. That is the part people miss. A free thing pulls in everyone, including people who would never pay.</p>",
apply:"Free is a filter setting, not just a price. Free brings in everyone. That is exactly wrong when your job is finding the right ten students, not the most people.",
recall:"Why is a price of zero not just a very low price?",
answer:"Demand jumps much more at zero than at any other price cut. That suggests people see free as \"no risk\", not as a small cost.",
src:"Shampanier, Mazar & Ariely, 2007",
drill:"List every free thing you offer right now: free class, free reel, free PDF, free trial. Next to each, write who it pulls in: everyone, or serious people. Done when each item has a one-word answer and you have marked one to change or keep."},

{id:"o7",topic:"offer",title:"Admitting a weak spot makes people trust you more",
body:"<p>Say you want to convince someone. Start by admitting a real weak spot. Then make your case. This often works better than only saying good things. It works best with people who are doubtful or who already know a lot. Hovland's team found this in 1949. Eisend checked many studies in 2006 and found the same.</p><p>The admission says \"this person is honest\". The rest of the argument borrows that trust. But the weak spot has to be real and has to matter. Confessing a tiny flaw just to look honest is a trick, and people can smell it.</p>",
apply:"Your \"this is not for you\" section does this job. Naming exactly who should not come is the strongest trust move you have. It only costs you the people you did not want anyway.",
recall:"When does admitting a weak spot beat only saying good things?",
answer:"With doubtful or well-informed listeners, and when the weak spot is real and matters, not a tiny cosmetic one.",
src:"Hovland et al., 1949; Eisend, 2006 meta-analysis",
drill:"Write one honest sentence for the cohort page that starts with \"This is not for you if\". Make it name a real reason, not a flattering one like \"if you are not committed enough\". Done when the sentence would make a wrong-fit person actually stop reading."},


/* ============ READING THE EVIDENCE ============ */
{id:"r1",topic:"evidence",title:"Around a third of studies worked a second time",
body:"<p>A big team of scientists picked 100 studies from top psychology journals. Then they ran each one again, the same way. The first time round, 97 out of 100 had found a clear result. The second time, only 36 out of 100 did. And when a result did show up again, it was usually about half as big as before.</p><p>These were not small, forgotten studies. Some were famous ones that many other papers had quoted.</p>",
apply:"When you read one surprising study, your first move should be doubt, not belief. This is the card that guards you against every other card in this deck.",
recall:"What did the Reproducibility Project find about the repeat rate and the size of the effects?",
answer:"Only 36 out of 100 studies worked again with a clear result in the same direction. The first time, 97 out of 100 had. And the repeat results were about half as big as the originals.",
src:"Open Science Collaboration, 2015 — verified",
drill:"Open one marketing post or book page you saved that quotes a study. Write one line under it: \"One study. Not proven until another team got the same result.\" Done when the line is written and you can name the study it is about."},

{id:"r2",topic:"evidence",title:"Small free choices with the numbers can fake a result",
body:"<p>Imagine a coin game where you decide, after seeing the flips, when to stop, which flips to ignore, and which score to report. You would win far more often than you should. Scientists can do this too. They choose when to stop collecting data, which odd results to drop, which extra factors to include, and which measures to report, all after seeing the numbers. Each choice looks fair on its own. Together, they push the rate of false results far above the 5 percent that science is supposed to allow.</p><p>Nobody has to cheat. Normal judgment calls, made over and over, are enough.</p>",
apply:"When a study's method sounds oddly perfect for the result it got, ask what else was measured and left out. Marketing case studies have this same problem, only worse.",
recall:"How can scientists' small free choices make false results more common, without anyone cheating?",
answer:"Many small choices about the numbers are made after seeing the data. Each choice works like an extra hidden test. Together they push the true false-result rate well above 5 percent.",
flag:"The paper ran computer simulations mixing these choices together and found the false-result rate went up a lot. I could not check the exact headline percentage against a source in this session, so on purpose no number is quoted here.",
src:"Simmons, Nelson & Simonsohn, 2011",
drill:"Pick one of your own reel stats, like \"this one got three times the views.\" Write down two things you did not count, such as the day it went up or the time of day. Done when both are written plus one honest line: \"So I am not sure why it worked.\""},

{id:"r3",topic:"evidence",title:"\"Significant\" answers a question you did not ask",
body:"<p>Scientists often report a \"p-value.\" If it is under .05, they call the result \"significant.\" Here is what that word really means. If there were no real effect, this data would be unlikely. That is all. It does not say how big the effect is. It does not say if it matters. It does not say how likely the claim is to be true.</p><p>With a huge enough group of people, even a tiny, useless effect gets called \"significant.\"</p>",
apply:"Ask how big the effect was. Do not ask if it was \"significant.\" In a marketing case study, \"statistically significant\" usually tells you nothing about whether it would move your numbers.",
recall:"What does a p-value tell you, and what does it not tell you?",
answer:"It tells you how surprising the data would be if there were no effect at all. It does not tell you the size of the effect, if it matters, or how likely the claim is to be true.",
src:"Cohen, 1994",
drill:"Find one claim you saw this week, in a post, a book, or an ad, that says something \"works\" or \"was proven.\" Write one question next to it: \"How much, in real numbers?\" Done when the question is written and you have checked whether the claim answers it."},

{id:"r4",topic:"evidence",title:"The evidence comes from an odd slice of the world",
body:"<p>Most psychology studies test people from one odd group. They are Western. They went to school for a long time. They live in rich countries with factories and votes. Scientists call this group WEIRD. The letters stand for Western, Educated, Industrialised, Rich, Democratic. Many of the people tested are also university students. When scientists compare this group with the rest of the world, it is often the odd one out, not the normal one.</p><p>So saying \"people do X\" because WEIRD students did X is a guess. For studies about how people treat each other and what is right or wrong, it is often a bad guess.</p>",
apply:"This matters for you directly. What American students did in a persuasion study may not match what Chinese practitioners do. The honest truth is that often nobody has checked.",
recall:"What does WEIRD stand for, and why does it matter?",
answer:"Western, Educated, Industrialised, Rich, Democratic. People from these groups are the odd ones out on many things that have been measured. So results from them may not hold for everyone else.",
src:"Henrich, Heine & Norenzayan, 2010",
drill:"Open your China cohort page. Find one line that leans on a \"people are like this\" idea. Write next to it: \"Tested on whom?\" Done when that question sits beside one line, with your best guess at the answer."},

{id:"r5",topic:"evidence",title:"Journals only show the tests that passed",
body:"<p>Picture a school notice board that only shows the tests kids passed. You would think everyone was a genius. Science journals work a bit like that. Studies that find something exciting get printed. Studies that find nothing often do not. So the printed record makes effects look bigger than they are. Even big reviews that add up many studies, called meta-analyses, inherit that same tilt.</p><p>There is a fix aimed at the cause. It is called pre-registration. Scientists write down what they expect and how they will test it before they see any results. Then the study gets published whichever way it comes out.</p>",
apply:"Every marketing case study you read is a survivor. The campaigns that flopped never got written up.",
recall:"How does pre-registration fix the problem of only good news getting published?",
answer:"Scientists commit to the idea, the test plan, and publishing before they know the results. That way studies that found nothing still enter the record instead of being left out.",
src:"Rosenthal, 1979; Chambers, 2013",
drill:"Count how many of your reels or shop tries flopped this year. Then count how many of those you ever told anyone about. Done when both numbers are on paper and you can see the gap between them."},

{id:"r6",topic:"evidence",title:"Three other stories sit between \"go together\" and \"cause\"",
body:"<p>Ice cream sales and sunburns go up together. Does ice cream cause sunburn? No. When two things, A and B, move together, there are three other stories besides \"A causes B.\" One: B causes A. Two: a third thing causes both, like the sun in the ice cream story. Three: it is just chance, or it comes from how the people in the study were picked.</p><p>Saying which of these three is at work is much more useful than chanting \"that does not prove it.\" Most popular \"this causes that\" claims fall down on the third-thing story.</p>",
apply:"When someone shows you that all the successful brands do X, ask: did X cause the success, or did being successful let them do X? Usually it is the second.",
recall:"If A and B go up together, what are the other explanations besides \"A causes B\"?",
answer:"B causes A. Something else causes both. Or it is chance, or comes from how the sample was picked.",
src:"Standard causal inference",
drill:"Write down one \"successful teachers all do X\" belief you hold about reels or pricing. Under it, write the reverse: \"Or, being successful lets them do X.\" Done when both lines are written and you have circled the one you think is more likely."},

{id:"r7",topic:"evidence",title:"Four questions to ask of any claim about people",
body:"<p>Here are four questions to ask of any claim about how people think or act. One: how big is the effect, in units that mean something in real life? Two: how many people were tested, and who were they? Three: did the scientists predict this before they looked, or find it afterwards by digging through the data? Four: has a separate team, with no link to the first, got the same result?</p><p>Most claims that make it into popular books fail at least two of the four.</p>",
apply:"Run these four questions on Sutherland, Hormozi and Godin as you read them. All three are worth reading. None of them are careful with evidence. Knowing which of their ideas can carry weight is what separates using their work from just repeating it.",
recall:"What are the four screening questions for a psychology claim?",
answer:"How big is the effect in real units. How many people, and who they were. Predicted in advance, or found afterwards. Has a separate team repeated it.",
src:"Synthesis of open-science practice",
drill:"Take one idea you like from Sutherland, Hormozi or Godin. Ask it the four questions and write yes, no, or don't know for each. Done when you have four answers and have counted how many say don't know."},


/* ============ STORYTELLING STRUCTURE ============ */
{id:"st1",topic:"structure",title:"A niche is a way of seeing, not a topic",
body:"<p>A creator named Bruno has 443,000 followers. People ask him what his niche is. A niche means the one thing you are known for. He says his is not a subject at all. One day he talks about relationships. The next day, the mind. The next day, mushrooms. What stays the same is how he looks at each thing. Curious but not easily fooled. Serious but not stiff. Happy to follow a strange question somewhere new.</p><p>His own words, from a 28 Aug 2026 post: the niche is what happens when the subject passes through your mind. People follow the way he sees. They do not follow the topic.</p>",
apply:"Ashtanga is your subject. Your way of seeing is two things: you got the teaching straight from your teacher, and you are willing to say no. Every reel should carry that, whether it is about a pose, a fix, or a student's mistake. That is what makes a mixed feed sound like one voice.",
recall:"In Bruno's own words, what is a niche?",
answer:"Not a subject. A steady way of seeing that any subject passes through. People follow the way of seeing.",
src:"Vibe Samurai, Substack, 28 Aug 2026 — verified, his own words",
drill:"Open your last three reels. For each one, say out loud in one line what your way of seeing was. Done when all three lines use the same two ideas: teaching passed straight down, and willing to say no. If one reel has neither, write down what it was missing."},

{id:"st2",topic:"structure",title:"Eight steps, and step four is the turn",
body:"<p>His long articles follow the same eight steps every time. One: a plain everyday scene. Two: the same scene seen from a second spot. Three: he admits the usual explanation is sometimes right. Four: one short sentence that flips it. That is the turn. Five: he names the pattern and says where the name came from. Six: he defines it in one line. Seven: he ends by turning the idea upside down. Eight: he hands the reader two questions.</p><p>Everything before the turn makes you more sure of the story you already believe. Everything after it takes that story apart. So it feels like you found the answer yourself, not like you were told. This was checked against the full text of two of his pieces, Idiot Compassion and Nostalgia Is the Searching Mind.</p>",
apply:"Write the turn sentence first: 'It isn't ___. It's ___.' Then write the 'you're partly right' part that makes the turn land. Then the scene. End on one line a practitioner would screenshot, like: 'The people practising hardest are often progressing slowest.' In a reel, one step moves. The name and where it came from go before the turn, not after. The reel spends its source early to earn the hook.",
recall:"Which step carries the piece, and what do the steps before it do?",
answer:"The turn. One short sentence that flips the usual explanation. The steps before it make the reader more sure of that explanation, so the flip feels like a discovery.",
src:"Reconstructed from 'Idiot Compassion' and 'Nostalgia Is the Searching Mind' — verified against full text",
drill:"Pick one thing you say to students every week. Write one turn sentence about it: 'It isn't ___. It's ___.' Then write one line above it that admits the usual view is partly right. Done when you have two lines on paper and the second one flips the first."},

{id:"st3",topic:"structure",title:"Videos are filters. Views are a signal check.",
body:"<p>He says it plainly in his 28 Aug 2026 post: his videos are becoming filters. A filter lets some things through and stops the rest. His videos ask: can you hold science and mystery in one hand? Can you play with a strange idea without swallowing it whole? The people who say yes are already members of his club. They just do not know its name yet.</p><p>He got 21 million views in one month. He says that is not the goal. It is proof the transmitter works. The reels send out the signal. The paid community is where the people who hear it find each other.</p>",
apply:"This is your Name-Disqualify-Release idea, done as content. Make reels so the wrong person scrolls past and the right ten see themselves. And notice where he sells. In seven of seven reels, the spoken video never mentions the club, the call, or the newsletter. All the selling sits in the written caption. The video has no pitch. The caption is the shop. Read view counts as a check on the signal, not as a score to beat.",
recall:"What job do his videos do, and what are views for?",
answer:"They filter. They pull in people who already share his way of seeing. Views are proof the signal is working, not the goal.",
src:"Vibe Samurai, Substack, 28 Aug 2026 — verified, his own words",
drill:"Take your newest reel. Watch it once. Say out loud who should scroll past it. If you cannot name that person, the reel is not filtering. Then check the caption: does any selling live in the spoken video instead? Done when you have named the wrong viewer and moved any pitch out of the spoken part."},

{id:"st4",topic:"structure",title:"The hook is a flat statement, usually borrowed",
body:"<p>Seven of his reels were watched frame by frame. All seven open the same way: one flat sentence, said as a fact, inside five seconds. Never a question. 'Gnomes are real.' 'Everybody is rooting for you.' 'If you meet the Buddha on the road, kill him.' Five of the seven borrow the idea from somewhere else: a proverb, a Zen riddle, a viral comment, a study, or a label he made up. The next sentence names the source or takes the sting out with a joke.</p><p>His 60 YouTube Shorts titles have the same shape in writing. His own story works the same way: fifty years old, a career in another field, 750,000 followers in 100 days. Every number can be checked.</p>",
apply:"Open on one true contradiction about practice, said flat. Borrow an idea you can credit by name: a line from a sutra, a Mysore rule, something a senior teacher really said. Never use Sharath's name as the hook. Use his name as bait and it becomes wallpaper: something people see so often they stop noticing it. Your permission from Sharath is worth too much for that. And never let anyone, human or AI, hand you a personal story you did not live.",
recall:"How do his reels open, and what is the one thing you must not spend in yours?",
answer:"A flat statement inside five seconds, usually a borrowed idea with the source named, never a question. Do not spend Sharath's name as the hook. Never use a life story you cannot back up.",
flag:"This is a habit, not a law. One of his reels opens on a quoted command instead. Also, his big numbers come from his topics, not his shape: his videos about narcissism and toxic relationships take a third of all his views. Copy the shape. Expect a small fraction of the numbers. One more warning from the notes: an AI draft once invented a back injury for Boonchu. That is exactly the mistake to avoid.",
src:"Seven reels read frame by frame; 60 YouTube Shorts titles; the 750,000 People video — verified. Caution: an AI-drafted adaptation invented a back injury for Boonchu; that is the failure mode.",
drill:"Write three opening lines for one reel. Each must be a flat statement, no question mark, and true. For at least one, borrow a line you can credit by name. Read each out loud with a timer. Done when all three take under five seconds and none of them uses Sharath's name."},

{id:"st5",topic:"structure",title:"Follow a tired word back to its root",
body:"<p>Take a word people use too much and follow it home. 'Authenticity' comes from the Greek word authentikos. That word is built on autos, which means self. So authentic means coming from yourself. He says the real question was never 'did you show your messy self to the world?' It was: where did this come from? This is from his piece of 23 Mar 2026, checked word for word.</p><p>This move does three jobs at once. It shows you did your homework. It makes a worn-out word feel new. And it works in any country, because a root is a root.</p>",
apply:"You teach with words most students use without knowing what they mean. Yoga comes from yuj, to yoke or join, not to stretch. Asana means seat, a place you live in, not a shape. Vinyasa means to place in a special way. Each one is a reel. Each one cannot be faked, because it is simply true.",
recall:"What is the word-root move, and why does it work across cultures?",
answer:"Follow a familiar word back to its root and use the root meaning to give the tired modern word a new angle. Roots are shared, so it lands with any audience.",
src:"'Nobody Knows What Authenticity Actually Means', 23 Mar 2026 — verified verbatim",
drill:"Pick one of the three words: yoga, asana, vinyasa. Write one line: '___ does not mean ___. It means ___.' Say it out loud. Done when a student who has never heard the root would get it the first time they hear it."},

{id:"st6",topic:"structure",title:"The pattern lives in the body, so break it there",
body:"<p>His case against insight, which means a sudden understanding: the deep, hidden part of your mind does not listen to a good argument. It listens to what the body does. In his words, the body is the native language of the unconscious mind. Take a deep breath in a moment of panic and you change the chemistry in your body. The hidden mind answers that right away. It never answers a thought that fast. This is from his piece of 10 May 2026, checked word for word.</p><p>So the thing that breaks a pattern cannot be a realisation. It has to be an action. Do it again and again, and your idea of who you are follows what your body did.</p>",
apply:"You already teach this. You just have not said it out loud. Breath before alignment. The pose as a body-level interrupt to a mental habit. A student's wobble as the moment the old pattern is losing its grip. This is Ashtanga's own argument, and he has handed you the words for it.",
recall:"Why does he say insight alone does not change a pattern?",
answer:"Because the pattern lives in the body, and the hidden mind answers action, not argument. The interrupt has to be physical and repeated. Who you are follows what you do.",
src:"'The Loop Lives in the Body', 10 May 2026 — verified verbatim",
drill:"Write one sentence about a moment in class where a student's body changed before their mind did. Make it a sentence a student could read. Done when it has an action in it, like breath, hand, or foot, and no word like 'realise' or 'understand'."},

{id:"st7",topic:"structure",title:"Four stages, and the awkward one in the middle has a name",
body:"<p>His pattern-interrupt series walks through four stages. One: see the pattern. You cannot see the frame while you are inside the painting. Two: interrupt it. One moment where you respond differently. Three: the in-between. The old you is gone and nothing new has arrived yet. Four: creation. Building the new pattern on purpose.</p><p>Stage three is the one everyone runs from. He says Heather Keys, a hypnotherapist, which means someone who helps people change using hypnosis, gave it its name: the Sacred In-Between. He calls it the most important idea in the whole set. If people know the awkward stage is normal, they do not quit while they are in it. The credit to Heather Keys is in his own text, from 7 May 2026.</p>",
apply:"Every intermediate student lives in stage three. The old way of moving no longer works. The new way is not automatic yet. It feels like going backwards. Name it for them. A student who knows the wobble is a stage, not a failure, stays.",
recall:"Name the four stages, and say who named the third.",
answer:"See, interrupt, the in-between, creation. The Sacred In-Between is Heather Keys's name for it, and Bruno credits her.",
src:"'You Are Not Living Your Life. You Are Living Your Patterns.', 7 May 2026 — verified; attribution to Heather Keys is in the source text",
drill:"Think of one student who is in the wobble stage right now. Write the one sentence you will say to them next class that names it as a stage, not a failure. Done when the sentence has no 'but' and no 'try harder' in it."},


/* ============ SARCASM THAT DOES NOT COST YOU ============ */
{id:"h1",topic:"humor",title:"Only make fun of ideas that are too big for their boots",
body:"<p>Ricky Gervais is funny because he picks the right target. He laughs at people who act bigger than they are. He does not laugh at people who are trying, or scared, or small. That is the whole rule. Punch up, never down.</p><p>In yoga there is a lot to punch up at. The fancy words. The teachers who say practice is magic. The people selling calm. Those are fair targets. A student who cannot touch their toes is never a target.</p>",
apply:"Your safe target is the yoga business, not yoga and not students. Make fun of the word journey. Never make fun of the person on the mat next to you.",
recall:"What is the one rule about who you can make fun of?",
answer:"Punch up, never down. Laugh at big ideas and people acting bigger than they are. Never at students, beginners, or anyone trying.",
src:"Craft rule, not research. Seen in Gervais and in Bruno's reels: every joke hits an idea or himself, never a follower.",
drill:"Write down three things in the yoga world that annoy you. Cross out any that are about a person. Keep the ones about an idea or a fashion. Done when you have one left that a serious practitioner would nod at."},

{id:"h2",topic:"humor",title:"Say the joke like it is the weather",
body:"<p>Deadpan means you say a funny thing with a plain face, like you are reading the weather. You do not smile. You do not wait for the laugh. You do not say just kidding. The listener does the laughing for you.</p><p>Bruno does this in every reel. The joke about the hair dryer is said the same way as the serious line before it. That flat voice is why it lands. When the speaker laughs first, the joke dies.</p>",
apply:"You already have a calm teaching voice. Keep it. Say the sharp line in exactly that voice and move on. Do not raise your eyebrows to tell people it was a joke.",
recall:"What does deadpan mean, and what kills the joke?",
answer:"Say the funny line in a flat, plain voice as if it were a fact, and do not react. Laughing first, or signalling that it was a joke, kills it.",
src:"Craft rule. Verified in seven of Bruno's reels: jokes delivered straight, no voice change, the reaction is an eyebrow at most.",
drill:"Pick one sharp line you would like to say on camera. Record it three times on your phone: once smiling, once flat, once flat with a one-second pause after. Watch all three. Done when you can hear why the flat one is best."},

{id:"h3",topic:"humor",title:"Two voices: say the silly thing in its voice, then the true thing in yours",
body:"<p>This is the easiest joke shape there is. First you say the fancy thing in the fancy voice, as if you believe it. Then you stop. Then you say the plain truth in your own voice. The gap between the two is the joke.</p><p>My practice is a journey. Pause. It is a mat, a room, and six in the morning. The journey is the walk to the room. Nobody had to be clever. The plain truth did the work.</p>",
apply:"Take one buzzword your students use. Say it the way they say it. Then say what is actually true in ten plain words. That is a reel opening, and it is also the turn from card st2 in one breath.",
recall:"What are the two voices, and where is the joke?",
answer:"First the fancy claim in its own confident voice, then the plain truth in your voice. The joke lives in the gap between them.",
src:"Craft rule. The shape matches the turn sentence Bruno uses: it isn't this, it's that.",
drill:"Write five buzzword lines students say, like my body is not ready. Under each, write the plain truth in ten words or fewer. Read each pair out loud with a pause in the middle. Done when one pair makes you smile without trying."},

{id:"h4",topic:"humor",title:"Laugh at yourself first, and nobody can use it against you",
body:"<p>A person who can make fun of himself is very hard to embarrass. He has already said the worst thing. Gervais does this all the time. Bruno ends a reel by admitting he is the one who dries his balls with a hair dryer. It makes you trust him more, not less.</p><p>There is one rule. Make fun of your habits, your mistakes, your bad days. Never make fun of the thing that gives you the right to teach. The lineage is not a joke. Your morning coffee is.</p>",
apply:"You can joke about being tired at 5am, about how long you took to learn something, about being bad at Instagram. You cannot joke about Sharath, about authorization, or about the practice itself. Those stay serious so the jokes have something to stand on.",
recall:"What can you make fun of in yourself, and what can you never touch?",
answer:"Your habits, mistakes and bad days are fair. The thing that gives you the right to teach, the lineage and the practice, is never the joke.",
src:"Craft rule, and a positioning rule from this session: the authority is the asset, so it stays out of the jokes.",
drill:"Write three honest, small, funny things about yourself as a teacher. Then write the one thing you will never joke about and put it on a card by your desk. Done when the list has three and the card has one."},

{id:"h5",topic:"humor",title:"The honest thing, said plainly, is the joke",
body:"<p>Most of Gervais is not clever wordplay. It is him saying the thing everyone thinks but nobody says. Out loud. Plainly. The laugh is relief. Someone finally said it.</p><p>The test for this kind of joke is simple. Is it true? Would a person who has practised for ten years nod? If yes, say it flat and it is funny. If it is only mean, or only clever, it is not this kind of joke.</p>",
apply:"You have twenty years of things you have noticed and not said. Most teachers do not do their own practice. Most stretching videos are performances. Most people do not want to be corrected. Pick the true ones. They are your best material and nobody can copy them.",
recall:"What is the test for an honest joke?",
answer:"Is it true, and would a ten-year practitioner nod. If yes, say it flat. If it is only mean or only clever, drop it.",
src:"Craft rule. Matches card yes-7: one honest voice saying the unsaid thing breaks the silence everyone else was keeping.",
drill:"Write ten true things about the yoga world you have never said on camera. No jokes, just true. Then read the list and circle the ones that made you smirk. Done when you have circled at least two."},

{id:"h6",topic:"humor",title:"Something must stay sacred, or the jokes have nothing to stand on",
body:"<p>Gervais makes fun of nearly everything. Not comedy. About comedy he is deadly serious. That is why his jokes work. There is a floor under them. If everything is a joke, nothing is funny, and nobody trusts you.</p><p>Bruno is the same. He jokes about gnomes and hair dryers. He never jokes about the actual idea underneath. Depth creates closeness, humour creates safety, and he means it.</p>",
apply:"Your floor is the practice and the lineage. Be sarcastic about the industry around it. Be dead serious about the thing itself. A student should finish your funniest reel more sure that you take the practice seriously, not less.",
recall:"Why does a comedian need something he will not joke about?",
answer:"The serious thing is the floor the jokes stand on. If everything is a joke, nothing lands and nobody trusts the speaker.",
src:"Craft rule. Verified in Bruno's reels: the joke lines sit on top of a sincere thesis every time.",
drill:"Watch one of your own old videos. Write down what in it was serious and what was light. If everything was serious, add one light line. If everything was light, add one sentence that says what you actually believe. Done when the video has both."},

{id:"h7",topic:"humor",title:"No swearing, no cruelty, and the face-to-face test",
body:"<p>Gervais swears a lot. You will not. It is not about being polite. Swear words get your reel hidden on Chinese apps. They sound cheap to a serious forty-year-old practitioner. And they are a shortcut. The flat voice and the true thing do the work without them.</p><p>Cruelty is the other trap. Sarcasm can slide into mean without you noticing. The test is simple. Would you say this line to that person, in your shala, to their face? If not, cut it.</p>",
apply:"Keep the timing and the flat voice. Drop the swearing completely. Before you post, read every sharp line and ask if you would say it to a student standing in front of you. If you would not, it does not go out.",
recall:"What two things do you leave out, and what is the test?",
answer:"Leave out swearing and cruelty. The test: would you say the line to that person, face to face, in your shala. If not, cut it.",
src:"Positioning rule from this session: swearing is filtered on Chinese platforms and reads as cheap to the serious practitioner you want.",
drill:"Take the sharpest line you wrote this week. Read it out loud as if a student is standing in front of you. Then read it again without any swear word. Done when the clean version is the one you would actually say."}

];

/* ================= STATE ================= */
const KEY = "mindstash.v1";
const DAY = 86400000;
const byId = {};
CARDS.forEach(c => { byId[c.id] = c; });
const topicName = id => (TOPICS.find(t => t.id === id) || {}).name || id;

function blank(){
  return { topics: TOPICS.map(t => t.id), srs:{}, stash:[], seen:[],
           streak:0, lastDay:null, xp:0, theme:null, dailyLimit:5, newDay:null, newCount:0, journal:{}, practiceSeed:0 };
}
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const p = JSON.parse(raw);
    const b = blank();
    return Object.assign(b, p, { topics: Array.isArray(p.topics) && p.topics.length ? p.topics : b.topics });
  }catch(e){ return blank(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const todayKey = () => new Date().toISOString().slice(0,10);

function touchStreak(){
  const t = todayKey();
  if(S.lastDay === t) return;
  const y = new Date(Date.now() - DAY).toISOString().slice(0,10);
  S.streak = (S.lastDay === y) ? S.streak + 1 : 1;
  S.lastDay = t;
  save();
}

/* ================= SPACED REPETITION (SM-2 lite) ================= */
function schedule(id, grade){
  const s = S.srs[id] || { ease:2.5, ivl:0, due:0, reps:0, lapses:0 };
  if(grade === 0){
    s.lapses++; s.reps = 0; s.ease = Math.max(1.3, s.ease - 0.2);
    s.ivl = 0; s.due = Date.now() + 600000;             // 10 minutes
  }else{
    if(s.reps === 0)      s.ivl = (grade === 1) ? 1 : (grade === 2 ? 1 : 3);
    else if(s.reps === 1) s.ivl = (grade === 1) ? 3 : (grade === 2 ? 4 : 6);
    else{
      const mult = (grade === 1) ? 1.2 : (grade === 2 ? s.ease : s.ease * 1.3);
      s.ivl = Math.round(s.ivl * mult);
    }
    if(grade === 1) s.ease = Math.max(1.3, s.ease - 0.15);
    if(grade === 3) s.ease = Math.min(3.2, s.ease + 0.1);
    s.reps++;
    s.due = Date.now() + s.ivl * DAY;
  }
  S.srs[id] = s;
  S.xp += (grade === 0) ? 2 : 5;
  touchStreak(); save();
}
function previewIvl(id, grade){
  const s = S.srs[id] || { ease:2.5, ivl:0, reps:0 };
  if(grade === 0) return "10m";
  let d;
  if(s.reps === 0)      d = (grade === 1) ? 1 : (grade === 2 ? 1 : 3);
  else if(s.reps === 1) d = (grade === 1) ? 3 : (grade === 2 ? 4 : 6);
  else{
    const mult = (grade === 1) ? 1.2 : (grade === 2 ? s.ease : s.ease * 1.3);
    d = Math.round(s.ivl * mult);
  }
  return d < 30 ? d + "d" : Math.round(d/30) + "mo";
}
const dueCards    = () => Object.keys(S.srs).filter(id => byId[id] && S.srs[id].due <= Date.now()).map(id => byId[id]);
const masteredIds = () => Object.keys(S.srs).filter(id => S.srs[id].ivl >= 21);

/* ================= HELPERS ================= */
const $ = sel => document.querySelector(sel);
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
let toastT;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1600);
}
function cardHTML(c){
  return '<div class="topic">' + esc(topicName(c.topic)) + '</div>' +
         '<h2>' + esc(c.title) + '</h2>' +
         '<div class="body">' + c.body + '</div>' +
         (c.apply ? '<div class="apply"><b>Use it</b>' + esc(c.apply) + '</div>' : '') +
         (c.flag ? '<div class="flag"><b>Worth flagging.</b> ' + esc(c.flag) + '</div>' : '') +
         '<div class="src">' + esc(c.src) + '</div>';
}

/* ================= FEED ================= */
let feedQueue = [];
function newToday(){
  if(S.newDay !== todayKey()){ S.newDay = todayKey(); S.newCount = 0; save(); }
  return S.newCount;
}
function countNew(){ newToday(); S.newCount++; save(); }
function buildFeed(){
  const seen = new Set(S.seen);
  feedQueue = CARDS.filter(c => S.topics.indexOf(c.topic) !== -1 && !seen.has(c.id));
  for(let i = feedQueue.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = feedQueue[i]; feedQueue[i] = feedQueue[j]; feedQueue[j] = t;
  }
}
function renderFeed(){
  const el = $("#p-feed");
  if(!feedQueue.length) buildFeed();
  if(!feedQueue.length){
    const total = CARDS.filter(c => S.topics.indexOf(c.topic) !== -1).length;
    el.innerHTML = '<div class="empty"><div class="big">You have seen all ' + total + ' cards</div>' +
      '<p>in the topics you switched on. Turn on more topics, or work your review queue in Study.</p>' +
      '<div class="actions" style="max-width:320px;margin:18px auto 0">' +
      '<button class="btn" id="fResetSeen">Reset feed</button>' +
      '<button class="btn primary" data-go="topics">Topics</button></div></div>';
    $("#fResetSeen").onclick = () => { S.seen = []; save(); buildFeed(); renderFeed(); toast("Feed reset"); };
    return;
  }
  if(S.dailyLimit && newToday() >= S.dailyLimit){
    const d = dueCards().length;
    el.innerHTML = '<div class="empty"><div class="big">Done for today</div>' +
      '<p>You have read your ' + S.dailyLimit + ' new cards. Spacing does the work now — ' +
      'more today mostly means more forgotten by Friday.</p>' +
      '<div class="actions" style="max-width:340px;margin:18px auto 0">' +
      (d ? '<button class="btn primary" data-go="study">Review ' + d + ' due</button>' : '') +
      '<button class="btn" id="fMore">Read 3 more anyway</button></div></div>';
    $("#fMore").onclick = () => { S.newCount = Math.max(0, S.newCount - 3); save(); renderFeed(); };
    return;
  }
  const c = feedQueue[0];
  const inStash = S.stash.indexOf(c.id) !== -1;
  const total = CARDS.filter(x => S.topics.indexOf(x.topic) !== -1).length;
  el.innerHTML =
    '<div class="meta"><span>' + (total - feedQueue.length + 1) + ' of ' + total + '</span>' +
    '<span>' + S.stash.length + ' stashed</span></div>' +
    '<article class="card">' + cardHTML(c) + '</article>' +
    '<div class="actions">' +
      '<button class="btn" id="fSkip">Skip</button>' +
      '<button class="btn ' + (inStash ? "on" : "primary") + '" id="fStash">' +
        (inStash ? "In your stash" : "Stash & study") + '</button>' +
    '</div>' +
    '<div class="note">Stash a card and it comes back to test you, right before you would forget it. Tap Practice for one small thing to do today.</div>';

  $("#fSkip").onclick = () => { S.seen.push(c.id); countNew(); save(); feedQueue.shift(); renderFeed(); };
  $("#fStash").onclick = () => {
    if(S.stash.indexOf(c.id) === -1){
      S.stash.push(c.id);
      S.srs[c.id] = { ease:2.5, ivl:0, due:Date.now(), reps:0, lapses:0 };
      S.xp += 3; touchStreak();
    }
    if(S.seen.indexOf(c.id) === -1) S.seen.push(c.id);
    countNew(); save(); feedQueue.shift(); renderFeed(); paintStats();
    toast("Stashed — due in Study");
  };
}

/* ================= STUDY ================= */
let studyCard = null, revealed = false;
function renderStudy(){
  const el = $("#p-study");
  const due = dueCards();
  if(!due.length){
    const upcoming = Object.keys(S.srs).length;
    el.innerHTML = '<div class="empty"><div class="big">' +
      (upcoming ? "Nothing due right now" : "Your review queue is empty") + '</div>' +
      '<p>' + (upcoming
        ? "Reviews return on schedule. " + upcoming + " card" + (upcoming===1?"":"s") + " in rotation."
        : "Stash cards from the Feed and they will appear here for recall practice.") + '</p>' +
      '<div class="actions" style="max-width:320px;margin:18px auto 0">' +
      '<button class="btn primary" data-go="feed">Go to Feed</button></div></div>';
    return;
  }
  if(!studyCard || due.indexOf(studyCard) === -1){ studyCard = due[0]; revealed = false; }
  const c = studyCard;
  el.innerHTML =
    '<div class="meta"><span>' + due.length + ' due</span><span>' + esc(topicName(c.topic)) + '</span></div>' +
    '<article class="card">' +
      '<div class="topic">Recall</div>' +
      '<h2>' + esc(c.title) + '</h2>' +
      '<div class="recall">' +
        '<p class="q">' + esc(c.recall) + '</p>' +
        '<p class="hint">Say your answer out loud first. Trying hard to remember is what makes it stick.</p>' +
        (revealed ? '<p class="a">' + esc(c.answer) + '</p>' : '') +
      '</div>' +
    '</article>' +
    (revealed
      ? '<div class="grades">' +
          '<button class="grade g0" data-g="0">Again<small>' + previewIvl(c.id,0) + '</small></button>' +
          '<button class="grade" data-g="1">Hard<small>' + previewIvl(c.id,1) + '</small></button>' +
          '<button class="grade" data-g="2">Good<small>' + previewIvl(c.id,2) + '</small></button>' +
          '<button class="grade g3" data-g="3">Easy<small>' + previewIvl(c.id,3) + '</small></button>' +
        '</div>' +
        '<div class="actions"><button class="btn" id="sFull">Read the full card</button></div>'
      : '<div class="actions"><button class="btn primary" id="sReveal">Show answer</button></div>');

  if(revealed){
    el.querySelectorAll(".grade").forEach(b => {
      b.onclick = () => {
        schedule(c.id, parseInt(b.dataset.g, 10));
        studyCard = null; revealed = false;
        renderStudy(); paintStats();
      };
    });
    $("#sFull").onclick = () => {
      const a = document.createElement("article");
      a.className = "card"; a.style.marginTop = "12px";
      a.innerHTML = cardHTML(c);
      $("#sFull").parentElement.after(a);
      $("#sFull").remove();
    };
  }else{
    $("#sReveal").onclick = () => { revealed = true; renderStudy(); };
  }
}

/* ================= PRACTICE ================= */
function dayHash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); }
function pickDrill(){
  const pool0 = CARDS.filter(c => c.drill && S.topics.indexOf(c.topic) !== -1);
  const stashed = pool0.filter(c => S.srs[c.id]);
  const pool = stashed.length >= 3 ? stashed : pool0;
  if(!pool.length) return null;
  return pool[ dayHash(todayKey() + ":" + S.practiceSeed) % pool.length ];
}
function renderPractice(){
  const el = $("#p-practice");
  const t = todayKey();
  const saved = S.journal[t];
  const c = saved ? byId[saved.card] : pickDrill();
  const hist = Object.keys(S.journal).sort().reverse().slice(0, 14);
  if(!c){
    el.innerHTML = '<div class="empty"><div class="big">No practice yet</div><p>Turn on a topic and the cards bring their own daily practice.</p></div>';
    return;
  }
  el.innerHTML =
    '<div class="meta"><span>Today’s practice</span><span>' + esc(topicName(c.topic)) + '</span></div>' +
    '<article class="card">' +
      '<div class="topic">From the card</div><h2>' + esc(c.title) + '</h2>' +
      '<div class="drill"><div class="dl">Do this now · about 10 minutes</div><div class="dt">' + esc(c.drill) + '</div></div>' +
      '<textarea id="jrn" placeholder="Write what you did, or paste the line you wrote.">' + esc(saved ? saved.text : "") + '</textarea>' +
    '</article>' +
    '<div class="actions">' +
      (saved ? '<button class="btn" id="pEdit">Saved — edit</button>' : '<button class="btn" id="pOther">Give me another</button>') +
      '<button class="btn primary" id="pSave">' + (saved ? 'Save changes' : 'Save today’s practice') + '</button>' +
    '</div>' +
    '<div class="note">One small thing a day, on your real work. Reading the card is study. Doing the drill is practice. Only the second one changes how you write.</div>' +
    (hist.length ? '<h3 class="sec">What you did</h3>' + hist.map(d => {
        const j = S.journal[d], cc = byId[j.card];
        return '<div class="jitem"><div class="jd">' + esc(d) + '</div><div class="jt">' + esc(cc ? cc.title : j.card) + '</div><div class="jx">' + esc(j.text || "") + '</div></div>';
      }).join("") : '');
  const other = $("#pOther"); if(other) other.onclick = () => { S.practiceSeed++; save(); renderPractice(); };
  const edit = $("#pEdit"); if(edit) edit.onclick = () => { $("#jrn").focus(); };
  $("#pSave").onclick = () => {
    const txt = $("#jrn").value.trim();
    if(!txt) return toast("Write one line first");
    S.journal[t] = { card: c.id, text: txt };
    if(!saved){ S.xp += 5; touchStreak(); }
    save(); renderPractice(); paintStats(); toast("Saved. That counts.");
  };
}

/* ================= STASH ================= */
function renderStash(){
  const el = $("#p-stash");
  const q = (window.__q || "").toLowerCase().trim();
  let list = S.stash.map(id => byId[id]).filter(Boolean).reverse();
  if(q) list = list.filter(c => (c.title + " " + c.body + " " + c.src).toLowerCase().indexOf(q) !== -1);
  el.innerHTML =
    '<input id="search" placeholder="Search your stash" value="' + esc(window.__q || "") + '">' +
    (list.length
      ? list.map(c => {
          const s = S.srs[c.id];
          const when = s ? (s.due <= Date.now() ? "due now" : "in " + Math.max(1, Math.round((s.due - Date.now())/DAY)) + "d") : "";
          return '<button class="mini" data-open="' + c.id + '">' +
                 '<div class="mtop">' + esc(topicName(c.topic)) + (when ? " · " + when : "") + '</div>' +
                 '<div class="mt">' + esc(c.title) + '</div>' +
                 '<div class="mb">' + esc(c.answer) + '</div></button>';
        }).join("")
      : '<div class="empty"><div class="big">' + (q ? "No match" : "Nothing stashed yet") + '</div>' +
        '<p>' + (q ? "Try another word." : "Cards you stash from the Feed collect here.") + '</p></div>');

  const si = $("#search");
  si.oninput = () => { window.__q = si.value; const p = si.selectionStart; renderStash();
                       const n = $("#search"); n.focus(); n.setSelectionRange(p, p); };
  el.querySelectorAll("[data-open]").forEach(b => {
    b.onclick = () => {
      const c = byId[b.dataset.open];
      const a = document.createElement("article");
      a.className = "card"; a.style.margin = "10px 0";
      a.innerHTML = cardHTML(c) +
        '<div class="actions"><button class="btn" data-un="' + c.id + '">Remove from stash</button></div>';
      b.replaceWith(a);
      a.querySelector("[data-un]").onclick = () => {
        S.stash = S.stash.filter(x => x !== c.id);
        delete S.srs[c.id]; save(); renderStash(); paintStats(); toast("Removed");
      };
    };
  });
}

/* ================= TOPICS ================= */
function renderTopics(){
  const el = $("#p-topics");
  el.innerHTML = '<h3 class="sec">What lands in your feed</h3><div class="tlist">' +
    TOPICS.map(t => {
      const on = S.topics.indexOf(t.id) !== -1;
      const n = CARDS.filter(c => c.topic === t.id).length;
      const done = CARDS.filter(c => c.topic === t.id && S.srs[c.id]).length;
      return '<button class="trow' + (on ? "" : " off") + '" data-t="' + t.id + '">' +
             '<span class="chk">✓</span><span class="tx"><span class="tn">' + esc(t.name) + '</span>' +
             '<span class="td">' + done + " of " + n + ' in rotation · ' + esc(t.desc) + '</span></span></button>';
    }).join("") + '</div>' +
    '<h3 class="sec">Daily pace</h3>' +
    '<div class="actions" id="paceRow">' +
      [3,5,8,0].map(n => '<button class="btn' + (S.dailyLimit === n ? ' on' : '') + '" data-n="' + n + '">' +
        (n ? n : 'No cap') + '</button>').join("") +
    '</div>' +
    '<div class="note">Twelve topics, 84 cards, seven per topic. New cards a day are capped so your review pile stays small. Reviews are never capped. Turning a topic off only hides it from the Feed. Anything you already stashed stays in your queue.</div>';
  el.querySelectorAll("#paceRow [data-n]").forEach(b => {
    b.onclick = () => { S.dailyLimit = parseInt(b.dataset.n, 10); save(); renderTopics();
                        toast(S.dailyLimit ? S.dailyLimit + " new cards a day" : "No daily cap"); };
  });
  el.querySelectorAll("[data-t]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.t;
      const i = S.topics.indexOf(id);
      if(i === -1) S.topics.push(id);
      else if(S.topics.length > 1) S.topics.splice(i, 1);
      else return toast("Keep at least one topic on");
      save(); buildFeed(); renderTopics();
    };
  });
}

/* ================= PROGRESS ================= */
function renderProgress(){
  const el = $("#p-progress");
  const inRot = Object.keys(S.srs).length;
  const mast = masteredIds().length;
  const lvl = Math.floor(S.xp / 100) + 1;
  el.innerHTML =
    '<div class="stats">' +
      '<div class="sbox"><div class="n">' + S.streak + '</div><div class="l">day streak</div></div>' +
      '<div class="sbox"><div class="n">' + inRot + '</div><div class="l">cards in rotation</div></div>' +
      '<div class="sbox"><div class="n">' + mast + '</div><div class="l">mastered (21d+)</div></div>' +
      '<div class="sbox"><div class="n">' + lvl + '</div><div class="l">level · ' + S.xp + ' xp</div></div>' +
    '</div>' +
    '<div class="sbox" style="margin-bottom:18px"><div class="n">' + Object.keys(S.journal).length + '</div><div class="l">days you practised, not just read</div></div>' +
    '<h3 class="sec">By topic</h3>' +
    TOPICS.map(t => {
      const all = CARDS.filter(c => c.topic === t.id);
      const m = all.filter(c => S.srs[c.id] && S.srs[c.id].ivl >= 21).length;
      const r = all.filter(c => S.srs[c.id]).length;
      return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:14px">' +
             '<b style="font-weight:600">' + esc(t.name) + '</b>' +
             '<span style="color:var(--ink-3)">' + m + '/' + all.length + '</span></div>' +
             '<div class="pbar"><i style="width:' + Math.round((r/all.length)*100) + '%"></i></div></div>';
    }).join("") +
    '<div class="note"><b>How it works.</b> A stashed card comes back right before you would forget it. Be honest when you grade. If you say Easy to everything, the card comes back too late to help. A card is mastered when it can wait 21 days.</div>' +
    '<div class="actions" style="margin-top:16px"><button class="btn" id="wipe">Reset all progress</button></div>';
  $("#wipe").onclick = () => {
    if(confirm("Delete your streak, stash and all review schedules? This cannot be undone.")){
      S = blank(); save(); buildFeed(); paintStats(); show("feed"); toast("Reset");
    }
  };
}

/* ================= CHROME ================= */
function paintStats(){
  $("#sStreak").textContent = S.streak;
  $("#sMastered").textContent = masteredIds().length;
  const d = dueCards().length;
  const pill = $("#dueCount");
  pill.textContent = d; pill.style.display = d ? "" : "none";
}
const RENDER = { feed:renderFeed, study:renderStudy, practice:renderPractice, stash:renderStash, topics:renderTopics, progress:renderProgress };
function show(p){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.p === p)));
  document.querySelectorAll(".panel").forEach(s => { s.hidden = (s.id !== "p-" + p); });
  RENDER[p]();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(t => { t.onclick = () => show(t.dataset.p); });
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g) show(g.dataset.go);
});

/* theme */
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
$("#themeBtn").onclick = () => {
  S.theme = S.theme === "dark" ? "light" : (S.theme === "light" ? null : "dark");
  save(); applyTheme();
  toast(S.theme ? S.theme + " theme" : "system theme");
};

/* keyboard */
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  const cur = document.querySelector('.tab[aria-selected="true"]').dataset.p;
  if(cur === "feed"){
    if(e.key === "ArrowRight" || e.key === "s"){ const b = $("#fSkip"); if(b) b.click(); }
    if(e.key === " " || e.key === "Enter"){ e.preventDefault(); const b = $("#fStash"); if(b) b.click(); }
  }
  if(cur === "study"){
    if(e.key === " " || e.key === "Enter"){ e.preventDefault(); const b = $("#sReveal"); if(b) b.click(); }
    if("1234".indexOf(e.key) !== -1){
      const b = document.querySelector('.grade[data-g="' + (parseInt(e.key,10)-1) + '"]');
      if(b) b.click();
    }
  }
});

applyTheme(); buildFeed(); paintStats(); show("feed");
</script>
