<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';src:url(__INTER__) format('woff2');font-weight:100 900}
@font-face{font-family:'Noto Sans Thai';src:url(__THAI__) format('truetype');font-weight:100 900;
  ascent-override:97%;descent-override:25%;line-gap-override:0%}
*{box-sizing:border-box}
html,body{margin:0;background:#17121a}

/* One big style (the month), one middle (date numbers), one small (everything else). */
#p{--m:22px;--gap:10px;--small:22px;--w:600;--lh:1.15;--padx:7px;--pady:10px;--tgap:24px;
  position:relative;width:1080px;height:var(--H);overflow:hidden;color:var(--ink);
  font:var(--w) var(--small)/var(--lh) 'Inter','Noto Sans Thai',sans-serif;font-feature-settings:'tnum' 0}
#p.size-feed{--top:var(--m);--bot:var(--m);--date:40px;--bigmax:150px}
#p.size-story{--top:220px;--bot:260px;--date:60px;--bigmax:150px}
/* Tall: the feed's calendar block, same height, at the bottom; the photo above it is the header. */
#p.size-tall{--block:calc(1350px - 2 * var(--m));--top:calc(var(--H) - var(--m) - var(--block));--bot:var(--m);--date:40px;--bigmax:150px}

/* One ink per look. Class colours, if ever wanted, go in --k-mysore / --k-led_primary / --k-led_inter. */
#p.look-A,#p.look-C{--ink:#17121a;--title:#17121a;--tile:rgba(255,255,255,.64);--panel:rgba(255,255,255,.64);--scrim:transparent;
  --k-mysore:var(--ink);--k-led_primary:var(--ink);--k-led_inter:var(--ink)}
/* C: Look A's calendar; white title and header on a scrim that stops above the weekday heads. */
#p.look-C{--title:#fff;--scrim:rgba(14,10,16,.6)}
#p.look-B{--ink:#fff;--title:#fff;--tile:rgba(255,255,255,.16);--panel:transparent;--scrim:rgba(14,10,16,.68);
  --k-mysore:#fff;--k-led_primary:#fff;--k-led_inter:#fff}

.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.look-C .scrim{bottom:auto;height:var(--scrim-h,0px);background:linear-gradient(var(--scrim) calc(100% - var(--tgap)),transparent)}
.hdr{position:absolute;left:var(--m);top:var(--m);display:flex;align-items:center;column-gap:24px;color:#fff}
.hdr img{display:block;height:var(--logo,200px);width:auto}
.hdr b{display:block;font-weight:900;font-size:var(--date);line-height:1;letter-spacing:-.02em;
  text-box:trim-both cap alphabetic;margin-bottom:14px}
.hdr p{margin:0;white-space:nowrap}
/* --lift raises the month name off a face (tall only); the heads and tiles stay where they are. */
.fr{position:absolute;left:var(--m);right:var(--m);top:calc(var(--top) - var(--lift, 0px));bottom:var(--bot);display:flex;flex-direction:column}

h1{margin:0 0 var(--tgap);font-weight:900;font-size:var(--big,140px);line-height:.9;letter-spacing:-.035em;
  color:var(--title);white-space:nowrap;text-box:trim-both cap alphabetic}
.lang-th h1{letter-spacing:-.01em}
.grid h1{align-self:end;margin:0 0 var(--pady)}
/* In a six-week month the name sits in the empty first days, part of Look A's block: A's ink, no scrim there. */
.look-C .grid h1{--title:var(--ink)}

.heads,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:var(--gap)}
.heads{margin-bottom:8px}
.heads span{padding:0 var(--padx)}
:is(.look-A,.look-C) .heads span{background:var(--tile);padding-top:5px;padding-bottom:5px}
:is(.look-A,.look-C) .heads{margin-bottom:var(--gap)}
.grid{flex:1;min-height:0;row-gap:var(--gap)}

.tile{background:var(--tile);padding:var(--pady) var(--padx);overflow:hidden;min-height:0}
.tile .d{display:block;font-weight:900;font-size:var(--date);line-height:1;letter-spacing:-.02em;
  text-box:trim-both cap alphabetic;margin:2px 0 calc(6px + var(--date) * .15)}
.tile .k ~ .k{margin-top:6px}
.tile p,.foot p{margin:0;white-space:nowrap}
.tile .mn{display:block;width:calc(var(--date) * 1.6);height:calc(var(--date) * 1.6);border-radius:50%;margin-top:12px}
.tile .mn.full{background:#F2C94C}
.tile .mn.new{background:#17121a}
/* On B's dark scrim a dark disc would vanish: give it a gold edge. */
.look-B .tile .mn.new{background:#0e0a10;box-shadow:inset 0 0 0 3px #F2C94C}
.wrap p{white-space:normal}
.k{color:var(--kc,inherit)}
.k.mysore{--kc:var(--k-mysore)}.k.led_primary{--kc:var(--k-led_primary)}.k.led_inter{--kc:var(--k-led_inter)}

.foot{padding:var(--pady) var(--padx);overflow:hidden;min-height:0}
.grid .foot{background:var(--panel)}
:is(.look-A,.look-C) .grid .foot{align-self:start;max-height:100%}
.band{margin-top:var(--gap);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--gap);background:var(--panel)}
</style></head>
<body>
<div id="p"><img class="ph" alt=""><div class="scrim"></div><div class="hdr"></div><div class="fr"></div></div>
<script>
const P = __DATA__;
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const at = (e, row, c0, c1) => { e.style.gridRow = String(row); e.style.gridColumn = c0 + ' / ' + c1; return e; };

function build() {
  const p = $('#p'), fr = $('.fr');
  p.className = `look-${P.look} size-${P.size} lang-${P.lang}`;
  p.style.setProperty('--H', P.H + 'px');
  const ph = $('.ph');
  ph.src = P.photo.src;
  ph.style.objectPosition = P.photo.pos;
  if (P.header) {
    const logo = el('img');
    logo.src = P.header.logo;
    logo.alt = '';
    const words = el('div');
    words.append(el('b', '', P.header.brand), el('p', '', P.header.place));
    $('.hdr').append(logo, words);
  }

  const h1 = el('h1');
  h1.append(el('span', '', P.title));
  const heads = el('div', 'heads');
  for (const h of P.heads) heads.append(el('span', '', h));
  const g = el('div', 'grid');
  g.style.gridTemplateRows = `repeat(${P.rows}, minmax(0, 1fr))`;
  if (P.titleIn === 'lead') g.append(at(h1, 1, 1, P.lead + 1)); else fr.append(h1);
  fr.append(heads, g);

  for (const c of P.cells) {
    const t = at(el('div', 'tile' + (c.moon ? ' moon' : '')), c.row, c.col, c.col + 1);
    t.dataset.day = c.d;
    t.append(el('b', 'd', String(c.d)));
    for (const l of c.lines) t.append(el('p', l.k ? 'k ' + l.k : '', l.t));
    // Boonchu, 2 Nov: a dark moon for the new moon, a full yellow moon for the full moon.
    if (c.moon === 'new' || c.moon === 'full') t.append(el('i', 'mn ' + c.moon));
    g.append(t);
  }

  // Footer and photo credit go in the month's empty days when there is room, else in a band below.
  const area = (where, cls) => {
    const e = el('div', cls);
    if (where === 'band') { fr.append(e); return e; }
    if (where === 'trail') at(e, P.rows, 8 - P.trail, 8); else at(e, 1, 1, P.lead + 1);
    g.append(e);
    return e;
  };
  const foot = area(P.footIn, 'foot' + (P.footIn === 'band' ? ' band' : ''));
  if (P.footIn === 'band') {
    const a = el('div'), b = el('div');
    a.append(...P.foot.filter((_, i) => i !== 1).map(t => el('p', '', t)));
    b.append(el('p', '', P.foot[1]));
    foot.append(a, b);
  } else for (const line of P.foot) foot.append(el('p', '', line));
}

function addCredit() {
  const c = P.photo.credit;
  if (P.creditIn === 'foot') return $('.foot').append(el('p', '', c.join(' · ')));
  if (P.creditIn === 'band') return $('.band > div:last-child').append(el('p', '', c.join(' · ')));
  const e = el('div', 'foot credit');
  if (P.creditIn === 'trail') at(e, P.rows, 8 - P.trail, 8); else at(e, 1, 1, P.lead + 1);
  for (const line of c) e.append(el('p', '', line));
  $('.grid').append(e);
}

function fitTitle() {
  const h1 = $('h1');
  h1.style.setProperty('--big', '100px');
  const avail = h1.parentElement.classList.contains('grid')
    ? h1.getBoundingClientRect().width : $('.fr').clientWidth;
  const w = h1.firstChild.getBoundingClientRect().width;
  const max = parseFloat(getComputedStyle($('#p')).getPropertyValue('--bigmax'));
  const size = Math.min(max, Math.floor(100 * avail / w * 10) / 10);
  h1.style.setProperty('--big', size + 'px');
  // Pull the first letter back by its side bearing so its stem sits on the tiles' left edge.
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `900 ${size}px Inter, "Noto Sans Thai"`;
  const m = ctx.measureText(P.title.slice(0, 1));
  h1.style.marginLeft = (m.actualBoundingBoxLeft) + 'px';
  // The box is trimmed to cap height and baseline. Thai marks above it and descenders below it
  // (July, พฤศจิกายน) get room of their own, in em so it scales if the title is shrunk later.
  const ink = ctx.measureText(P.title), cap = ctx.measureText('H').actualBoundingBoxAscent;
  const em = v => Math.max(0, v) / size + 'em';
  const inGrid = h1.parentElement.classList.contains('grid');
  if (!inGrid) h1.style.marginTop = em(ink.actualBoundingBoxAscent - cap);
  h1.style.marginBottom = inGrid ? `calc(var(--pady) + ${em(ink.actualBoundingBoxDescent)})`
    : `calc(var(--tgap) + ${em(ink.actualBoundingBoxDescent)} + var(--lift, 0px))`;
  return size;
}

// The logo is up to 200px tall, less if the photo leaves less room above the title's ink (Thai
// marks included); false if that is under 120px or the words run off the right edge.
function fitHeader(inkTop) {
  const cs = getComputedStyle($('#p'));
  const room = inkTop - parseFloat(cs.getPropertyValue('--m')) - parseFloat(cs.getPropertyValue('--tgap'));
  $('#p').style.setProperty('--logo', Math.max(0, Math.min(200, Math.floor(room))) + 'px');
  return room >= 120 && $('.hdr').getBoundingClientRect().right <= P.W - 22;
}

function rect(e) { const r = e.getBoundingClientRect(); return { x0: r.left, y0: r.top, x1: r.right, y1: r.bottom }; }
const hit = (a, b, pad = 6) => a.x0 < b.x1 + pad && a.x1 > b.x0 - pad && a.y0 < b.y1 + pad && a.y1 > b.y0 - pad;

// A box in photo pixels [left, top, right, bottom] as page pixels, after the cover crop.
function fromPhoto(box) {
  const ph = $('.ph'), W = P.W, H = P.H, nw = ph.naturalWidth, nh = ph.naturalHeight;
  const s = Math.max(W / nw, H / nh), rw = nw * s, rh = nh * s;
  const [px, py] = P.photo.pos.split(/\s+/).map(v => parseFloat(v) / 100);
  const ox = (W - rw) * px, oy = (H - rh) * py;
  return { x0: box[0] * s + ox, y0: box[1] * s + oy, x1: box[2] * s + ox, y1: box[3] * s + oy };
}

// The month name's ink as drawn, pixel by pixel (the box around the text is far bigger than the
// letters, and only a few letters reach down or up). x, y: page position of the mask's corner.
function titleInk() {
  const h1 = $('h1'), cs = getComputedStyle(h1), size = parseFloat(cs.fontSize);
  const span = h1.firstChild.getBoundingClientRect(), base = h1.getBoundingClientRect().bottom;
  const m = Math.ceil(size * .6), w = Math.ceil(span.width) + 2 * m, h = Math.ceil(size * 2), b = Math.ceil(size * 1.3);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.font = `900 ${size}px Inter, "Noto Sans Thai"`;
  ctx.letterSpacing = cs.letterSpacing;
  ctx.fillText(P.title, m, b);
  const d = ctx.getImageData(0, 0, w, h).data, a = new Uint8Array(w * h);
  let top = h, bot = -1;
  for (let i = 0; i < w * h; i++) if (d[4 * i + 3] > 64) { a[i] = 1; const y = (i / w) | 0; top = Math.min(top, y); bot = Math.max(bot, y); }
  return { a, w, h, x: span.left - m, y: base - b, top: base - b + top, bottom: base - b + bot + 1 };
}
// The lowest ink row (page y, exclusive) inside the box's columns, or null if no ink there.
function inkLow(ink, b, pad = 6) {
  const x0 = Math.max(0, Math.floor(b.x0 - pad - ink.x)), x1 = Math.min(ink.w, Math.ceil(b.x1 + pad - ink.x));
  for (let y = ink.h - 1; y >= 0; y--) for (let x = x0; x < x1; x++) if (ink.a[y * ink.w + x]) return ink.y + y + 1;
  return null;
}
function inkOn(ink, b, pad = 6) {
  const x0 = Math.max(0, Math.floor(b.x0 - pad - ink.x)), x1 = Math.min(ink.w, Math.ceil(b.x1 + pad - ink.x));
  const y0 = Math.max(0, Math.floor(b.y0 - pad - ink.y)), y1 = Math.min(ink.h, Math.ceil(b.y1 + pad - ink.y));
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) if (ink.a[y * ink.w + x]) return true;
  return false;
}

// Tall only: if the month name's letters sit on a face from the photo's JSON, raise it just clear of
// every such face (same size; the heads and tiles stay put). Returns the lift in px.
function liftOffFaces(faces) {
  const ink = titleInk(), pad = 6;
  let lift = 0;
  for (const f of faces) {
    if (!inkOn(ink, f, pad)) continue;
    const low = inkLow(ink, f, pad);
    if (low != null && f.y0 > ink.top) lift = Math.max(lift, Math.ceil(low + pad - f.y0));
  }
  if (lift) $('#p').style.setProperty('--lift', lift + 'px');
  return lift;
}

// Whether the photo's printed credit shows after the crop: 'shows', 'out' (cut off),
// 'scrim' (darkened) or 'covered' (under a tile, the footer, the title or the header).
function creditState() {
  const c = P.photo, sc = $('.scrim'), cs = getComputedStyle(sc);
  // Under a dark scrim the printed credit's thin white letters go grey and unreadable.
  const dark = cs.backgroundColor !== 'rgba(0, 0, 0, 0)' || cs.backgroundImage !== 'none';
  if (!c.box) return dark && sc.offsetHeight >= P.H ? 'scrim' : 'shows';
  const W = P.W, H = P.H, b = fromPhoto(c.box);
  if (b.x0 < 0 || b.y0 < 0 || b.x1 > W || b.y1 > H) return 'out';
  if (dark && hit(rect(sc), b, 0)) return 'scrim';
  return [...document.querySelectorAll('h1, .heads, .tile, .foot, .hdr > *')].some(e => hit(rect(e), b)) ? 'covered' : 'shows';
}

// A see-through box over the printed credit would leave it half showing next to the re-stamp, so
// its letters (thin bright strokes, found by a morphological top-hat) and their soft shadow are
// filled in from the pixels around them. Works in photo pixels, then swaps the photo.
async function paintOutCredit() {
  const ph = $('.ph'), [bx0, by0, bx1, by1] = P.photo.box, pad = 16, stroke = 4, shadow = 6;
  const cv = document.createElement('canvas');
  cv.width = ph.naturalWidth; cv.height = ph.naturalHeight;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(ph, 0, 0);
  const X = Math.max(0, bx0 - pad), Y = Math.max(0, by0 - pad);
  const w = Math.min(cv.width, bx1 + pad) - X, h = Math.min(cv.height, by1 + pad) - Y, n = w * h;
  const img = ctx.getImageData(X, Y, w, h), d = img.data;
  const L = new Float32Array(n);
  for (let i = 0; i < n; i++) L[i] = .299 * d[4 * i] + .587 * d[4 * i + 1] + .114 * d[4 * i + 2];
  // Square min or max filter of radius r, rows then columns.
  const filt = (src, r, f) => {
    const a = new Float32Array(n), out = new Float32Array(n);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let v = src[y * w + x];
      for (let k = Math.max(0, x - r); k <= Math.min(w - 1, x + r); k++) v = f(v, src[y * w + k]);
      a[y * w + x] = v;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let v = a[y * w + x];
      for (let k = Math.max(0, y - r); k <= Math.min(h - 1, y + r); k++) v = f(v, a[k * w + x]);
      out[y * w + x] = v;
    }
    return out;
  };
  const open = filt(filt(L, stroke, Math.min), stroke, Math.max);
  let m = new Float32Array(n);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, inBox = X + x >= bx0 && X + x < bx1 && Y + y >= by0 && Y + y < by1;
    m[i] = inBox && L[i] - open[i] > 28 ? 1 : 0;
  }
  m = filt(m, shadow, Math.max);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (x < 1 || y < 1 || x >= w - 1 || y >= h - 1) m[y * w + x] = 0;
  }
  // Fill the marked pixels by repeated averaging of their four neighbours (diffusion).
  const ch = [0, 1, 2].map(c => Float32Array.from({ length: n }, (_, i) => d[4 * i + c]));
  const idx = [];
  for (let i = 0; i < n; i++) if (m[i]) idx.push(i);
  for (let it = 0; it < 600; it++) for (const c of ch) for (const i of idx) c[i] = (c[i - 1] + c[i + 1] + c[i - w] + c[i + w]) / 4;
  for (const i of idx) for (let c = 0; c < 3; c++) d[4 * i + c] = ch[c][i];
  ctx.putImageData(img, X, Y);
  await new Promise(r => { ph.onload = r; ph.src = cv.toDataURL('image/png'); });
  return idx.length;
}

const boxes = () => [...document.querySelectorAll('.tile, .foot')];
const wide = e => e.scrollWidth > e.clientWidth + 1;
const tall = e => e.scrollHeight > e.clientHeight + 1;

window.layout = async () => {
  build();
  await Promise.all([
    document.fonts.load('900 100px Inter'), document.fonts.load('600 22px Inter'),
    document.fonts.load('900 100px "Noto Sans Thai"', 'กข'), document.fonts.load('600 22px "Noto Sans Thai"', 'กข'),
    ...[...document.querySelectorAll('img')].map(i => new Promise(r => { if (i.complete && i.naturalWidth) r(); else i.onload = r; })),
  ]);
  await document.fonts.ready;
  const p = $('#p'), h1 = $('h1'), set = (k, v) => p.style.setProperty(k, v);
  const log = [];
  const size = fitTitle();
  if (P.header) fitHeader(titleInk().top);
  let restamp = false, painted = false;
  const credit = P.photo.credit.length ? creditState() : 'shows';
  if (credit !== 'shows') { restamp = true; addCredit(); }
  if (credit === 'covered') painted = (await paintOutCredit()) > 0;
  // A line wider than its box may wrap, in that box only.
  for (const e of boxes()) if (wide(e)) { e.classList.add('wrap'); log.push('wrapped ' + (e.dataset.day ? 'day ' + e.dataset.day : e.className)); }
  const top = P.titleIn !== 'lead';
  const steps = [
    ['tighter lines', () => set('--lh', '1.1')],
    ['date 36px', () => set('--date', '36px')],
    top && ['title 90%', () => h1.style.setProperty('--big', (size * .9) + 'px')],
    ['date 32px', () => set('--date', '32px')],
    top && ['title 80%', () => h1.style.setProperty('--big', (size * .8) + 'px')],
    ['tile padding 7px', () => set('--pady', '7px')],
  ].filter(Boolean);
  for (const [name, fn] of steps) {
    if (!boxes().some(tall)) break;
    fn(); log.push(name);
  }
  // Faces from the photo's JSON: white letters never go across one.
  const faces = P.photo.faces.map(fromPhoto);
  const lift = P.size === 'tall' && P.titleUp && top ? liftOffFaces(faces) : 0;
  const ink = titleInk(), headsTop = $('.heads').getBoundingClientRect().top;
  const header = P.header ? fitHeader(ink.top) : true;
  const tgap = parseFloat(getComputedStyle(p).getPropertyValue('--tgap'));
  if (P.header) set('--scrim-h', Math.min(ink.bottom + tgap, headsTop) + 'px');
  const over = boxes().filter(e => tall(e) || wide(e)).map(e => e.dataset.day ? 'day ' + e.dataset.day : 'footer');
  if (!header) over.push('header');
  if (h1.firstChild.getBoundingClientRect().right > h1.getBoundingClientRect().right + 1) over.push('title');
  const onFace = [];
  if (faces.some(f => inkOn(ink, f))) onFace.push('month name');
  if (faces.some(f => [...document.querySelectorAll('.hdr > *')].some(e => hit(rect(e), f)))) onFace.push('header');
  const small = [...document.querySelectorAll('.tile p, .foot p, .heads span, .hdr p')].map(e => parseFloat(getComputedStyle(e).fontSize));
  return { overflow: over, onFace, steps: log, restamp, painted, lift, logo: P.header ? $('.hdr img').getBoundingClientRect().height : 0,
    title: parseFloat(getComputedStyle(h1).fontSize), minSmall: Math.min(...small) };
};
</script>
</body></html>
