<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYBKK — Orientation Dashboard</title>
  <link rel="stylesheet" href="/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--wall); color: var(--ink); }
    .header { background: var(--shirt); color: var(--chalk); padding: 20px 16px; text-align: center; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }
    .header .count { color: color-mix(in oklab, var(--chalk) 75%, transparent); font-size: 13px; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card { background: var(--paper); border: var(--frame-w) solid var(--ink); border-radius: var(--frame-radius); box-shadow: var(--frame-shadow); padding: 16px; margin-bottom: 12px; }
    .card .name { font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .card .chinese { font-size: 14px; color: var(--ink-soft); margin-bottom: 8px; }
    .card .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; }
    .card .row:last-child { border-bottom: none; }
    .card .label { color: var(--ink-soft); }
    .card .value { color: var(--ink); font-weight: 500; text-align: right; max-width: 60%; }
    .card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .card .tag { background: var(--shirt); color: var(--chalk); padding: 3px 8px; border-radius: 10px; font-size: 11px; }
    .card .injury { background: color-mix(in oklab, #a8632f 12%, var(--paper)); border-left: 3px solid #a8632f; padding: 8px 12px; margin-top: 8px; border-radius: 0 8px 8px 0; font-size: 12px; color: #a8632f; }
    .empty { text-align: center; padding: 40px; color: var(--ink-soft); }
    .refresh { position: fixed; bottom: 20px; right: 20px; background: var(--shirt-deep); color: var(--chalk); border: 2px solid var(--ink); width: 48px; height: 48px; border-radius: 50%; font-family: var(--font-display); font-size: 20px; cursor: pointer; box-shadow: 3px 3px 0 color-mix(in oklab, var(--ink) 30%, transparent); }
    .loading { text-align: center; padding: 20px; color: var(--ink-soft); }
  </style>
</head>
<body>

<div class="header">
  <h1>Orientation Dashboard</h1>
  <div class="count" id="count">Loading...</div>
</div>

<div class="container" id="students">
  <div class="loading">Loading students...</div>
</div>

<button class="refresh" onclick="loadStudents()">↻</button>

<script>
const diffLabels = {
  'forward-fold': 'Forward Fold',
  'hip-opening': 'Hip Opening',
  'backbend': 'Backbend',
  'inversion': 'Inversion',
  'balance': 'Balance',
  'twist': 'Twist',
  'shoulder': 'Shoulder',
  'core': 'Core'
};

async function loadStudents() {
  try {
    const res = await fetch('/api/orientations');
    const data = await res.json();
    const students = data.orientations || [];
    
    document.getElementById('count').textContent = `${students.length} student${students.length !== 1 ? 's' : ''} registered`;
    
    if (students.length === 0) {
      document.getElementById('students').innerHTML = '<div class="empty">No submissions yet.<br>Share the QR code with students.</div>';
      return;
    }
    
    // Sort newest first
    students.sort((a, b) => {
      const da = new Date(String(a.submittedAt || 0));
      const db = new Date(String(b.submittedAt || 0));
      return db - da; // newest first
    });

    let html = '';
    students.forEach((s, i) => {
      const time = s.submittedAt ? new Date(s.submittedAt).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
      const diffs = (s.difficulties || []).map(d => `<span class="tag">${diffLabels[d] || d}</span>`).join('');
      const injuries = s.injuries || s.injury || '';
      const goals = s.goals || '';
      const experience = s.experience || s.yearsPractice || '';
      const wechat = s.wechat || '';
      const journalLink = s.journalLink || '';

      html += `<div class="card">
        <div class="name">${i+1}. ${s.englishName || s.name || 'Unknown'}</div>
        ${s.chineseName ? `<div class="chinese">${s.chineseName}</div>` : ''}
        <div class="row"><span class="label">City</span><span class="value">${s.city || '—'}</span></div>
        ${wechat ? `<div class="row"><span class="label">WeChat</span><span class="value">${wechat}</span></div>` : ''}
        <div class="row"><span class="label">Experience</span><span class="value">${experience || '—'}</span></div>
        <div class="row"><span class="label">Last Asana</span><span class="value">${s.lastAsana || '—'}</span></div>
        ${diffs ? `<div class="tags">${diffs}</div>` : ''}
        ${injuries ? `<div class="injury">⚠️ ${injuries}</div>` : ''}
        ${goals ? `<div class="injury" style="background:color-mix(in oklab, #2e7d5b 12%, var(--paper));border-color:#2e7d5b;color:#2e7d5b;">🎯 ${goals}</div>` : ''}
        ${journalLink ? `<div class="row" style="margin-top:6px;"><span class="label">Journal</span><a href="${journalLink}" target="_blank" style="font-size:11px;color:var(--shirt);word-break:break-all;">Open ↗</a></div>` : ''}
        <div class="row" style="margin-top:4px;"><span class="label">Submitted</span><span class="value">${time}</span></div>
      </div>`;
    });
    
    document.getElementById('students').innerHTML = html;
  } catch (err) {
    document.getElementById('students').innerHTML = `<div class="empty">Error loading data: ${err.message}</div>`;
  }
}

loadStudents();
setInterval(loadStudents, 30000); // Auto-refresh every 30s
</script>

</body>
</html>
